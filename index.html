{id:"m1t9",m:"m1",title:"Linearly Non-Separable Classes and XOR",type:"problem-solving",priority:"high",los:["1.2"],
 src:"Module 1 deck, slides 45–49",
 summary:"Why interaction between features breaks a single line, with XOR as the standard case.",
 whatIs:"<p>Some classifications depend on how features <i>combine</i>, not on either feature by itself. The deck calls this the Interaction Principle, and XOR is its minimal example. No single line can express an interaction, which is why XOR ended the first wave of neural network research.</p>",
 concept:"<h4>XOR, and why it resists a line</h4><div class='scroll'><table>"+
  "<tr><th>x₁</th><th>x₂</th><th>XOR</th></tr><tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>0</td></tr></table></div>"+
  "<p>Plot the four corners of the unit square. The two 1s sit on one diagonal, the two 0s on the other. Any straight line splits the square into two halves; to isolate the diagonal pair you would have to bend it. Exhaustive search over integer weights confirms it: no (w₁, w₂, b) works.</p>"+
  "<h4>The Interaction Principle</h4>"+
  "<p>The deck states it as: <i>outcomes emerge from the synergy of combinations rather than isolated rules.</i> With XOR, knowing x₁ alone tells you nothing about the output — for x₁ = 1 the answer is 1 or 0 depending entirely on x₂. Each feature has zero predictive power in isolation, and all the information lives in the pair. A linear model computes w₁x₁ + w₂x₂, which is a sum of separate contributions and therefore structurally incapable of representing 'it depends on the other one'.</p>"+
  "<h4>The escape route</h4>"+
  "<p>XOR = (x₁ OR x₂) AND NOT(x₁ AND x₂). Each of OR, AND and NOT is individually linearly separable. So XOR is buildable from two layers: a hidden layer computing OR and NAND, and an output layer computing AND of those two.</p>"+
  "<div class='eqb'>h₁ = OR(x₁, x₂)    w = (1, 1),   b = −0.5\nh₂ = NAND(x₁, x₂)  w = (−1, −1), b = +1.5\ny  = AND(h₁, h₂)   w = (1, 1),   b = −1.5</div>"+
  "<div class='scroll'><table><tr><th>x₁</th><th>x₂</th><th>h₁ (OR)</th><th>h₂ (NAND)</th><th>y = AND(h₁,h₂)</th><th>XOR</th></tr>"+
  "<tr><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td>0 ✓</td></tr>"+
  "<tr><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1 ✓</td></tr>"+
  "<tr><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1 ✓</td></tr>"+
  "<tr><td>1</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0 ✓</td></tr></table></div>"+
  "<div class='box warning'><h5>A note on the deck's XOR slide</h5><p>The deck's 'XOR Reality' quadrant chart labels Low-attendance/High-study and High-attendance/High-study both as Ready, and both Low-study quadrants as Needs Intervention. Read literally that is a function of study hours alone, which <i>is</i> linearly separable, not an XOR pattern. The lecturer's teaching point — that outcomes can depend on combinations rather than single features — is correct and is what the marks are for. For a worked XOR use the Boolean truth table above, which is unambiguous.</p></div>",
 needToKnow:["Write the XOR truth table and plot the four corners","State why no line separates the diagonals","Explain the Interaction Principle in one sentence","Build XOR from OR, NAND and AND and verify all four rows","Name what XOR proves: single-layer models are fundamentally limited, not just badly trained"],
 recognition:{clues:["XOR is named, or the phrase 'exclusive OR'","'Show that a single-layer perceptron cannot …'","A truth table whose 1s sit diagonally opposite","'Why do we need hidden layers?'"],
  wording:["Show that XOR is not linearly separable and design a network that solves it.","Explain linearly non-separable classes with a suitable example.","Why can a single-layer perceptron not solve XOR?"],
  firstMove:"Draw the unit square with the four labelled corners. The picture makes the diagonal structure obvious and earns the first mark immediately.",
  trap:"Proving XOR is unsolvable and stopping. Almost every version of this question also asks for the two-layer solution, and that half carries more marks."},
 examAnswer:[
  {marks:2,body:"<p>XOR truth table, the plotted square showing 1s on one diagonal, and one sentence: no straight line separates diagonally opposite pairs.</p>"},
  {marks:5,body:"<p>(1) Truth table and plot. (2) The reason — either the diagonal argument or the four-inequality contradiction. (3) The decomposition XOR = OR AND NAND. (4) The two-layer network with all weights and biases. (5) Verification table with h₁ and h₂ columns. (6) One closing line: this is why hidden layers exist.</p>"}],
 mistakes:["Claiming XOR needs three layers; two layers of weights (one hidden layer) suffice","Giving the hidden units as OR and AND rather than OR and NAND — with AND the output layer cannot recover XOR","Forgetting the h₁ and h₂ columns in the verification, which is where the method is shown","Saying 'the perceptron fails because it was not trained enough' — it is a representational limit, not a training one","Drawing a curved boundary and calling it a perceptron solution"],
 examples:[
  {id:"m1t9e1",title:"Building XOR with two layers",q:"Design a two-layer perceptron network that computes XOR. Give all weights and verify.",
   steps:["Decompose: XOR(x₁,x₂) = OR(x₁,x₂) AND NAND(x₁,x₂). Check the logic — OR excludes (0,0), NAND excludes (1,1), and AND of the two keeps exactly the middle rows.","Hidden unit h₁ = OR: w = (1, 1), b = −0.5.","Hidden unit h₂ = NAND: w = (−1, −1), b = 1.5.","Output y = AND(h₁, h₂): w = (1, 1), b = −1.5.","Verify (0,0): h₁ = step(−0.5) = 0, h₂ = step(1.5) = 1, y = step(0 + 1 − 1.5) = step(−0.5) = 0 ✓","Verify (0,1): h₁ = step(0.5) = 1, h₂ = step(0.5) = 1, y = step(1 + 1 − 1.5) = step(0.5) = 1 ✓","Verify (1,0): identical by symmetry → y = 1 ✓","Verify (1,1): h₁ = step(1.5) = 1, h₂ = step(−0.5) = 0, y = step(1 + 0 − 1.5) = step(−0.5) = 0 ✓"],
   answer:"Output (0, 1, 1, 0) — exactly XOR. Two layers of weights, one hidden layer of two units.",
   trap:"The hidden layer must be non-linear. If the hidden units were linear, the whole network would collapse to a single linear function and would still fail. It is the <i>step</i> at the hidden layer that creates the new representation."},
  {id:"m1t9e2",title:"Spotting an interaction in worded data",q:"A model must flag a student for help. A student is flagged if exactly one of (low attendance) and (low marks) holds — a student weak in both is already in a remedial stream and is not flagged, and a student strong in both needs nothing. Is this separable?",
   steps:["Encode: x₁ = 1 for low attendance, x₂ = 1 for low marks. Flag y = 1 when exactly one is 1.","(0,0) → 0 (strong in both). (1,0) → 1. (0,1) → 1. (1,1) → 0 (already in remedial stream).","That is exactly the XOR truth table.","Neither feature predicts alone: for x₁ = 1 the answer is 1 or 0 depending on x₂."],
   answer:"<b>Not linearly separable</b> — it is XOR in disguise. A single perceptron cannot do it; a hidden layer is required.",
   trap:"Worded problems hide XOR behind phrases such as 'exactly one of', 'either but not both', or a rule that reverses when a second condition also holds. Any of those should make you check for XOR before assuming a line exists."}],
 practice:[
  {id:"m1t9p1",d:"easy",q:"Write the XOR truth table and explain in two sentences why no straight line separates it.",hint:"Plot the four corners of the unit square.",a:"<div class='scroll'><table><tr><th>x₁</th><th>x₂</th><th>y</th></tr><tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>0</td></tr></table></div><p>Plotted on the unit square, the outputs of 1 sit at (0,1) and (1,0) — one diagonal — while the outputs of 0 sit at (0,0) and (1,1) — the other diagonal. A straight line divides the plane into two half-planes, and any half-plane containing both ends of one diagonal must also contain at least one point of the other, because the diagonals cross. So no line can separate them.</p>"},
  {id:"m1t9p2",d:"moderate",q:"State the Interaction Principle and give one example from outside Boolean logic.",hint:"Look for cases where a feature's effect reverses depending on another feature.",a:"<p><b>The principle:</b> some outcomes emerge from the combination of features rather than from any feature in isolation. A linear model computes a sum of independent contributions, w₁x₁ + w₂x₂, so it cannot represent a rule in which the effect of one feature depends on the value of another.</p><p><b>Example:</b> a drug that helps patients who are not already on a second medication, but is harmful to those who are. Taking the drug alone → good; taking the second medication alone → good; taking both → bad; taking neither → neutral. The effect of 'take the drug' reverses depending on the other feature, so no single weight on 'take the drug' can be right for both groups. Any model of this must have somewhere to represent the pair, which is what a hidden unit provides.</p>"},
  {id:"m1t9p3",d:"hard",q:"Design a two-layer network for XNOR (output 1 when the inputs are equal). Verify all four rows.",hint:"XNOR is NOT(XOR). You can flip the output layer of the XOR network.",a:"<p>XNOR = AND(x₁,x₂) OR NOR(x₁,x₂) — it fires when both are 1 or both are 0.</p><p><b>Hidden h₁ = AND:</b> w = (1, 1), b = −1.5. <b>Hidden h₂ = NOR:</b> w = (−1, −1), b = 0.5. <b>Output = OR(h₁,h₂):</b> w = (1, 1), b = −0.5.</p><div class='scroll'><table><tr><th>x₁</th><th>x₂</th><th>h₁ (AND)</th><th>h₂ (NOR)</th><th>z_out</th><th>y</th><th>XNOR?</th></tr><tr><td>0</td><td>0</td><td>0</td><td>1</td><td>0+1−0.5 = 0.5</td><td>1</td><td>✓</td></tr><tr><td>0</td><td>1</td><td>0</td><td>0</td><td>−0.5</td><td>0</td><td>✓</td></tr><tr><td>1</td><td>0</td><td>0</td><td>0</td><td>−0.5</td><td>0</td><td>✓</td></tr><tr><td>1</td><td>1</td><td>1</td><td>0</td><td>1+0−0.5 = 0.5</td><td>1</td><td>✓</td></tr></table></div><p>Alternatively, take the XOR network and negate its output layer: w = (−1,−1), b = +1.5. Both are correct; the first shows the decomposition explicitly, which reads better in an exam.</p>"}],
 questions:[
  {q:"Show that the XOR function is not linearly separable and design a multilayer network that implements it. Verify with a truth table.",marks:5,d:"moderate",priority:"high",source:"source"},
  {q:"Explain linearly non-separable classes with a suitable example and state its implication for single-layer models.",marks:5,d:"easy",priority:"high",source:"source"},

{id:"m1t10",m:"m1",title:"Multilayer Perceptron",type:"theory",priority:"high",los:["1.2","1.3"],
 src:"Module 1 deck, slides 50–53",
 summary:"Stacked layers of neurons, and why non-linear activations are what make depth mean anything.",
 whatIs:"<p>A multilayer perceptron (MLP) is a feed-forward network with an input layer, one or more <b>hidden layers</b>, and an output layer, where every neuron in one layer connects to every neuron in the next. It is the model that escapes the linear-separability wall.</p>",
 concept:"<h4>Structure</h4><ul>"+
  "<li><b>Input layer</b> — one node per feature. These nodes do no computation; they simply hold the input values.</li>"+
  "<li><b>Hidden layer(s)</b> — each unit computes its own weighted sum and applies a non-linear activation. This is where new, derived features are constructed.</li>"+
  "<li><b>Output layer</b> — produces the final prediction, with as many units as there are outputs.</li></ul>"+
  "<h4>Why a hidden layer changes what is representable</h4>"+
  "<p>Each hidden unit draws its own linear boundary in the input space and reports which side the input fell on. The output layer then works not with the raw inputs but with this new set of derived features. In the XOR solution, the hidden units report 'is at least one input on?' and 'are not both inputs on?' — and in that new two-dimensional space the classes <i>are</i> linearly separable. Depth does not bend the line; it changes the space the line is drawn in.</p>"+
  "<div class='box warning'><h5>The critical condition</h5><p>The activation in the hidden layer must be <b>non-linear</b>. If it were linear, then layer 2 applied to layer 1 would be W₂(W₁x) = (W₂W₁)x, which is just another single linear map. A hundred linear layers collapse to one. The deck states this directly: without activation functions, a 100-layer network behaves merely as a single flat layer.</p></div>"+
  "<h4>The depth advantage</h4><div class='scroll'><table>"+
  "<tr><th></th><th>Single layer</th><th>Multi-layer</th></tr>"+
  "<tr><td>Boundary</td><td>One straight line / hyperplane</td><td>Piecewise, effectively arbitrary shape</td></tr>"+
  "<tr><td>Features</td><td>Uses the raw inputs as given</td><td>Builds its own derived features in the hidden layers</td></tr>"+
  "<tr><td>Solves</td><td>Linearly separable problems only</td><td>Non-linearly separable problems, XOR included</td></tr>"+
  "<tr><td>Training</td><td>Perceptron learning rule</td><td>Backpropagation with gradient descent</td></tr></table></div>",
 needToKnow:["Draw and label input, hidden and output layers","Explain that hidden units construct derived features and the output layer separates in that new space","State why the activation must be non-linear, with the collapse argument","Name backpropagation as the training method","Contrast single-layer and multi-layer in a table"],
 recognition:{clues:["'Hidden layer', 'MLP', 'multilayer'","'Why do we need more than one layer?'","A diagram with three columns of circles"],
  wording:["Explain the multilayer perceptron with a neat diagram.","Why is a non-linear activation function essential in a multilayer network?","How does an MLP overcome the limitations of a single perceptron?"],
  firstMove:"Draw the three-layer diagram, then write the collapse argument W₂W₁x = Wx. Those two things carry most of the marks.",
  trap:"Explaining that more layers give 'more power' without the collapse argument. The collapse argument is the actual reason, and it is the part examiners look for."},
 examAnswer:[
  {marks:2,body:"<p>Define the three layer types, and state that hidden layers with non-linear activations let the network represent non-linearly-separable functions.</p>"},
  {marks:5,body:"<p>(1) Labelled diagram. (2) What each layer does, one line each. (3) The collapse argument in symbols. (4) One concrete example — XOR, with the two hidden units named. (5) The single-layer vs multi-layer comparison table. (6) One line naming backpropagation as the training method.</p>"}],
 mistakes:["Counting the input layer as a computing layer — it holds values and computes nothing","Saying an MLP is trained by the perceptron learning rule; hidden units have no target, so backpropagation is required","Omitting the non-linearity condition, which makes the whole answer wrong in principle","Claiming more hidden layers always give better accuracy — beyond a point they overfit, which is Module 2's subject","Drawing an MLP with no bias terms"],
 examples:[{id:"m1t10e1",title:"The collapse argument in numbers",q:"A two-layer network has hidden weights W₁ = [[2,0],[0,3]] and output weights W₂ = [1, 1], with linear (identity) activation throughout. Show it is equivalent to a single layer, then say what changes with a step activation.",
  steps:["Hidden layer with identity activation: h = W₁x, so h₁ = 2x₁ and h₂ = 3x₂.","Output: y = W₂h = 1·h₁ + 1·h₂ = 2x₁ + 3x₂.","That is a single linear function of the inputs — equivalent to one perceptron with w = (2, 3) and b = 0. The hidden layer contributed nothing.","Now put a step at the hidden layer: h₁ = step(2x₁) and h₂ = step(3x₂), each 0 or 1.","y = h₁ + h₂ now depends on the inputs through two thresholds, which is a piecewise-constant function of x that no single linear unit can produce."],
  answer:"With linear activations the network collapses to <b>y = 2x₁ + 3x₂</b>, a single perceptron. With a step activation it does not collapse, because the composition of a step with a linear map is not linear.",
  trap:"The collapse has nothing to do with how many layers or how many units there are — it is purely about linearity. Ten thousand linear hidden units still collapse to one linear map."}],
 practice:[
  {id:"m1t10p1",d:"easy",q:"Draw and describe the three layer types of an MLP.",hint:"One holds, one derives, one decides.",a:"<p><b>Input layer:</b> one node per feature. Purely a holding layer — it applies no weights and no activation, it just presents the values to the next layer.</p><p><b>Hidden layer(s):</b> each unit computes z = Σwᵢxᵢ + b over the previous layer's outputs and applies a non-linear activation. These units construct derived features; there may be one such layer or many.</p><p><b>Output layer:</b> produces the final prediction, with one unit per output. Its activation is chosen to match the task — a step or sigmoid for binary, softmax for multi-class, linear for regression.</p><p>Every unit in a layer connects to every unit in the next, and information flows in one direction only, which is what 'feed-forward' means.</p>"},
  {id:"m1t10p2",d:"moderate",q:"Prove that stacking linear layers gains nothing, and state the consequence.",hint:"Compose two matrix multiplications.",a:"<p>Let layer 1 compute h = W₁x + b₁ and layer 2 compute y = W₂h + b₂, with no non-linearity between them. Substituting:</p><div class='eqb'>y = W₂(W₁x + b₁) + b₂\n  = (W₂W₁)x + (W₂b₁ + b₂)\n  = W′x + b′</div><p>where W′ = W₂W₁ is a single matrix and b′ = W₂b₁ + b₂ a single vector. The two-layer network is therefore <i>exactly</i> a one-layer network with parameters (W′, b′), and the argument extends to any depth by induction.</p><p><b>Consequence:</b> depth buys representational power only when a non-linear function is applied between the linear maps. This is why activation functions are not an optional refinement but the thing that makes deep learning possible at all — and it is why Module 2 spends thirty slides on them.</p>"},
  {id:"m1t10p3",d:"moderate",q:"An MLP has 3 inputs, one hidden layer of 4 units, and 2 outputs. How many weights and biases does it have in total?",hint:"Count each layer's connections separately, then the biases.",a:"<p><b>Input → hidden:</b> every one of the 3 inputs connects to every one of the 4 hidden units: 3 × 4 = <b>12 weights</b>. Each hidden unit has one bias: <b>4 biases</b>.</p><p><b>Hidden → output:</b> 4 × 2 = <b>8 weights</b>. Each output unit has one bias: <b>2 biases</b>.</p><p><b>Total:</b> 12 + 8 = 20 weights and 4 + 2 = 6 biases, giving <b>26 learnable parameters</b>.</p><p>The general formula for a fully connected layer from n units to m units is n×m weights plus m biases. Note how fast this grows — it is exactly the growth that motivates weight sharing in CNNs in Module 3.</p>"}],
 questions:[

{id:"m1t11",m:"m1",title:"Perceptron Learning Rule",type:"problem-solving",priority:"high",los:["1.2"],
 src:"⚑ Module 2 deck, slides 214–224 — this Module 1 syllabus topic is NOT in the Module 1 deck",
 summary:"The rule that updates weights only when the perceptron gets an example wrong.",
 whatIs:"<p>The perceptron learning rule is how a perceptron's weights are found from data rather than chosen by hand. It is an <b>error-driven</b> rule: if the prediction is right, nothing moves at all; if it is wrong, every weight shifts by an amount proportional to the input that caused the error.</p>",
 concept:"<div class='box warning'><h5>Where this topic lives</h5><p>The syllabus lists <b>Perceptron Learning, Delta learning</b> under Module 1. Neither appears anywhere in the Module 1 deck. Both are taught only in the Module 2 deck, slides 214–230. If you revise Module 1 from <code>Module1.pdf</code> alone you will miss a named Module 1 topic completely.</p></div>"+
  "<h4>The rule</h4><div class='eqb'>w_i(new) = w_i(old) + η (t − y) x_i\nb(new)   = b(old)   + η (t − y)</div>"+
  "<p>where <b>η</b> is the learning rate, <b>t</b> the target (desired) output, <b>y</b> the actual output, and <b>xᵢ</b> the i-th input. The quantity (t − y) is the error, and for a binary perceptron it can only take three values:</p>"+
  "<div class='scroll'><table><tr><th>t</th><th>y</th><th>t − y</th><th>What happens</th></tr>"+
  "<tr><td>1</td><td>1</td><td>0</td><td>Correct — <b>no update at all</b></td></tr>"+
  "<tr><td>0</td><td>0</td><td>0</td><td>Correct — <b>no update at all</b></td></tr>"+
  "<tr><td>1</td><td>0</td><td>+1</td><td>Fired too little — weights <b>increase</b> on active inputs</td></tr>"+
  "<tr><td>0</td><td>1</td><td>−1</td><td>Fired too much — weights <b>decrease</b> on active inputs</td></tr></table></div>"+
  "<h4>Why the update has that shape</h4>"+
  "<p>The change to wᵢ is proportional to xᵢ. An input that was 0 contributed nothing to the wrong answer, so its weight does not move. An input that was large contributed a lot, so its weight moves a lot. The rule assigns blame in proportion to involvement — which is the same instinct that backpropagation later formalises with gradients.</p>"+
  "<h4>The algorithm</h4><ol>"+
  "<li>Initialise weights and bias (small values, often zero or random).</li>"+
  "<li>For each training example: compute z = Σwᵢxᵢ + b, then y = step(z).</li>"+
  "<li>If y ≠ t, apply the update to every weight and to the bias.</li>"+
  "<li>Repeat over the whole dataset until an entire pass produces no updates.</li></ol>"+
  "<div class='box tip'><h5>Convergence</h5><p>If the data is linearly separable, this rule is guaranteed to find a separating boundary in a finite number of steps. If the data is <b>not</b> separable it never terminates — it cycles indefinitely. That is why the separability test of the previous topics matters practically and not just theoretically.</p></div>",
 needToKnow:["Write the update rule for weights and for the bias","State that no update occurs when the prediction is correct","Explain why the update is proportional to xᵢ","Carry out a full numeric update for a misclassified example","State the convergence guarantee and its condition"],
 recognition:{clues:["A learning rate η is given","Both a target t and an output y appear","'Update the weights', 'perform one iteration', 'one epoch'","A step / threshold activation is in use"],
  wording:["Apply the perceptron learning rule to update the weights for the given example.","State the perceptron learning rule and explain each term.","Perform one iteration of perceptron learning with η = 0.1."],
  firstMove:"Compute z and y first. Then compute (t − y). If it is 0, write 'no update required' and stop — that is the complete correct answer for that example.",
  trap:"Updating the weights even when the prediction was already correct. The perceptron rule is silent on correct examples; only the delta rule always moves."},
 examAnswer:[
  {marks:2,body:"<p>Give the update equation, define η, t, y and xᵢ, and state the key property: no update when t = y.</p>"},
  {marks:5,body:"<p>(1) The rule for weights and bias. (2) The three cases of (t − y) in a small table. (3) One sentence on why the update is proportional to xᵢ. (4) A worked numeric update. (5) The convergence guarantee and the condition it requires.</p>"}],
 mistakes:["Updating on correctly classified examples","Forgetting to update the bias — it uses (t − y) with no xᵢ factor, because its input is permanently 1","Getting the sign backwards: when t = 1 and y = 0 the weights must <i>rise</i>","Multiplying by the output y instead of the input xᵢ","Claiming the rule converges on any data — it only converges when the data is linearly separable"],
 examples:[
  {id:"m1t11e1",title:"One full update step (deck example, recomputed)",q:"A perceptron predicting student readiness has w = (0.20, 0.10, 0.15, −0.10) for (attendance, GPA, sleep, mobile usage) and b = −0.20, with η = 0.1. Student B has x = (0.5, 0.4, 0.6, 0.7), target t = 0, and the perceptron predicts y = 1. Update the weights.",
   steps:["Error: t − y = 0 − 1 = −1. Non-zero, so an update is required.","Δwᵢ = η(t − y)xᵢ = 0.1 × (−1) × xᵢ = −0.1 xᵢ.","w₁ = 0.20 + 0.1(−1)(0.5) = 0.20 − 0.05 = 0.15","w₂ = 0.10 + 0.1(−1)(0.4) = 0.10 − 0.04 = 0.06","w₃ = 0.15 + 0.1(−1)(0.6) = 0.15 − 0.06 = 0.09","w₄ = −0.10 + 0.1(−1)(0.7) = −0.10 − 0.07 = −0.17","b = −0.20 + 0.1(−1) = −0.30"],
   answer:"w = <b>(0.15, 0.06, 0.09, −0.17)</b>, b = −0.30. Every weight moved down, because the perceptron fired when it should not have. Mobile usage, already an unhelpful signal at −0.10, is pushed further negative to −0.17.",
   trap:"<b>Note on the source.</b> The deck's slide states z = 0.06 for this student. Recomputing with the bias of −0.20 given two slides earlier gives z = 0.10 + 0.04 + 0.09 − 0.07 − 0.20 = −0.04, which would make y = 0 and require no update. The 0.06 figure is consistent with a bias of −0.10. The lecturer's weight updates (shown above) are internally consistent and correct for y = 1, so they are reproduced as given; be ready to state your bias explicitly if this appears in the paper."},
  {id:"m1t11e2",title:"An example that triggers no update",q:"Same perceptron, w = (0.20, 0.10, 0.15, −0.10), b = −0.20, η = 0.1. Student A has x = (0.9, 0.8, 0.7, 0.2) with target t = 1. What is the update?",
   steps:["z = (0.20)(0.9) + (0.10)(0.8) + (0.15)(0.7) + (−0.10)(0.2) − 0.20","= 0.18 + 0.08 + 0.105 − 0.02 − 0.20 = 0.145","z ≥ 0, so y = 1.","t − y = 1 − 1 = 0."],
   answer:"<b>No update.</b> Every Δwᵢ = η × 0 × xᵢ = 0, and Δb = 0 as well. The weights are unchanged: w = (0.20, 0.10, 0.15, −0.10), b = −0.20.",
   trap:"Writing out four update lines that all evaluate to zero wastes time but is not wrong. Writing 'no update, since t = y' is the better answer — it shows you understand the rule is error-driven."}],
 practice:[
  {id:"m1t11p1",d:"easy",q:"State the perceptron learning rule and explain each symbol.",hint:"Weights and bias update differently in exactly one respect.",a:"<div class='eqb'>wᵢ(new) = wᵢ(old) + η (t − y) xᵢ\nb(new)  = b(old)  + η (t − y)</div><p><b>η</b> — the learning rate, a small positive constant controlling how big each correction is. <b>t</b> — the target or desired output for this training example. <b>y</b> — the output the perceptron actually produced. <b>xᵢ</b> — the i-th input of the example.</p><p>The bias update has no xᵢ factor because its input is the dummy x₀ = 1, so η(t−y)x₀ = η(t−y).</p>"},
  {id:"m1t11p2",d:"moderate",q:"A perceptron has w = (0.5, −0.2), b = 0.1, η = 0.2. For x = (1, 1) the target is 0. Perform one update.",hint:"Compute z, then y, then the error, then update.",a:"<p><b>Forward pass:</b> z = (0.5)(1) + (−0.2)(1) + 0.1 = 0.5 − 0.2 + 0.1 = 0.4. Since 0.4 ≥ 0, y = 1.</p><p><b>Error:</b> t − y = 0 − 1 = −1, so an update is needed.</p><p><b>Updates:</b><br>w₁ = 0.5 + 0.2(−1)(1) = 0.5 − 0.2 = <b>0.3</b><br>w₂ = −0.2 + 0.2(−1)(1) = −0.2 − 0.2 = <b>−0.4</b><br>b = 0.1 + 0.2(−1) = <b>−0.1</b></p><p><b>Check the correction worked:</b> new z = 0.3 − 0.4 − 0.1 = −0.2 &lt; 0, so y = 0 = t. This example is now classified correctly. (One update does not always fix an example, but it always moves in the right direction.)</p>"},
  {id:"m1t11p3",d:"moderate",q:"Why is the weight update proportional to xᵢ rather than a constant step?",hint:"Ask which inputs were responsible for the error.",a:"<p>Because the size of an input measures how much that input contributed to the wrong answer. An input of xᵢ = 0 contributed nothing to z, so changing its weight could not have prevented the error — and indeed η(t−y)(0) = 0, so it does not move. An input of xᵢ = 0.9 contributed heavily, so its weight is corrected heavily.</p><p>A constant step would move all weights equally, including weights on inputs that were inactive and therefore blameless. That would corrupt what the perceptron has already learned about those inputs. Scaling by xᵢ assigns blame in proportion to involvement, which is the same principle that backpropagation generalises through the chain rule in Module 2.</p>"},
  {id:"m1t11p4",d:"hard",q:"A dataset is not linearly separable. Describe what the perceptron learning rule does when run on it, and how you would detect this in practice.",hint:"Think about what the stopping condition is.",a:"<p>The stopping condition is 'a complete pass produces no updates', which requires every example to be classified correctly. On non-separable data no weight vector achieves that, so the condition is never met and the algorithm <b>runs forever</b>, cycling through weight vectors without settling. It does not converge to a good approximate boundary either — it keeps being knocked around by whichever examples it currently gets wrong.</p><p><b>Detecting it:</b> impose a maximum epoch count and track the number of misclassifications per epoch. On separable data that count falls to zero. On non-separable data it oscillates around some non-zero floor and never trends to zero, no matter how long you wait.</p><p><b>What to do instead:</b> the pocket algorithm (keep the best weights seen so far), or switch to the delta rule on a smooth loss, which minimises squared error and does settle even when zero error is unreachable.</p>"}],

{id:"m1t12",m:"m1",title:"Delta Learning Rule (Widrow–Hoff)",type:"problem-solving",priority:"high",los:["1.2"],
 src:"⚑ Module 2 deck, slides 225–228 — this Module 1 syllabus topic is NOT in the Module 1 deck",
 summary:"Learning from a continuous error rather than a binary one, and how it differs from the perceptron rule.",
 whatIs:"<p>The delta rule (also called the Widrow–Hoff or LMS rule) replaces the perceptron's binary error with a <b>continuous</b> one. Instead of asking 'was I right or wrong?', it asks 'by how much was I off?', and updates in proportion to that amount.</p>",
 concept:"<h4>The rule</h4><div class='eqb'>Δw_i = η (t − y) x_i        with y a CONTINUOUS output</div>"+
  "<p>The equation looks identical to the perceptron rule, and that similarity is exactly what the exam tests. The difference is entirely in what <b>y</b> is. In the perceptron rule y is the thresholded 0/1 output, so (t − y) ∈ {−1, 0, +1}. In the delta rule y is the output <i>before</i> or after a differentiable activation, so (t − y) is a real number that can be 0.03 or 0.87.</p>"+
  "<h4>The comparison the deck draws</h4><div class='scroll'><table>"+
  "<tr><th>Feature</th><th>Perceptron Learning</th><th>Delta Learning Rule</th></tr>"+
  "<tr><td>Output y</td><td>Binary, from a step function</td><td>Continuous, from a linear or differentiable activation</td></tr>"+
  "<tr><td>Error (t − y)</td><td>Only −1, 0 or +1</td><td>Any real number</td></tr>"+
  "<tr><td>Update when correct</td><td><b>None</b> — the rule is silent</td><td><b>Still updates</b>, unless the error is exactly 0</td></tr>"+
  "<tr><td>Size of correction</td><td>Same magnitude for every mistake</td><td>Proportional to how badly wrong it was</td></tr>"+
  "<tr><td>Minimises</td><td>Number of misclassifications</td><td>Mean squared error E = ½Σ(t − y)²</td></tr>"+
  "<tr><td>Needs the activation to be</td><td>Anything, including a step</td><td><b>Differentiable</b></td></tr>"+
  "<tr><td>Non-separable data</td><td>Never converges; cycles</td><td>Converges to the least-squared-error solution</td></tr>"+
  "<tr><td>Leads to</td><td>Nothing further — it is a dead end</td><td><b>Gradient descent and backpropagation</b></td></tr></table></div>"+
  "<h4>Why the delta rule matters more</h4>"+
  "<p>The delta rule is gradient descent on the squared-error loss. Differentiating E = ½(t − y)² with respect to wᵢ, with y = Σwᵢxᵢ, gives ∂E/∂wᵢ = −(t − y)xᵢ, so a step of −η∂E/∂wᵢ is precisely η(t − y)xᵢ. The rule is not an ad-hoc heuristic like the perceptron rule; it is the gradient of a loss function. That is why it generalises to hidden layers and to any differentiable activation, and it is the direct ancestor of everything in Module 2.</p>"+
  "<div class='box tip'><h5>The one-sentence distinction</h5><p>The perceptron rule learns from <i>whether</i> you were wrong. The delta rule learns from <i>how</i> wrong you were — and being able to differentiate the error is what lets the signal reach a hidden layer.</p></div>",
 needToKnow:["Write Δwᵢ = η(t − y)xᵢ and say explicitly that y is continuous","Give at least five rows of the perceptron-vs-delta comparison","State that the delta rule minimises squared error, and derive the gradient link","Explain why the activation must be differentiable","Perform a numeric delta update"],
 recognition:{clues:["'Delta rule', 'Widrow–Hoff', 'LMS'","The output is a decimal such as 0.73 rather than 0 or 1","Squared error is mentioned","'Compare the perceptron rule with the delta rule'"],
  wording:["Explain the delta learning rule and compare it with perceptron learning.","Apply the delta rule to update weights given a continuous output.","Why must the activation be differentiable for the delta rule?"],
  firstMove:"Check whether y is binary or continuous. That single observation determines which rule the question is about and is worth stating in your first line.",
  trap:"Writing the same equation for both rules and calling that the comparison. The equations are the same; the answer is about what y is and what follows from it."},
 examAnswer:[
  {marks:2,body:"<p>The rule with y stated as continuous, plus the single sharpest difference: the delta rule still updates on correctly classified examples because the error is rarely exactly zero.</p>"},
  {marks:5,body:"<p>(1) The rule. (2) A five- to seven-row comparison table. (3) The gradient derivation showing the delta rule is gradient descent on ½(t−y)². (4) Why differentiability is required. (5) One line: this is what backpropagation generalises.</p>"}],
 mistakes:["Saying the two rules have different equations — they do not; the difference is in y","Claiming the delta rule needs no learning rate","Forgetting that the delta rule converges on non-separable data while the perceptron rule does not","Using a step activation with the delta rule; the step has zero derivative almost everywhere and undefined derivative at 0, so it cannot be used","Omitting the link to gradient descent, which is the reason the topic matters"],
 examples:[
  {id:"m1t12e1",title:"Delta update with a continuous output",q:"A linear unit has w = (0.4, 0.6), b = 0.1, η = 0.5. For x = (1, 2) the target is t = 1.0. Perform one delta update.",
   steps:["Output (linear activation): y = (0.4)(1) + (0.6)(2) + 0.1 = 0.4 + 1.2 + 0.1 = 1.7.","Error: t − y = 1.0 − 1.7 = −0.7. Note this is a real number, not ±1.","Δw₁ = η(t − y)x₁ = 0.5(−0.7)(1) = −0.35 → w₁ = 0.4 − 0.35 = 0.05","Δw₂ = 0.5(−0.7)(2) = −0.7 → w₂ = 0.6 − 0.7 = −0.1","Δb = 0.5(−0.7) = −0.35 → b = 0.1 − 0.35 = −0.25"],
   answer:"w = <b>(0.05, −0.1)</b>, b = −0.25. Check: new y = 0.05 − 0.2 − 0.25 = −0.4, so the error is now 1.0 − (−0.4) = 1.4 — <i>larger</i> than before.",
   trap:"The check reveals a real hazard: η = 0.5 is too large here and the update overshoots past the target. The delta rule only converges for a sufficiently small learning rate; this is the same overshoot problem that Module 2 treats under learning rate selection."},
  {id:"m1t12e2",title:"Same example, both rules",q:"For an example with t = 1, a unit produces continuous output y = 0.9, which thresholds to 1. Compare what each rule does, with η = 0.1 and x₁ = 2.",
   steps:["<b>Perceptron rule:</b> the thresholded output is y = 1, so t − y = 1 − 1 = 0. Δw₁ = 0. No update.","<b>Delta rule:</b> the continuous output is y = 0.9, so t − y = 1 − 0.9 = 0.1. Δw₁ = 0.1 × 0.1 × 2 = 0.02. The weight rises by 0.02."],
   answer:"The perceptron rule does <b>nothing</b>; the delta rule makes a small positive correction of <b>+0.02</b>.",
   trap:"This is the cleanest illustration of the difference and a very common exam question. The perceptron rule is satisfied as soon as the answer is on the right side of the boundary. The delta rule keeps pushing the output towards the target even when the classification is already correct, which is why it produces a better-conditioned boundary and why it keeps working when perfect classification is impossible."}],
 practice:[
  {id:"m1t12p1",d:"easy",q:"Give five differences between the perceptron learning rule and the delta learning rule.",hint:"Start from what y is and follow the consequences.",a:"<div class='scroll'><table><tr><th>Feature</th><th>Perceptron rule</th><th>Delta rule</th></tr><tr><td>Output y</td><td>Binary (step)</td><td>Continuous (differentiable activation)</td></tr><tr><td>Error range</td><td>−1, 0 or +1 only</td><td>Any real number</td></tr><tr><td>On a correct example</td><td>No update</td><td>Still updates unless error is exactly 0</td></tr><tr><td>Objective minimised</td><td>Count of misclassifications</td><td>Squared error ½Σ(t−y)²</td></tr><tr><td>Non-separable data</td><td>Cycles forever</td><td>Converges to least-squares solution</td></tr></table></div>"},
  {id:"m1t12p2",d:"moderate",q:"Show that the delta rule is gradient descent on the squared-error loss.",hint:"Differentiate E = ½(t − y)² with respect to wᵢ, remembering y depends on wᵢ.",a:"<p>Take the loss for a single example with a linear unit, E = ½(t − y)² where y = Σⱼwⱼxⱼ + b.</p><div class='eqb'>∂E/∂wᵢ = ∂E/∂y × ∂y/∂wᵢ\n∂E/∂y  = ½ · 2(t − y) · (−1) = −(t − y)\n∂y/∂wᵢ = xᵢ\n⟹ ∂E/∂wᵢ = −(t − y) xᵢ</div><p>A gradient-descent step moves against the gradient: Δwᵢ = −η ∂E/∂wᵢ = <b>+η(t − y)xᵢ</b>, which is exactly the delta rule.</p><p>The factor of ½ in the loss exists purely so the 2 from differentiating the square cancels — it is cosmetic, not meaningful. The important consequence is that the delta rule is <i>derived</i>, not invented: it is what gradient descent on squared error looks like for one linear unit. That is why it extends to hidden layers, where no target t exists but a gradient still does.</p>"},
  {id:"m1t12p3",d:"moderate",q:"Why can the delta rule not be used with a step activation function?",hint:"The derivation you just did needs one property of the activation.",a:"<p>The derivation requires ∂y/∂wᵢ, which needs y to be differentiable in the weights. A step function fails this in two ways: its derivative is <b>0 everywhere except at the jump</b>, and at the jump itself it is <b>undefined</b> (formally infinite).</p><p>The practical consequence is fatal. With a zero derivative almost everywhere, ∂E/∂wᵢ = 0 for essentially every weight vector, so the update is zero and nothing ever learns. There is no gradient signal telling the weights which way to move.</p><p>This is precisely why differentiable activations exist. The perceptron rule sidesteps the problem by not being a gradient method at all — it is a hand-designed correction — but that is also why it cannot be extended to hidden layers. Once you want gradients to flow backwards through multiple layers, every activation on the path must be differentiable, which is the whole motivation for sigmoid, tanh and ReLU in Module 2.</p>"}],
 questions:[
  {q:"Explain the delta learning rule and compare it with the perceptron learning rule.",marks:5,d:"moderate",priority:"high",source:"source"},
  {q:"Show that the delta rule is gradient descent on the squared error loss.",marks:5,d:"hard",priority:"high",source:"predicted"},
  {q:"Why must the activation function be differentiable for the delta rule to work?",marks:2,d:"moderate",priority:"high",source:"predicted"}]},

{id:"m1t13",m:"m1",title:"Deep Networks: Fundamentals, History, Advantages and Drawbacks",type:"theory",priority:"medium",los:["1.3"],
 src:"Module 1 deck, slides 13, 23, 53–55",
 summary:"What makes a network 'deep', the two dates the deck anchors, and the honest cost of depth.",
 whatIs:"<p>A network is called <b>deep</b> when it has more than one hidden layer, so that features are built in stages: early layers learn simple patterns and later layers combine them into complex ones.</p>",
 concept:"<h4>What 'deep' actually buys</h4>"+
  "<p>Depth gives <b>hierarchical feature learning</b>. Each layer takes the previous layer's derived features as its raw material. In vision this shows up concretely: edges, then corners and textures, then object parts, then whole objects — exactly the progression Module 3 traces through LeNet and AlexNet. The consequence is that features no longer have to be hand-designed; the network discovers them from data. That single property is what separates deep learning from classical machine learning.</p>"+
  "<h4>The history the deck anchors</h4><div class='scroll'><table>"+
  "<tr><th>Year</th><th>Event</th><th>Why it mattered</th></tr>"+
  "<tr><td><b>1943</b></td><td>McCulloch–Pitts neuron</td><td>First mathematical model of a neuron; showed Boolean logic could be computed by a threshold unit</td></tr>"+
  "<tr><td><b>1958</b></td><td>Rosenblatt's perceptron</td><td>Added weights and a learnable threshold, so the model could be trained from data rather than designed by hand</td></tr></table></div>"+
  "<div class='box warning'><h5>Gap in the material</h5><p>The syllabus lists <b>'Deep Networks: Fundamentals, Brief History'</b>, but the folder anchors only these two dates. There is no slide anywhere covering the 1969 Minsky–Papert critique, the 1986 backpropagation revival, or the 2012 AlexNet breakthrough as history — although AlexNet itself is taught in Module 3 as an architecture. Nothing has been invented here to fill the gap.</p></div>"+
  "<h4>Advantages and drawbacks — the deck's 'Economics of Deep Learning'</h4><div class='scroll'><table>"+
  "<tr><th>Advantages</th><th>Drawbacks</th></tr>"+
  "<tr><td>Learns features automatically — no manual feature engineering</td><td>Needs very large amounts of labelled data</td></tr>"+
  "<tr><td>Accuracy keeps improving as data grows, where classical methods plateau</td><td>Computationally expensive; needs GPUs and long training times</td></tr>"+
  "<tr><td>Handles unstructured data — images, audio, text — directly</td><td>A 'black box': the learned representation is hard to interpret or justify</td></tr>"+
  "<tr><td>One architecture generalises across many tasks</td><td>Many hyperparameters to tune, and results are sensitive to them</td></tr>"+
  "<tr><td>Scales to very high-dimensional inputs</td><td>Prone to overfitting without regularization — the whole of Module 2's last section</td></tr></table></div>",
 needToKnow:["Define 'deep' as more than one hidden layer","Explain hierarchical feature learning with a concrete progression","State 1943 and 1958 with what each contributed","Give at least three advantages and three drawbacks","Name automatic feature learning as the defining advantage"],
 recognition:{clues:["'Brief history', 'evolution of', a date","'Advantages and disadvantages of deep learning'","'What makes a network deep?'"],
  wording:["Explain the fundamentals of deep networks and trace their brief history.","State the advantages and drawbacks of deep learning.","What is meant by a deep network?"],
  firstMove:"Define depth in one line, then go straight to hierarchical feature learning — that is the substance, and history is the garnish.",
  trap:"Listing only advantages. Questions phrased 'advantages and drawbacks' split the marks evenly, and the drawbacks are the half students skip."},
 examAnswer:[
  {marks:2,body:"<p>Depth = more than one hidden layer. One sentence on hierarchical feature learning. Two advantages and two drawbacks.</p>"},
  {marks:5,body:"<p>(1) Definition of depth. (2) Hierarchical feature learning with the edges → parts → objects progression. (3) The two anchored dates. (4) A two-column advantages/drawbacks table with four rows each. (5) One closing line naming automatic feature learning as the defining shift from classical ML.</p>"}],
 mistakes:["Defining 'deep' as 'many neurons' — it is many <i>layers</i>","Claiming deep learning is always better; on small tabular datasets classical methods routinely win","Listing 'needs data' and 'needs computation' as one point when they are two separate marks","Omitting interpretability, which is the drawback with the most real-world consequence","Inventing historical dates the folder does not contain"],
 examples:[{id:"m1t13e1",title:"Choosing between deep learning and a classical method",q:"You have 400 labelled patient records with 12 numeric features, and a requirement that a clinician must be able to justify every decision. Would you use a deep network? Justify against the advantage/drawback table.",
  steps:["Data volume: 400 rows is tiny. The 'accuracy improves with data' advantage does not apply, and the 'needs large data' drawback bites hard — a deep network would overfit badly.","Data type: 12 numeric features is structured tabular data, not unstructured. The advantage of handling images or audio directly is irrelevant here.","Feature learning: with 12 well-understood clinical features there is little for hierarchical learning to discover; the features are already meaningful.","Interpretability: this is a hard requirement, and the black-box drawback is disqualifying."],
  answer:"<b>No.</b> Every advantage of deep learning is inapplicable here and two drawbacks are decisive. A logistic regression or decision tree would be more accurate on 400 rows and is directly interpretable.",
  trap:"This is a genuinely common exam framing and students almost always answer 'yes, deep learning is more powerful'. The marks are for matching the method to the situation, and the honest answer is that depth is the wrong tool for small, structured, interpretability-critical problems."}],
 practice:[
  {id:"m1t13p1",d:"easy",q:"What makes a network 'deep', and what does depth give you?",hint:"Count layers, then say what each successive layer works with.",a:"<p>A network is <b>deep</b> when it has more than one hidden layer between input and output.</p><p>What depth gives is <b>hierarchical feature learning</b>. The first hidden layer computes simple features from the raw input; the second computes features of those features; and so on. In vision this produces a concrete progression — edges, then corners and textures, then object parts, then whole objects. The practical payoff is that features are discovered from data rather than hand-designed by an engineer, which is the defining difference between deep learning and classical machine learning.</p>"},
  {id:"m1t13p2",d:"moderate",q:"Give four advantages and four drawbacks of deep learning, each with one line of consequence.",hint:"Pair each advantage with the cost that comes with it.",a:"<p><b>Advantages.</b> (1) Automatic feature learning — removes the manual feature-engineering step that dominates classical pipelines. (2) Accuracy scales with data — where classical methods plateau, deep networks keep improving as the dataset grows. (3) Handles unstructured data directly — images, audio and text need no hand-built descriptors. (4) Architectural transfer — the same family of architectures works across many tasks and domains.</p><p><b>Drawbacks.</b> (1) Data hunger — needs very large labelled datasets, which are expensive and sometimes impossible to obtain. (2) Computational cost — GPU hardware and long training times, with real energy and money implications. (3) Black-box behaviour — the learned representation resists interpretation, which blocks use where decisions must be justified. (4) Hyperparameter sensitivity — learning rate, depth, width, regularization strength all interact, and poor choices produce poor results with no obvious diagnosis.</p>"}],
 questions:[
  {q:"Explain the fundamentals of deep networks and state the advantages and drawbacks of deep learning.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"What is meant by hierarchical feature learning? Illustrate with an example.",marks:5,d:"moderate",priority:"medium",source:"predicted"}]},

{id:"m1t14",m:"m1",title:"Basic Terminologies of Deep Learning",type:"theory",priority:"medium",los:["1.3"],
 src:"Module 2 deck, slides 4–18 (definitions are scattered there; no dedicated slide exists in the Module 1 deck)",
 summary:"The vocabulary every later question assumes — epoch, batch, learning rate, weights, bias, loss.",
 whatIs:"<p>A named Module 1 syllabus bullet. The terms are the running vocabulary of Modules 2 and 3, so getting them precise now removes friction from every later topic.</p>",
 concept:"<div class='box warning'><h5>Gap in the material</h5><p>No slide in the folder carries the heading 'Basic Terminologies of Deep Learning'. The definitions below are drawn from where the Module 2 deck introduces each term in its opening narrative (slides 4–18) — 'Stage 7: Tuning the Pace of Mastery' for learning rate, 'Stage 8: The Discipline of Complete Epochs' for epoch, 'Stage 9: Accelerating Progress through Efficient Batching' for batch. Nothing has been added from outside the folder.</p></div>"+
  "<div class='scroll'><table><tr><th>Term</th><th>Definition</th><th>The distinction that gets tested</th></tr>"+
  "<tr><td><b>Weight</b> (w)</td><td>A learnable coefficient on a connection, saying how strongly one unit's output influences the next</td><td>Weights set the boundary's <i>orientation</i></td></tr>"+
  "<tr><td><b>Bias</b> (b)</td><td>A learnable constant added to the weighted sum, equal to −θ</td><td>Bias sets the boundary's <i>position</i>; without it every boundary passes through the origin</td></tr>"+
  "<tr><td><b>Activation function</b></td><td>The non-linear function applied to the weighted sum</td><td>Without it, any depth of network collapses to a single linear layer</td></tr>"+
  "<tr><td><b>Loss function</b></td><td>A number measuring how far one prediction is from its target</td><td>Loss is <i>per example</i>; cost is usually the average over a set</td></tr>"+
  "<tr><td><b>Learning rate</b> (η)</td><td>The step size applied to each weight update</td><td>Too small → painfully slow; too large → overshoots and may diverge</td></tr>"+
  "<tr><td><b>Epoch</b></td><td>One complete pass through the <i>entire</i> training dataset</td><td>An epoch is about <i>coverage</i>, not about a number of updates</td></tr>"+
  "<tr><td><b>Batch</b></td><td>The group of examples processed before one weight update</td><td>A batch is about <i>update frequency</i>, not coverage</td></tr>"+
  "<tr><td><b>Iteration</b></td><td>One weight update, i.e. one batch processed</td><td>iterations per epoch = dataset size ÷ batch size</td></tr>"+
  "<tr><td><b>Hyperparameter</b></td><td>A value you choose before training — η, batch size, number of layers</td><td>Hyperparameters are <b>set</b>, parameters (w, b) are <b>learned</b></td></tr>"+
  "<tr><td><b>Forward propagation</b></td><td>Computing the output by passing inputs through the network</td><td>Goes input → output</td></tr>"+
  "<tr><td><b>Backpropagation</b></td><td>Computing gradients by applying the chain rule backwards</td><td>Goes output → input; it computes gradients, it does not update weights</td></tr></table></div>"+
  "<div class='box tip'><h5>The relationship worth memorising</h5><p>With N training examples and batch size B: <b>iterations per epoch = N / B</b>. Ten epochs on 1000 examples with batch size 50 means 20 iterations per epoch and 200 weight updates in total.</p></div>",
 needToKnow:["Define all the terms precisely enough to distinguish them","Compute iterations per epoch from N and B","Separate hyperparameters from parameters","Separate epoch from batch from iteration — the most tested trio","State that backpropagation computes gradients and the optimizer applies them"],
 recognition:{clues:["'Define the following terms'","'Differentiate between epoch, batch and iteration'","A short-answer question worth 2 marks"],
  wording:["Define the basic terminologies of deep learning.","Differentiate between an epoch, a batch and an iteration.","Distinguish between a parameter and a hyperparameter."],
  firstMove:"For any pair, state what each one <i>counts</i>. An epoch counts passes over the data; a batch counts examples per update; an iteration counts updates.",
  trap:"Saying 'an epoch is one update'. An epoch is one full pass over the data, which is normally many updates."},
 examAnswer:[
  {marks:2,body:"<p>One precise line per term asked. For a distinguish question, give both definitions plus the arithmetic relationship linking them.</p>"},
  {marks:5,body:"<p>A table with a Term / Definition / Example column. Include the N/B relationship worked with real numbers, and the parameter-vs-hyperparameter split, since these are where the discriminating marks are.</p>"}],
 mistakes:["Confusing epoch and iteration","Calling weights hyperparameters — weights are learned, so they are parameters","Saying backpropagation updates the weights; it computes gradients, and the optimizer does the updating","Defining loss and cost as identical without noting that cost is typically the average","Saying the learning rate is learned — it is chosen"],
 examples:[{id:"m1t14e1",title:"Counting epochs, batches and iterations",q:"A dataset has 10,000 training examples. You train with batch size 100 for 30 epochs. How many weight updates occur in total? How many times is each example seen?",
  steps:["Iterations per epoch = N / B = 10,000 / 100 = 100.","One iteration = one batch processed = one weight update. So 100 updates per epoch.","Total updates = 100 × 30 epochs = 3,000.","Each epoch is a complete pass over the data, so each example is seen exactly once per epoch."],
  answer:"<b>3,000</b> weight updates in total; each example is seen <b>30</b> times, once per epoch.",
  trap:"Answering '30 updates' by confusing epochs with iterations. Also note what happens if you halve the batch size to 50: updates double to 6,000, but each example is still seen exactly 30 times. Batch size changes update frequency, never coverage."}],
 practice:[
  {id:"m1t14p1",d:"easy",q:"Differentiate between an epoch, a batch and an iteration.",hint:"Ask what each one counts.",a:"<p><b>Epoch</b> — one complete pass through the entire training dataset. It counts <i>coverage</i>: after one epoch, every example has been seen once.</p><p><b>Batch</b> — the group of training examples processed together before a single weight update. It counts <i>examples per update</i>.</p><p><b>Iteration</b> — one weight update, i.e. one batch processed. It counts <i>updates</i>.</p><p>They are linked by <b>iterations per epoch = N / B</b>, where N is the dataset size and B the batch size. With N = 1000 and B = 100, one epoch contains 10 iterations.</p>"},
  {id:"m1t14p2",d:"moderate",q:"Distinguish parameters from hyperparameters, giving three examples of each.",hint:"Ask who or what decides the value.",a:"<p><b>Parameters</b> are learned from data by the training algorithm. You do not set them; gradient descent does. Examples: the connection weights wᵢⱼ, the biases bᵢ, and in batch normalization the learned scale and shift γ and β.</p><p><b>Hyperparameters</b> are chosen by you before training starts, and no gradient updates them. Examples: the learning rate η, the batch size, the number of hidden layers and units, the dropout rate, and the regularization strength λ.</p><p>The practical consequence: parameters are fitted automatically in one training run, whereas hyperparameters must be searched over by training repeatedly with different values and comparing validation performance. That is why hyperparameter tuning is expensive and why the syllabus lists it as a self-learning topic.</p>"},
  {id:"m1t14p3",d:"moderate",q:"A model trains on 50,000 examples with batch size 250 for 40 epochs. Give iterations per epoch, total iterations, and how many times each example is seen.",hint:"N/B first.",a:"<p><b>Iterations per epoch</b> = N / B = 50,000 / 250 = <b>200</b>.</p><p><b>Total iterations</b> (weight updates) = 200 × 40 = <b>8,000</b>.</p><p><b>Each example is seen</b> once per epoch, so <b>40 times</b>.</p><p>Sanity check by a second route: total examples processed = 8,000 iterations × 250 per batch = 2,000,000 = 50,000 × 40 ✓.</p>"}],
 questions:[
  {q:"Define the basic terminologies of deep learning: weight, bias, activation function, loss, learning rate, epoch, batch and iteration.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"Differentiate between an epoch, a batch and an iteration with a numerical example.",marks:2,d:"easy",priority:"high",source:"source"},
  {q:"Distinguish between parameters and hyperparameters with examples.",marks:2,d:"moderate",priority:"medium",source:"predicted"}]},

{id:"m1t15",m:"m1",title:"AI vs Machine Learning vs Deep Learning",type:"theory",priority:"medium",los:["1.3"],
 src:"Module 1 deck, slides 56–57",
 summary:"Three nested fields, and the single feature that separates ML from DL.",
 whatIs:"<p>Artificial intelligence, machine learning and deep learning are nested, not parallel: <b>DL ⊂ ML ⊂ AI</b>. The exam wants the nesting stated and the boundary between ML and DL made precise.</p>",
 concept:"<div class='scroll'><table><tr><th></th><th>Artificial Intelligence</th><th>Machine Learning</th><th>Deep Learning</th></tr>"+
  "<tr><td>Scope</td><td>Any technique making a machine behave intelligently</td><td>Subset of AI: systems that learn from data</td><td>Subset of ML: learning with multi-layer neural networks</td></tr>"+
  "<tr><td>Includes rule-based systems?</td><td>Yes — expert systems, search, planning</td><td>No — it must learn from data</td><td>No</td></tr>"+
  "<tr><td>Feature engineering</td><td>Hand-coded rules</td><td><b>Manual</b> — a human designs the features</td><td><b>Automatic</b> — the network learns them</td></tr>"+
  "<tr><td>Data needed</td><td>Varies</td><td>Moderate — works on hundreds to thousands of rows</td><td>Large — typically tens of thousands upward</td></tr>"+
  "<tr><td>Hardware</td><td>CPU</td><td>CPU is usually enough</td><td>GPU strongly preferred</td></tr>"+
  "<tr><td>Interpretability</td><td>High for rule systems</td><td>Moderate — trees and linear models are readable</td><td>Low — a black box</td></tr>"+
  "<tr><td>Performance vs data</td><td>—</td><td>Plateaus once data grows past a point</td><td>Keeps improving as data grows</td></tr>"+
  "<tr><td>Typical methods</td><td>Search, logic, planning, expert systems</td><td>Linear regression, SVM, decision trees, random forests</td><td>MLP, CNN, RNN, autoencoder, transformer</td></tr></table></div>"+
  "<div class='box tip'><h5>The core difference in one sentence</h5><p>In machine learning a human decides <i>what to measure</i> and the algorithm decides how to weigh it. In deep learning the network decides both.</p></div>",
 needToKnow:["State the nesting DL ⊂ ML ⊂ AI and draw the concentric diagram","Name manual vs automatic feature engineering as the ML/DL boundary","Give an example method from each","Contrast data requirements, hardware and interpretability"],
 recognition:{clues:["Three terms named together","'Differentiate between AI, ML and DL'","A concentric-circles diagram in the question"],
  wording:["Differentiate between artificial intelligence, machine learning and deep learning.","With a suitable diagram, explain the relationship between AI, ML and DL."],
  firstMove:"Draw three concentric circles labelled AI (outer), ML (middle), DL (inner). Then table the differences.",
  trap:"Presenting the three as separate, competing fields. They are nested, and saying so is the first mark."},
 examAnswer:[
  {marks:2,body:"<p>The nesting with a concentric diagram, plus the one-line boundary: ML uses hand-designed features, DL learns them.</p>"},
  {marks:5,body:"<p>(1) Concentric diagram. (2) One-line definition of each. (3) A comparison table on feature engineering, data, hardware, interpretability and typical methods. (4) One example method from each. (5) The closing sentence on who chooses what to measure.</p>"}],
 mistakes:["Drawing three separate circles rather than nested ones","Saying 'DL is more accurate than ML' without qualification — on small structured data ML usually wins","Omitting feature engineering, which is the actual boundary","Listing neural networks as ML-but-not-DL without noting that a shallow network is ML and a deep one is DL"],
 examples:[{id:"m1t15e1",title:"Placing three systems",q:"Classify each as AI-only, ML, or DL: (a) a chess engine that searches ahead using a hand-written evaluation function; (b) a spam filter using logistic regression on word-count features chosen by an engineer; (c) an image classifier trained end-to-end from raw pixels.",
  steps:["(a) It behaves intelligently but nothing is learned from data — the evaluation function is hand-written. This is AI, specifically search, and not ML.","(b) It learns its coefficients from data, so it is ML. But the features (word counts) were chosen by a human, so it is not DL.","(c) It learns from data and takes raw pixels with no hand-designed features, building its own representation through many layers. This is DL."],
  answer:"(a) AI only. (b) ML but not DL. (c) DL, and therefore also ML and AI.",
  trap:"Case (b) is the discriminating one. Logistic regression is unambiguously machine learning even though it has no hidden layers — and a two-layer neural network on hand-chosen features would also be ML rather than deep learning. The test is not 'is it a neural network' but 'are the features learned'."}],
 practice:[
  {id:"m1t15p1",d:"easy",q:"Explain the relationship between AI, ML and DL, and give one example method from each.",hint:"Nested, not parallel.",a:"<p>They are <b>nested</b>: DL ⊂ ML ⊂ AI. Artificial intelligence is the broadest field — any technique that makes a machine behave intelligently. Machine learning is the subset of AI in which the system learns its behaviour from data rather than being programmed with rules. Deep learning is the subset of ML that learns using neural networks with multiple hidden layers.</p><p><b>Examples:</b> AI but not ML — a rule-based expert system or a search-based planner. ML but not DL — a decision tree or a support vector machine. DL — a convolutional neural network.</p>"},
  {id:"m1t15p2",d:"moderate",q:"What is the single most important difference between ML and DL, and why does it matter practically?",hint:"Think about who designs the features.",a:"<p><b>Feature engineering.</b> In classical machine learning a human expert decides what to measure — which words to count, which edges to detect, which ratios to compute — and the algorithm only learns how to weigh those chosen features. In deep learning the network learns the features themselves, layer by layer, directly from raw input.</p><p><b>Why it matters practically:</b> feature engineering is the expensive, domain-specific, slow part of a classical pipeline, and it caps performance at the quality of the human's insight. Removing it is what let deep learning work on problems — raw images, raw audio, raw text — where nobody knew what the right features were. The cost of removing it is that the network needs far more data to discover what a human could have simply told it, which is exactly why deep learning wins on large unstructured datasets and loses on small structured ones.</p>"}],
 questions:[
  {q:"Differentiate between artificial intelligence, machine learning and deep learning with a suitable diagram.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"What is the key difference between machine learning and deep learning? Justify with an example.",marks:2,d:"moderate",priority:"medium",source:"source"}]},

{id:"m1t16",m:"m1",title:"Classes of Deep Learning",type:"theory",priority:"high",los:["1.3"],
 src:"Module 1 deck, slides 61–67",
 summary:"The deck's dual classification: by learning paradigm, and separately by network architecture.",
 whatIs:"<p>The deck is emphatic that deep learning models are classified along <b>two independent axes</b>, and it names the slide 'Decoupling How from What'. The <i>paradigm</i> is how the model learns; the <i>architecture</i> is what it is built from. Any model is a pairing of one from each.</p>",
 concept:"<h4>Axis 1 — Learning paradigms (the 'how')</h4><div class='scroll'><table>"+
  "<tr><th>Paradigm</th><th>What the data looks like</th><th>Typical task</th></tr>"+
  "<tr><td><b>Supervised</b></td><td>Every example carries a label</td><td>Classification, regression</td></tr>"+
  "<tr><td><b>Unsupervised</b></td><td>No labels at all</td><td>Clustering, dimensionality reduction, autoencoders</td></tr>"+
  "<tr><td><b>Semi-supervised</b></td><td>A small labelled set plus a large unlabelled one</td><td>Classification where labelling is expensive</td></tr>"+
  "<tr><td><b>Self-supervised</b></td><td>No human labels; the data supplies its own targets</td><td>Predicting a masked word or a hidden patch</td></tr>"+
  "<tr><td><b>Reinforcement</b></td><td>No labels; a reward signal from an environment</td><td>Control, game playing, sequential decisions</td></tr></table></div>"+
  "<h4>Axis 2 — Network architectures (the 'what')</h4><div class='scroll'><table>"+
  "<tr><th>Architecture</th><th>Built for</th><th>Where in this course</th></tr>"+
  "<tr><td><b>MLP</b> / feed-forward</td><td>Fixed-length structured input</td><td>Modules 1 and 2</td></tr>"+
  "<tr><td><b>CNN</b></td><td>Grid-structured data, above all images</td><td>Module 3</td></tr>"+
  "<tr><td><b>RNN / LSTM / GRU</b></td><td>Sequences, where order matters</td><td>Module 5 (out of MSE scope)</td></tr>"+
  "<tr><td><b>Autoencoder</b></td><td>Compressing input into a bottleneck and rebuilding it</td><td>Module 4 (out of MSE scope)</td></tr>"+
  "<tr><td><b>Transformer</b></td><td>Long-range dependencies via attention</td><td>Named in the deck, not taught</td></tr>"+
  "<tr><td><b>GNN</b></td><td>Graph-structured data</td><td>Named in the deck, not taught</td></tr></table></div>"+
  "<div class='box tip'><h5>Why the two axes are independent — and why that is the point of the question</h5><p>A CNN trained on labelled images is supervised; the same CNN inside an autoencoder rebuilding its own input is unsupervised. The architecture did not change, the paradigm did. Stating this explicitly is usually worth a mark on its own, because most answers wrongly present one flat list.</p></div>",
 needToKnow:["State that there are two independent axes and name them","List five learning paradigms with the data each requires","List at least five architectures with what each is built for","Give an example of one architecture used under two different paradigms","Say which architecture suits which data shape"],
 recognition:{clues:["'Classes of deep learning', 'categories of', 'classify … models'","LO 1.3 language: 'major categories of Deep Learning models'","The words supervised and unsupervised together"],
  wording:["Explain the classes of deep learning models.","Classify deep learning models by learning paradigm and by architecture.","Which deep learning architecture would you choose for image data, and why?"],
  firstMove:"Split the page into two headed halves — Paradigms and Architectures — before writing anything. The structure is what distinguishes a full-mark answer here.",
  trap:"Producing one flat list mixing 'supervised' with 'CNN'. They are answers to different questions and mixing them is the standard way to lose marks on this topic."},
 examAnswer:[
  {marks:2,body:"<p>Name the two axes, list the paradigms on one and the architectures on the other. Two lines each.</p>"},
  {marks:5,body:"<p>(1) One sentence establishing the two independent axes. (2) A paradigm table with the data each needs. (3) An architecture table with what each is built for. (4) A concrete example of one architecture under two paradigms. (5) One line matching data shape to architecture — grid → CNN, sequence → RNN, fixed vector → MLP.</p>"}],
 mistakes:["Mixing paradigms and architectures into a single list","Calling an autoencoder a learning paradigm — it is an architecture, usually trained unsupervised","Saying CNNs are 'for supervised learning only'; Module 3's subtitle says supervised because that is the use taught, not because CNNs are restricted to it","Omitting self-supervised, which the deck lists explicitly","Failing to name the data shape each architecture suits, which is the practically useful half"],
 examples:[{id:"m1t16e1",title:"One architecture, two paradigms",q:"Show that a CNN can be used both supervised and unsupervised, and say what that proves about the classification.",
  steps:["<b>Supervised use:</b> train the CNN on images each labelled 'cat' or 'dog', with cross-entropy loss against those labels. Labels come from humans, so the paradigm is supervised.","<b>Unsupervised use:</b> put the same convolutional layers into a convolutional autoencoder that compresses an image to a bottleneck and reconstructs it, with the loss measuring reconstruction error against the input itself. No human labels are involved, so the paradigm is unsupervised.","The convolution layers, filters and weight sharing are identical in both. What changed is the target and the loss, not the architecture."],
  answer:"The same architecture appears under two different paradigms. This proves the two axes are <b>independent</b>: knowing the architecture tells you nothing about the paradigm, and vice versa.",
  trap:"The related trap is assuming Module 3's title, 'CNN: Supervised Learning', means CNNs are inherently supervised. It describes the use being taught in that module. Module 4 then covers autoencoders as unsupervised, and convolutional autoencoders sit in both."}],
 practice:[
  {id:"m1t16p1",d:"easy",q:"List the five learning paradigms and state what data each needs.",hint:"The distinguishing question is: where does the training signal come from?",a:"<p><b>Supervised</b> — every example carries a human-provided label. Signal comes from the label.</p><p><b>Unsupervised</b> — no labels at all. Signal comes from structure within the data itself, such as reconstruction error or cluster compactness.</p><p><b>Semi-supervised</b> — a small labelled set plus a much larger unlabelled one. Used when labelling is expensive but raw data is plentiful.</p><p><b>Self-supervised</b> — no human labels, but targets are generated automatically from the data by hiding part of it and predicting it, such as a masked word or an occluded image patch.</p><p><b>Reinforcement</b> — no labels; an environment returns a reward after each action, and the model learns a policy that maximises cumulative reward.</p>"},
  {id:"m1t16p2",d:"moderate",q:"Match each data type to the most suitable architecture and justify: (a) 28×28 grayscale images, (b) a sentence of variable length, (c) a fixed vector of 15 sensor readings.",hint:"Ask what structure in the data the architecture is designed to exploit.",a:"<p><b>(a) Images → CNN.</b> Images have grid structure with strong local correlation — nearby pixels are related, distant ones usually are not. Convolution exploits exactly this with local receptive fields, and weight sharing means the same edge detector works anywhere in the image. An MLP would treat each pixel as an independent feature, destroying spatial information and needing vastly more parameters.</p><p><b>(b) Sentence → RNN / LSTM / GRU.</b> The input is a sequence of variable length in which order carries meaning. Recurrent architectures process one element at a time while carrying a hidden state, so they handle any length and remember earlier context. An MLP requires a fixed-size input and has no mechanism for order.</p><p><b>(c) Fixed sensor vector → MLP.</b> There is no spatial or temporal structure to exploit — 15 independent readings in a fixed order. A fully connected network is exactly right, and the specialised machinery of a CNN or RNN would buy nothing.</p><p>The general principle: choose the architecture whose built-in assumption matches the structure actually present in the data.</p>"},
  {id:"m1t16p3",d:"moderate",q:"Explain why the deck insists on two independent classification axes rather than one list.",hint:"Consider what each axis constrains.",a:"<p>Because they answer different questions and neither determines the other.</p><p>The <b>paradigm</b> is fixed by your <i>data situation</i>: if you have labels you can do supervised learning; if you have none you cannot, whatever architecture you pick. The paradigm determines the loss function and what a training target even is.</p><p>The <b>architecture</b> is fixed by your <i>data shape</i>: grid-structured data calls for convolution, sequential data for recurrence, fixed vectors for a plain MLP. This is independent of whether labels exist.</p><p>Combining them into one list implies constraints that are not real — it would suggest that choosing a CNN commits you to supervised learning, or that unsupervised learning rules out convolution, and neither is true. The convolutional autoencoder is a single counter-example to both. Keeping the axes separate lets you choose the loss from your labels and the architecture from your data shape, which is how the decision is actually made in practice.</p>"}],
 questions:[
  {q:"Explain the classes of deep learning models, classifying them by learning paradigm and by network architecture.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"Which deep learning architecture would you choose for image data, sequence data and fixed-length structured data? Justify each choice.",marks:5,d:"moderate",priority:"high",source:"source"},
  {q:"Differentiate between supervised, unsupervised and reinforcement learning.",marks:5,d:"easy",priority:"high",source:"source"}]}
]);

var M2=[
{id:"m2t1",m:"m2",title:"Multi-Layered Feed-Forward Neural Network",type:"theory",priority:"high",los:["2.1"],
 src:"Module 2 deck, slides 24–37 and 38–46",
 summary:"The architecture LO 2.1 asks you to represent mathematically, plus its learning factors.",
 whatIs:"<p>A Multi-Layered Feed-Forward Neural Network (MLFFNN) is a network of layers in which information travels in exactly one direction — input to output — with no cycles and no connections backwards or within a layer.</p>",
 concept:"<h4>Structure</h4>"+
  "<p>The deck builds a four-level example: an input layer of student signals, two hidden layers, and an output layer with four categories (Ready, Moderate Risk, High Risk, Immediate Intervention). Every unit in a layer connects to every unit in the next.</p>"+
  "<h4>The mathematical representation — what LO 2.1 asks for</h4>"+
  "<p>Write it in matrix form; per-neuron scalar equations are correct but slow and lose the point.</p>"+
  "<div class='eqb'>Layer 1:  z⁽¹⁾ = W⁽¹⁾x + b⁽¹⁾        a⁽¹⁾ = f(z⁽¹⁾)\nLayer 2:  z⁽²⁾ = W⁽²⁾a⁽¹⁾ + b⁽²⁾     a⁽²⁾ = f(z⁽²⁾)\n   ⋮\nOutput:   z⁽ᴸ⁾ = W⁽ᴸ⁾a⁽ᴸ⁻¹⁾ + b⁽ᴸ⁾   ŷ  = f_out(z⁽ᴸ⁾)</div>"+
  "<p>If layer ℓ−1 has n units and layer ℓ has m units, then W⁽ˡ⁾ is an <b>m × n</b> matrix and b⁽ˡ⁾ is an <b>m × 1</b> vector. Getting these shapes right is the most commonly awarded mark on this topic.</p>"+
  "<h4>Unidirectional flow</h4>"+
  "<p>'Feed-forward' means no unit ever feeds a unit in its own layer or an earlier one. The consequence is that the whole network is one composed function ŷ = f_out(W⁽ᴸ⁾ f(… f(W⁽¹⁾x + b⁽¹⁾) …) + b⁽ᴸ⁾) with no state carried between examples. Networks that <i>do</i> feed backwards are recurrent networks, which is Module 5.</p>"+
  "<h4>Learning factors — the syllabus names these alongside the architecture</h4><div class='scroll'><table>"+
  "<tr><th>Factor</th><th>Effect if too low</th><th>Effect if too high</th></tr>"+
  "<tr><td><b>Learning rate η</b></td><td>Painfully slow convergence</td><td>Overshoots the minimum, may diverge</td></tr>"+
  "<tr><td><b>Number of hidden layers / units</b></td><td>Underfits — cannot represent the pattern</td><td>Overfits — memorises the training set</td></tr>"+
  "<tr><td><b>Batch size</b></td><td>Noisy, unstable updates</td><td>Smooth but slow, and poorer generalisation</td></tr>"+
  "<tr><td><b>Number of epochs</b></td><td>Underfits — training stopped too early</td><td>Overfits — training continued past the optimum</td></tr>"+
  "<tr><td><b>Weight initialisation</b></td><td colspan='2'>All-zero weights make every unit in a layer identical forever (symmetry never breaks); random initialisation is required</td></tr>"+
  "<tr><td><b>Choice of activation</b></td><td colspan='2'>Determines whether gradients survive depth — the vanishing-gradient issue</td></tr></table></div>"+
  "<div class='box tip'><h5>The pattern in that table</h5><p>Almost every learning factor has the same shape: too little capacity or training gives underfitting, too much gives overfitting. That single observation ties the first half of Module 2 to the regularization half.</p></div>",
 needToKnow:["Draw and label a network with two hidden layers","Write the matrix form for each layer and give the shapes of W and b","Explain what 'feed-forward' forbids and what follows from it","Name at least five learning factors with the effect of setting each too high or too low","Explain why weights must be initialised randomly"],
 recognition:{clues:["'MLFFNN', 'feed-forward', 'mathematically represent'","LO 2.1 wording: 'linear-algebraic … represent'","A layer diagram with the number of units per layer given"],

 examAnswer:[
  {marks:5,body:"<p>(1) Labelled diagram with two hidden layers. (2) The matrix equations for each layer. (3) The dimensions of W⁽ˡ⁾ and b⁽ˡ⁾ stated in general. (4) One line on unidirectional flow and what it forbids. (5) A table of five learning factors with too-low and too-high effects.</p>"},
