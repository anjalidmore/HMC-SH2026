 mistakes:["Forgetting the minus sign, giving a negative loss","Mixing log₂ and ln without saying which — they differ by a factor of ln 2 ≈ 0.693","Taking the log of the wrong class's probability","Computing CE over all classes for a one-hot target","Using cross-entropy for a regression task"],
 examples:[
  {id:"m2t9e1",title:"Categorical cross-entropy from a softmax output",q:"A four-class softmax outputs [0.775, 0.116, 0.039, 0.070] and the true class is the first. Compute the cross-entropy in bits and in nats.",
   steps:["The target is one-hot: t = [1, 0, 0, 0].","CE = −(1·log ŷ₁ + 0·log ŷ₂ + 0·log ŷ₃ + 0·log ŷ₄) = −log ŷ₁.","Only the correct class's probability matters: ŷ₁ = 0.775.","In bits: −log₂(0.775) = −(ln 0.775 / ln 2) = −(−0.25489 / 0.69315) = 0.3677 bits.","In nats: −ln(0.775) = 0.2549 nats.","Check the conversion: 0.3677 × 0.69315 = 0.2549 ✓"],
   answer:"CE = <b>0.3677 bits</b> (equivalently 0.2549 nats). This matches the deck exactly.",
   trap:"A loss of 0.37 bits is small — the model gave 77.5% to the right answer. Compare: had it given 0.10 to the correct class the loss would be 3.32 bits, nine times larger. Confidence in the truth is rewarded steeply."},
  {id:"m2t9e2",title:"Binary cross-entropy in both cases",q:"A sigmoid output gives ŷ = 0.8. Compute BCE when t = 1 and when t = 0, using natural log.",
   steps:["BCE = −[t·ln ŷ + (1 − t)·ln(1 − ŷ)].","<b>Case t = 1:</b> the second term has factor (1 − 1) = 0 and vanishes. BCE = −ln(0.8) = −(−0.2231) = 0.2231.","<b>Case t = 0:</b> the first term has factor t = 0 and vanishes. BCE = −ln(1 − 0.8) = −ln(0.2) = 1.6094."],
   answer:"t = 1 → loss <b>0.223</b>; t = 0 → loss <b>1.609</b>. The same prediction is punished seven times harder when it is wrong.",
   trap:"The asymmetry is the whole point of the loss. The prediction 0.8 is a good answer if the truth is 1 and a bad one if the truth is 0, and the loss reflects that automatically. Also note that as ŷ → 1 with t = 0, the loss → ∞: cross-entropy will never let a model be certain and wrong without paying an unbounded price."}],
 practice:[
  {id:"m2t9p1",d:"easy",q:"Write the cross-entropy formula and simplify it for a one-hot target.",hint:"What happens to terms multiplied by zero?",a:"<div class='eqb'>H(t, ŷ) = − Σᵢ tᵢ log ŷᵢ</div><p>With a one-hot target, tᵢ = 1 for the correct class c and 0 for every other class. Every term with tᵢ = 0 vanishes, leaving only the term for class c:</p><div class='eqb'>CE = − log(ŷ_c)</div><p>So the loss is the negative log of the probability assigned to the correct class, and no other output value enters the calculation.</p>"},
  {id:"m2t9p2",d:"moderate",q:"A three-class softmax gives [0.2, 0.7, 0.1] and the true class is the third. Compute the cross-entropy in bits, and say what the loss would have been had the second class been correct.",hint:"Pick out the correct class's probability first.",a:"<p><b>True class is the third:</b> ŷ₃ = 0.1.</p><p>CE = −log₂(0.1) = −(ln 0.1 / ln 2) = −(−2.30259 / 0.69315) = <b>3.322 bits</b>.</p><p><b>Had the second class been correct:</b> ŷ₂ = 0.7, so CE = −log₂(0.7) = −(−0.35667/0.69315) = <b>0.515 bits</b>.</p><p>The same output vector gives a loss over six times larger when the model's confident choice is wrong. Note also that 3.322 bits is worse than a uniform guess over three classes, which would cost log₂(3) = 1.585 bits — the model is actively misleading here, and cross-entropy says so.</p>"},
  {id:"m2t9p3",d:"hard",q:"Why is cross-entropy preferred over MSE for classification? Give both the penalty argument and the gradient argument.",hint:"One argument is about the loss value, one about its derivative.",a:"<p><b>The penalty argument.</b> Probabilities live in [0,1], so squared error between them is capped: the worst possible MSE for a single output is (1 − 0)² = 1. A model that assigns probability 0.001 to the truth is punished almost exactly as much as one assigning 0.05, because both squared errors are near 1. Cross-entropy is unbounded: −log(0.001) = 9.97 bits against −log(0.05) = 4.32 bits. Confident wrongness is punished in proportion to the confidence, which is what forces a classifier to be honest about its uncertainty.</p><p><b>The gradient argument — the more important one.</b> With a sigmoid output and MSE, the gradient with respect to the pre-activation carries a factor of σ′(z) = ŷ(1 − ŷ). When the network is confidently wrong, ŷ is near 1 while t = 0, so σ′ ≈ 0 and the gradient collapses. Learning stalls exactly where correction is most urgently needed.</p><p>With cross-entropy the algebra cancels this factor. Differentiating BCE = −[t ln ŷ + (1−t) ln(1−ŷ)] with ŷ = σ(z) gives</p><div class='eqb'>∂E/∂z = ŷ − t</div><p>with no σ′ term at all. The gradient is simply the error, so a badly wrong prediction produces a correspondingly large correction. The same cancellation holds between softmax and categorical cross-entropy.</p><p>This is why the activation-loss pairings in the task table are not conventions but constructions: each pair is chosen so that the saturating derivative cancels.</p>"}],

{id:"m2t10",m:"m2",title:"Backpropagation: Gradient, Chain Rule and the Algorithm",type:"problem-solving",priority:"high",los:["2.3"],
 src:"Module 2 deck, slides 113–138",
 summary:"How the error at the output is turned into a gradient for every weight in the network.",
 whatIs:"<p>Backpropagation is the algorithm that computes ∂E/∂w for every weight, by applying the chain rule backwards from the output to the input. It answers the deck's framing question: <i>which weight is responsible for the mistake?</i></p>",
 concept:"<div class='box warning'><h5>The distinction that gets tested</h5><p>Backpropagation <b>computes gradients</b>. It does not update anything. Gradient descent, or whichever optimizer you use, applies those gradients. Saying 'backpropagation updates the weights' loses a mark.</p></div>"+
  "<h4>Why the chain rule</h4>"+
  "<p>A weight deep in the network affects the loss only indirectly: it changes a pre-activation, which changes an activation, which changes the next layer, and so on until it changes the output and hence the loss. The chain rule multiplies these local sensitivities together.</p>"+
  "<div class='eqb'>∂E/∂w = (∂E/∂ŷ) · (∂ŷ/∂z) · (∂z/∂w)\n         error       activation      input\n        signal      derivative</div>"+
  "<p>The deck states the prerequisite plainly: <b>all operations in the network must be differentiable</b>, which is why the step function cannot be used and why every activation in Module 2 is chosen partly for its derivative.</p>"+
  "<h4>The algorithm</h4><ol>"+
  "<li><b>Forward pass.</b> Compute and store every z and a, layer by layer, up to the output.</li>"+
  "<li><b>Compute the loss</b> against the target.</li>"+
  "<li><b>Output-layer error.</b> δ⁽ᴸ⁾ = (ŷ − t) ⊙ f′(z⁽ᴸ⁾). With the standard activation-loss pairings this simplifies to δ⁽ᴸ⁾ = ŷ − t.</li>"+
  "<li><b>Propagate backwards.</b> For each earlier layer: δ⁽ˡ⁾ = (W⁽ˡ⁺¹⁾ᵀ δ⁽ˡ⁺¹⁾) ⊙ f′(z⁽ˡ⁾).</li>"+
  "<li><b>Read off the gradients.</b> ∂E/∂W⁽ˡ⁾ = δ⁽ˡ⁾ (a⁽ˡ⁻¹⁾)ᵀ and ∂E/∂b⁽ˡ⁾ = δ⁽ˡ⁾.</li>"+
  "<li><b>Hand the gradients to the optimizer</b>, which performs the update.</li></ol>"+
  "<h4>Reading the two backward formulas</h4>"+
  "<p>δ⁽ˡ⁾ = (W⁽ˡ⁺¹⁾ᵀ δ⁽ˡ⁺¹⁾) ⊙ f′(z⁽ˡ⁾) says: gather the blame arriving from the next layer, weighted by the connections that carried it, then scale by how responsive this unit actually was. A saturated unit has f′ ≈ 0 and passes almost nothing back — that is the vanishing-gradient mechanism seen from the algorithm's side.</p>"+
  "<p>∂E/∂W⁽ˡ⁾ = δ⁽ˡ⁾(a⁽ˡ⁻¹⁾)ᵀ says: a weight's gradient is its unit's blame times its input's activity. A weight fed by an inactive input has zero gradient — the same proportionality principle as the perceptron rule's factor of xᵢ.</p>"+
  "<h4>Gradient and derivative</h4>"+
  "<p>A <b>derivative</b> is the slope of a function of one variable. A <b>gradient</b> is the vector of partial derivatives of a function of many variables, and it points in the direction of steepest <i>increase</i>. Descent therefore moves along the <b>negative</b> gradient.</p>",
 needToKnow:["State that backpropagation computes gradients and does not update weights","Write the chain-rule decomposition into three factors","Give δ for the output layer and the recursive δ for hidden layers","Explain why differentiability is required","Distinguish gradient from derivative and say why we move along the negative gradient"],

 examples:[
  {id:"m2t10e1",title:"One weight's gradient, factor by factor",q:"An output neuron has out_o1 = 0.75137, target t = 0.01, sigmoid activation, and receives out_h1 = 0.59327 through weight w₅. Find ∂E/∂w₅ with E = ½(t − out)².",
   steps:["Decompose: ∂E/∂w₅ = (∂E/∂out_o1) · (∂out_o1/∂net_o1) · (∂net_o1/∂w₅).","<b>Factor 1</b> — how the loss responds to the output: ∂E/∂out = −(t − out) = out − t = 0.75137 − 0.01 = 0.74137.","<b>Factor 2</b> — how the output responds to the pre-activation: σ′ = out(1 − out) = 0.75137 × 0.24863 = 0.18682.","<b>Factor 3</b> — how the pre-activation responds to the weight: ∂net/∂w₅ = out_h1 = 0.59327.","Multiply: 0.74137 × 0.18682 = 0.13850 (this is δ_o1).","∂E/∂w₅ = 0.13850 × 0.59327 = 0.08217."],
   answer:"∂E/∂w₅ = <b>0.08217</b>. With η = 0.5 the updated weight is w₅ = 0.40 − 0.5(0.08217) = <b>0.35892</b>.",
   trap:"The middle factor is where marks are lost. σ′ is computed from the <i>output</i> as out(1 − out), not by differentiating from scratch — that identity is why sigmoid is convenient. Note also that δ_o1 = 0.13850 is reused for every weight into that neuron; only factor 3 changes."},
  {id:"m2t10e2",title:"Propagating back to a hidden weight",q:"Continuing the same network: δ_o1 = 0.13850, δ_o2 = −0.03810, w₅ = 0.40, w₇ = 0.50, out_h1 = 0.59327, i₁ = 0.05. Find δ_h1 and then ∂E/∂w₁.",
   steps:["Hidden unit h1 feeds <i>both</i> output units, so blame arrives along two paths and must be summed.","Blame arriving: δ_o1·w₅ + δ_o2·w₇ = 0.13850(0.40) + (−0.03810)(0.50) = 0.05540 − 0.01905 = 0.03635.","Scale by how responsive h1 was: f′(net_h1) = out_h1(1 − out_h1) = 0.59327 × 0.40673 = 0.24132.","δ_h1 = 0.03635 × 0.24132 = 0.00877.","∂E/∂w₁ = δ_h1 × i₁ = 0.00877 × 0.05 = 0.00044.","With η = 0.5: w₁ = 0.15 − 0.5(0.00044) = 0.14978."],
   answer:"δ_h1 = <b>0.00877</b>, ∂E/∂w₁ = <b>0.00044</b>, updated w₁ = <b>0.14978</b>.",
   trap:"Two things to notice. First, the two blame contributions have <i>opposite signs</i> and partly cancel — output 1 wants h1 lower, output 2 wants it higher, and the net signal is what survives. Second, the hidden gradient (0.00044) is nearly 200 times smaller than the output gradient (0.08217). That shrinkage across a single layer is the vanishing-gradient problem in miniature, caused by the factor f′ = 0.241 and the small input i₁ = 0.05."}],
 practice:[
  {id:"m2t10p1",d:"easy",q:"State what backpropagation computes and list the steps of the algorithm.",hint:"It computes one thing and hands it to something else.",a:"<p>Backpropagation <b>computes the gradient ∂E/∂w for every weight and bias</b>. It does not change any parameter — the optimizer does that.</p><p><b>Steps:</b> (1) forward pass, storing every z and a; (2) compute the loss against the target; (3) compute the output-layer error δ⁽ᴸ⁾ = (ŷ − t) ⊙ f′(z⁽ᴸ⁾); (4) propagate backwards with δ⁽ˡ⁾ = (W⁽ˡ⁺¹⁾ᵀδ⁽ˡ⁺¹⁾) ⊙ f′(z⁽ˡ⁾); (5) read off ∂E/∂W⁽ˡ⁾ = δ⁽ˡ⁾(a⁽ˡ⁻¹⁾)ᵀ and ∂E/∂b⁽ˡ⁾ = δ⁽ˡ⁾; (6) pass the gradients to the optimizer, which performs the update.</p>"},
  {id:"m2t10p2",d:"moderate",q:"Distinguish a derivative from a gradient, and explain why gradient descent uses the negative gradient.",hint:"One variable versus many, and which way each points.",a:"<p>A <b>derivative</b> is the rate of change of a function of a single variable — one number, the slope at a point. A <b>gradient</b> is the vector of partial derivatives of a function of several variables: for a loss E(w₁, …, w_n) it is ∇E = (∂E/∂w₁, …, ∂E/∂w_n), one component per parameter.</p><p>The key geometric fact is that the gradient points in the direction of <b>steepest increase</b> of the function. Moving along +∇E raises the loss as fast as possible.</p><p>Since training seeks to <i>minimise</i> the loss, we move in the opposite direction, along −∇E, which is the direction of steepest decrease. Hence the update w ← w − η∇E. Getting this sign wrong is not a small error: the network would climb the loss surface and diverge within a few iterations.</p>"},
  {id:"m2t10p3",d:"moderate",q:"Why must every operation in the network be differentiable, and what breaks if one is not?",hint:"Look at what the chain rule multiplies together.",a:"<p>Backpropagation computes ∂E/∂w as a <i>product</i> of local derivatives along the path from that weight to the loss. If any operation on that path has no derivative, the product cannot be formed and no gradient reaches the weight.</p><p><b>What breaks, concretely.</b> Take the step function used by the original perceptron. Its derivative is 0 everywhere except at z = 0, where it is undefined. Every δ⁽ˡ⁾ is multiplied by f′(z⁽ˡ⁾), so with a step activation δ = 0 for essentially every unit, every gradient is zero, and no weight ever changes. Training does nothing at all.</p><p>This is why the perceptron learning rule had to be a hand-designed correction rather than a gradient method, and why it could never be extended to hidden layers — there is no target for a hidden unit, so the only possible signal is a gradient, and the step function destroys it.</p><p>It is also why every activation in Module 2 is chosen partly for its derivative. ReLU is the interesting edge case: it is not differentiable at exactly z = 0, but that single point has measure zero and the convention f′(0) = 0 works fine in practice.</p>"}],
 questions:[
  {q:"Explain the backpropagation algorithm with a neat diagram and state its steps.",marks:10,d:"moderate",priority:"high",source:"source"},

{id:"m2t11",m:"m2",title:"The Weight Update Rule",type:"problem-solving",priority:"high",los:["2.3"],
 src:"Module 2 deck, slides 139–140, 159, 198",
 summary:"W_new = W_old − η·∂E/∂W, and the numerical steps the deck works with it.",
 whatIs:"<p>Once backpropagation has produced a gradient, the optimizer applies it. The plain gradient-descent update is the simplest possible rule and the base every other optimizer modifies.</p>",
 concept:"<div class='eqb'>W_new = W_old − η · ∂E/∂W\nb_new = b_old − η · ∂E/∂b</div>"+
  "<p>Read it as three questions. <b>∂E/∂W</b> — which way does the loss increase? <b>The minus sign</b> — go the other way. <b>η</b> — how far.</p>"+
  "<div class='box warning'><h5>A sign convention in the source</h5><p>Slide 159 prints the update as <b>ΔW = η ∂E/∂W</b> without a minus sign, while slide 139 gives the standard <b>W_new = W_old − η∇</b> and every worked example on slides 140 and 198 subtracts. Some textbooks define ΔW as the negative of the gradient step, which makes the printed form self-consistent; but if you write ΔW = +η∂E/∂W and then subtract nothing, the network will climb the loss. <b>Use W_new = W_old − η·∂E/∂W</b>, which is what the lecturer's own numerical examples do.</p></div>"+
  "<h4>The deck's two numerical steps, verified</h4><div class='scroll'><table>"+
  "<tr><th>W_old</th><th>η</th><th>∂E/∂W</th><th>Computation</th><th>W_new</th></tr>"+
  "<tr><td>0.80</td><td>0.20</td><td>0.50</td><td>0.80 − 0.20(0.50) = 0.80 − 0.10</td><td><b>0.70</b> ✓</td></tr>"+
  "<tr><td>0.80</td><td>1.00</td><td>0.50</td><td>0.80 − 1.00(0.50) = 0.80 − 0.50</td><td><b>0.30</b> ✓</td></tr></table></div>"+
  "<p>The same gradient with a five-times larger learning rate moves the weight five times further. That single comparison is the whole learning-rate argument in one line, and it is why the deck presents the two side by side.</p>"+
  "<h4>Reading the sign of the gradient</h4><div class='scroll'><table>"+
  "<tr><th>∂E/∂W</th><th>Meaning</th><th>Update does</th></tr>"+
  "<tr><td>Positive</td><td>Increasing W increases the loss</td><td><b>Decreases</b> W</td></tr>"+
  "<tr><td>Negative</td><td>Increasing W decreases the loss</td><td><b>Increases</b> W</td></tr>"+
  "<tr><td>Zero</td><td>Flat — a minimum, maximum or saddle</td><td>No change</td></tr></table></div>",
 needToKnow:["Write the update rule for weights and biases with the correct sign","Perform the update numerically","Explain what each of the three parts contributes","Predict the direction of movement from the sign of the gradient","Explain what happens when the gradient is zero"],
 recognition:{clues:["A learning rate, an old weight and a gradient are all given","'Update the weight', 'find the new value of w'","'One iteration of gradient descent'"],
  wording:["Given w = 0.80, η = 0.2 and ∂E/∂w = 0.50, compute the updated weight.","State the weight update rule and explain each term.","What happens to the update if the gradient is zero?"],
  firstMove:"Write W_new = W_old − η·∂E/∂W first, then substitute. Substituting into a half-remembered rule is how sign errors happen.",
  trap:"Adding instead of subtracting. This does not produce a slightly worse answer — it produces divergence, and it is the single most common error on this topic."},
 examAnswer:[
  {marks:2,body:"<p>The rule with the correct sign, one substitution, and the answer. Two lines.</p>"},
  {marks:5,body:"<p>The rule; a sentence on each of the three parts; the numerical update; the sign table showing which way W moves; and one line on what a zero gradient means.</p>"}],
 mistakes:["Getting the sign wrong","Forgetting to update the bias as well as the weights","Using the new weight inside the same step's gradient — all gradients are computed from the old weights, then all parameters update together","Assuming a zero gradient always means a minimum; it can be a maximum or a saddle point","Applying different learning rates to different weights without saying so"],
 examples:[
  {id:"m2t11e1",title:"The same gradient at two learning rates",q:"A weight is 0.80 and its gradient is 0.50. Compute the updated weight for η = 0.2 and for η = 1.0, and comment.",
   steps:["<b>η = 0.2:</b> W_new = 0.80 − 0.2(0.50) = 0.80 − 0.10 = 0.70.","<b>η = 1.0:</b> W_new = 0.80 − 1.0(0.50) = 0.80 − 0.50 = 0.30.","The gradient is positive in both cases, so the weight decreases in both — the direction is set by the gradient, not by η.","The step sizes are 0.10 and 0.50, a factor of five, exactly the ratio of the learning rates."],
   answer:"η = 0.2 gives <b>0.70</b>; η = 1.0 gives <b>0.30</b>. Both verified against the deck.",
   trap:"The learning rate controls only distance, never direction. A common misreading is that a large η might overshoot 'past the minimum and back'; what actually happens is it lands somewhere further along the same straight line, which may be beyond the minimum on the far side — and if it lands somewhere steeper still, the next step is larger again and the process diverges."},
  {id:"m2t11e2",title:"Updating a whole layer at once",q:"A layer has w = (0.5, −0.3, 0.2) and b = 0.1, with gradients ∂E/∂w = (0.2, −0.4, 0.0) and ∂E/∂b = 0.3. Apply one update with η = 0.5.",
   steps:["w₁ = 0.5 − 0.5(0.2) = 0.5 − 0.10 = 0.40","w₂ = −0.3 − 0.5(−0.4) = −0.3 + 0.20 = −0.10","w₃ = 0.2 − 0.5(0.0) = 0.20  (unchanged — zero gradient)","b = 0.1 − 0.5(0.3) = 0.1 − 0.15 = −0.05"],
   answer:"w = <b>(0.40, −0.10, 0.20)</b>, b = <b>−0.05</b>.",
   trap:"Three things are on display here. w₂ has a <i>negative</i> gradient, so subtracting a negative increases it — the sign rule working correctly. w₃ has zero gradient and does not move, which is what happens when an input was inactive. And the bias updates by exactly η times its gradient, with no input factor, because its input is permanently 1."}],
 practice:[
  {id:"m2t11p1",d:"easy",q:"State the weight update rule and explain the role of each part.",hint:"Direction, reversal, distance.",a:"<div class='eqb'>W_new = W_old − η · ∂E/∂W</div><p><b>∂E/∂W</b> — the gradient, telling you which direction increases the loss and how steeply.</p><p><b>The minus sign</b> — reverses that direction, because we want to <i>decrease</i> the loss. Without it the weights climb the loss surface and training diverges.</p><p><b>η</b> — the learning rate, controlling how far along that direction to step. It affects distance only, never direction.</p><p>The bias follows the same rule: b_new = b_old − η·∂E/∂b.</p>"},
  {id:"m2t11p2",d:"moderate",q:"A weight is 1.2 with gradient −0.8 and η = 0.25. Find the new weight and explain the direction of movement.",hint:"Watch the double negative.",a:"<p>W_new = 1.2 − 0.25(−0.8) = 1.2 + 0.20 = <b>1.40</b></p><p><b>Direction:</b> the gradient is negative, meaning that increasing this weight <i>decreases</i> the loss. The rule subtracts a negative quantity, which increases the weight — exactly the right response. The weight moves from 1.2 up to 1.4.</p><p>The general pattern: positive gradient → weight decreases; negative gradient → weight increases. The rule always moves the weight in whichever direction reduces the loss.</p>"},
  {id:"m2t11p3",d:"moderate",q:"What does a zero gradient mean, and is it always a good place to stop?",hint:"There are three kinds of flat point.",a:"<p>A zero gradient means the loss surface is <b>flat</b> in that direction — an infinitesimal change to the weight does not change the loss. The update rule then leaves the weight unchanged, so training halts in that coordinate.</p><p><b>It is not always a good place to stop.</b> There are three kinds of stationary point:</p><p><b>Local or global minimum</b> — the loss increases in every direction. This is what you want, and a global minimum is ideal.</p><p><b>Local maximum</b> — the loss decreases in every direction. Unstable and rarely reached, since any perturbation escapes it.</p><p><b>Saddle point</b> — the loss decreases in some directions and increases in others. These are the real problem in high-dimensional networks, where they vastly outnumber local minima. Plain gradient descent can crawl on a saddle's plateau for a very long time, because the gradient is near zero in most directions.</p><p>This is one of the main motivations for momentum, which carries accumulated velocity through flat regions and pushes the optimizer off a plateau that plain gradient descent would sit on indefinitely.</p>"}],
 questions:[
  {q:"State the weight update rule of gradient descent and compute the updated weight for w = 0.80, η = 0.2 and gradient 0.50.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"Explain what happens to the update when the gradient is zero, and whether this always indicates a minimum.",marks:5,d:"moderate",priority:"high",source:"predicted"}]},

{id:"m2t12",m:"m2",title:"Gradient Descent Variants: Batch, Stochastic and Mini-Batch",type:"theory",priority:"high",los:["2.3"],
 src:"Module 2 deck, slides 156–173",
 summary:"How many examples to look at before each update — and the comparison table the deck builds.",
 whatIs:"<p>All three variants use the same update rule. They differ only in <b>how many training examples are used to compute each gradient</b>, and that single choice changes speed, stability and memory cost.</p>",
 concept:"<div class='scroll'><table>"+
  "<tr><th></th><th>Batch GD</th><th>Stochastic GD</th><th>Mini-Batch GD</th></tr>"+
  "<tr><td><b>Examples per update</b></td><td>All N</td><td>1</td><td>B (typically 32–256)</td></tr>"+
  "<tr><td><b>Updates per epoch</b></td><td>1</td><td>N</td><td>N/B</td></tr>"+
  "<tr><td><b>Gradient quality</b></td><td>Exact — the true gradient</td><td>Very noisy estimate</td><td>Good estimate</td></tr>"+
  "<tr><td><b>Path to the minimum</b></td><td>Smooth and direct</td><td>Erratic, zig-zagging</td><td>Mostly smooth</td></tr>"+
  "<tr><td><b>Speed per epoch</b></td><td>Slow — one step only</td><td>Fast progress early</td><td>Fast</td></tr>"+
  "<tr><td><b>Memory</b></td><td>Must hold the whole dataset</td><td>One example</td><td>One batch</td></tr>"+
  "<tr><td><b>Escapes local minima</b></td><td>No — deterministic</td><td>Yes — noise helps</td><td>Somewhat</td></tr>"+
  "<tr><td><b>Hardware use</b></td><td>Poor on very large data</td><td>Poor — no parallelism</td><td><b>Excellent</b> — vectorised</td></tr>"+
  "<tr><td><b>Online learning</b></td><td>No</td><td><b>Yes</b></td><td>No</td></tr></table></div>"+
  "<h4>Batch gradient descent</h4>"+
  "<p>Computes the gradient over the entire training set, then takes one step. The gradient is exact, so the path is smooth and convergence is stable. But one step per epoch is very slow on large data, and the whole dataset must fit in memory. Being deterministic, it also cannot escape a local minimum — with no noise, once it settles it stays.</p>"+
  "<h4>Stochastic gradient descent</h4>"+
  "<p>Updates after every single example. The deck stresses that SGD is an <b>online algorithm</b>: it does not require the whole dataset to be available, so it can learn from a stream of arriving data. Each gradient is a noisy estimate of the true one, which makes the path erratic — but that same noise lets it jump out of shallow local minima and saddle points. It makes fast initial progress because it takes N steps in the time batch GD takes one.</p>"+
  "<h4>Mini-batch gradient descent</h4>"+
  "<p>The compromise, and what is used in practice almost universally. It averages the gradient over B examples, which cancels most of the noise while still giving many updates per epoch. Crucially it uses hardware well: a batch is a matrix operation that a GPU executes in parallel, whereas SGD's one-at-a-time updates cannot be parallelised at all.</p>"+
  "<div class='box tip'><h5>Why batch sizes are powers of 2</h5><p>The deck has a slide on this: GPU memory and compute units are organised in powers of two, so batch sizes of 32, 64, 128 or 256 map cleanly onto the hardware. A batch of 100 wastes part of each pass. This is a hardware convenience, not a mathematical requirement.</p></div>",
 needToKnow:["State examples-per-update and updates-per-epoch for each variant","Reproduce at least six rows of the comparison table","Explain why SGD's noise is both a drawback and a benefit","Say why mini-batch is the practical default","Explain the power-of-2 batch size convention","Compute updates per epoch from N and B"],
 recognition:{clues:["'Batch size', 'stochastic', 'mini-batch'","'How many updates per epoch?'","A dataset size and a batch size are both given","'Compare the variants of gradient descent'"],
  wording:["Compare batch, stochastic and mini-batch gradient descent.","Why is mini-batch gradient descent preferred in practice?","Why is SGD called an online algorithm?","Compute the number of weight updates for the given N, B and epochs."],
  firstMove:"Draw the comparison table straight away. Then, if numbers are given, compute N/B — that one figure answers most numerical parts.",
  trap:"Saying SGD is 'faster'. It makes faster <i>initial progress</i> per epoch but is slower per unit of computation, because it cannot use vectorised hardware."},
 examAnswer:[
  {marks:5,body:"<p>A table with examples per update, updates per epoch, gradient quality, speed and memory. One closing line on why mini-batch wins in practice.</p>"},
  {marks:10,body:"<p>The full eight-row table; a paragraph on each variant; the noise-as-benefit argument for escaping local minima; the hardware argument for mini-batch including powers of 2; and a worked N/B calculation.</p>"}],
 mistakes:["Saying batch GD makes N updates per epoch — it makes exactly one","Treating SGD's noise as purely bad, which misses why it helps escape local minima","Confusing batch size with number of batches","Claiming mini-batch is exact — it is an estimate, just a good one","Forgetting the memory argument, which is often why batch GD is impossible at all"],
 examples:[
  {id:"m2t12e1",title:"Counting updates across all three variants",q:"A dataset has 60,000 examples and training runs for 10 epochs. Give the number of weight updates for batch GD, for SGD, and for mini-batch with B = 128.",
   steps:["<b>Batch GD:</b> one update per epoch, using all 60,000 examples for each gradient. 1 × 10 = 10 updates.","<b>SGD:</b> one update per example. 60,000 per epoch × 10 = 600,000 updates.","<b>Mini-batch, B = 128:</b> updates per epoch = 60,000/128 = 468.75, so 469 batches (the last one partial). 469 × 10 = 4,690 updates."],
   answer:"Batch GD <b>10</b>, SGD <b>600,000</b>, mini-batch <b>4,690</b>. All three saw every example exactly 10 times.",
   trap:"Batch GD taking only 10 steps in the entire training run explains why it is impractical: ten steps is nowhere near enough to reach a minimum. Note also that the last mini-batch holds 60,000 − 468×128 = 96 examples, not 128 — implementations either accept the smaller batch or drop it."},
  {id:"m2t12e2",title:"Choosing a variant from constraints",q:"For each case, choose a variant and justify: (a) 500 examples that fit in memory and a need for reproducible results; (b) sensor readings arriving continuously with no fixed dataset; (c) 2 million images on a GPU.",
   steps:["<b>(a)</b> The dataset is tiny, so computing the exact gradient over all 500 is cheap. Reproducibility favours a deterministic method. → <b>Batch GD</b>.","<b>(b)</b> There is no complete dataset to batch over; examples arrive one at a time and may never be stored. Only an online method works. → <b>SGD</b>.","<b>(c)</b> Two million images cannot fit in memory at once, ruling out batch GD; SGD would waste the GPU entirely by processing one image at a time. → <b>Mini-batch</b>, B = 128 or 256."],
   answer:"(a) Batch GD. (b) SGD, for its online property. (c) Mini-batch, which is the only option that both fits in memory and uses the hardware.",
   trap:"Case (b) is the one that isolates SGD's genuine unique advantage. Mini-batch is better than SGD on essentially every axis <i>except</i> that it requires B examples to be available simultaneously. When data arrives as a stream, that requirement cannot be met, and SGD is the only choice."}],
 practice:[
  {id:"m2t12p1",d:"easy",q:"Give six differences between batch, stochastic and mini-batch gradient descent.",hint:"Start from how many examples each uses per update.",a:"<div class='scroll'><table><tr><th></th><th>Batch</th><th>Stochastic</th><th>Mini-batch</th></tr><tr><td>Examples per update</td><td>All N</td><td>1</td><td>B</td></tr><tr><td>Updates per epoch</td><td>1</td><td>N</td><td>N/B</td></tr><tr><td>Gradient</td><td>Exact</td><td>Very noisy</td><td>Good estimate</td></tr><tr><td>Convergence path</td><td>Smooth</td><td>Erratic</td><td>Mostly smooth</td></tr><tr><td>Memory needed</td><td>Whole dataset</td><td>One example</td><td>One batch</td></tr><tr><td>Escapes local minima</td><td>No</td><td>Yes</td><td>Somewhat</td></tr></table></div>"},
  {id:"m2t12p2",d:"moderate",q:"Why is SGD's noisy gradient both a drawback and an advantage?",hint:"Think about a shallow local minimum.",a:"<p><b>As a drawback:</b> a gradient computed from one example points towards reducing the loss on <i>that example</i>, which may be quite different from the direction that reduces the loss overall. Successive updates therefore pull in conflicting directions, giving an erratic zig-zag path. Near the minimum the noise prevents settling — the weights bounce around it rather than converging cleanly, which is why a decaying learning rate is usually needed with SGD.</p><p><b>As an advantage:</b> that same randomness is what lets SGD escape places where batch GD gets stuck. In a shallow local minimum the true gradient is zero, so batch GD, being fully deterministic, stops there permanently. SGD's single-example gradient is almost never zero at that point, so it keeps moving and can climb out of a shallow basin into a better one. The same applies to saddle points and flat plateaus, which are far more common than local minima in high-dimensional loss surfaces.</p><p>The practical resolution is mini-batch, which retains enough noise to avoid getting permanently stuck while averaging away enough to keep the path usable.</p>"},
  {id:"m2t12p3",d:"moderate",q:"Why is mini-batch gradient descent the practical default, and why are batch sizes usually powers of 2?",hint:"One answer is statistical, one is about hardware.",a:"<p><b>Why mini-batch wins.</b> It occupies the useful middle of every trade-off. Averaging over B examples cancels most of SGD's noise, giving a gradient close to the true one, while still delivering N/B updates per epoch instead of batch GD's single step. Memory requirements are fixed by B rather than by the dataset size, so it scales to datasets that could never fit in memory. And it retains a little noise, which helps with saddle points.</p><p><b>The decisive reason is hardware.</b> A mini-batch is a matrix multiplication — B examples processed as one operation — which a GPU executes in parallel across thousands of cores. SGD's one-example-at-a-time updates are inherently sequential and leave almost all of that hardware idle. In wall-clock terms a mini-batch of 128 often costs barely more than a single example.</p><p><b>Powers of 2.</b> GPU memory alignment, warp sizes and compute units are organised in powers of two, so batch sizes of 32, 64, 128 and 256 map exactly onto the hardware with no wasted lanes. A batch of 100 leaves part of each parallel pass unused. This is purely an efficiency convention — the mathematics is identical for any B — but it is a real speed difference in practice.</p>"}],

  {q:"Compare batch gradient descent, stochastic gradient descent and mini-batch gradient descent.",marks:10,d:"moderate",priority:"high",source:"source"},

{id:"m2t13",m:"m2",title:"Learning Rate and Learning Rate Decay",type:"problem-solving",priority:"high",los:["2.3"],
 src:"Module 2 deck, slides 194–200",
 summary:"The single most important hyperparameter, its two failure modes, and why it should shrink over time.",
 whatIs:"<p>The learning rate η controls how far each update moves the weights. The deck calls it 'the pace of the architect' and devotes several slides to the dilemma it poses, because it is the hyperparameter most likely to make training fail outright.</p>",
 concept:"<h4>The two failure modes</h4><div class='scroll'><table>"+
  "<tr><th>η too small</th><th>η too large</th></tr>"+
  "<tr><td>Each step is tiny</td><td>Each step overshoots the minimum</td></tr>"+
  "<tr><td>Training takes an impractical number of epochs</td><td>The loss oscillates or increases</td></tr>"+
  "<tr><td>Can stall in a shallow local minimum</td><td>Training can diverge entirely</td></tr>"+
  "<tr><td>Loss curve falls smoothly but far too slowly</td><td>Loss curve is jagged, or rises</td></tr>"+
  "<tr><td>Can strand ReLU units in a bad region for a long time</td><td>Can kill ReLU units in one step</td></tr></table></div>"+
  "<h4>The dilemma the deck identifies</h4>"+
  "<p>A <b>constant</b> learning rate is wrong at some point in training whatever value you pick. Early on, weights are far from the optimum and large steps are wanted. Late on, the weights are close and large steps overshoot, causing the loss to bounce around the minimum without settling. One fixed η cannot serve both phases.</p>"+
  "<h4>Learning rate decay</h4>"+
  "<p>The resolution is to shrink η as training proceeds — large steps to cover ground, then progressively finer steps to settle.</p>"+
  "<div class='eqb'>Step decay:        η_t = η₀ · γ^⌊t/k⌋      (drop by factor γ every k epochs)\nExponential decay: η_t = η₀ · e^(−λt)\n1/t decay:         η_t = η₀ / (1 + λt)</div>"+
  "<div class='box tip'><h5>The analogy the deck uses</h5><p>The staircase analogy: you take large strides down a long staircase, but as you approach the bottom step you shorten your stride so as not to stumble past it. Decay gives you speed early and precision late.</p></div>"+
  "<h4>Decay combined with momentum</h4>"+
  "<p>The deck notes that decay alone has a weakness: once η is small, the optimizer can be trapped on a plateau because every step is now tiny. Pairing decay with momentum solves this — as the slide puts it, the ball rolls over the plateau losing energy, but reaches the next valley before it halts, giving it the chance to drop into the minimum.</p>",
 needToKnow:["State both failure modes with their symptoms in the loss curve","Explain why a constant η is wrong in at least one phase of training","Write at least one decay schedule and compute η at a given epoch","Explain why decay pairs well with momentum","Diagnose a learning-rate problem from a described loss curve"],
 recognition:{clues:["'Learning rate', η, 'step size'","A loss curve described as oscillating, diverging or flat","'Why does the loss increase?'","'Learning rate decay' or 'schedule'"],
  wording:["Explain the effect of the learning rate on training.","What is learning rate decay and why is it used?","The training loss oscillates and does not converge. Diagnose and suggest a fix.","Compute the learning rate at epoch 30 given the schedule."],
  firstMove:"Identify which failure mode the symptom indicates. Loss rising or jagged → η too large. Loss falling but barely → η too small.",
  trap:"Recommending 'increase the learning rate' when the loss has plateaued. A plateau more often means the optimizer is on a flat region or has already converged; raising η there can destroy a good solution."},
 examAnswer:[
  {marks:5,body:"<p>The two failure modes in a table with their loss-curve symptoms, then decay with one schedule and the reason it is needed.</p>"},
  {marks:10,body:"<p>All of the above plus: the constant-η dilemma stated explicitly; two or three decay schedules with a worked value; the staircase analogy; and the interaction with momentum on plateaus.</p>"}],
 mistakes:["Saying a large η is 'faster' — it is faster per step but may never converge","Treating divergence as a bug in the code when it is usually η","Forgetting that η interacts with batch size — larger batches generally tolerate larger η","Applying decay so aggressively that η reaches near zero before training has converged","Confusing learning rate decay with weight decay, which is a regularization method"],
 examples:[
  {id:"m2t13e1",title:"Computing a decayed learning rate",q:"Training uses step decay with η₀ = 0.1, γ = 0.5, dropping every 10 epochs. Find η at epochs 0, 15 and 32.",
   steps:["η_t = η₀ · γ^⌊t/k⌋ with k = 10.","<b>Epoch 0:</b> ⌊0/10⌋ = 0, so η = 0.1 × 0.5⁰ = 0.1 × 1 = 0.1.","<b>Epoch 15:</b> ⌊15/10⌋ = 1, so η = 0.1 × 0.5¹ = 0.05.","<b>Epoch 32:</b> ⌊32/10⌋ = 3, so η = 0.1 × 0.5³ = 0.1 × 0.125 = 0.0125."],
   answer:"η = <b>0.1</b>, <b>0.05</b> and <b>0.0125</b> at epochs 0, 15 and 32.",
   trap:"The floor function makes the schedule a staircase, not a smooth curve — η is constant at 0.05 for the whole of epochs 10 to 19 and drops abruptly at epoch 20. Students often compute 0.1 × 0.5^1.5 for epoch 15, which is exponential decay, a different schedule."},
  {id:"m2t13e2",title:"Diagnosing three loss curves",q:"Diagnose each and prescribe a fix: (a) loss falls from 2.3 to 2.28 over 50 epochs; (b) loss goes 2.3, 1.8, 4.2, 0.9, 6.7, 15.4; (c) loss falls to 0.4 by epoch 20 then oscillates between 0.38 and 0.45 for 80 more epochs.",
   steps:["<b>(a)</b> Steady decrease but negligible magnitude — 0.02 in 50 epochs. The direction is right, so the gradient is fine; the step size is far too small. → <b>η too small. Increase it, perhaps tenfold.</b>","<b>(b)</b> The loss is not just oscillating, it is growing without bound. Each overshoot lands somewhere steeper, producing a larger next step. → <b>η far too large; the run has diverged. Reduce η by a factor of 10 or more and restart.</b>","<b>(c)</b> Good progress, then a plateau with small oscillation around 0.4. The optimizer has reached the neighbourhood of a minimum but each step is now too big to settle inside it. → <b>η was right early and is too large now. Apply learning rate decay.</b>"],
   answer:"(a) η too small — increase. (b) Divergence — decrease sharply and restart. (c) Correct early, too large late — add decay.",
   trap:"Case (c) is the one that proves a single constant η cannot be right throughout. The value that produced the healthy fall to 0.4 is the same value that now prevents settling. This is precisely the dilemma decay exists to solve, and it is the most examinable of the three."}],
 practice:[
  {id:"m2t13p1",d:"easy",q:"State the consequences of a learning rate that is too small and one that is too large.",hint:"Distance per step, in both directions.",a:"<p><b>Too small:</b> each update moves the weights only slightly, so convergence takes an impractically large number of epochs. The loss curve falls smoothly but almost flat. The optimizer can also become stuck in a shallow local minimum, lacking the step size to climb out.</p><p><b>Too large:</b> each update overshoots the minimum. The loss oscillates, and if each overshoot lands somewhere steeper the next step is larger still, so training diverges and the loss grows without bound. Large steps can also kill ReLU units by flinging their weights strongly negative in a single update.</p>"},
  {id:"m2t13p2",d:"moderate",q:"Explain why a constant learning rate is unsatisfactory, and how decay resolves it.",hint:"Consider what you want early in training versus late.",a:"<p><b>The dilemma.</b> The ideal step size changes during training. Early on the weights are far from any good solution, the loss surface is steep, and large steps make rapid progress; a small η here simply wastes epochs. Late on the weights are close to a minimum, and a step that was helpful earlier now carries them past it, so the loss bounces around the minimum without ever settling inside it.</p><p>A single fixed value must therefore be wrong in at least one phase. Choose it for the early phase and training will not converge cleanly; choose it for the late phase and training will take far too long to get there.</p><p><b>How decay resolves it.</b> Start with a large η for speed, then shrink it as training proceeds so the steps become fine enough to settle. The staircase analogy in the deck captures it: long strides down the staircase, shortening as you approach the bottom step so you do not stumble past it. Common schedules are step decay η_t = η₀γ^⌊t/k⌋, exponential decay η_t = η₀e^(−λt), and 1/t decay η_t = η₀/(1 + λt).</p>"},
  {id:"m2t13p3",d:"hard",q:"Why does the deck pair learning rate decay with momentum, and what problem does that pairing solve?",hint:"What is the downside of a small learning rate on a flat region?",a:"<p><b>The problem decay creates.</b> Once η has decayed to a small value, every step is short. If the optimizer then encounters a plateau — a broad flat region where the gradient is near zero — the update is (small η) × (small gradient), which is negligible. The optimizer effectively stops, even though it may be nowhere near a good minimum. Decay has traded away the ability to cross flat regions.</p><p><b>How momentum fixes it.</b> Momentum accumulates a running velocity from previous gradients rather than depending only on the current one. Entering a plateau with accumulated velocity, the optimizer keeps coasting across it — the velocity decays gradually as β < 1, but not instantly. The deck's own wording is that the ball rolls for a while over the plateau, losing energy and slowing, but reaches the next valley before it comes to a halt, giving it the chance to drop in and get down to the minimum error.</p><p><b>Why the combination works.</b> Decay supplies precision near the minimum; momentum supplies persistence through flat regions. Neither alone is sufficient: decay alone stalls on plateaus, and momentum alone still overshoots a narrow minimum because the step size never shrinks. Together they give large effective steps where the surface is flat and fine control where it matters. This complementarity is also part of why Adam — which combines momentum with per-parameter adaptive step sizes — became the standard default.</p>"}],
 questions:[
  {q:"Explain the effect of the learning rate on training and describe what happens when it is too small or too large.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"What is learning rate decay? Explain with a schedule and state why it is needed.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"The training loss oscillates without converging. Diagnose the cause and suggest two fixes.",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m2t14",m:"m2",title:"Momentum-Based GD and Nesterov Accelerated Gradient",type:"problem-solving",priority:"high",los:["2.3"],
 src:"Module 2 deck, slides 176–192, 200–208",
 summary:"Adding velocity to gradient descent, and NAG's look-before-you-leap correction.",
 whatIs:"<p>Plain gradient descent decides each step using only the current gradient, which makes it slow in ravines and prone to stalling on plateaus. Momentum accumulates a <b>velocity</b> from past gradients, so consistent directions build up speed. NAG refines this by evaluating the gradient <i>after</i> the momentum step rather than before.</p>",
 concept:"<h4>Momentum-based gradient descent</h4>"+
  "<p>The deck gives the update in the form used by Aggarwal's textbook, contrasting it with plain GD:</p>"+
  "<div class='eqb'>Plain GD:   V ← −α · ∂L/∂W          W ← W + V\nMomentum:   V ← βV − α · ∂L/∂W       W ← W + V</div>"+
  "<p>The only change is the βV term, which carries forward a fraction of the previous velocity. Written in the more common equivalent notation:</p>"+
  "<div class='eqb'>v_t = β·v_{t−1} + η·∇E(W)\nW   = W − v_t          with β typically 0.9</div>"+
  "<h4>What β does</h4>"+
  "<p>β is the fraction of previous velocity retained. With β = 0.9, a gradient that keeps pointing the same way builds towards an effective step of 1/(1 − β) = <b>10 times</b> the plain gradient step. Directions that keep reversing cancel out instead of accumulating.</p>"+
  "<div class='scroll'><table><tr><th>β</th><th>Effective amplification 1/(1−β)</th><th>Behaviour</th></tr>"+
  "<tr><td>0</td><td>1×</td><td>Plain gradient descent</td></tr>"+
  "<tr><td>0.5</td><td>2×</td><td>Mild smoothing</td></tr>"+
  "<tr><td>0.9</td><td>10×</td><td>Standard choice</td></tr>"+
  "<tr><td>0.99</td><td>100×</td><td>Very heavy — can overshoot badly</td></tr></table></div>"+
  "<h4>The three problems momentum solves</h4><ul>"+
  "<li><b>Ravines.</b> Where the surface is steep across and shallow along, plain GD zig-zags across the narrow direction and creeps along the useful one. Momentum cancels the oscillating across-component and accumulates the consistent along-component.</li>"+
  "<li><b>Plateaus.</b> Accumulated velocity carries the optimizer across flat regions where the gradient alone would stall.</li>"+
  "<li><b>Shallow local minima.</b> Velocity can carry it through a small basin rather than settling in it.</li></ul>"+
  "<p>The deck also notes momentum's cost: it can <b>overshoot</b> the minimum, because velocity keeps pushing after the gradient has reversed. This is what NAG is designed to correct.</p>"+
  "<h4>Nesterov Accelerated Gradient — 'look before you leap'</h4>"+
  "<p>Momentum computes the gradient at the current position and then takes the momentum step. NAG reverses the order: it first jumps to where momentum is about to take it, and evaluates the gradient <i>there</i>.</p>"+
  "<div class='eqb'>Momentum:  v_t = β·v_{t−1} + η·∇E(W)          ← gradient at current W\nNAG:       v_t = β·v_{t−1} + η·∇E(W − β·v_{t−1})  ← gradient at the LOOK-AHEAD point\n\nboth then:  W = W − v_t</div>"+
  "<p>The consequence is a correction term. If the look-ahead point is already past the minimum, the gradient there points backwards and pulls the step in before the overshoot happens. Momentum only discovers the overshoot after making it; NAG anticipates it. The deck's phrasing is that momentum is the driver watching the road, and NAG is the driver watching the corner ahead.</p>"+
  "<div class='scroll'><table><tr><th></th><th>Plain GD</th><th>Momentum</th><th>NAG</th></tr>"+
  "<tr><td>Uses past gradients</td><td>No</td><td>Yes</td><td>Yes</td></tr>"+
  "<tr><td>Gradient evaluated at</td><td>Current W</td><td>Current W</td><td><b>Look-ahead point</b></td></tr>"+
  "<tr><td>Speed in a ravine</td><td>Slow, zig-zags</td><td>Fast</td><td>Fast</td></tr>"+
  "<tr><td>Overshoot near minimum</td><td>No</td><td><b>Yes</b></td><td>Reduced</td></tr>"+
  "<tr><td>Per-parameter step size</td><td>No</td><td>No</td><td>No</td></tr></table></div>",
 needToKnow:["Write the momentum update in both the deck's form and the common form","State the effective amplification 1/(1 − β) and compute it","Name the three problems momentum solves and the one it creates","Write NAG's update and identify the single difference from momentum","Perform a numeric momentum update over two steps"],
 recognition:{clues:["β or γ appears alongside η","'Velocity', 'momentum', 'accumulated'","'Look ahead', 'Nesterov', 'NAG'","A question about zig-zagging or slow ravine convergence"],
  wording:["Explain momentum-based gradient descent and state its advantages.","Differentiate between momentum and Nesterov accelerated gradient.","Perform two iterations of momentum-based gradient descent.","Why does momentum overshoot, and how does NAG address it?"],
  firstMove:"Write both update lines — velocity then weight — before substituting. Momentum is a two-line rule and collapsing it to one line is where errors start.",
  trap:"Forgetting that v carries over between steps. v₁ feeds into v₂; starting each step from v = 0 removes the momentum entirely."},
 examAnswer:[
  {marks:5,body:"<p>The two-line momentum update, what β does with the 1/(1−β) figure, and the three problems it solves. One line on overshoot.</p>"},
  {marks:10,body:"<p>All of the above plus: the ravine diagram or description; a worked two-step numeric example; NAG's update with the look-ahead point highlighted as the only change; and the three-way comparison table.</p>"}],
 mistakes:["Resetting the velocity to zero between steps","Writing NAG's gradient at the current point, which makes it identical to momentum","Confusing β with the learning rate","Claiming momentum always converges faster — it can overshoot and oscillate on a sharp minimum","Saying momentum adapts the step size per parameter; it does not, which is what AdaGrad adds"],
 examples:[
  {id:"m2t14e1",title:"Two steps of momentum",q:"w = 1.0, η = 0.1, β = 0.9, v₀ = 0. Gradients are ∇₁ = 0.5 and ∇₂ = 0.4. Perform two updates and compare with plain GD.",
   steps:["<b>Step 1:</b> v₁ = 0.9(0) + 0.1(0.5) = 0.05. w = 1.0 − 0.05 = 0.95.","<b>Step 2:</b> v₂ = 0.9(0.05) + 0.1(0.4) = 0.045 + 0.04 = 0.085. w = 0.95 − 0.085 = 0.865.","<b>Plain GD for comparison:</b> step 1 gives w = 1.0 − 0.1(0.5) = 0.95; step 2 gives w = 0.95 − 0.1(0.4) = 0.91."],
   answer:"Momentum reaches w = <b>0.865</b> after two steps; plain GD reaches <b>0.91</b>. Momentum has travelled 0.135 against plain GD's 0.09 — 50% further, using the same gradients.",
   trap:"Step 1 is identical for both, because v₀ = 0 and there is no history yet. The advantage only appears from step 2 onwards and grows as consistent gradients accumulate. Note also that v₂ = 0.085 exceeds the plain step of 0.04 — the accumulated velocity now dominates the current gradient's contribution."},
  {id:"m2t14e2",title:"Momentum overshooting, and NAG catching it",q:"A weight sits at w = 0.1 with the minimum at w = 0. Velocity carries v = 0.5 downhill, η = 0.1, β = 0.9, and the current gradient is ∇E(0.1) = 0.2. Compare momentum and NAG.",
   steps:["<b>Momentum:</b> v = 0.9(0.5) + 0.1(0.2) = 0.45 + 0.02 = 0.47. New w = 0.1 − 0.47 = −0.37.","The minimum was at 0 and we have landed at −0.37, well past it — a clear overshoot.","<b>NAG:</b> first look ahead to w − βv = 0.1 − 0.9(0.5) = 0.1 − 0.45 = −0.35.","Evaluate the gradient there. At w = −0.35 we are on the far side of the minimum, so the gradient points back the other way — say ∇E(−0.35) = −0.7.","v = 0.9(0.5) + 0.1(−0.7) = 0.45 − 0.07 = 0.38. New w = 0.1 − 0.38 = −0.28."],
   answer:"Momentum overshoots to <b>−0.37</b>; NAG lands at <b>−0.28</b>, closer to the minimum at 0. The look-ahead gradient was negative and pulled the step back.",
   trap:"The essential mechanism is that NAG's correction term has the <i>opposite</i> sign to the momentum term whenever the look-ahead lands past the minimum. Momentum can only discover an overshoot on the following step, after it has already happened; NAG detects it within the same step and shortens the jump. This is why NAG typically converges in fewer iterations on sharply curved surfaces."}],
 practice:[
  {id:"m2t14p1",d:"easy",q:"Write the momentum update rule and explain what β controls.",hint:"Two lines: velocity, then weight.",a:"<div class='eqb'>v_t = β·v_{t−1} + η·∇E(W)\nW   = W − v_t</div><p><b>β</b> is the momentum coefficient, the fraction of the previous velocity carried forward. It controls how much history influences the current step.</p><p>With β = 0, the rule reduces exactly to plain gradient descent. With β = 0.9 — the standard choice — a gradient that keeps pointing the same direction builds up to an effective step of 1/(1 − 0.9) = 10 times the plain step. Directions that keep reversing cancel rather than accumulate, which is what smooths the zig-zag in a ravine.</p>"},
  {id:"m2t14p2",d:"moderate",q:"What single change distinguishes NAG from momentum, and what does it achieve?",hint:"Where is the gradient evaluated?",a:"<p><b>The single change:</b> where the gradient is evaluated.</p><div class='eqb'>Momentum: v_t = β·v_{t−1} + η·∇E(W)\nNAG:      v_t = β·v_{t−1} + η·∇E(W − β·v_{t−1})</div><p>Momentum evaluates the gradient at the current position W. NAG first computes where momentum alone would carry it — the look-ahead point W − βv_{t−1} — and evaluates the gradient <i>there</i>. Everything else is identical.</p><p><b>What it achieves:</b> anticipation of overshoot. If the look-ahead point has already passed the minimum, the gradient at that point points back towards the minimum, so the correction term opposes the momentum term and shortens the step before the overshoot occurs. Plain momentum can only detect an overshoot after committing to it, then spends subsequent steps correcting. NAG's correction arrives within the same step, which is why it converges in fewer iterations on curved surfaces — the deck's 'look before you leap'.</p>"},
  {id:"m2t14p3",d:"moderate",q:"Explain how momentum speeds up convergence in a ravine.",hint:"Split the gradient into two components and follow each over several steps.",a:"<p>A ravine is a region where the loss surface is steep in one direction and shallow in another — a long narrow valley. The gradient there is dominated by the steep across-valley component, while the useful progress lies along the shallow direction.</p><p><b>What plain GD does:</b> each step is dominated by the across-valley component, so the optimizer bounces from one wall to the other. Because it overshoots the valley floor each time, the across-component reverses sign every step. Meanwhile the along-valley component is small, so actual progress towards the minimum is slow. The path is a tight zig-zag making little headway.</p><p><b>What momentum does:</b> velocity accumulates gradients over time. The across-valley component alternates sign — positive, negative, positive — so successive contributions largely <b>cancel</b> in the running sum. The along-valley component always has the same sign, so its contributions <b>accumulate</b>, building towards 1/(1−β) times its individual magnitude.</p><p>The net effect is that momentum damps exactly the component causing the zig-zag and amplifies exactly the component making progress. With β = 0.9 the along-valley motion is amplified up to tenfold while the oscillation is suppressed, which is why momentum is dramatically faster than plain GD on this very common loss-surface shape.</p>"}],
 questions:[
  {q:"Explain momentum-based gradient descent with its update rule and state the problems it solves.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Differentiate between momentum-based gradient descent and Nesterov accelerated gradient.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Perform two iterations of momentum-based gradient descent for the given weight, gradients, η and β.",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m2t15",m:"m2",title:"Adaptive Optimizers: AdaGrad, RMSProp and Adam",type:"problem-solving",priority:"high",los:["2.3"],
 src:"Module 2 deck, slides 209–213",
 summary:"Giving every parameter its own learning rate — the three-step progression the syllabus names.",
 whatIs:"<p>Momentum improves the <i>direction</i> of the step but every parameter still shares one learning rate. Adaptive methods give each parameter its own effective step size, based on the history of gradients that parameter has received.</p>",
 concept:"<h4>Why per-parameter rates are needed</h4>"+
  "<p>Some features occur often and produce large, frequent gradients; others are rare and produce small, infrequent ones. A single η is either too large for the frequent parameters or too small for the rare ones. Adaptive methods fix this by dividing each parameter's step by a running measure of its own gradient magnitude.</p>"+
  "<h4>1 · AdaGrad — Adaptive Gradient</h4>"+
  "<div class='eqb'>G_t = G_{t−1} + (∇_t)²          accumulate ALL past squared gradients\nW   = W − (η / √(G_t + ε)) · ∇_t</div>"+
  "<p>Parameters with large accumulated gradients get small steps; rare parameters keep large ones. ε (about 10⁻⁸) only prevents division by zero.</p>"+
  "<p><b>The fatal flaw:</b> G_t is a sum of squares, so it only ever grows. The effective learning rate η/√G_t therefore decreases monotonically towards zero, and training eventually stops making progress whether or not it has converged. The deck states this directly as the reason a successor was needed.</p>"+
  "<h4>2 · RMSProp — Root Mean Square Propagation</h4>"+
  "<div class='eqb'>E[g²]_t = β·E[g²]_{t−1} + (1 − β)·(∇_t)²   exponentially weighted MOVING AVERAGE\nW = W − (η / √(E[g²]_t + ε)) · ∇_t</div>"+
  "<p>The single change is replacing the running <b>sum</b> with an exponentially weighted <b>moving average</b>. Old gradients decay away instead of accumulating forever, so the denominator can shrink again and the effective learning rate does not die. β is typically 0.9.</p>"+
  "<h4>3 · Adam — Adaptive Moment Estimation</h4>"+
  "<p>Adam combines momentum's first moment with RMSProp's second moment.</p>"+
  "<div class='eqb'>m_t = β₁·m_{t−1} + (1 − β₁)·∇_t        first moment  — the MEAN (momentum)\nv_t = β₂·v_{t−1} + (1 − β₂)·(∇_t)²    second moment — the VARIANCE (RMSProp)\n\nm̂_t = m_t / (1 − β₁ᵗ)     bias correction\nv̂_t = v_t / (1 − β₂ᵗ)\n\nW = W − η · m̂_t / (√v̂_t + ε)\n\nDefaults: β₁ = 0.9, β₂ = 0.999, ε = 10⁻⁸</div>"+
  "<p><b>Why bias correction is needed:</b> m₀ and v₀ start at zero, so early estimates are biased towards zero. Dividing by (1 − βᵗ) corrects this; as t grows, βᵗ → 0 and the correction fades away.</p>"+
  "<div class='scroll'><table><tr><th></th><th>GD</th><th>Momentum</th><th>AdaGrad</th><th>RMSProp</th><th>Adam</th></tr>"+
  "<tr><td>Uses gradient direction history</td><td>No</td><td><b>Yes</b></td><td>No</td><td>No</td><td><b>Yes</b></td></tr>"+
  "<tr><td>Per-parameter step size</td><td>No</td><td>No</td><td><b>Yes</b></td><td><b>Yes</b></td><td><b>Yes</b></td></tr>"+
  "<tr><td>Gradient history</td><td>—</td><td>Running mean</td><td>Full sum</td><td>Moving average</td><td>Both moments</td></tr>"+
  "<tr><td>Learning rate dies?</td><td>No</td><td>No</td><td><b>Yes</b></td><td>No</td><td>No</td></tr>"+
  "<tr><td>Bias correction</td><td>—</td><td>No</td><td>No</td><td>No</td><td><b>Yes</b></td></tr></table></div>"+
  "<div class='box tip'><h5>The progression in one line</h5><p>AdaGrad introduced per-parameter rates but let them die. RMSProp fixed the dying by using a moving average. Adam added momentum on top of RMSProp, plus bias correction — which is why it is the standard default.</p></div>",
 needToKnow:["Write all three update rules","Name AdaGrad's flaw and the exact change RMSProp makes","State what Adam's two moments are and where each comes from","Explain why bias correction is needed and why it fades","Fill the five-way comparison table"],
 recognition:{clues:["'Adaptive', 'per-parameter learning rate'","β₁ and β₂ both appear → Adam","A squared gradient accumulator","'Which optimizer would you use?'"],
  wording:["Explain AdaGrad, RMSProp and Adam.","What is the limitation of AdaGrad and how does RMSProp address it?","Why is Adam considered a combination of momentum and RMSProp?","Explain the need for bias correction in Adam."],
  firstMove:"Identify which moments the method tracks. First moment only → momentum. Second only → AdaGrad or RMSProp. Both → Adam.",
  trap:"Saying AdaGrad and RMSProp differ in their learning rate. They differ in how the denominator accumulates: a sum versus a moving average."},
 examAnswer:[
  {marks:5,body:"<p>All three update rules, AdaGrad's dying-rate flaw, RMSProp's one-line fix, and Adam as the combination of the two moments.</p>"},
  {marks:10,body:"<p>All of the above plus: why per-parameter rates are needed at all; the bias-correction derivation and why it fades; the five-way comparison table; and a recommendation with justification.</p>"}],
 mistakes:["Confusing Adam's β₁ and β₂ — β₁ = 0.9 for the mean, β₂ = 0.999 for the variance","Omitting the square root in the denominator","Forgetting bias correction, which matters most in the first few steps","Saying Adam is always best; well-tuned SGD with momentum often generalises better","Writing AdaGrad's accumulator as a moving average, which makes it RMSProp"],
 examples:[
  {id:"m2t15e1",title:"Watching AdaGrad's learning rate die",q:"A parameter has η = 0.1 and receives gradients of 1.0 at every step. Compute its effective learning rate at steps 1, 4, 25 and 100 under AdaGrad, then say what RMSProp gives with β = 0.9.",
   steps:["AdaGrad: G_t = Σ(∇)² = t × 1² = t after t steps. Effective rate = η/√G_t = 0.1/√t.","Step 1: 0.1/√1 = 0.1000","Step 4: 0.1/√4 = 0.0500","Step 25: 0.1/√25 = 0.0200","Step 100: 0.1/√100 = 0.0100","RMSProp: E[g²] converges to a constant. With a steady gradient of 1.0, E[g²] → 1.0 whatever β is, since it is a weighted average of values all equal to 1.","Effective rate = 0.1/√1.0 = 0.1000, constant at every step."],
   answer:"AdaGrad's effective rate falls from <b>0.100 to 0.010</b> over 100 steps — a tenfold decay — and keeps falling forever. RMSProp holds it at <b>0.100</b> indefinitely.",
   trap:"The decay is 1/√t, which sounds gentle but is unbounded: by step 10,000 AdaGrad's rate is 0.001, and by step 1,000,000 it is 0.0001. Training halts through arithmetic rather than convergence. RMSProp's average is bounded because old contributions decay geometrically, which is the entire fix."},
  {id:"m2t15e2",title:"Adam's first step, with and without bias correction",q:"First step of Adam: ∇₁ = 0.4, m₀ = v₀ = 0, β₁ = 0.9, β₂ = 0.999, η = 0.001, ε = 10⁻⁸. Compute the update with and without bias correction.",
   steps:["m₁ = 0.9(0) + 0.1(0.4) = 0.04","v₁ = 0.999(0) + 0.001(0.4²) = 0.001(0.16) = 0.00016","<b>Without correction:</b> Δ = η·m₁/(√v₁ + ε) = 0.001 × 0.04/(√0.00016) = 0.001 × 0.04/0.012649 = 0.001 × 3.162 = 0.003162","<b>With correction:</b> m̂₁ = m₁/(1 − 0.9¹) = 0.04/0.1 = 0.4; v̂₁ = v₁/(1 − 0.999¹) = 0.00016/0.001 = 0.16","Δ = 0.001 × 0.4/(√0.16 + ε) = 0.001 × 0.4/0.4 = 0.001"],
   answer:"Without correction Δ = <b>0.003162</b>; with correction Δ = <b>0.001</b>, exactly η.",
   trap:"Look at what the correction recovered: m̂₁ = 0.4, the actual gradient, and √v̂₁ = 0.4, its actual magnitude. Their ratio is 1, so the first step is exactly η — clean and predictable. Uncorrected, m₁ = 0.04 is ten times too small because it was averaged against a zero initial value, and v₁ is a thousand times too small; the two biases do not cancel, leaving a step three times too large. By step 1000, 0.9¹⁰⁰⁰ ≈ 0 and 0.999¹⁰⁰⁰ ≈ 0.37, so the corrections approach 1 and quietly stop mattering."}],
 practice:[
  {id:"m2t15p1",d:"easy",q:"Write the AdaGrad update and state its main limitation.",hint:"What kind of quantity is the accumulator?",a:"<div class='eqb'>G_t = G_{t−1} + (∇_t)²\nW   = W − (η / √(G_t + ε)) · ∇_t</div><p><b>Limitation:</b> G_t is a running <i>sum</i> of squared gradients, and squares are non-negative, so G_t can only increase. The effective learning rate η/√G_t therefore decreases monotonically and approaches zero. Eventually the steps become so small that training stops making progress, whether or not the model has converged. AdaGrad kills its own learning rate.</p>"},
  {id:"m2t15p2",d:"moderate",q:"How does RMSProp fix AdaGrad, and what exactly changes in the formula?",hint:"Compare the two accumulators side by side.",a:"<p><b>The change is one line.</b> AdaGrad accumulates a sum; RMSProp accumulates an exponentially weighted moving average:</p><div class='eqb'>AdaGrad:  G_t     = G_{t−1} + (∇_t)²\nRMSProp:  E[g²]_t = β·E[g²]_{t−1} + (1 − β)·(∇_t)²</div><p><b>Why this fixes it.</b> In AdaGrad every past gradient contributes with full weight forever, so the accumulator grows without bound. In RMSProp a gradient from k steps ago carries weight βᵏ, which decays geometrically — with β = 0.9, a gradient 50 steps old contributes about 0.5% of its original weight.</p><p>The accumulator therefore reflects only <i>recent</i> gradient magnitudes and stays bounded. Crucially it can also <b>decrease</b>: if gradients become smaller, the average falls and the effective learning rate <i>rises</i> again. AdaGrad can never recover a learning rate it has spent; RMSProp can. That is the whole difference, and it is what makes RMSProp usable for long training runs.</p>"},
  {id:"m2t15p3",d:"moderate",q:"Why is Adam described as combining momentum and RMSProp? Name what each contributes.",hint:"Adam tracks two running quantities.",a:"<p>Adam maintains two exponentially weighted moving averages of the gradient, one of each statistical moment.</p><p><b>From momentum — the first moment m_t</b>, a moving average of the gradient itself: m_t = β₁m_{t−1} + (1−β₁)∇_t. This is the mean gradient direction, and it does exactly what momentum does — smooths the path, cancels oscillation in ravines, and carries velocity across plateaus. It determines the <b>direction and consistency</b> of the step.</p><p><b>From RMSProp — the second moment v_t</b>, a moving average of the squared gradient: v_t = β₂v_{t−1} + (1−β₂)(∇_t)². This measures each parameter's recent gradient magnitude and appears in the denominator, giving every parameter its own effective learning rate. It determines the <b>scale</b> of the step.</p><div class='eqb'>W = W − η · m̂_t / (√v̂_t + ε)</div><p>Numerator from momentum, denominator from RMSProp. Adam adds one thing neither had: bias correction by (1 − βᵗ), which compensates for both averages starting at zero and would otherwise make the first steps badly wrong. This combination of a good direction, a per-parameter scale and a correct start is why Adam is the standard default optimizer.</p>"}],
 questions:[
  {q:"Explain AdaGrad, RMSProp and Adam with their update rules.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"What is the limitation of AdaGrad and how does RMSProp overcome it?",marks:5,d:"moderate",priority:"high",source:"source"},
  {q:"Why is bias correction required in Adam? Show its effect on the first update.",marks:5,d:"hard",priority:"high",source:"source"}]}
]);
