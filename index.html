var QUICK={
m1:[
 {t:"θ for every M-P gate",b:"AND θ = n (all inputs). OR θ = 1 (any input). NOR θ = 0 with inhibitory inputs. NOT = one inhibitory input, θ = 0. Fires at <b>g ≥ θ</b>, not g > θ."},
 {t:"Perceptron in three lines",b:"z = Σwᵢxᵢ + b · y = 1 if z ≥ 0 else 0 · b = <b>−θ</b>. Weights set the boundary's <b>orientation</b>; bias sets its <b>position</b>."},
 {t:"Standard gate weights",b:"OR (1, 1, b = −0.5) · AND (1, 1, b = −1.5) · NAND (−1, −1, b = +1.5) · NOR (−1, −1, b = +0.5). <b>AND and OR differ only in the bias.</b> Negating a gate flips every sign."},
 {t:"The XOR contradiction",b:"b < 0, w₁+b ≥ 0, w₂+b ≥ 0, w₁+w₂+b < 0. Adding the middle two gives w₁+w₂ ≥ −2b; the last gives w₁+w₂ < −b. Together they force b > 0 — contradiction."},
 {t:"XOR in two layers",b:"h₁ = OR(1,1,−0.5) · h₂ = NAND(−1,−1,+1.5) · y = AND(h₁,h₂) with (1,1,−1.5). Gives 0,1,1,0. <b>OR and NAND, not OR and AND.</b>"},
 {t:"Two rules, one equation",b:"Both are Δwᵢ = η(t − y)xᵢ. Perceptron: y is <b>binary</b>, so no update when correct. Delta: y is <b>continuous</b>, so it always updates. Delta = gradient descent on ½(t−y)²."},
 {t:"M-P vs Perceptron",b:"Boolean → real inputs · no weights → weights · θ by hand → bias learned · veto input → negative weight. <b>Both still fail XOR</b> — that shared row is worth a mark."},
 {t:"Two axes, never one list",b:"<b>Paradigm</b> (how it learns): supervised, unsupervised, semi-supervised, self-supervised, reinforcement. <b>Architecture</b> (what it is): MLP, CNN, RNN, autoencoder, transformer, GNN. A CNN can be either paradigm."},
 {t:"Epoch vs batch vs iteration",b:"Epoch = one full pass over the data. Batch = examples per update. Iteration = one update. <b>iterations per epoch = N / B.</b> Changing B changes update count, never coverage."},
 {t:"The collapse argument",b:"W₂(W₁x + b₁) + b₂ = (W₂W₁)x + (W₂b₁ + b₂). Any depth of linear layers = one layer. This is why non-linear activations are structural, not decorative."}
],
m2:[
 {t:"Output layer → loss — learn as one object",b:"Regression → linear + MSE · Binary → sigmoid + binary CE · Multi-class → softmax + categorical CE · Multi-<b>label</b> → sigmoid on each + binary CE on each. The pairs cancel the saturating derivative; breaking a pair stalls training."},
 {t:"Derivative maxima",b:"σ′ max <b>0.25</b> · tanh′ max <b>1.0</b> · ReLU′ = <b>1</b> for z>0, <b>0</b> for z<0 · Leaky ReLU′ = α for z<0. Sigmoid's 0.25 is the entire vanishing-gradient argument: 0.25⁵ ≈ 1/1000."},
 {t:"σ and tanh values worth knowing",b:"σ(0)=0.5 · σ(2)=0.88 · σ(−2)=0.12 · tanh(0)=0 · tanh(2)=0.96. Shortcuts: σ(−z) = 1 − σ(z); tanh(−z) = −tanh(z); σ′ = σ(1−σ)."},
 {t:"Dying ReLU, as a chain",b:"z < 0 for every input → output 0 → derivative 0 → gradient 0 → no update → stuck forever. Usually caused by <b>η too large</b>. Fix: Leaky ReLU, or lower η."},
 {t:"Cross-entropy in one move",b:"One-hot target ⟹ CE = <b>−log(ŷ_correct)</b>. Every other output vanishes. −log₂(0.775) = 0.368 bits. Confident and wrong → unbounded penalty; that is why CE beats MSE for classification."},
 {t:"The update rule, correct sign",b:"W_new = W_old <b>−</b> η·∂E/∂W. Positive gradient → weight <b>decreases</b>. 0.80 − 0.2(0.50) = 0.70; 0.80 − 1.0(0.50) = 0.30. Adding instead of subtracting diverges."},
 {t:"Backprop computes, optimizer applies",b:"δ⁽ᴸ⁾ = (ŷ − t) ⊙ f′(z⁽ᴸ⁾) · δ⁽ˡ⁾ = (W⁽ˡ⁺¹⁾ᵀδ⁽ˡ⁺¹⁾) ⊙ f′(z⁽ˡ⁾) · ∂E/∂W⁽ˡ⁾ = δ⁽ˡ⁾(a⁽ˡ⁻¹⁾)ᵀ. Backprop never updates a weight."},
 {t:"GD family in one row each",b:"Batch: all N, 1 update/epoch, exact, needs whole dataset. SGD: 1 example, N updates, noisy, <b>online</b>. Mini-batch: B examples, N/B updates, good estimate, <b>uses the GPU</b> — the practical default."},
 {t:"Optimizer progression",b:"Momentum: v = βv + η∇, amplification <b>1/(1−β)</b> = 10× at β=0.9. NAG: same but gradient at the <b>look-ahead</b> point. AdaGrad: sum of squares, so <b>the rate dies</b>. RMSProp: moving average, so it does not. Adam: both moments + bias correction."},
 {t:"Diagnose in two numbers",b:"Low train → <b>underfitting</b> whatever the gap. High train + large gap → <b>overfitting</b>. High train + small gap → good fit. Validation above training → usually a dropout artefact, not a fitting regime."},
 {t:"L1 vs L2 — the gradients decide",b:"L1 gradient λ·sign(w), <b>constant</b> → drives weights to exactly 0 → sparsity → feature selection. L2 gradient 2λw, <b>proportional</b> → shrinks but never reaches 0. On correlated features L1 picks one, L2 shares."},
 {t:"Dropout and batch norm both switch modes",b:"Dropout: train zeroes units and scales by 1/(1−p); <b>test disables it entirely</b>. Batch norm: train uses batch statistics; <b>test uses running averages</b>. Forgetting to switch is a real bug."},
 {t:"Regularization is a bias-for-variance trade",b:"Every method accepts more bias to cut variance. That is why regularization <b>raises training error while lowering validation error</b>. Total error = Bias² + Variance + irreducible noise."},
 {t:"Early stopping — do not skip the last step",b:"Stop at the <b>validation minimum</b>, after <i>patience</i> non-improving epochs. Then <b>restore the saved best weights</b>, not the final ones. Training loss never signals overfitting."}
],
m3:[
 {t:"The master formula",b:"Output = <b>⌊(N − F + 2P)/S⌋ + 1</b>. The <b>+1</b> counts the first position; the floor drops a partial step. Height and width separately whenever they differ. Always state depth too."},
 {t:"Four cases to recognise instantly",b:"Valid (P=0, S=1): N − F + 1 · Same (P=(F−1)/2, S=1): N · Halving (F=2, S=2): N/2 · 1×1 conv: N unchanged, <b>depth changes only</b>."},
 {t:"Parameters — the term everyone drops",b:"(F_h × F_w × <b>C_in</b> + 1) × K. C_in is the input depth: a 3×3 filter on RGB has <b>27</b> weights, not 9. Pooling has <b>zero</b> parameters. Count is independent of image size."},
 {t:"The deck's unsolved exercise",b:"filters = 1, kernel (3,3), input (10,10,1) → params = 3×3×1 + 1 = <b>10</b>; output = ⌊(10−3)/1⌋ + 1 = <b>(8,8,1)</b>. Set on slide 33 and never answered — a strong exam candidate."},
 {t:"Pooling, the deck's example",b:"[[32,10,11,17],[4,14,9,19],[20,4,16,27],[8,12,7,14]] → max <b>[[32,19],[20,27]]</b>, average <b>[[15,14],[11,16]]</b>. Depth never changes; no parameters."},
 {t:"Max over average",b:"A feature map value means 'how strongly detected'. Max asks <i>was it found</i>; average dilutes a 32 among 10, 4, 14 down to 15. Max also routes the gradient to the unit that found it."},
 {t:"Weight sharing, three advantages",b:"Fewer weights to learn · feature search insensitive to location · greater model flexibility. Gradients from <b>all</b> positions are summed onto the one shared weight."},
 {t:"LeNet chain",b:"32 → 28 → 14 → 10 → 5 → 1, depth 1 → 6 → 16 → 120, then FC 84 → 10. <b>No padding anywhere</b>, 5×5 filters, <b>tanh</b>. Task: handwritten digits."},
 {t:"AlexNet chain",b:"227 → 55 → 27 → 27 → 13 → 13 → 13 → 13 → 6, flatten <b>9216</b> → 4096 → 4096 → 1000. Conv2–5 are <b>padded to preserve size</b>; only pooling downsamples. <b>ReLU</b>, overlapping 3×3/s2 pooling."},
 {t:"Why 227 and not 224",b:"(227 − 11)/4 + 1 = 55 exactly. (224 − 11)/4 + 1 = 54.25, not an integer. If your chain does not come out whole, check the input size first."},
 {t:"CNN pipeline, ReLU included",b:"INPUT → [CONV → <b>ReLU</b> → POOL] × n → FLATTEN → FC → SOFTMAX. ReLU is a named step producing the <b>rectified feature map</b>; omitting it loses a mark. It changes values, never shape."},
 {t:"Edge filters sum to zero",b:"On a uniform patch the output is c × Σwᵢ = 0, so the filter ignores flat regions and responds only to <b>change</b>. Verified: sharpen on [[21,19,17],[71,76,73],[153,164,164]] gives −74."}
]};

var QUIZ=[
/* ---- Module 1 ---- */
{t:"m1t1",stage:"concept",q:"In the artificial neuron, which biological part corresponds to the weight?",o:["Dendrite","Synapse","Soma","Axon"],a:1,e:"The synapse is the junction that strengthens or weakens a passing signal, which is exactly what a weight does. Dendrites are the inputs, the soma is the summation, and the axon is the activation and output."},
{t:"m1t1",stage:"concept",q:"Why does the artificial neuron use a threshold rather than passing on its raw sum?",o:["To keep the output small","Because a real neuron fires all-or-nothing after accumulating","To make the maths easier","To reduce the number of weights"],a:1,e:"A biological neuron stays silent while accumulating charge and then fires all at once. A threshold reproduces that all-or-nothing behaviour; passing on the raw sum would model a neuron that is always partly firing."},
{t:"m1t2",stage:"recognise",q:"A question gives Boolean inputs, a value θ, and no weights anywhere. Which model is it about?",o:["Perceptron","McCulloch–Pitts neuron","Multilayer perceptron","Adaline"],a:1,e:"Boolean-only inputs, no weights and a hand-set θ are the three defining restrictions of the M-P neuron. The instant weights appear you are dealing with a perceptron instead."},
{t:"m1t2",stage:"solve",q:"An M-P neuron has three excitatory inputs and θ = 2. What is the output for (1, 1, 0)?",o:["0","1","Undefined","Depends on the weights"],a:1,e:"g(x) = 1 + 1 + 0 = 2, and the rule fires when g(x) ≥ θ. Since 2 ≥ 2, y = 1. The ≥ is essential — with a strict > the answer would be 0."},
{t:"m1t2",stage:"concept",q:"What does an inhibitory input do in an M-P neuron?",o:["Subtracts 1 from the sum","Acts as a large negative weight","Forces the output to 0 regardless of every other input","Halves the threshold"],a:2,e:"Inhibition in the M-P neuron is an absolute veto checked before the sum is even considered. It is not a negative weight, because the model has no weights at all."},
{t:"m1t3",stage:"solve",q:"What value of θ implements a four-input AND with an M-P neuron?",o:["1","2","3","4"],a:3,e:"AND fires only when every input is 1, so the count must reach n. For four inputs θ = 4. The general rule is θ = n for AND and θ = 1 for OR, independent of n."},
{t:"m1t3",stage:"concept",q:"Why can a threshold alone not implement NOT?",o:["The threshold would have to be negative","Thresholding a count is monotone increasing, and NOT is decreasing","There is only one input","θ cannot be zero"],a:1,e:"Any rule of the form g ≥ θ can never lower its output when an input rises. NOT must do exactly that, so no θ works and an inhibitory input is required."},
{t:"m1t3",stage:"concept",q:"The decision boundary of a two-input M-P neuron always has slope −1. Why?",o:["Because θ is always positive","Because g(x) = x₁ + x₂ gives both inputs an implicit coefficient of 1","Because the inputs are Boolean","Because there is no bias"],a:1,e:"With no weights, both inputs carry an implicit coefficient of 1, so the boundary x₁ + x₂ = θ has fixed slope. θ only translates the line; tilting it requires unequal coefficients, i.e. weights."},
{t:"m1t4",stage:"concept",q:"Which limitation of the M-P neuron is the reason nothing in it can learn?",o:["Inputs must be Boolean","There are no weights","θ is set by hand","The boundary is linear"],a:2,e:"Even if weights were added, nothing would update them without a learning rule. The absence of any mechanism for setting θ from data is what makes the model non-learning; the perceptron fixed this by making θ a learnable bias."},
{t:"m1t5",stage:"solve",q:"A perceptron has w = (0.20, 0.10, 0.15, −0.10) and b = −0.20. What is z for x = (0.9, 0.8, 0.7, 0.2)?",o:["0.345","0.145","0.545","−0.055"],a:1,e:"0.18 + 0.08 + 0.105 − 0.02 − 0.20 = 0.145. The distractor 0.345 is what you get by forgetting the bias; note the fourth weight is negative and subtracts."},
{t:"m1t5",stage:"concept",q:"If an M-P rule fires when x₁ + x₂ ≥ 3, the equivalent perceptron bias is:",o:["b = +3","b = −3","b = 0","b = 1/3"],a:1,e:"Rearranging x₁ + x₂ ≥ 3 gives x₁ + x₂ − 3 ≥ 0, so b = −3. The general relation is b = −θ, and getting the sign backwards flips every classification."},
{t:"m1t5",stage:"concept",q:"Geometrically, what does the bias control?",o:["The orientation of the decision boundary","The position of the decision boundary","The steepness of the activation","The learning rate"],a:1,e:"Weights set orientation; the bias translates the boundary without rotating it. Without a bias every boundary would be forced through the origin."},
{t:"m1t6",stage:"concept",q:"Which statement is true of BOTH the M-P neuron and the perceptron?",o:["Both learn from data","Both accept real-valued inputs","Both fail on XOR","Both have a special inhibitory input type"],a:2,e:"Both are single linear units, so neither can represent XOR. Adding weights lets the perceptron tilt its boundary but does not make it non-linear — escaping XOR requires layers."},
{t:"m1t6",stage:"concept",q:"How is inhibition represented in a perceptron?",o:["A special veto input","A large negative weight","A threshold of zero","It cannot be represented"],a:1,e:"Signed weights come for free in the perceptron, so a large negative weight drags z below zero whenever that input is active. No special mechanism is needed."},
{t:"m1t7",stage:"solve",q:"Which weights implement a two-input AND perceptron?",o:["w = (1, 1), b = −0.5","w = (1, 1), b = −1.5","w = (−1, −1), b = +1.5","w = (1, 0), b = −0.5"],a:1,e:"AND needs the boundary between one and two active inputs, so b must lie strictly between −2 and −1; b = −1.5 is the standard choice. Option A is OR, option C is NAND."},
{t:"m1t7",stage:"select",q:"How do you convert an OR perceptron into a NOR perceptron?",o:["Flip the sign of the weights only","Flip the sign of the bias only","Flip the sign of every weight and the bias","Double the bias"],a:2,e:"Negating a gate means negating z, and y depends only on the sign of z. Multiplying every parameter by −1 does it; flipping only the weights gives a perceptron that never fires."},
{t:"m1t7",stage:"solve",q:"A perceptron must output 1 when x₁ = 1 regardless of x₂. What is w₂?",o:["1","−1","0","0.5"],a:2,e:"A zero weight is how a perceptron expresses that an input is irrelevant — it contributes nothing to z whatever its value. This is precisely what the M-P neuron could never do."},
{t:"m1t8",stage:"concept",q:"Two classes are linearly separable if and only if:",o:["They can be separated by any curve","Some single perceptron achieves zero training error on them","Every feature separates them alone","The classes have equal size"],a:1,e:"The condition wᵀx + b ≥ 0 for one class and < 0 for the other is exactly the condition for a perceptron to classify every point correctly. The two statements are equivalent."},
{t:"m1t8",stage:"select",q:"Attendance alone fails to separate a dataset. What should you conclude?",o:["The data is not linearly separable","Nothing yet — test the other features and combinations","A perceptron cannot be used","A hidden layer is required"],a:1,e:"Failure on one feature is not failure overall. In the deck's own classroom data attendance fails but a threshold on the second feature separates every point perfectly."},
{t:"m1t9",stage:"concept",q:"Which pair of hidden units correctly builds XOR before an AND output layer?",o:["AND and OR","OR and NAND","NOR and NAND","AND and NOT"],a:1,e:"XOR = OR AND NAND. OR excludes (0,0), NAND excludes (1,1), and the AND of the two keeps exactly the middle rows. Using OR and AND instead cannot recover XOR."},
{t:"m1t9",stage:"concept",q:"Why can a single perceptron not represent XOR?",o:["It has too few weights","It was not trained long enough","Its four required inequalities are mutually inconsistent","XOR needs more than two inputs"],a:2,e:"Adding the constraints from rows (1,0) and (0,1) forces b > 0, while row (0,0) forces b < 0. It is a representational impossibility, not a training failure."},
{t:"m1t10",stage:"concept",q:"A network stacks three layers with linear activations throughout. It is equivalent to:",o:["A three-layer non-linear network","A single linear layer","An M-P neuron","A network with no bias"],a:1,e:"W₃(W₂(W₁x)) = (W₃W₂W₁)x, a single matrix. Depth buys nothing without a non-linearity between the linear maps — the collapse argument."},
{t:"m1t10",stage:"solve",q:"An MLP has 3 inputs, one hidden layer of 4 units and 2 outputs. How many learnable parameters?",o:["20","24","26","32"],a:2,e:"Weights 3×4 + 4×2 = 20; biases 4 + 2 = 6; total 26. Forgetting the biases gives the distractor 20."},
{t:"m1t11",stage:"solve",q:"A perceptron predicts y = 1 and the target is t = 1. With η = 0.1, what is Δw₁?",o:["0.1x₁","−0.1x₁","0","0.1"],a:2,e:"t − y = 0, so every Δwᵢ = η × 0 × xᵢ = 0. The perceptron rule is error-driven and makes no update on a correctly classified example."},
{t:"m1t11",stage:"solve",q:"w = 0.20, x = 0.5, η = 0.1, t = 0, y = 1. What is the updated weight?",o:["0.25","0.15","0.20","0.10"],a:1,e:"Δw = η(t − y)x = 0.1(−1)(0.5) = −0.05, so w = 0.20 − 0.05 = 0.15. The perceptron fired when it should not have, so the weight falls."},
{t:"m1t11",stage:"concept",q:"On data that is NOT linearly separable, the perceptron learning rule:",o:["Converges to the best approximate boundary","Converges more slowly","Never terminates — it cycles indefinitely","Raises an error"],a:2,e:"Its stopping condition is a complete pass with no updates, which requires zero errors. On non-separable data that never happens, so it cycles forever without settling."},
{t:"m1t12",stage:"concept",q:"What is the single difference between the perceptron rule and the delta rule?",o:["The learning rate","Whether y is binary or continuous","The presence of a bias","The number of layers"],a:1,e:"The equation Δwᵢ = η(t − y)xᵢ is identical. In the perceptron rule y is thresholded so the error is −1, 0 or +1; in the delta rule y is continuous so the error is any real number."},
{t:"m1t12",stage:"concept",q:"The delta rule is gradient descent on which loss?",o:["Cross-entropy","Squared error ½(t − y)²","Absolute error","Hinge loss"],a:1,e:"Differentiating ½(t − y)² with respect to wᵢ gives −(t − y)xᵢ, so a step of −η∂E/∂wᵢ is exactly η(t − y)xᵢ. This is why the delta rule generalises to hidden layers and the perceptron rule does not."},
{t:"m1t12",stage:"concept",q:"Why can the delta rule not be used with a step activation?",o:["The step is too slow to compute","The step's derivative is 0 almost everywhere and undefined at 0","The step has no bias","The step is not bounded"],a:1,e:"The derivation needs ∂y/∂w. With a zero derivative almost everywhere the gradient is zero, so no weight ever updates. Differentiability is the requirement."},
{t:"m1t13",stage:"concept",q:"A network is called 'deep' when it has:",o:["More than 100 neurons","More than one hidden layer","At least one hidden layer","More weights than training examples"],a:1,e:"Depth counts layers, not neurons. More than one hidden layer allows hierarchical feature learning — features built from features."},
{t:"m1t13",stage:"select",q:"You have 400 records, 12 numeric features, and must justify every decision to a clinician. Deep learning is:",o:["The right choice — it is most accurate","The wrong choice — too little data and no interpretability","The right choice if you add dropout","The wrong choice only because of the data size"],a:1,e:"Two drawbacks are decisive: 400 rows is far too little for a deep network, and the black-box nature blocks the justification requirement. Both matter, so the answer naming only one is incomplete."},
{t:"m1t14",stage:"solve",q:"10,000 examples, batch size 100, 30 epochs. How many weight updates?",o:["30","100","3,000","300,000"],a:2,e:"Iterations per epoch = N/B = 100, and 100 × 30 epochs = 3,000 updates. Each example is still seen exactly 30 times — batch size changes update frequency, never coverage."},
{t:"m1t14",stage:"concept",q:"Which of these is a hyperparameter rather than a parameter?",o:["A connection weight","A bias","The learning rate","Batch norm's learned γ"],a:2,e:"Parameters are learned by gradient descent; hyperparameters are chosen before training and no gradient updates them. Weights, biases and γ are all learned."},
{t:"m1t14",stage:"concept",q:"An epoch is:",o:["One weight update","One batch processed","One complete pass over the training set","The time to reach convergence"],a:2,e:"An epoch counts coverage — after one epoch every example has been seen once. One update is an iteration, and one batch produces one iteration."},
{t:"m1t15",stage:"concept",q:"What is the boundary between machine learning and deep learning?",o:["Deep learning uses more data","Deep learning learns its own features; ML uses hand-designed ones","Deep learning uses neural networks; ML does not","Deep learning is always more accurate"],a:1,e:"Feature engineering is the boundary. A shallow neural network on hand-chosen features is still machine learning; the test is whether the features are learned, not whether a network is used."},
{t:"m1t15",stage:"recognise",q:"A chess engine searching ahead with a hand-written evaluation function is:",o:["Deep learning","Machine learning but not deep learning","AI but not machine learning","None of these"],a:2,e:"It behaves intelligently but nothing is learned from data — the evaluation function was written by a human. That places it in AI and outside ML."},
{t:"m1t16",stage:"concept",q:"A CNN trained inside an autoencoder to reconstruct its own input is an example of:",o:["A supervised architecture","An unsupervised use of a CNN","A new paradigm","An invalid combination"],a:1,e:"The architecture is unchanged; only the target and loss changed. This is the clearest demonstration that paradigm and architecture are independent axes."},
{t:"m1t16",stage:"select",q:"Which architecture suits a variable-length sentence where word order matters?",o:["MLP","CNN","RNN / LSTM","Autoencoder"],a:2,e:"Recurrent architectures process one element at a time while carrying a hidden state, so they handle any length and remember earlier context. An MLP requires a fixed-size input and has no notion of order."},
{t:"m1t16",stage:"concept",q:"Which learning paradigm generates its own targets from the data by hiding part of it?",o:["Supervised","Semi-supervised","Self-supervised","Reinforcement"],a:2,e:"Self-supervised learning uses no human labels but creates targets automatically — predicting a masked word or an occluded image patch. Reinforcement learning instead uses a reward from an environment."},
{t:"m1t16",stage:"concept",q:"Why does the deck insist on two classification axes rather than one list?",o:["There are too many models for one list","Paradigm follows from your data situation, architecture from your data shape","Architectures are newer than paradigms","One list would be too long to memorise"],a:1,e:"The paradigm is fixed by whether you have labels; the architecture by whether the data is a grid, a sequence or a fixed vector. Neither determines the other, and a convolutional autoencoder proves it."},
/* ---- Module 2 ---- */
{t:"m2t1",stage:"solve",q:"Layer ℓ−1 has 5 units and layer ℓ has 3. What are the dimensions of W⁽ˡ⁾?",o:["5 × 3","3 × 5","5 × 5","3 × 3"],a:1,e:"W⁽ˡ⁾ must have as many rows as the layer has units, so that W⁽ˡ⁾a⁽ˡ⁻¹⁾ produces 3 outputs from 5 inputs. The rule is (units in this layer) × (units in previous layer)."},
{t:"m2t1",stage:"concept",q:"Why must weights be initialised randomly rather than to zero?",o:["Zero weights make the loss undefined","Every unit in a layer would receive identical gradients and stay identical forever","Zero weights cause exploding gradients","It only matters for the output layer"],a:1,e:"With all-zero weights every unit in a layer computes the same output and receives the same gradient, so the symmetry never breaks. A wide layer would have the power of a single unit."},
{t:"m2t1",stage:"concept",q:"'Feed-forward' means the architecture forbids:",o:["Backpropagation","Any connection to a unit in the same or an earlier layer","More than two hidden layers","Non-linear activations"],a:1,e:"It forbids cycles in the computation graph. Training still runs backwards through the network; it is the architecture, not the training, that is feed-forward."},
{t:"m2t2",stage:"solve",q:"A neuron has w = (0.6, −0.4), b = 0.2, sigmoid activation. What is its output for x = (2, 1)?",o:["0.5000","0.7311","0.2689","1.0000"],a:1,e:"z = 1.2 − 0.4 + 0.2 = 1.0, and σ(1.0) = 1/(1 + e⁻¹) = 0.7311. The distractor 0.2689 is σ(−1), which comes from a sign slip."},
{t:"m2t2",stage:"concept",q:"Why must four decimal places be carried through a multi-layer forward pass?",o:["Because sigmoid needs four decimals","Because rounding errors compound multiplicatively across layers","Because the exam requires it","Because biases are small"],a:1,e:"An error introduced at one unit is multiplied by outgoing weights and passed through further activations, growing at each layer where weights exceed 1 in magnitude."},
{t:"m2t2",stage:"solve",q:"In the deck's Ex2 network, out_o1 = 0.75137 with target 0.01. What is E_o1 using ½(t − ŷ)²?",o:["0.74137","0.27481","0.54963","0.02356"],a:1,e:"½(0.01 − 0.75137)² = ½(0.74137)² = ½(0.54963) = 0.27481. The distractor 0.74137 is the raw error before squaring and halving."},
{t:"m2t3",stage:"concept",q:"Two linear layers composed give W₂(W₁x + b₁) + b₂ = W′x + b′. What does this prove?",o:["Biases are unnecessary","Depth without non-linearity buys no representational power","Linear activations are faster","Two layers are always better than one"],a:1,e:"Any depth of purely linear network is exactly equivalent to one layer, so it can only represent linearly separable problems. XOR remains impossible however many layers you add."},
{t:"m2t4",stage:"solve",q:"What is the maximum value of the sigmoid derivative?",o:["1.00","0.50","0.25","0.10"],a:2,e:"σ′ = σ(1 − σ) is maximised at σ = 0.5, giving 0.25. Every layer therefore shrinks the backward signal by at least a factor of 4, which is the vanishing-gradient argument."},
{t:"m2t4",stage:"solve",q:"σ(2) ≈ 0.88. What is σ(−2)?",o:["−0.88","0.12","0.88","0.24"],a:1,e:"σ(−z) = 1 − σ(z), so σ(−2) = 1 − 0.88 = 0.12. The sigmoid's range is (0,1), so a negative output is impossible."},
{t:"m2t4",stage:"concept",q:"Tanh is preferred over sigmoid in hidden layers mainly because it is:",o:["Faster to compute","Zero-centred with a larger maximum derivative","Unbounded","Free of saturation"],a:1,e:"Tanh's maximum derivative is 1.0 against sigmoid's 0.25, and being zero-centred it avoids the zig-zag updates. It still saturates, so it reduces rather than removes vanishing gradients."},
{t:"m2t4",stage:"concept",q:"Why does sigmoid's lack of zero-centring cause inefficient updates?",o:["Outputs are too small","All incoming weight gradients of a unit share one sign, forcing zig-zag steps","The derivative is undefined at zero","It makes the loss non-convex"],a:1,e:"With all activations positive, ∂E/∂wᵢ = δ·aᵢ has the sign of δ for every i, so all incoming weights must move together. The optimizer cannot raise one and lower another in a single step."},
{t:"m2t5",stage:"solve",q:"Leaky ReLU with α = 0.01 receives z = −3. What is the output?",o:["0","−3","−0.03","0.03"],a:2,e:"For z < 0 the output is αz = 0.01 × (−3) = −0.03. Plain ReLU would give 0; the lecturer's own slide uses α = 0.1, which would give −0.3."},
{t:"m2t5",stage:"concept",q:"What makes the dying ReLU problem irreversible?",o:["The weights are frozen by the optimizer","The derivative is exactly 0, so the gradient that would fix it is also 0","The learning rate decays to zero","The unit is removed from the network"],a:1,e:"Escaping requires changing the weights, and the only mechanism for that is the gradient — which is exactly what has become zero. Leaky ReLU keeps it non-zero at α."},
{t:"m2t5",stage:"concept",q:"What is the limitation of Leaky ReLU itself?",o:["It vanishes for large z","α is a hyperparameter with no principled value","It is not differentiable anywhere","It cannot output negative values"],a:1,e:"Too small an α barely prevents dying; too large and the function drifts towards linear, weakening the non-linearity. It must be guessed or searched over."},
{t:"m2t5",stage:"concept",q:"Sparsity and dying in a ReLU network differ in that:",o:["Sparsity affects only the output layer","A sparse unit is zero for some inputs; a dying unit is zero for every input","Dying is desirable and sparsity is not","They are the same phenomenon"],a:1,e:"Sparsity means different subsets of units activate for different inputs, which is efficient. A dying unit activates on 0% of inputs and its capacity is permanently lost."},
{t:"m2t6",stage:"solve",q:"Softmax is applied to [1.0, 2.0, 0.5]. Which class has the highest probability?",o:["Class 1","Class 2","Class 3","They are equal"],a:1,e:"Softmax is strictly increasing in each score, so the largest logit always gives the largest probability. Here p ≈ [0.231, 0.629, 0.140]."},
{t:"m2t6",stage:"concept",q:"Why exponentiate rather than normalise the raw scores directly?",o:["It is faster","Negative scores would give negative 'probabilities' and the sum can be zero","It makes the outputs sum to 1","It reduces overfitting"],a:1,e:"Naive normalisation zᵢ/Σzⱼ produces negative values for negative scores and divides by zero when the scores sum to zero. The exponential also usefully amplifies differences."},
{t:"m2t6",stage:"select",q:"A student can be simultaneously distracted and sleepy. The correct output layer is:",o:["Softmax over both","One sigmoid per label","A single sigmoid","Linear"],a:1,e:"This is multi-label, not multi-class. Softmax couples the outputs so detecting one would suppress the other, which is the opposite of what is required."},
{t:"m2t6",stage:"solve",q:"A softmax output is [0.25, 0.25, 0.25, 0.25] after many epochs. The most likely cause is:",o:["Perfect calibration","Learning has stalled — no gradient is reaching the output layer","Too much dropout at test time","The classes are balanced"],a:1,e:"Equal probabilities mean equal logits. After many epochs this indicates the output layer is not learning — a vanishing gradient, dead units upstream, or zero-initialised weights."},
{t:"m2t7",stage:"select",q:"Which pairing is correct for predicting a student's percentage marks?",o:["Sigmoid + binary CE","Softmax + categorical CE","Linear + MSE","ReLU + MSE"],a:2,e:"Regression needs an unbounded output, so linear activation with mean squared error. A sigmoid would cap the prediction at 1, and ReLU could not produce negative values."},
{t:"m2t7",stage:"select",q:"Assigning exactly one of five grades A–E requires:",o:["5 sigmoids + binary CE","Softmax with 5 units + categorical CE","1 sigmoid + binary CE","Linear with 5 units + MSE"],a:1,e:"The grades are mutually exclusive, so the outputs should be coupled and sum to 1. That is exactly what softmax with categorical cross-entropy provides."},
{t:"m2t7",stage:"concept",q:"Why must the output activation and loss be chosen together?",o:["To keep the code simple","So the saturating derivative factor cancels in the gradient","Because the loss determines the number of units","They need not be — any pairing works"],a:1,e:"With sigmoid + MSE the gradient carries a σ′ factor that vanishes when the network is confidently wrong. Cross-entropy is constructed so that factor cancels, leaving ∂E/∂z = ŷ − t."},
{t:"m2t8",stage:"solve",q:"Predictions [72, 85] against targets [75, 80]. What is the MSE?",o:["4.0","17.0","8.5","34.0"],a:1,e:"Errors 3 and −5; squares 9 and 25; sum 34; MSE = 34/2 = 17. The distractor 34 is the sum rather than the mean, and 4.0 comes from averaging the raw errors."},
{t:"m2t8",stage:"concept",q:"What is the role of the ½ in E = ½(t − ŷ)²?",o:["It halves the learning rate","It cancels the 2 produced by differentiating the square","It normalises over two outputs","It prevents overflow"],a:1,e:"Differentiating gives −(t − ŷ) with the 2 cancelling the ½. It is cosmetic and does not move the minimum, but omitting it in a derivation leaves a stray factor of 2."},
{t:"m2t8",stage:"concept",q:"Why should MSE not be used with a sigmoid output?",o:["MSE cannot handle probabilities","The gradient carries σ′, which vanishes exactly when the network is confidently wrong","MSE is only for multi-class problems","It causes exploding gradients"],a:1,e:"At ŷ = 0.99 with t = 0, σ′ = 0.0099 so the MSE gradient is 0.0098 — nearly zero. Cross-entropy gives 0.99 on the same error, a hundredfold difference."},
{t:"m2t9",stage:"solve",q:"A softmax gives [0.775, 0.116, 0.039, 0.070] and the first class is correct. The cross-entropy in bits is:",o:["0.775","0.3677","2.1073","0.2549"],a:1,e:"With a one-hot target the loss collapses to −log₂(0.775) = 0.3677 bits. The distractor 0.2549 is the same quantity in nats, i.e. using natural log."},
{t:"m2t9",stage:"concept",q:"For a one-hot target, categorical cross-entropy simplifies to:",o:["The sum over all classes","−log of the probability of the correct class","The mean of all log probabilities","The largest predicted probability"],a:1,e:"Every term is multiplied by tᵢ, which is 0 for all but the correct class. Only that one term survives, so no other output value enters the loss."},
{t:"m2t9",stage:"concept",q:"What happens to cross-entropy as the probability assigned to the truth approaches 0?",o:["It approaches 1","It approaches 0","It grows without bound","It becomes negative"],a:2,e:"−log(ŷ) → ∞ as ŷ → 0. This unbounded penalty for being confidently wrong is what forces a classifier to hedge, and squared error cannot reproduce it because it is capped."},
{t:"m2t9",stage:"solve",q:"A sigmoid outputs ŷ = 0.8 with target t = 0. What is BCE in nats?",o:["0.2231","1.6094","0.8000","0.2000"],a:1,e:"With t = 0 the first term vanishes: BCE = −ln(1 − 0.8) = −ln(0.2) = 1.6094. The distractor 0.2231 is the answer when t = 1."},
{t:"m2t10",stage:"concept",q:"Backpropagation:",o:["Updates the weights","Computes the gradients and hands them to the optimizer","Chooses the learning rate","Initialises the weights"],a:1,e:"Backpropagation computes ∂E/∂w for every parameter. Applying those gradients is the optimizer's job, and conflating the two loses a mark."},
{t:"m2t10",stage:"concept",q:"In δ⁽ˡ⁾ = (W⁽ˡ⁺¹⁾ᵀδ⁽ˡ⁺¹⁾) ⊙ f′(z⁽ˡ⁾), what does the f′ factor do?",o:["Normalises the gradient","Scales the incoming blame by how responsive that unit was","Prevents division by zero","Applies the learning rate"],a:1,e:"A saturated unit has f′ ≈ 0 and passes almost nothing backwards. This is the vanishing-gradient mechanism seen from inside the algorithm."},
{t:"m2t10",stage:"solve",q:"An output neuron has out = 0.75137, target 0.01, sigmoid, and input out_h1 = 0.59327. What is ∂E/∂w?",o:["0.74137","0.18682","0.13850","0.08217"],a:3,e:"(out − t) × out(1 − out) × out_h1 = 0.74137 × 0.18682 × 0.59327 = 0.08217. The intermediate 0.13850 is δ, which is reused for every weight into that neuron."},
{t:"m2t10",stage:"concept",q:"Why must every operation in the network be differentiable?",o:["To keep the forward pass fast","Because the chain rule multiplies local derivatives, and a missing one breaks the product","To bound the outputs","To allow batch processing"],a:1,e:"With a step activation, f′ = 0 almost everywhere, so every gradient is zero and no weight ever changes. This is why the step function cannot be used with gradient methods."},
{t:"m2t11",stage:"solve",q:"w = 0.80, η = 0.2, ∂E/∂w = 0.50. The updated weight is:",o:["0.90","0.70","0.30","0.80"],a:1,e:"0.80 − 0.2(0.50) = 0.80 − 0.10 = 0.70. With η = 1.0 the same gradient would give 0.30 — the learning rate controls distance only."},
{t:"m2t11",stage:"solve",q:"w = 1.2, gradient = −0.8, η = 0.25. The updated weight is:",o:["1.00","1.40","0.40","−1.40"],a:1,e:"1.2 − 0.25(−0.8) = 1.2 + 0.20 = 1.40. A negative gradient means increasing w reduces the loss, so subtracting a negative correctly raises the weight."},
{t:"m2t11",stage:"concept",q:"A zero gradient in high-dimensional networks most often indicates:",o:["A global minimum","A local maximum","A saddle point","A coding error"],a:2,e:"Saddle points vastly outnumber local minima in high dimensions. Plain gradient descent can crawl on a saddle's plateau for a long time, which is one motivation for momentum."},
{t:"m2t12",stage:"solve",q:"60,000 examples, batch size 128, 10 epochs. Roughly how many weight updates?",o:["10","469","4,690","600,000"],a:2,e:"Updates per epoch = ⌈60000/128⌉ = 469, and 469 × 10 = 4,690. Batch GD would give 10 and SGD 600,000."},
{t:"m2t12",stage:"concept",q:"Which variant is an online algorithm?",o:["Batch GD","SGD","Mini-batch GD","All three"],a:1,e:"SGD updates after every single example, so it needs no complete dataset and can learn from a stream. Mini-batch requires B examples to be available simultaneously."},
{t:"m2t12",stage:"concept",q:"Why is mini-batch the practical default?",o:["It gives the exact gradient","It averages away most noise while using vectorised hardware","It needs the least memory","It never gets stuck in local minima"],a:1,e:"A mini-batch is one matrix operation that a GPU runs in parallel, whereas SGD is inherently sequential. It also keeps a little noise, which helps with saddle points."},
{t:"m2t12",stage:"concept",q:"Why are batch sizes usually powers of 2?",o:["It is mathematically required","GPU memory and compute units are organised in powers of two","It makes N/B an integer","It halves the learning rate"],a:1,e:"Sizes such as 32, 64, 128 and 256 map cleanly onto the hardware with no wasted parallel lanes. The mathematics is identical for any B."},
{t:"m2t13",stage:"select",q:"The loss goes 2.3, 1.8, 4.2, 0.9, 6.7, 15.4. The diagnosis is:",o:["η too small","η far too large — the run has diverged","Normal early training","Overfitting"],a:1,e:"The loss is growing without bound: each overshoot lands somewhere steeper, producing a larger next step. Reduce η by a factor of 10 or more and restart."},
{t:"m2t13",stage:"solve",q:"Step decay with η₀ = 0.1, γ = 0.5, dropping every 10 epochs. What is η at epoch 32?",o:["0.0500","0.0250","0.0125","0.0031"],a:2,e:"⌊32/10⌋ = 3, so η = 0.1 × 0.5³ = 0.0125. The floor makes this a staircase — η is constant within each 10-epoch block."},
{t:"m2t13",stage:"concept",q:"Why is a constant learning rate unsatisfactory?",o:["It cannot be tuned","Large steps are wanted early and fine steps late; one value cannot serve both","It causes dying ReLU","It prevents momentum"],a:1,e:"A value that produces healthy early progress is too large to settle inside a minimum later. That is exactly the dilemma learning rate decay resolves."},
{t:"m2t14",stage:"solve",q:"Momentum with β = 0.9. What is the maximum amplification of a consistent gradient?",o:["1.9×","9×","10×","0.9×"],a:2,e:"The amplification is 1/(1 − β) = 1/0.1 = 10. Directions that keep reversing cancel instead of accumulating, which is what damps the zig-zag in a ravine."},
{t:"m2t14",stage:"solve",q:"w = 1.0, η = 0.1, β = 0.9, v₀ = 0, gradients 0.5 then 0.4. What is w after two steps?",o:["0.910","0.865","0.950","0.855"],a:1,e:"v₁ = 0.05 so w = 0.95; v₂ = 0.9(0.05) + 0.1(0.4) = 0.085 so w = 0.865. Plain GD would reach 0.91 — the distractor."},
{t:"m2t14",stage:"concept",q:"What is the single difference between momentum and NAG?",o:["NAG uses a larger β","NAG evaluates the gradient at the look-ahead point W − βv","NAG has no learning rate","NAG updates the bias separately"],a:1,e:"Momentum evaluates the gradient at the current position; NAG first jumps to where momentum would take it and evaluates there, so it anticipates overshoot rather than discovering it afterwards."},
{t:"m2t14",stage:"concept",q:"Momentum speeds up convergence in a ravine because:",o:["It increases the learning rate","The oscillating across-valley component cancels while the consistent along-valley one accumulates","It reduces the number of parameters","It normalises the gradient"],a:1,e:"The across-valley component reverses sign each step and largely cancels in the running velocity; the along-valley component always has the same sign and builds towards 1/(1−β) times its magnitude."},
{t:"m2t15",stage:"concept",q:"What is AdaGrad's fatal flaw?",o:["It has no learning rate","Its accumulator is a sum of squares, so the effective rate decays to zero","It cannot handle sparse features","It requires two hyperparameters"],a:1,e:"G_t only ever grows, so η/√G_t decreases monotonically towards zero and training eventually halts through arithmetic rather than convergence."},
{t:"m2t15",stage:"concept",q:"RMSProp fixes AdaGrad by replacing the running sum with:",o:["A running maximum","An exponentially weighted moving average","The median gradient","A fixed constant"],a:1,e:"Old gradients decay geometrically instead of contributing forever, so the accumulator stays bounded and can even decrease — letting the effective learning rate recover."},
{t:"m2t15",stage:"concept",q:"Adam's first moment m_t comes from which method?",o:["RMSProp","AdaGrad","Momentum","Weight decay"],a:2,e:"m_t is a moving average of the gradient itself — the mean, which is momentum. The second moment v_t averages the squared gradient, which is RMSProp."},
{t:"m2t15",stage:"concept",q:"Why does Adam need bias correction?",o:["To prevent overflow","m₀ and v₀ start at zero, biasing early estimates towards zero","To keep the learning rate constant","To handle negative gradients"],a:1,e:"Dividing by (1 − βᵗ) compensates for averaging against a zero initial value. As t grows, βᵗ → 0 and the correction quietly fades away."},
{t:"m2t16",stage:"select",q:"Training accuracy 99.9%, validation 61%. The diagnosis is:",o:["Underfitting","Overfitting","Good fit","A data leak"],a:1,e:"High training accuracy with a large gap is the textbook overfitting signature. Remedies: regularization, more data, or stopping earlier."},
{t:"m2t16",stage:"select",q:"Training accuracy 68%, validation 66%. The diagnosis is:",o:["Underfitting","Overfitting","Good fit","Over-regularization only"],a:0,e:"The gap is small, so it is not overfitting — but the model fails on data it has already seen. Low training accuracy means underfitting whatever the gap."},
{t:"m2t16",stage:"concept",q:"Validation accuracy is higher than training accuracy. The most likely explanation is:",o:["Reverse overfitting","Dropout is active during training but disabled at validation","The model has converged","The learning rate is too low"],a:1,e:"Training is measured with a handicapped, thinned network while validation uses the full one. There is no such thing as reverse overfitting."},
{t:"m2t16",stage:"concept",q:"Why does adding data help overfitting but not underfitting?",o:["Underfitting needs a lower learning rate","More data constrains a too-flexible model but cannot expand a too-simple one","More data always helps both","Underfitting is caused by noise"],a:1,e:"Overfitting is a variance problem addressed by more constraints; underfitting is a bias problem where the hypothesis space itself is too small. A linear model never learns XOR however many examples it sees."},
{t:"m2t17",stage:"concept",q:"High bias corresponds to which fitting regime?",o:["Overfitting","Underfitting","Good fit","Neither"],a:1,e:"High bias means excessively rigid assumptions, so the model cannot represent the pattern and fails on training data too. High variance corresponds to overfitting."},
{t:"m2t17",stage:"concept",q:"A model retrained on five different samples gives validation accuracies 71, 88, 65, 90, 68 with training always above 99. This indicates:",o:["High bias","High variance","Good fit","Irreducible noise"],a:1,e:"Wildly different results across retraining is the definition of high variance — sensitivity to minor changes in the training data. The near-perfect training score confirms low bias."},
{t:"m2t17",stage:"concept",q:"Why can bias and variance not both be minimised?",o:["They measure the same thing","Both are controlled by model complexity and respond to it in opposite directions","Variance is irreducible","Bias depends on the learning rate"],a:1,e:"More complexity lowers bias and raises variance; less complexity does the reverse. The goal is the bottom of the U-shaped total error curve, not a minimum of either component."},
{t:"m2t17",stage:"concept",q:"Regularization typically has which effect?",o:["Lowers both training and validation error","Raises training error and lowers validation error","Lowers training error and raises validation error","Raises both"],a:1,e:"It constrains the model, so the best achievable training loss rises. The flexibility given up was mostly fitting noise, so validation error falls — a deliberate bias-for-variance trade."},
{t:"m2t18",stage:"concept",q:"Which regularizer drives weights to exactly zero?",o:["L1","L2","Both equally","Neither"],a:0,e:"L1's gradient is λ·sign(w), a constant pull that does not weaken as the weight shrinks, so small weights are driven right through zero. L2's pull is proportional and vanishes as w does."},
{t:"m2t18",stage:"concept",q:"The gradient of the L2 penalty λΣwᵢ² with respect to wᵢ is:",o:["λ·sign(wᵢ)","2λwᵢ","λ","λwᵢ²"],a:1,e:"Differentiating λw² gives 2λw — proportional to the weight. This proportionality is precisely why L2 shrinks without ever reaching exactly zero."},
{t:"m2t18",stage:"select",q:"You want automatic feature selection. Which do you choose?",o:["L1","L2","Dropout","Batch normalization"],a:0,e:"Only L1 produces exact zeros, and a zeroed weight means the feature can genuinely be dropped from the model. L2 leaves every feature present with a small non-zero weight."},
{t:"m2t18",stage:"solve",q:"λ values 0, 0.001, 0.1 and 10 give train/val of 99/61, 96/89, 88/86 and 52/51. Which λ do you choose?",o:["0","0.001","0.1","10"],a:1,e:"Choose the highest validation accuracy, 89% at λ = 0.001. Choosing 0.1 for its smaller gap is a trap — a small gap achieved by making both numbers worse is not progress."},
{t:"m2t18",stage:"concept",q:"On two nearly identical correlated features, L2 tends to:",o:["Zero one of them","Spread the weight evenly between them","Ignore both","Double both weights"],a:1,e:"Squaring makes concentration expensive: (0.5, 0.5) costs 0.5 while (1.0, 0) costs 1.0. L1 costs the same either way, so it picks one arbitrarily."},
{t:"m2t19",stage:"concept",q:"At test time, dropout is:",o:["Applied with the same p","Applied with p halved","Disabled entirely","Applied only to the output layer"],a:2,e:"Dropout is a training-only mechanism. At inference all units are active, with activations scaled by (1 − p) — or, under inverted dropout, scaled during training so inference needs no change."},
{t:"m2t19",stage:"solve",q:"Inverted dropout with p = 0.5. A surviving activation of 0.8 becomes:",o:["0.4","0.8","1.6","0"],a:2,e:"Surviving activations are divided by (1 − p) = 0.5, i.e. doubled, so 0.8 becomes 1.6. This keeps the expected input to the next layer the same as at test time."},
{t:"m2t19",stage:"concept",q:"Dropout prevents co-adaptation because:",o:["It removes units permanently","No unit can rely on a specific other unit being present","It reduces the learning rate","It normalises the activations"],a:1,e:"Any partner may be absent on any pass, so each unit must learn a feature useful on its own. The dropped set is re-sampled every forward pass, so nothing is removed permanently."},
{t:"m2t20",stage:"concept",q:"Parameter sharing regularizes because it:",o:["Adds a penalty to the loss","Reduces the number of independent parameters","Normalises the weights","Slows down training"],a:1,e:"Forcing many connections to use one weight collapses the free parameter count, directly lowering capacity and variance. This is exactly what a CNN filter does across positions."},
{t:"m2t20",stage:"concept",q:"For plain gradient descent, weight decay and L2 regularization are:",o:["Unrelated","Algebraically identical","Opposites","Only similar for small λ"],a:1,e:"The L2 gradient 2λw is exactly the decay term, so w ← (1 − ηλ)w − η∂E/∂w. They diverge only with adaptive optimizers such as Adam."},
{t:"m2t20",stage:"concept",q:"Under weight decay, a weight with near-zero data gradient will:",o:["Stay constant","Decay geometrically towards zero","Grow without bound","Oscillate"],a:1,e:"Nothing opposes the decay term, so the weight shrinks by a factor of (1 − ηλ) every step. Useful weights are sustained by their data gradient and settle at an equilibrium."},
{t:"m2t21",stage:"concept",q:"Why are γ and β learned in batch normalization?",o:["To speed up the mean calculation","So the network can choose the output distribution rather than having mean 0, variance 1 imposed","To prevent division by zero","To replace the bias term"],a:1,e:"Since y = γx̂ + β has mean β and variance γ², the network can restore any distribution — including the original. Batch norm makes the distribution learned rather than accidental."},
{t:"m2t21",stage:"solve",q:"A batch gives activations [2, 4, 6, 8]. What are the batch mean and variance?",o:["μ = 5, σ² = 5","μ = 5, σ² = 20","μ = 4, σ² = 5","μ = 5, σ² = 2.24"],a:0,e:"μ = 20/4 = 5; σ² = (9 + 1 + 1 + 9)/4 = 5. The distractor 20 is the sum of squared deviations before dividing, and 2.24 is the standard deviation."},
{t:"m2t21",stage:"concept",q:"At inference, batch normalization uses:",o:["The current batch's statistics","Running averages accumulated during training","γ and β only","No normalisation"],a:1,e:"A single-example batch has zero variance, and a prediction should not depend on which other examples accompany it. Running averages make inference deterministic."},
{t:"m2t22",stage:"concept",q:"Early stopping monitors which curve?",o:["Training loss","Validation loss","Test loss","The gradient norm"],a:1,e:"Training loss falls monotonically and never signals overfitting. Only data the model has not been fitted to reveals the divergence — and using the test set would leak it."},
{t:"m2t22",stage:"solve",q:"Validation losses: 0.68, 0.51, 0.42, 0.38, 0.36, 0.37, 0.39. Which epoch's weights should be restored?",o:["Epoch 4","Epoch 5","Epoch 7","The final epoch"],a:1,e:"Epoch 5 gives the minimum validation loss of 0.36. When training stops you are holding weights from a non-improving epoch, so restoring the saved best is essential."},
{t:"m2t22",stage:"concept",q:"Early stopping is regularization because it constrains capacity through:",o:["Weight magnitude","Unit availability","Time","The number of features"],a:2,e:"Weights start near initialisation and travel further each epoch, so limiting epochs limits how much of the hypothesis space is explored. It is the cheapest method — it saves computation rather than adding any."},
{t:"m2t23",stage:"select",q:"Which augmentation would be invalid for handwritten digit recognition?",o:["Small rotation of ±10°","Small translation","Horizontal flip","Slight brightness change"],a:2,e:"A mirrored 6 resembles a 9 but keeps the label 6, teaching the model something false. Label preservation is the constraint on every augmentation."},
{t:"m2t23",stage:"concept",q:"Label smoothing changes a target of 1.0 to about 0.9 in order to:",o:["Speed up training","Stop the model becoming absolutely certain","Reduce the number of classes","Balance the dataset"],a:1,e:"It prevents the confident, unbounded-loss errors that cross-entropy punishes so heavily, and improves calibration. It is a form of noise added to the output."},
{t:"m2t23",stage:"concept",q:"Augmentation differs in kind from L2 and dropout because it:",o:["Is only for images","Modifies the data rather than constraining the model","Requires no hyperparameters","Cannot be combined with them"],a:1,e:"Model-side methods reduce capacity; augmentation increases the effective amount and variety of data. They act on opposite sides of the same ratio, so they combine rather than overlap."},
/* ---- Module 3 ---- */
{t:"m3t1",stage:"concept",q:"Which property of images justifies reusing the same filter everywhere?",o:["High dimensionality","Meaning is independent of position","Pixels are integers","Images are square"],a:1,e:"A cat in the top-left is the same cat as one in the bottom-right, so a detector useful at one location is useful at every location. That is the prior weight sharing encodes."},
{t:"m3t1",stage:"solve",q:"A 224×224 RGB image feeds a fully connected layer of 1000 units. Roughly how many weights?",o:["150 thousand","1.5 million","150 million","15 billion"],a:2,e:"224 × 224 × 3 = 150,528 inputs, times 1000 units ≈ 150.5 million. A convolution layer of 64 filters of 3×3 needs 1,792 — about 84,000 times fewer."},
{t:"m3t1",stage:"concept",q:"What is significant about a CNN's feature hierarchy?",o:["It is hand-designed by the architect","It is learned from data rather than designed","It requires exactly five layers","It only works for digits"],a:1,e:"Nobody programs an edge detector; the filters converge to edge detectors because that minimises the loss. Before deep learning these were hand-engineered over decades."},
{t:"m3t2",stage:"solve",q:"Convolving [2, 4, 6, 8] with the filter [1, −1] gives:",o:["[2, 2, 2]","[−2, −2, −2]","[6, 10, 14]","[−2, −2]"],a:1,e:"Each position computes a − b for consecutive pairs: 2−4, 4−6, 6−8, all equal to −2. The output length is n − f + 1 = 3."},
{t:"m3t2",stage:"solve",q:"The sharpen filter [[−1,−1,−1],[−1,8,−1],[−1,−1,−1]] applied to [[21,19,17],[71,76,73],[153,164,164]] gives:",o:["+74","−74","608","682"],a:1,e:"8 × 76 − (sum of the eight neighbours) = 608 − 682 = −74. The negative result means this pixel is darker than its surroundings, which is meaningful information."},
{t:"m3t2",stage:"concept",q:"Why do edge-detection filters have weights summing to zero?",o:["To keep the output small","So they give zero response on a uniform patch and detect only change","To make them differentiable","To normalise the image"],a:1,e:"On a patch where every pixel equals c, the output is c × Σwᵢ = 0 regardless of c. The filter therefore reports deviation from the local average, which is what an edge is."},
{t:"m3t3",stage:"solve",q:"How many weights does a 3×3 filter applied to an RGB image have?",o:["9","12","27","3"],a:2,e:"The filter's depth must match the input's, so it is 3 × 3 × 3 = 27 weights, plus one bias. Forgetting the channel dimension is the most common parameter-counting error."},
{t:"m3t3",stage:"concept",q:"A conv layer has 64 filters. Its output depth is:",o:["1","3","64","Depends on the input depth"],a:2,e:"Each filter spans all input channels and produces a single number per position, so one filter gives one output channel. The filter count sets the output depth."},
{t:"m3t3",stage:"solve",q:"Conv1 outputs 30×30×16. Each Conv2 filter of size 3×3 must have depth:",o:["3","16","30","32"],a:1,e:"Filter depth always matches the depth of whatever is immediately upstream, which here is Conv1's 16 output channels — not the original image's 3."},
{t:"m3t4",stage:"solve",q:"What padding keeps the output size unchanged for a 5×5 filter at stride 1?",o:["1","2","3","5"],a:1,e:"P = (F − 1)/2 = (5 − 1)/2 = 2. This requires an odd filter size, which is one reason filters are almost always odd."},
{t:"m3t4",stage:"concept",q:"Which is the stronger practical argument for padding?",o:["Edge pixels are under-used","Without it, a 32×32 image is exhausted after 16 layers","It adds information","It reduces the parameter count"],a:1,e:"Modern networks are 50 to 100 layers deep, which is arithmetically impossible without padding. Padding adds zeros, which carry no information — it preserves geometry."},
{t:"m3t4",stage:"solve",q:"A 28×28 input with a 3×3 filter, p = 0, s = 1 gives an output of:",o:["28×28","27×27","26×26","25×25"],a:2,e:"(28 − 3 + 0)/1 + 1 = 26. Each 3×3 convolution without padding removes exactly F − 1 = 2 from each dimension."},
{t:"m3t5",stage:"solve",q:"A 28×28 input, 3×3 filter, no padding, stride 2. The output is:",o:["14×14","13×13","12×12","26×26"],a:1,e:"⌊(28 − 3)/2⌋ + 1 = ⌊12.5⌋ + 1 = 13. Without the floor the formula would give 13.5, which is not a valid size."},
{t:"m3t5",stage:"solve",q:"A 5×9 input with a 3×3 filter, stride 3 horizontally and 2 vertically, no padding, gives:",o:["2×3","3×2","2×2","3×3"],a:0,e:"Vertically ⌊(5−3)/2⌋ + 1 = 2 rows; horizontally ⌊(9−3)/3⌋ + 1 = 3 columns. Always compute the two axes separately."},
{t:"m3t5",stage:"concept",q:"Downsampling lets a network increase channel count because:",o:["Fewer channels are needed later","Halving each dimension quarters the positions, freeing computation","Pooling adds parameters","Filters become smaller"],a:1,e:"You can quadruple the channels at the same cost. This is why AlexNet goes 96 → 256 → 384 filters as its maps shrink 55 → 27 → 13."},
{t:"m3t6",stage:"solve",q:"Input 28, filter 3, padding 1, stride 1. The output is:",o:["26","27","28","29"],a:2,e:"⌊(28 − 3 + 2)/1⌋ + 1 = 27 + 1 = 28. The distractor 27 comes from omitting the +1, which is the most common error on this formula."},
{t:"m3t6",stage:"solve",q:"Input 224, filter 11, padding 0, stride 4. The output is:",o:["53","54","55","56"],a:1,e:"⌊(224 − 11)/4⌋ + 1 = ⌊53.25⌋ + 1 = 54. Note AlexNet uses 227, not 224, precisely so this comes out to a clean 55."},
{t:"m3t6",stage:"concept",q:"A 1×1 convolution changes:",o:["The spatial size only","The depth only","Both size and depth","Neither"],a:1,e:"⌊(N − 1)/1⌋ + 1 = N, so the spatial size is untouched. With K filters the output depth becomes K, which is used for cheap dimensionality reduction."},
{t:"m3t7",stage:"solve",q:"Filters = 1, kernel (3,3), input (10,10,1). How many parameters?",o:["9","10","81","90"],a:1,e:"(3 × 3 × 1 + 1) × 1 = 10 — nine weights plus one bias. This is the exercise the deck sets on slide 33 and never answers."},
{t:"m3t7",stage:"solve",q:"Same layer: filters = 1, kernel (3,3), input (10,10,1). What is the output shape?",o:["(10,10,1)","(8,8,1)","(8,8,3)","(9,9,1)"],a:1,e:"No padding or stride is stated, so P = 0 and S = 1: ⌊(10 − 3)/1⌋ + 1 = 8. Depth is 1 because there is one filter."},
{t:"m3t7",stage:"solve",q:"128 filters of 5×5 on an input of depth 64. How many parameters?",o:["3,200","204,800","204,928","409,600"],a:2,e:"(5 × 5 × 64 + 1) × 128 = 1,601 × 128 = 204,928. The distractor 204,800 omits the bias."},
{t:"m3t7",stage:"concept",q:"A pooling layer has how many learnable parameters?",o:["One per window","One per channel","Zero","The same as the preceding conv layer"],a:2,e:"Max and average are fixed operations with nothing to learn. This is why pooling gives its benefits for free."},
{t:"m3t7",stage:"concept",q:"Why is a conv layer's parameter count independent of image size?",o:["Images are resized first","The same weights are reused at every position","Only the first layer sees the image","Padding removes the dependence"],a:1,e:"A 3×3 filter has 9 weights whether the image is 10×10 or 10,000×10,000. Computation scales with image size; the parameter count does not."},
{t:"m3t8",stage:"concept",q:"Which step is easiest to omit from the CNN pipeline?",o:["Convolution","ReLU","Pooling","Flatten"],a:1,e:"The deck lists ReLU as a distinct step producing the rectified feature map. It is where the convolutional stack gets its non-linearity, and omitting it loses a mark."},
{t:"m3t8",stage:"concept",q:"A CNN splits into two halves. Which is reusable across tasks?",o:["The classification half","The feature extraction half","Neither","Both equally"],a:1,e:"Edge and texture detectors are generic; only the classifier is specific to the class set. This is exactly what makes transfer learning possible."},
{t:"m3t9",stage:"concept",q:"Applying ReLU to a 3×3 feature map produces a map of size:",o:["2×2","3×3","1×1","It depends on the values"],a:1,e:"ReLU is element-wise, so it changes values but never dimensions. Only pooling and stride change the spatial size."},
{t:"m3t9",stage:"concept",q:"Why does a convolution layer contain several filters rather than one?",o:["For redundancy","One filter detects exactly one pattern","To increase the spatial size","To reduce parameters"],a:1,e:"A filter is a fixed set of weights responding to one specific arrangement. Recognising anything real needs edges, corners, textures and colour transitions simultaneously."},
{t:"m3t10",stage:"solve",q:"2×2 max pooling at stride 2 on [[32,10,11,17],[4,14,9,19],[20,4,16,27],[8,12,7,14]] gives:",o:["[[32,19],[20,27]]","[[15,14],[11,16]]","[[32,17],[20,27]]","[[14,19],[12,27]]"],a:0,e:"Each 2×2 block's maximum: {32,10,4,14}→32, {11,17,9,19}→19, {20,4,8,12}→20, {16,27,7,14}→27. The second option is the average-pooled result."},
{t:"m3t10",stage:"solve",q:"Average pooling the top-left block {32, 10, 4, 14} gives:",o:["32","15","14","60"],a:1,e:"(32 + 10 + 4 + 14)/4 = 60/4 = 15. Note how averaging dilutes the strong detection of 32 to less than half — which is why max pooling is preferred."},
{t:"m3t10",stage:"concept",q:"Pooling changes the depth of a feature map how?",o:["Halves it","Doubles it","Leaves it unchanged","Sets it to 1"],a:2,e:"Each channel is pooled independently, so only the spatial dimensions shrink. A conv layer sets depth to its filter count; pooling never touches it."},
{t:"m3t10",stage:"concept",q:"Pooling provides spatial invariance that is:",o:["Global — any shift is tolerated","Local — only shifts within a window","Only vertical","Only for max pooling of size 3"],a:1,e:"A shift within a window leaves the max unchanged; a shift across a boundary does not. Robustness to larger shifts is built up by stacking pooling layers."},
{t:"m3t11",stage:"solve",q:"A 6×6×256 pooled map flattens to a vector of length:",o:["256","1,536","9,216","36"],a:2,e:"6 × 6 × 256 = 9,216 — the figure that appears in AlexNet before its first fully connected layer. Omitting the channel dimension gives the distractor 36."},
{t:"m3t11",stage:"concept",q:"Why do fully connected layers hold most of a CNN's parameters?",o:["They have more layers","They share no weights — every input has its own weight to every output","They use larger filters","They process the image twice"],a:1,e:"Convolution reuses a small filter everywhere; a dense layer connects 25,088 inputs to 4,096 units with over 102 million individual weights."},
{t:"m3t11",stage:"concept",q:"Global average pooling replaces flatten-then-dense mainly to:",o:["Increase accuracy","Cut the parameter count and remove the fixed input size requirement","Add non-linearity","Speed up convolution"],a:1,e:"It collapses each channel to one number, turning 7×7×512 into 512 rather than 25,088. Averaging works on any spatial size, so the input need not be fixed."},
{t:"m3t12",stage:"concept",q:"In a CNN, weight sharing occurs across:",o:["Different filters in a layer","Different spatial positions","Different channels","Different training examples"],a:1,e:"Each filter has its own weights; sharing means one filter's weights are reused at every position. Sharing across filters would make them all identical."},
{t:"m3t12",stage:"concept",q:"A shared weight's gradient is computed as:",o:["The gradient at the first position","The average over positions","The sum of the gradients from all positions","The maximum gradient"],a:2,e:"When a variable appears in several places, the chain rule sums the partial derivatives through each path. This is why shared weights learn from the whole image at once."},
{t:"m3t12",stage:"select",q:"For which data type would weight sharing be inappropriate?",o:["Grayscale images","Audio waveforms","Tabular data with named columns","Video frames"],a:2,e:"In a table, column 1 is not interchangeable with column 3 — position carries meaning. Sharing would assert that a pattern in age means the same in income, which is false."},
{t:"m3t13",stage:"concept",q:"'Structure agnostic' describes a fully connected network because it:",o:["Has no hidden layers","Makes no assumptions about how inputs relate","Cannot be trained on images","Uses no activation functions"],a:1,e:"It sees a flat list of numbers and would handle any permutation identically. For images, where the structure is known and informative, that is a weakness."},
{t:"m3t13",stage:"concept",q:"Flattening an image before a dense layer destroys:",o:["Colour information","The fact that neighbouring pixels are adjacent","The bias terms","The class labels"],a:1,e:"Pixels 1 and 2 were neighbours; pixel 400 was not. In the flat vector they are just unrelated slots, so the network must rediscover adjacency from data."},
{t:"m3t14",stage:"concept",q:"Full convolution produces an output of size:",o:["n − f + 1","n","n + f − 1","n / f"],a:2,e:"Enough padding is applied that the filter may overhang the input entirely, so every overlap of at least one element is computed and the output grows."},
{t:"m3t14",stage:"concept",q:"Unshared convolution differs from a fully connected layer in that it:",o:["Has fewer layers","Is still local — each output sees only a patch","Uses the same weights everywhere","Has no bias terms"],a:1,e:"Unshared has convolutional connectivity without weight reuse, so it sits between convolution and fully connected. Confusing the two is the standard error on this topic."},
{t:"m3t14",stage:"concept",q:"Tiled convolution works by:",o:["Using one filter everywhere","Cycling through a small set of filters that repeats","Using a different filter at every position","Tiling the image into non-overlapping blocks"],a:1,e:"Neighbouring positions use different filters, but the set repeats every t positions, so parameters scale with t rather than with the position count."},
{t:"m3t15",stage:"solve",q:"LeNet's C1 takes a 32×32 input with 5×5 filters and no padding. Its output is:",o:["32×32","30×30","28×28","27×27"],a:2,e:"(32 − 5 + 0)/1 + 1 = 28. Each 5×5 convolution without padding removes exactly 4 from each dimension."},
{t:"m3t15",stage:"solve",q:"LeNet's spatial chain is:",o:["32→28→14→10→5→1","32→30→15→11→5→1","32→28→24→12→6→1","32→16→8→4→2→1"],a:0,e:"Alternating 5×5 convolutions (−4 each) and 2×2 subsampling at stride 2 (halving). C5 takes a 5×5 filter on a 5×5 input, giving exactly one position."},
{t:"m3t15",stage:"concept",q:"LeNet's original activation function was:",o:["ReLU","tanh","Softmax","Leaky ReLU"],a:1,e:"tanh was standard before ReLU. Switching to ReLU was one of AlexNet's key innovations, and it is what made much greater depth trainable."},
{t:"m3t16",stage:"solve",q:"AlexNet's Conv1: 227×227 input, 11×11 filters, stride 4, no padding. Output size:",o:["54","55","56","57"],a:1,e:"⌊(227 − 11)/4⌋ + 1 = 54 + 1 = 55. With 224 the arithmetic gives 54.25, which is a useful check that you have the right input size."},
{t:"m3t16",stage:"solve",q:"AlexNet's final pooled map is 6×6×256. The flattened length is:",o:["1,536","6,144","9,216","65,536"],a:2,e:"6 × 6 × 256 = 9,216, which feeds the first 4,096-unit fully connected layer."},
{t:"m3t16",stage:"concept",q:"Why do AlexNet's Conv2 to Conv5 use padding?",o:["To increase the output size","To preserve the spatial size so only pooling downsamples","To reduce the parameter count","To allow larger filters"],a:1,e:"Their job is to increase depth and abstraction, not to downsample. That is left to the three pooling layers, which is why 13 appears four times in the chain."},
{t:"m3t16",stage:"concept",q:"Which AlexNet innovation made its depth trainable?",o:["Overlapping pooling","Dropout","ReLU replacing tanh","Data augmentation"],a:2,e:"tanh saturates, so gradients vanish across eight layers. ReLU's derivative is exactly 1 for positive inputs, letting gradients survive any depth. The others are refinements."},
{t:"m3t17",stage:"concept",q:"The deck describes LeNet and AlexNet as:",o:["Competing architectures","Two milestones in the evolution of the same pipeline","Unrelated approaches","Identical apart from input size"],a:1,e:"Both follow CONV → activation → POOL, repeated, then flatten and dense. What changed between them was scale, depth, activation and data — not the kind of architecture."},
{t:"m3t17",stage:"concept",q:"How many output classes do LeNet and AlexNet have respectively?",o:["10 and 100","10 and 1000","26 and 1000","100 and 1000"],a:1,e:"LeNet classifies 10 handwritten digits; AlexNet classifies 1000 ImageNet categories. The scale difference is the point of the comparison."}
];

QUIZ = QUIZ.concat([
{t:"m1t7",stage:"recognise",q:"A question says 'find suitable weights and bias so that the network reproduces the following truth table'. What is being tested?",o:["Perceptron learning rule","Realising a Boolean function with a perceptron","Linear separability of real data","The delta rule"],a:1,e:"Weights are asked for rather than given, and the target is a truth table. Turn each row into an inequality on z, solve by inspection, then verify every row."},
{t:"m1t8",stage:"recognise",q:"A question gives eight labelled points with two features and asks whether one perceptron suffices. This is really a question about:",o:["Learning rate selection","Linear separability","Activation choice","Batch size"],a:1,e:"'Can a single perceptron classify this' and 'is this data linearly separable' are the same question. Plot, test each feature alone, then produce a line and verify."},
{t:"m2t7",stage:"recognise",q:"A problem description mentions that a recording may be tagged with 'any of eight topics'. The phrase 'any of' signals:",o:["Multi-class, use softmax","Multi-label, use independent sigmoids","Regression, use linear","Binary, use one sigmoid"],a:1,e:"'Any of' permits several labels simultaneously. Softmax would force the eight probabilities to sum to 1, so detecting one topic strongly would suppress the others."},
{t:"m2t13",stage:"recognise",q:"A loss curve falls from 2.30 to 2.28 over 50 epochs. Which hyperparameter is the problem?",o:["Batch size","Learning rate — too small","Dropout rate","Number of layers"],a:1,e:"The direction is right so the gradient is fine, but the magnitude is negligible. The step size is far too small; increase η, perhaps tenfold."},
{t:"m2t15",stage:"recognise",q:"An update rule contains a running sum of squared gradients in its denominator. Which optimizer is it?",o:["Momentum","AdaGrad","RMSProp","Adam"],a:1,e:"A running sum identifies AdaGrad, and naming it lets you state its flaw immediately — the sum only grows, so the effective learning rate decays to zero."},
{t:"m2t18",stage:"recognise",q:"A loss function contains the term λΣ|wᵢ|. What should your answer mention first?",o:["That the gradient is 2λw","That the gradient is a constant λ·sign(w), producing exact zeros","That λ is learned","That it is used for regression only"],a:1,e:"The absolute value identifies L1. Its constant gradient does not weaken as the weight shrinks, so small weights are driven to exactly zero — sparsity and feature selection."},
{t:"m3t6",stage:"recognise",q:"A question supplies an input size, a filter size, a padding and a stride, and asks for 'the feature map size'. The first thing to write is:",o:["The parameter formula","⌊(N − F + 2P)/S⌋ + 1","The number of filters","The activation function"],a:1,e:"Every CNN size question is the master formula applied once or chained. List N, F, P and S explicitly before substituting — that catches missing information."},
{t:"m3t7",stage:"recognise",q:"A question gives a filter count, a kernel size and an input shape, then asks for 'trainable parameters'. Which quantity is most often forgotten?",o:["The number of filters","The kernel width","The input depth C_in","The stride"],a:2,e:"C_in comes from the third entry of the input shape. A 3×3 filter on RGB has 27 weights, not 9, and the bias adds one more per filter."},
{t:"m3t15",stage:"recognise",q:"An architecture question mentions a 32×32 grayscale input, 5×5 filters and 10 outputs. Which architecture is it?",o:["AlexNet","LeNet","VGG","A generic CNN"],a:1,e:"Small grayscale input, 5×5 filters throughout and 10 digit classes identify LeNet. Write the chain 32→28→14→10→5→1 first, and remember there is no padding."},
{t:"m3t16",stage:"recognise",q:"An architecture question mentions 11×11 filters with stride 4 and 1000 output classes. Which architecture is it?",o:["LeNet","AlexNet","A convolutional autoencoder","An MLP"],a:1,e:"The aggressive 11×11 stride-4 first layer and 1000 ImageNet classes identify AlexNet. The input must be 227, since (224 − 11)/4 + 1 is not an integer."}
]);
