var M3=[
{id:"m3t1",m:"m3",title:"Why CNNs? Images as Input and the Feature Hierarchy",type:"theory",priority:"medium",los:["3.2"],
 src:"Module 3 deck, slides 2–4, 21, 65–72",
 summary:"Why image data needs a different architecture, and the layer-by-layer feature progression.",
 whatIs:"<p>The deck opens by stating that images make up a special class of input data. A computer sees an image as a grid of numbers, and the structure of that grid — that nearby pixels are related and distant ones usually are not — is exactly what a CNN is built to exploit.</p>",
 concept:"<h4>What makes image data special</h4><ul>"+
  "<li><b>Grid structure with local correlation.</b> Adjacent pixels are strongly related; pixels at opposite corners usually are not. A meaningful feature such as an edge is a <i>local</i> pattern.</li>"+
  "<li><b>Translation of meaning.</b> A cat in the top-left is the same cat as one in the bottom-right. The label does not depend on position.</li>"+
  "<li><b>Very high dimensionality.</b> A modest 224×224 colour image has 224 × 224 × 3 = 150,528 numbers. A fully connected first layer of 1000 units would need over 150 million weights.</li></ul>"+
  "<h4>The hierarchy — the deck's central claim</h4>"+
  "<p>The deck states the principle directly: <b>simple features are learned first; complex features are constructed from them.</b> Each layer concentrates on patterns of increasing complexity.</p>"+
  "<div class='scroll'><table><tr><th>Stage</th><th>What is detected</th><th>The deck's digit-recognition example</th></tr>"+
  "<tr><td>Pixels</td><td>Raw grid of values</td><td>The system does not yet know it is a 7</td></tr>"+
  "<tr><td>Early conv layers</td><td>Edges — horizontal, vertical, diagonal, corners</td><td>'I found some strokes'</td></tr>"+
  "<tr><td>Middle layers</td><td>Curves, shapes, textures</td><td>'These strokes look like part of a digit'</td></tr>"+
  "<tr><td>Deeper layers</td><td>Object parts, then whole objects</td><td>The complete digit form</td></tr>"+
  "<tr><td>Fully connected</td><td>Combination and classification</td><td>'Identified: 7'</td></tr></table></div>"+
  "<p>The deck's biological framing is that the eye and the visual brain are extremely complex and hierarchical, and that computers can see the world in the same layered way, but through numbers.</p>"+
  "<div class='box tip'><h5>The Fly's Eye idea</h5><p>The deck illustrates local receptive fields with a fly's compound eye: instead of one detector examining the whole scene, many small detectors each examine a small patch, and the results are combined. That is precisely how a convolution layer works.</p></div>",
 needToKnow:["Give three properties of image data that motivate a specialised architecture","State the hierarchy principle and give the four-stage progression","Compute the parameter cost of a fully connected layer on an image to show why it fails","Explain that the label does not depend on position, and why that matters"],
 recognition:{clues:["'Why CNN', 'why not a fully connected network for images'","'Feature hierarchy', 'edges to objects'","A question about the receptive field or local patterns"],
  wording:["Why are convolutional neural networks used for image data?","Explain the hierarchy of features learned by a CNN.","What makes image data a special class of input?"],
  firstMove:"Compute the parameter count of a fully connected layer on a realistic image. One large number makes the argument better than a paragraph.",
  trap:"Answering only 'CNNs are better for images' without saying which property of images they exploit."},
 examAnswer:[
  {marks:5,body:"<p>Three properties of image data; the parameter-count calculation showing a fully connected layer is infeasible; the four-stage feature hierarchy.</p>"},
  {marks:10,body:"<p>All of the above plus the local-correlation argument developed properly, the translation-of-meaning point linked to weight sharing, and the digit-recognition progression as a concrete illustration.</p>"}],
 mistakes:["Saying CNNs are faster without saying why — the reason is shared weights and local connections, not implementation","Claiming CNNs work only on images; they work on any grid-structured data","Describing the hierarchy without saying it is learned rather than designed","Omitting the dimensionality argument, which is the most concrete part"],
 examples:[{id:"m3t1e1",title:"Why a fully connected layer fails on images",q:"A 224×224 RGB image feeds a fully connected layer of 1000 units. Count the parameters, then compare with a convolution layer of 64 filters of size 3×3.",
  steps:["Input size = 224 × 224 × 3 = 150,528 values.","Fully connected: every input connects to every unit. 150,528 × 1000 = 150,528,000 weights, plus 1000 biases ≈ <b>150.5 million</b> parameters.","Convolution: each filter is 3 × 3 × 3 (height × width × input channels) = 27 weights, plus 1 bias = 28.","With 64 filters: 64 × 28 = <b>1,792</b> parameters.","Ratio: 150,529,000 / 1,792 ≈ 84,000."],
  answer:"A fully connected layer needs about <b>150 million</b> parameters; a convolution layer with 64 filters needs <b>1,792</b> — roughly 84,000 times fewer.",
  trap:"The problem is not only storage. With 150 million free parameters and a training set of, say, 50,000 images, the layer has thousands of times more parameters than examples and will memorise the training set completely. The convolution layer's tiny count is simultaneously a computational saving and a powerful regulariser — the parameter-sharing argument from Module 2 appearing again."}],
 practice:[
  {id:"m3t1p1",d:"easy",q:"Give three properties of image data that motivate the CNN architecture.",hint:"Structure, position, size.",a:"<p><b>1 — Grid structure with local correlation.</b> Adjacent pixels are strongly related while distant ones usually are not, so meaningful features such as edges and corners are local patterns. An architecture that examines small neighbourhoods matches this structure.</p><p><b>2 — Meaning is independent of position.</b> A cat in the top-left corner is the same cat as one in the bottom-right. A detector useful at one location is useful at every location, which justifies reusing the same weights everywhere.</p><p><b>3 — Very high dimensionality.</b> A 224×224 colour image is 150,528 numbers. A fully connected layer over that input needs hundreds of millions of weights, which is both computationally prohibitive and far more capacity than any realistic dataset can constrain.</p>"},
  {id:"m3t1p2",d:"moderate",q:"Describe the feature hierarchy a CNN learns and state what is significant about it.",hint:"Four stages, and one thing nobody had to do.",a:"<p><b>The progression:</b> raw pixels → edges (horizontal, vertical, diagonal, corners) in the early convolution layers → curves, shapes and textures in the middle layers → object parts and then whole objects in the deeper layers → combination and classification in the fully connected layers.</p><p>The deck's digit example traces it as: the system sees a grid of values and does not know it is a 7; C1 detects basic strokes; C3 combines strokes into curves and shapes; C5 and the fully connected layer combine everything to identify the digit.</p><p><b>What is significant:</b> this hierarchy is <b>learned, not designed</b>. Nobody programmed an edge detector — the filters converge to edge detectors because that is what minimises the loss. Before deep learning, edge and texture detectors were hand-engineered by researchers over decades; the CNN discovers them from data. That is the concrete form that Module 1's 'automatic feature learning' claim takes, and it is the reason the deck insists you should not merely memorise the architecture diagram but understand what each stage is learning.</p>"}],
 questions:[
  {q:"Why are convolutional neural networks preferred over fully connected networks for image data?",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Explain the hierarchy of features learned by a CNN with a suitable example.",marks:5,d:"easy",priority:"high",source:"source"}]},

{id:"m3t2",m:"m3",title:"The Convolution Operation",type:"problem-solving",priority:"high",los:["3.1"],
 src:"Module 3 deck, slides 15–20",
 summary:"Element-wise multiply and sum, slid across the input — the calculation LO 3.1 names first.",
 whatIs:"<p>A step of convolution takes two lists — the deck calls them inputs and weights — multiplies corresponding values pairwise, and adds the products. The deck notes this is exactly what an artificial neuron does, ignoring the activation function.</p>",
 concept:"<h4>1-D convolution</h4>"+
  "<p>Input [1, 2, 3, 4, 5] with filter [1, 0, −1]. Place the filter over the first three inputs, multiply pairwise, sum, then slide one position and repeat.</p>"+
  "<div class='eqb'>Position 1: (1)(1) + (2)(0) + (3)(−1) = 1 + 0 − 3 = −2\nPosition 2: (2)(1) + (3)(0) + (4)(−1) = 2 + 0 − 4 = −2\nPosition 3: (3)(1) + (4)(0) + (5)(−1) = 3 + 0 − 5 = −2\nOutput: [−2, −2, −2]</div>"+
  "<h4>2-D convolution</h4>"+
  "<p>The deck's description: the neuron receives inputs from a 3×3 square around the pixel. The set of all 9 pixels is called the <b>local receptive field</b>. Each is multiplied by a corresponding weight, and the products are summed. The <b>anchor</b> sits at the centre of the filter, the <b>focus pixel</b> is where the anchor currently is, and the output goes into the output image at the same location as the focus pixel.</p>"+
  "<div class='eqb'>output(i,j) = Σ_m Σ_n  input(i+m, j+n) × filter(m,n)</div>"+
  "<h4>What different filters do</h4><div class='scroll'><table>"+
  "<tr><th>Filter</th><th>Values</th><th>Detects</th></tr>"+
  "<tr><td>Horizontal edge</td><td>[[−1,−1,−1],[2,2,2],[−1,−1,−1]]</td><td>Horizontal lines (the deck's handwritten example)</td></tr>"+
  "<tr><td>Vertical edge</td><td>[[−1,2,−1],[−1,2,−1],[−1,2,−1]]</td><td>Vertical lines</td></tr>"+
  "<tr><td>Sharpen</td><td>[[−1,−1,−1],[−1,8,−1],[−1,−1,−1]]</td><td>Amplifies differences from neighbours</td></tr>"+
  "<tr><td>Blur / average</td><td>All entries 1/9</td><td>Smooths</td></tr></table></div>"+
  "<p>Notice that edge and sharpen filters have weights summing to zero (or near it). Applied to a flat region where every pixel is identical, the response is zero — they respond only to <b>change</b>, which is what an edge is.</p>"+
  "<div class='box tip'><h5>In a real CNN the filters are learned</h5><p>These hand-designed kernels illustrate the operation, but a CNN does not use them. It initialises filters randomly and learns their values by backpropagation. They typically converge to edge detectors anyway — which is the point the feature-hierarchy topic makes.</p></div>",
 needToKnow:["Perform 1-D convolution and state the output length","Perform 2-D convolution for a given patch and filter","Define local receptive field, anchor and focus pixel","Explain why edge filters sum to zero","State that filters are learned, not designed"],
 recognition:{clues:["A small input matrix and a small filter matrix are both given","'Compute the convolution', 'apply the filter'","'Feature map', 'kernel'","Words like sharpen, blur, edge"],
  wording:["Compute the convolution of the given input with the given filter.","Explain the convolution operation in 1-D and 2-D.","What is a local receptive field?"],
  firstMove:"Write out the nine products explicitly before summing. Doing the arithmetic in your head is the main source of lost marks on this topic.",
  trap:"Misaligning the filter with the patch. Line up filter position (0,0) with the top-left of the patch and work across each row in order."},
 examAnswer:[
  {marks:5,body:"<p>The operation stated, one worked position with all products shown, and the output. Define receptive field.</p>"},
  {marks:10,body:"<p>All of the above plus 1-D and 2-D both worked; the receptive field, anchor and focus pixel named on a diagram; a table of filters and what they detect; and the observation that edge filters sum to zero.</p>"}],
 mistakes:["Misaligning the filter and the patch","Sign errors with negative filter weights","Forgetting that the filter slides across every valid position, giving a whole output map rather than one number","Confusing convolution with matrix multiplication","Assuming filters are hand-chosen in a trained CNN"],
 examples:[
  {id:"m3t2e1",title:"The deck's sharpen-filter computation",q:"Apply the sharpen filter [[−1,−1,−1],[−1,8,−1],[−1,−1,−1]] to the patch [[21,19,17],[71,76,73],[153,164,164]].",
   steps:["Multiply each pair. Row 1: 21(−1) + 19(−1) + 17(−1) = −21 − 19 − 17 = −57","Row 2: 71(−1) + 76(8) + 73(−1) = −71 + 608 − 73 = 464","Row 3: 153(−1) + 164(−1) + 164(−1) = −153 − 164 − 164 = −481","Sum: −57 + 464 − 481 = −74","Cross-check the shortcut: 8 × centre − (sum of the eight neighbours) = 8(76) − 682 = 608 − 682 = −74 ✓"],
   answer:"Output = <b>−74</b>. Independently recomputed and matching the deck exactly.",
   trap:"The result is negative because the centre pixel (76) is much darker than the neighbours below it (153, 164, 164). Sharpen filters produce signed output, and a negative value is meaningful — it says this pixel is darker than its surroundings. This is exactly why a ReLU follows the convolution: it discards the negative responses, keeping only evidence that the feature is present."},
  {id:"m3t2e2",title:"A horizontal edge filter finding an edge",q:"Apply the horizontal edge filter [[−1,−1,−1],[2,2,2],[−1,−1,−1]] to two patches: (a) a flat region [[10,10,10],[10,10,10],[10,10,10]]; (b) a horizontal edge [[0,0,0],[10,10,10],[10,10,10]].",
   steps:["<b>(a) Flat region.</b> Row 1: 10(−1)×3 = −30. Row 2: 10(2)×3 = +60. Row 3: −30. Sum = −30 + 60 − 30 = 0.","<b>(b) Edge.</b> Row 1: 0(−1)×3 = 0. Row 2: 10(2)×3 = +60. Row 3: 10(−1)×3 = −30. Sum = 0 + 60 − 30 = 30."],
   answer:"Flat region gives <b>0</b>; the edge gives <b>+30</b>. The filter is blind to uniform regions and responds strongly where brightness changes vertically.",
   trap:"The zero response on flat input is a direct consequence of the weights summing to zero: (−1)(3) + (2)(3) + (−1)(3) = −3 + 6 − 3 = 0. On any patch where all pixels are equal to c, the output is c × 0 = 0 regardless of c. This is why edge detectors are constructed to sum to zero — it makes them respond to <i>change</i> rather than to brightness."}],
 practice:[
  {id:"m3t2p1",d:"easy",q:"Convolve the 1-D input [2, 4, 6, 8] with the filter [1, −1] and state the output length.",hint:"Slide one position at a time.",a:"<p>Position 1: (2)(1) + (4)(−1) = 2 − 4 = <b>−2</b><br>Position 2: (4)(1) + (6)(−1) = 4 − 6 = <b>−2</b><br>Position 3: (6)(1) + (8)(−1) = 6 − 8 = <b>−2</b></p><p>Output = <b>[−2, −2, −2]</b>, length 3.</p><p>The length follows n − f + 1 = 4 − 2 + 1 = 3. The constant output reflects a constant gradient in the input: this filter computes a difference, and the input rises by 2 at every step.</p>"},
  {id:"m3t2p2",d:"moderate",q:"Convolve [[1,2,3],[4,5,6],[7,8,9]] with [[1,0],[0,−1]] and give the full output map.",hint:"A 2×2 filter on a 3×3 input gives a 2×2 output.",a:"<p>Output size = (3 − 2 + 1) × (3 − 2 + 1) = 2 × 2.</p><p><b>(0,0):</b> patch [[1,2],[4,5]] → 1(1) + 2(0) + 4(0) + 5(−1) = 1 − 5 = <b>−4</b></p><p><b>(0,1):</b> patch [[2,3],[5,6]] → 2(1) + 3(0) + 5(0) + 6(−1) = 2 − 6 = <b>−4</b></p><p><b>(1,0):</b> patch [[4,5],[7,8]] → 4(1) + 5(0) + 7(0) + 8(−1) = 4 − 8 = <b>−4</b></p><p><b>(1,1):</b> patch [[5,6],[8,9]] → 5(1) + 6(0) + 8(0) + 9(−1) = 5 − 9 = <b>−4</b></p><p>Output = <b>[[−4, −4], [−4, −4]]</b>. This filter computes a diagonal difference, and the input increases by 4 along every such diagonal.</p>"},
  {id:"m3t2p3",d:"moderate",q:"Why do edge-detection filters have weights that sum to zero?",hint:"Apply one to a region where every pixel is the same.",a:"<p>Consider a filter applied to a uniform patch where every pixel equals c. The output is Σ wᵢ × c = c × Σ wᵢ. If the weights sum to zero, the output is <b>zero for any c</b> — the filter gives no response to a flat region regardless of how bright or dark it is.</p><p>This is exactly the behaviour an edge detector needs. An edge is a <i>change</i> in brightness, not a brightness value. A filter that responded to absolute brightness would fire on every bright region whether or not an edge was present, making its output useless for locating boundaries.</p><p>By summing to zero, the filter subtracts out the local average and reports only the deviation from it. The response is then large where brightness changes rapidly and zero where it does not — genuine edge detection, invariant to overall illumination. Verified on the horizontal edge filter: (−1)(3) + (2)(3) + (−1)(3) = 0, and applying it to a uniform patch of 10s gives −30 + 60 − 30 = 0.</p>"}],
 questions:[
  {q:"Explain the convolution operation in 1-D and 2-D with a worked numerical example.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Apply the given filter to the given input matrix and compute the output feature map.",marks:5,d:"moderate",priority:"high",source:"source"},
  {q:"What is a local receptive field? Explain with reference to a 3×3 filter.",marks:5,d:"easy",priority:"high",source:"source"}]},

{id:"m3t3",m:"m3",title:"Receptive Field, Depth and Channels",type:"theory",priority:"medium",los:["3.1"],
 src:"Module 3 deck, slides 17–18, 22–23",
 summary:"Why an image has a third dimension, and what the filter's depth must match.",
 whatIs:"<p>Every image has a width and a height, and also a <b>depth</b> — the number of channels. The deck states it plainly: a grayscale image has a depth of 1, a colour image a depth of 3, one channel each for red, green and blue.</p>",
 concept:"<h4>Depth and channels</h4><div class='scroll'><table>"+
  "<tr><th>Image type</th><th>Channels</th><th>Shape of a 28×28 image</th></tr>"+
  "<tr><td>Grayscale</td><td>1</td><td>28 × 28 × 1</td></tr>"+
  "<tr><td>Colour (RGB)</td><td>3</td><td>28 × 28 × 3</td></tr>"+
  "<tr><td>Output of a conv layer with 64 filters</td><td>64</td><td>26 × 26 × 64</td></tr></table></div>"+
  "<p>The deck's framing: in a neural network each image is a sample, and each pixel in a grayscale image is a single feature. In a colour image there are three features per pixel.</p>"+
  "<div class='box warning'><h5>The rule that governs every CNN calculation</h5><p><b>A filter's depth must equal the input's depth.</b> A 3×3 filter applied to an RGB image is not 3×3 — it is 3 × 3 × 3, with 27 weights. The filter spans <i>all</i> channels and produces a <b>single</b> number per position, so one filter always produces a one-channel output.</p><p>Consequence: the number of <b>filters</b> in a layer determines the number of <b>channels</b> in its output, which becomes the depth the next layer's filters must match.</p></div>"+
  "<h4>The local receptive field</h4>"+
  "<p>The receptive field is the region of the input a single output neuron looks at. For a 3×3 filter on a single-channel image it is the 9 pixels around the focus pixel; on an RGB image it is 3 × 3 × 3 = 27 values. The <b>anchor</b> is the filter's centre, and the output is written at the same position as the focus pixel.</p>"+
  "<p><b>Effective receptive field grows with depth.</b> A neuron in layer 1 with a 3×3 filter sees 3×3 input pixels. A neuron in layer 2, looking at a 3×3 window of layer-1 outputs, indirectly sees a 5×5 region of the original image. Stacking small filters therefore builds up a large field of view without large filters — which is why modern architectures prefer several 3×3 layers to one 7×7 layer.</p>",
 needToKnow:["State the depth of grayscale and RGB images","State that a filter's depth must match its input's depth","Compute the true parameter count of a filter including its depth","Explain that one filter produces one output channel","Explain how the effective receptive field grows with depth"],
 recognition:{clues:["An input shape given as (H, W, C)","'How many channels?', 'depth of the filter'","RGB or grayscale mentioned","'Receptive field'"],
  wording:["What is the depth of an image? Explain with grayscale and colour examples.","A 3×3 filter is applied to an RGB image. How many weights does it have?","Explain the local receptive field."],
  firstMove:"Write the input shape as (H, W, C) before anything else. Once C is explicit, filter depth and parameter counts follow mechanically.",
  trap:"Treating a 3×3 filter on RGB as having 9 weights. It has 27, because it must span all three channels."},
 examAnswer:[
  {marks:5,body:"<p>Depth defined with both image types; the filter-depth-matches-input-depth rule; the parameter count for one RGB filter; and one line that filter count sets output depth.</p>"},
  {marks:10,body:"<p>All of the above plus the receptive field with anchor and focus pixel; a worked shape chain through two layers; and the growth of the effective receptive field with depth.</p>"}],
 mistakes:["Forgetting the channel dimension when counting parameters","Thinking a filter produces one output per channel — it produces one number in total per position","Saying a colour image has depth 1 because it is one image","Confusing the number of filters with the filter size"],
 examples:[{id:"m3t3e1",title:"Tracking shapes and depths through two layers",q:"A 32×32 RGB image passes through Conv1 (16 filters of 3×3, no padding, stride 1) then Conv2 (32 filters of 3×3, no padding, stride 1). Give every shape and parameter count.",
  steps:["<b>Input:</b> 32 × 32 × 3.","<b>Conv1 filters:</b> each is 3 × 3 × 3 (depth must match the input's 3 channels) = 27 weights + 1 bias = 28. With 16 filters: 16 × 28 = 448 parameters.","<b>Conv1 output size:</b> (32 − 3)/1 + 1 = 30. With 16 filters the output has 16 channels → 30 × 30 × 16.","<b>Conv2 filters:</b> each must have depth 16 to match Conv1's output. Each is 3 × 3 × 16 = 144 weights + 1 bias = 145. With 32 filters: 32 × 145 = 4,640 parameters.","<b>Conv2 output size:</b> (30 − 3)/1 + 1 = 28, with 32 channels → 28 × 28 × 32.","Total: 448 + 4,640 = 5,088."],
  answer:"32×32×3 → <b>30×30×16</b> (448 params) → <b>28×28×32</b> (4,640 params). Total <b>5,088</b> parameters.",
  trap:"The critical step is Conv2's filter depth. It is 16, not 3 — the input to Conv2 is Conv1's output, which has 16 channels, not the original image. Students who use 3 get 32 × 28 = 896 instead of 4,640. The rule to carry: filter depth always equals the depth of whatever is immediately upstream."}],
 practice:[
  {id:"m3t3p1",d:"easy",q:"What is the depth of an image, and what depth must a filter have?",hint:"Channels on both sides.",a:"<p><b>Depth</b> is the number of channels. A grayscale image has depth 1, since each pixel carries a single intensity value. A colour image has depth 3 — one channel each for red, green and blue — so each pixel carries three values.</p><p><b>A filter's depth must equal the depth of its input.</b> A 3×3 filter applied to a grayscale image is 3 × 3 × 1 = 9 weights; the same filter applied to an RGB image is 3 × 3 × 3 = 27 weights. The filter spans all channels simultaneously and produces a <b>single</b> number at each position, so one filter always yields a one-channel output map.</p>"},
  {id:"m3t3p2",d:"moderate",q:"A conv layer has 64 filters of size 5×5 applied to an input of depth 32. How many parameters, and what is the output depth?",hint:"Filter depth is fixed by the input.",a:"<p><b>Each filter:</b> 5 × 5 × 32 = 800 weights, plus 1 bias = 801 parameters.</p><p><b>All 64 filters:</b> 64 × 801 = <b>51,264 parameters</b>.</p><p><b>Output depth:</b> each filter produces one output channel, so 64 filters give an output of depth <b>64</b>.</p><p>The next layer's filters would therefore need depth 64. Note how the parameter count is driven by the input depth: had the input been depth 3 instead of 32, each filter would need only 76 parameters and the layer 4,864 in total.</p>"},
  {id:"m3t3p3",d:"hard",q:"Explain how the effective receptive field grows with depth, and why three 3×3 layers are preferred to one 7×7 layer.",hint:"Trace what a layer-3 neuron ultimately depends on, then count parameters.",a:"<p><b>Growth.</b> A layer-1 neuron with a 3×3 filter sees a 3×3 patch of the input. A layer-2 neuron looks at a 3×3 window of layer-1 outputs — but each of those depends on its own 3×3 input patch, and the patches overlap, so the layer-2 neuron indirectly depends on a <b>5×5</b> region of the original image. A layer-3 neuron similarly reaches <b>7×7</b>. Each additional 3×3 layer adds 2 to the effective receptive field.</p><p><b>Why three 3×3 layers beat one 7×7.</b></p><p><b>Fewer parameters.</b> With C channels in and out at each stage, three 3×3 layers cost 3 × (3 × 3 × C × C) = 27C² weights. One 7×7 layer costs 7 × 7 × C × C = 49C². The stacked version uses about 45% fewer parameters for the same field of view — less memory, less computation and less overfitting.</p><p><b>More non-linearity.</b> Three layers means three activation functions rather than one. The 7×7 layer computes a single linear map of its window before one activation; the stack applies a non-linearity twice in between, so it can represent a substantially richer family of functions over the same 7×7 region.</p><p><b>Better feature hierarchy.</b> The intermediate representations are themselves useful — edges at layer 1, corners at layer 2, shapes at layer 3 — whereas the single large filter must jump straight from pixels to a 7×7 pattern with nothing in between. This is the design principle behind VGG and every architecture since.</p>"}],
 questions:[
  {q:"What is meant by the depth of an image? Explain with grayscale and colour examples.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"A 3×3 filter is applied to an RGB image. How many weights does it have, and how many output channels does it produce?",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m3t4",m:"m3",title:"Padding",type:"problem-solving",priority:"high",los:["3.1"],
 src:"Module 3 deck, slides 24–26",
 summary:"Adding a border of zeros so the filter can centre on every pixel, including the edges.",
 whatIs:"<p>Near the edge of an image the filter's receptive field falls off the side. Padding adds extra pixels — almost always zeros — around the border so that every original pixel can serve as the centre of the filter.</p>",
 concept:"<h4>The two problems padding solves</h4><ol>"+
  "<li><b>Edge pixels are under-used.</b> Without padding, a corner pixel participates in only one filter position while a central pixel participates in nine. Information at the border is systematically under-weighted. The deck's phrasing is that padding gives boundary pixels a fair chance to participate in feature detection.</li>"+
  "<li><b>The image shrinks at every layer.</b> Each 3×3 convolution without padding removes 2 from each dimension. A 32×32 image passes 30, 28, 26 … and after 16 layers there is nothing left. Padding lets you build deep networks without running out of spatial extent.</li></ol>"+
  "<h4>Zero-padding</h4>"+
  "<p>The deck states that by far the most common choice for the padded values is simply zero, and that this choice is called zero-padding. A padding of p adds p rows above and below and p columns left and right, so each dimension grows by 2p.</p>"+
  "<h4>The two named modes</h4><div class='scroll'><table>"+
  "<tr><th>Mode</th><th>Padding</th><th>Output size (stride 1)</th><th>Effect</th></tr>"+
  "<tr><td><b>Valid</b></td><td>p = 0</td><td>n − f + 1</td><td>No padding; output shrinks</td></tr>"+
  "<tr><td><b>Same</b></td><td>p = (f − 1)/2</td><td><b>n</b></td><td>Output matches input size</td></tr></table></div>"+
  "<p>For 'same' padding with stride 1, set p = (f − 1)/2. This gives p = 1 for f = 3, p = 2 for f = 5 and p = 3 for f = 7 — note that it requires an odd filter size, which is one reason filters are almost always odd.</p>"+
  "<div class='box tip'><h5>Deriving 'same' rather than memorising it</h5><p>Output = (n − f + 2p)/s + 1. For the output to equal n with s = 1: n = n − f + 2p + 1, so 2p = f − 1 and p = (f − 1)/2. Deriving it takes three lines and is safer than recalling it.</p></div>",
 needToKnow:["Explain both problems padding solves","State that padded values are zeros","Give the formula p = (f − 1)/2 for same padding and derive it","Compute output size with and without padding","Explain why odd filter sizes are preferred"],
 recognition:{clues:["p appears in the output formula","'Same' or 'valid' padding named","'The output must be the same size as the input'","A question about edge or boundary pixels"],
  wording:["What is padding and why is it used?","Find the padding required to keep the output size the same as the input.","Explain zero-padding with a diagram."],
  firstMove:"Write Output = (n − f + 2p)/s + 1 and substitute what is known. Every padding question is that formula rearranged.",
  trap:"Adding p to only one side. Padding is applied to both sides, so each dimension gains 2p, not p."},
 examAnswer:[
  {marks:5,body:"<p>Both problems padding solves, zero-padding named, the two modes with their formulas, and one worked output-size calculation.</p>"},
  {marks:10,body:"<p>All of the above plus the derivation of p = (f − 1)/2; a diagram showing the padded border; the shrinkage argument across several layers with real numbers; and why odd filter sizes are used.</p>"}],
 mistakes:["Using p instead of 2p in the formula","Computing same padding for stride greater than 1 with the s = 1 formula","Saying padding adds information — it adds zeros, which carry none; it preserves the geometry","Forgetting that padding is applied on all four sides"],
 examples:[
  {id:"m3t4e1",title:"Same padding, and what happens without it",q:"A 28×28 image is convolved with a 3×3 filter at stride 1. Find the output with p = 0 and with p = 1, and state the padding needed for 'same'.",
   steps:["Formula: Output = (n − f + 2p)/s + 1.","<b>p = 0:</b> (28 − 3 + 0)/1 + 1 = 25 + 1 = 26. Output is 26 × 26 — the image has shrunk by 2.","<b>p = 1:</b> (28 − 3 + 2)/1 + 1 = 27 + 1 = 28. Output is 28 × 28 — size preserved.","<b>Same padding formula:</b> p = (f − 1)/2 = (3 − 1)/2 = 1 ✓ consistent."],
   answer:"Without padding <b>26×26</b>; with p = 1 <b>28×28</b>. Same padding requires <b>p = 1</b>. Both verified.",
   trap:"Note that p = 1 adds one row on top <i>and</i> one below, so the padded image is 30×30, and (30 − 3)/1 + 1 = 28. Writing 2p in the formula already accounts for both sides; adding p separately to each dimension double-counts."},
  {id:"m3t4e2",title:"How fast an image disappears without padding",q:"A 32×32 image passes through successive 3×3 convolutions at stride 1 with no padding. After how many layers does it vanish, and what changes with same padding?",
   steps:["Each layer: output = n − 3 + 1 = n − 2. Each convolution removes 2 from each dimension.","32 → 30 → 28 → 26 → 24 → 22 → 20 → 18 → 16 → 14 → 12 → 10 → 8 → 6 → 4 → 2 → 0.","From 32, reaching 0 takes 16 layers. The network cannot be deeper than 15 convolution layers.","<b>With same padding (p = 1):</b> output = (n − 3 + 2)/1 + 1 = n at every layer. The size stays 32×32 indefinitely, and depth is limited only by computation."],
   answer:"Without padding the image is exhausted after <b>16 layers</b>. With same padding it stays 32×32 for <b>any depth</b>.",
   trap:"This is the argument that matters more than the edge-pixel one. Modern architectures are 50 or 100 layers deep, which is arithmetically impossible without padding. Note also that deliberate downsampling still happens — but through pooling and stride, where it is chosen, rather than as an uncontrolled side effect of every convolution."}],
 practice:[
  {id:"m3t4p1",d:"easy",q:"What is padding, what values are used, and what two problems does it solve?",hint:"Border pixels and image size.",a:"<p><b>Padding</b> adds extra pixels around the border of an image so the filter's receptive field does not fall off the edge. By far the most common choice for these values is <b>zero</b>, which is called zero-padding.</p><p><b>Problem 1 — edge pixels are under-used.</b> Without padding, a corner pixel appears in only one filter position while a central pixel appears in nine, so information at the boundary is systematically under-weighted. Padding lets every original pixel serve as the centre of the filter.</p><p><b>Problem 2 — the image shrinks at every layer.</b> Each 3×3 convolution removes 2 from each dimension, so a 32×32 image is exhausted after 16 layers. Padding preserves the size and allows deep networks to be built.</p>"},
  {id:"m3t4p2",d:"moderate",q:"Derive the padding needed for 'same' output with stride 1, and give p for filters of size 3, 5 and 7.",hint:"Set the output equal to the input in the general formula.",a:"<p>Start from the general formula and require the output to equal n with s = 1:</p><div class='eqb'>n = (n − f + 2p)/1 + 1\nn = n − f + 2p + 1\n0 = −f + 2p + 1\n2p = f − 1\np = (f − 1)/2</div><p><b>f = 3:</b> p = (3−1)/2 = <b>1</b>. <b>f = 5:</b> p = <b>2</b>. <b>f = 7:</b> p = <b>3</b>.</p><p>Note that this requires f to be <b>odd</b>, otherwise p is not an integer. That is one of the main reasons filter sizes are almost always odd — an even filter has no single centre pixel and cannot be padded symmetrically.</p>"},
  {id:"m3t4p3",d:"moderate",q:"A 64×64 input uses a 5×5 filter at stride 1. Give the output for p = 0, p = 1 and p = 2, and say which is 'same'.",hint:"One formula, three substitutions.",a:"<p>Output = (n − f + 2p)/s + 1 = (64 − 5 + 2p)/1 + 1 = 60 + 2p.</p><p><b>p = 0:</b> 60 + 0 = <b>60</b> → 60 × 60</p><p><b>p = 1:</b> 60 + 2 = <b>62</b> → 62 × 62</p><p><b>p = 2:</b> 60 + 4 = <b>64</b> → 64 × 64 ✓ <b>this is 'same' padding</b></p><p>Consistent with p = (f − 1)/2 = (5 − 1)/2 = 2. Each unit of padding adds exactly 2 to the output dimension, because it adds one row or column on each side.</p>"}],
 questions:[
  {q:"What is padding? Explain zero-padding and the two problems it solves.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"Find the padding required so that a 5×5 filter on a 64×64 input produces an output of the same size.",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m3t5",m:"m3",title:"Stride",type:"problem-solving",priority:"high",los:["3.1"],
 src:"Module 3 deck, slides 27–29",
 summary:"How far the filter jumps between positions, and how that downsamples the output.",
 whatIs:"<p>Stride is how far the filter moves at each step. The deck's definition: the number of rows and columns traversed per slide. Stride 1 examines almost every location; stride 2 skips alternate ones.</p>",
 concept:"<h4>Effect on the output</h4>"+
  "<p>Stride divides the output size. Larger strides mean fewer filter positions and therefore a smaller feature map — this is deliberate <b>downsampling</b>.</p>"+
  "<div class='eqb'>Output = ⌊(n − f + 2p) / s⌋ + 1</div>"+
  "<p>The floor function matters: when the filter cannot complete a final step, that position is simply dropped.</p>"+
  "<h4>Strides can differ per axis</h4>"+
  "<p>The deck's worked example uses different strides in each direction: looking at every third pixel horizontally and every other pixel vertically — a stride of 3 horizontally and 2 vertically — turns a 5×9 input into a 2×3 output. Verify: horizontally (9 − 3)/3 + 1 = 3; vertically (5 − 3)/2 + 1 = 2.</p>"+
  "<h4>Striding for hierarchies</h4>"+
  "<p>The deck explains why this is useful. The first convolution works on a full 600×600 image; the second works on a 300×300 version containing the results of the first stage's five filters. Each stage uses a lower-resolution version of the previous stage, so it can work with larger collections of features without requiring larger filters.</p>"+
  "<p>That is the key architectural insight: reducing spatial size lets you increase the number of channels without the computation exploding, and it widens each neuron's effective view of the original image.</p>"+
  "<div class='box tip'><h5>Stride versus pooling</h5><p>Both downsample. Stride does it <i>during</i> the convolution by skipping positions — free, since the skipped computations are never performed. Pooling does it <i>after</i>, as a separate step, and can summarise with a maximum or a mean. Modern architectures often use strided convolutions in place of pooling.</p></div>",
 needToKnow:["Define stride and state its effect on output size","Apply the formula with the floor function","Handle different strides on each axis","Explain striding for hierarchies","Compare stride with pooling as downsampling methods"],
 recognition:{clues:["s or 'stride' appears in the question","'Skipping', 'every other pixel', 'downsampling'","An output much smaller than the input","Different horizontal and vertical steps"],
  wording:["What is stride? Explain its effect on the output size.","Compute the output for the given input, filter, padding and stride.","Explain striding for hierarchies."],
  firstMove:"Substitute into ⌊(n − f + 2p)/s⌋ + 1 and apply the floor before adding 1. Order matters.",
  trap:"Applying the floor after adding 1, or not applying it at all. ⌊27/2⌋ + 1 = 14, whereas 27/2 + 1 = 14.5 is not a valid size."},
 examAnswer:[
  {marks:5,body:"<p>Definition, the formula with the floor, one worked calculation, and one line on downsampling.</p>"},
  {marks:10,body:"<p>All of the above plus a per-axis example; the hierarchy argument with the 600→300 illustration; and the comparison with pooling.</p>"}],
 mistakes:["Forgetting the floor function","Applying the floor in the wrong order","Assuming the stride is the same on both axes when the question gives two values","Thinking a larger stride loses information entirely — it samples less densely, and features larger than the stride are still detected","Confusing stride with filter size"],
 examples:[
  {id:"m3t5e1",title:"The deck's per-axis stride example",q:"A 5×9 input (5 rows, 9 columns) is convolved with a 3×3 filter, no padding, using stride 3 horizontally and 2 vertically. Find the output size.",
   steps:["The two axes must be computed separately.","<b>Horizontal</b> (9 columns, stride 3): ⌊(9 − 3 + 0)/3⌋ + 1 = ⌊6/3⌋ + 1 = 2 + 1 = 3.","<b>Vertical</b> (5 rows, stride 2): ⌊(5 − 3 + 0)/2⌋ + 1 = ⌊2/2⌋ + 1 = 1 + 1 = 2.","Output = 2 rows × 3 columns."],
   answer:"Output is <b>2 × 3</b>, matching the deck exactly.",
   trap:"Different strides per axis is unusual but appears in the material, so read the question carefully. The habit to build is computing height and width separately every time — it costs nothing when the strides are equal and saves you when they are not."},
  {id:"m3t5e2",title:"Where the floor function bites",q:"A 28×28 input, 3×3 filter, no padding, stride 2. Compute the output and explain the floor.",
   steps:["Output = ⌊(28 − 3 + 0)/2⌋ + 1 = ⌊25/2⌋ + 1 = ⌊12.5⌋ + 1 = 12 + 1 = 13.","Check by counting positions: the filter starts at column 0 and advances by 2 — columns 0, 2, 4, …, 24. The last valid start is 24, because a filter at column 25 would need columns 25, 26, 27, which exists, but 26 would need 26, 27, 28 — out of range. Starts at 0, 2, …, 25 is not attainable at even steps, so the last is 24.","Positions 0 through 24 in steps of 2: (24 − 0)/2 + 1 = 13 ✓"],
   answer:"Output is <b>13 × 13</b>. Without the floor the formula would give 13.5, which is not a valid size.",
   trap:"The floor represents a real discarding of data. Column 27 of the input is never used as a filter start, so the rightmost strip of the image is examined less than the rest. This asymmetry is why 'same' padding with stride greater than 1 is defined by a slightly different formula in most frameworks, which pad asymmetrically to cover the edge."}],
 practice:[
  {id:"m3t5p1",d:"easy",q:"Define stride and state its effect on the output feature map.",hint:"Distance per step, and what that does to the count of positions.",a:"<p><b>Stride</b> is the number of rows and columns the filter traverses per slide — how far it jumps between positions. A stride of 1 moves the filter one pixel at a time and examines almost every location; a stride of 2 skips alternate locations.</p><p><b>Effect:</b> increasing the stride reduces the number of filter positions and therefore <b>shrinks the output feature map</b>, by a factor of approximately s in each dimension. This is deliberate downsampling: it reduces computation and memory in every subsequent layer, and it widens each neuron's effective view of the original image.</p><div class='eqb'>Output = ⌊(n − f + 2p)/s⌋ + 1</div>"},
  {id:"m3t5p2",d:"moderate",q:"A 32×32 input with a 5×5 filter and p = 2. Compute the output for s = 1, 2 and 3.",hint:"One formula, three substitutions, and watch the floor.",a:"<p>Output = ⌊(32 − 5 + 2(2))/s⌋ + 1 = ⌊31/s⌋ + 1.</p><p><b>s = 1:</b> ⌊31/1⌋ + 1 = 31 + 1 = <b>32</b> → 32 × 32 (this is 'same')</p><p><b>s = 2:</b> ⌊31/2⌋ + 1 = ⌊15.5⌋ + 1 = 15 + 1 = <b>16</b> → 16 × 16</p><p><b>s = 3:</b> ⌊31/3⌋ + 1 = ⌊10.33⌋ + 1 = 10 + 1 = <b>11</b> → 11 × 11</p><p>Each doubling of the stride roughly halves each dimension, so the feature map area falls by about a factor of 4 — from 1024 to 256 to 121 values.</p>"},
  {id:"m3t5p3",d:"moderate",q:"Explain 'striding for hierarchies' and why downsampling is architecturally useful.",hint:"What can you afford once the maps are smaller?",a:"<p><b>The deck's illustration:</b> the first convolution works on the full 600×600 image. The second works on a 300×300 version containing the results of the first stage's five filters. Each stage operates on a lower-resolution version of the previous one.</p><p><b>Why this is useful.</b> The deck's own phrasing is that each stage can then work with larger collections of features without requiring larger filters. Three things follow:</p><p><b>1 — Computation stays bounded.</b> Halving each spatial dimension quarters the number of positions, so you can quadruple the number of channels at the same cost. This is why channel counts rise as spatial size falls — AlexNet goes 96 → 256 → 384 filters while its maps shrink 55 → 27 → 13.</p><p><b>2 — The effective receptive field widens.</b> After downsampling, a 3×3 filter covers twice as much of the original image in each direction. Large-scale structure becomes visible to small filters, which is how a network progresses from strokes to shapes to objects.</p><p><b>3 — It matches the feature hierarchy.</b> Early layers need fine spatial resolution to locate edges precisely, but few feature types. Later layers need many feature types — 'is this an eye, a wheel, a letter?' — but only coarse position. Downsampling trades exactly the resolution you stop needing for exactly the channel capacity you start needing.</p>"}],
 questions:[
  {q:"What is stride? Explain its effect on the output size with a numerical example.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"Explain striding for hierarchies and state why downsampling is architecturally useful.",marks:10,d:"moderate",priority:"high",source:"source"}]},

{id:"m3t6",m:"m3",title:"Relation Between Input, Output and Filter Size",type:"problem-solving",priority:"high",los:["3.2"],
 src:"Module 3 deck, slides 31–33 — 'The Master Architecture Formula'",
 summary:"The one formula LO 3.2 is built around, and the calculation most likely to appear on the paper.",
 whatIs:"<p>The deck names this <b>the master architecture formula</b>. Every CNN dimension question in Module 3 — layer sizes, padding choices, LeNet, AlexNet — is this formula applied once or repeatedly.</p>",
 concept:"<div class='eqb'>Output = ⌊(N − F + 2P) / S⌋ + 1</div>"+
  "<div class='scroll'><table><tr><th>Symbol</th><th>Meaning</th></tr>"+
  "<tr><td><b>N</b></td><td>Input size (one dimension)</td></tr>"+
  "<tr><td><b>F</b></td><td>Filter (kernel) size</td></tr>"+
  "<tr><td><b>P</b></td><td>Padding on each side</td></tr>"+
  "<tr><td><b>S</b></td><td>Stride</td></tr></table></div>"+
  "<p>The deck also gives the layer-size form used in the textbook: when convolving in layer q, the filter can be aligned at L<sub>q+1</sub> = (L<sub>q</sub> − F<sub>q</sub> + 1) positions along the height and B<sub>q+1</sub> = (B<sub>q</sub> − F<sub>q</sub> + 1) along the width, so the size of the next hidden layer is L<sub>q+1</sub> × B<sub>q+1</sub>. That is the same formula with P = 0 and S = 1.</p>"+
  "<h4>Where each term comes from</h4><ul>"+
  "<li><b>N − F</b> — the filter's last valid start position, since it needs F pixels of room.</li>"+
  "<li><b>+ 2P</b> — padding adds P on each side, so the effective input is N + 2P.</li>"+
  "<li><b>÷ S</b> — only every S-th position is used.</li>"+
  "<li><b>+ 1</b> — counting positions from 0 to k inclusive gives k + 1 of them. This is the term most often forgotten.</li>"+
  "<li><b>Floor</b> — a partial final step is dropped.</li></ul>"+
  "<h4>The deck's worked example, verified</h4>"+
  "<div class='eqb'>Input 28 × 28, Filter 3 × 3, Padding 1, Stride 1\n⌊(28 − 3 + 2(1))/1⌋ + 1 = ⌊27/1⌋ + 1 = 27 + 1 = 28\nOutput feature map = 28 × 28   ✓ verified</div>"+
  "<h4>The four standard cases worth recognising instantly</h4><div class='scroll'><table>"+
  "<tr><th>Case</th><th>Settings</th><th>Output</th></tr>"+
  "<tr><td>Valid, stride 1</td><td>P = 0, S = 1</td><td>N − F + 1 (shrinks by F − 1)</td></tr>"+
  "<tr><td>Same, stride 1</td><td>P = (F−1)/2, S = 1</td><td>N (unchanged)</td></tr>"+
  "<tr><td>Halving</td><td>F = 2, P = 0, S = 2</td><td>N/2</td></tr>"+
  "<tr><td>1×1 convolution</td><td>F = 1, P = 0, S = 1</td><td>N (changes depth only)</td></tr></table></div>"+
  "<div class='box tip'><h5>Always sanity-check</h5><p>The output must be a positive integer and no larger than N + 2P. If you get a fraction you forgot the floor; if you get something bigger than the padded input, you made a sign error.</p></div>",
 needToKnow:["Write the formula and name every symbol","Apply it to any combination of N, F, P, S","Rearrange it to solve for P or F","Handle height and width separately when they differ","Chain it through several layers"],
 recognition:{clues:["Any question giving input size, filter size, padding or stride","'Calculate the output shape'","An architecture table to be completed","'Feature map size'"],
  wording:["Determine the relationship between input, output and filter size in a CNN.","Compute the output feature map size for the given configuration.","What padding is required to achieve an output of the given size?"],
  firstMove:"Write the formula, then list N, F, P, S with their values before substituting. Listing them catches missing information immediately.",
  trap:"Forgetting the + 1. It is the difference between 27 and 28 in the deck's own example, and it propagates through every subsequent layer."},
 examAnswer:[
  {marks:5,body:"<p>The formula with all symbols named, one worked substitution, and the answer stated as H × W × depth.</p>"},
  {marks:10,body:"<p>All of the above plus: where each term comes from; the four standard cases; a chained multi-layer calculation; and a rearrangement solving for P.</p>"}],
 mistakes:["Omitting the + 1","Using P instead of 2P","Forgetting the floor when S > 1","Giving the answer as a single number when the layer has depth — always state H × W × C","Applying the formula to height and width together when they differ"],
 examples:[
  {id:"m3t6e1",title:"The deck's master formula example",q:"Input 28×28, filter 3×3, padding 1, stride 1. Find the output feature map size.",
   steps:["N = 28, F = 3, P = 1, S = 1.","Output = ⌊(28 − 3 + 2(1))/1⌋ + 1","= ⌊(28 − 3 + 2)/1⌋ + 1","= ⌊27/1⌋ + 1 = 27 + 1 = 28"],
   answer:"Output feature map = <b>28 × 28</b>. Verified against the deck.",
   trap:"This is the 'same' padding case, since P = (F − 1)/2 = 1. Recognising it lets you write the answer immediately, but show the substitution anyway — the method marks are in the working, not the number."},
  {id:"m3t6e2",title:"Chaining the formula through a small network",q:"A 64×64×3 input passes through: Conv 5×5, 32 filters, P = 2, S = 1; MaxPool 2×2, S = 2; Conv 3×3, 64 filters, P = 1, S = 2. Give every output shape.",
   steps:["<b>Conv 1:</b> ⌊(64 − 5 + 4)/1⌋ + 1 = ⌊63⌋ + 1 = 64. Depth = number of filters = 32. → <b>64 × 64 × 32</b>","<b>MaxPool:</b> ⌊(64 − 2 + 0)/2⌋ + 1 = ⌊31⌋ + 1 = 32. Pooling does not change depth. → <b>32 × 32 × 32</b>","<b>Conv 2:</b> ⌊(32 − 3 + 2)/2⌋ + 1 = ⌊31/2⌋ + 1 = 15 + 1 = 16. Depth = 64. → <b>16 × 16 × 64</b>"],
   answer:"64×64×3 → <b>64×64×32</b> → <b>32×32×32</b> → <b>16×16×64</b>.",
   trap:"Two points. Pooling uses the same formula but never changes depth, whereas a convolution sets the depth to its filter count. And the final layer's floor matters: ⌊31/2⌋ = 15, so the answer is 16 and not 16.5. Always state the depth alongside the spatial size — an answer of '16 × 16' is incomplete."}],
 practice:[
  {id:"m3t6p1",d:"easy",q:"Write the master formula and name each symbol.",hint:"Four symbols, a division and a floor.",a:"<div class='eqb'>Output = ⌊(N − F + 2P) / S⌋ + 1</div><p><b>N</b> — input size in one dimension. <b>F</b> — filter (kernel) size. <b>P</b> — padding applied to each side. <b>S</b> — stride, the step between filter positions.</p><p>The <b>+ 1</b> counts the starting position itself; the <b>floor</b> discards a partial final step. Height and width must be computed separately whenever they differ.</p>"},
  {id:"m3t6p2",d:"moderate",q:"An input of 224×224 uses an 11×11 filter with stride 4 and no padding. Find the output. Then find the padding needed to make the output 56×56.",hint:"Apply, then rearrange.",a:"<p><b>Part 1.</b> Output = ⌊(224 − 11 + 0)/4⌋ + 1 = ⌊213/4⌋ + 1 = ⌊53.25⌋ + 1 = 53 + 1 = <b>54</b> → 54 × 54.</p><p><b>Part 2.</b> Set the output to 56 and solve for P:</p><div class='eqb'>56 = ⌊(224 − 11 + 2P)/4⌋ + 1\n55 = ⌊(213 + 2P)/4⌋\n220 ≤ 213 + 2P < 224\n7 ≤ 2P < 11\n3.5 ≤ P < 5.5  ⟹  P = 4 or P = 5</div><p><b>P = 4</b> is the smaller valid choice. Check: ⌊(224 − 11 + 8)/4⌋ + 1 = ⌊221/4⌋ + 1 = 55 + 1 = 56 ✓</p><p>Note that the floor makes the solution a <i>range</i> rather than a single value — a detail worth mentioning if a question asks for 'the' padding.</p>"},
  {id:"m3t6p3",d:"moderate",q:"What does a 1×1 convolution do, given the formula?",hint:"Substitute F = 1, P = 0, S = 1 and then think about depth.",a:"<p><b>Spatially, nothing.</b> Output = ⌊(N − 1 + 0)/1⌋ + 1 = N − 1 + 1 = N. The height and width are unchanged.</p><p><b>But it changes depth.</b> A 1×1 filter applied to an input of depth C is really 1 × 1 × C, so it computes a weighted sum across all C channels at a single spatial position, producing one number. With K such filters the output has depth K, chosen freely and independently of C.</p><p><b>What it is used for.</b> Firstly, <b>dimensionality reduction</b>: applying 64 filters of 1×1 to a 28×28×256 input gives 28×28×64, cutting the channel count by a factor of 4 and making a subsequent expensive 3×3 convolution far cheaper. This is the bottleneck idea behind the Inception and ResNet families. Secondly, it adds a <b>non-linearity</b>, since an activation follows it, letting the network mix channels in a learned non-linear way at no spatial cost.</p><p>The general lesson from the formula: F controls the spatial footprint and the <i>number of filters</i> controls the output depth, and these are independent. A 1×1 convolution is the extreme case where all the work happens in the depth dimension.</p>"}],
 questions:[
  {q:"Determine the relationship between input, output and filter size in a CNN, and compute the output for input 28×28, filter 3×3, padding 1, stride 1.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"An input of 224×224 uses an 11×11 filter with stride 4 and no padding. Compute the output feature map size.",marks:5,d:"moderate",priority:"high",source:"source"},
  {q:"Compute the output shape at every stage of the given multi-layer CNN.",marks:10,d:"hard",priority:"high",source:"source"}]},

{id:"m3t7",m:"m3",title:"Number of Parameters in a Convolution Layer",type:"problem-solving",priority:"high",los:["3.2"],
 src:"Module 3 deck, slide 33 — the deck poses this exercise and does not solve it",
 summary:"Counting the learnable weights, and the exercise the deck sets but leaves open.",
 whatIs:"<p>The deck states that the number of parameters in a convolution layer is <b>kernel_size + bias</b>, then poses an exercise: given filters = 1, kernel size = (3,3) and input shape = (10,10,1), calculate the number of parameters and the output shape.</p>",
 concept:"<div class='box warning'><h5>An unsolved exercise in the material</h5><p>Slide 33 sets this problem; the following slide moves on to a different topic and no answer appears anywhere in the deck. The solution below is computed from the deck's own formula and numbers and independently verified. This is a strong candidate for the paper precisely because it was set and left open.</p></div>"+
  "<h4>The full formula</h4>"+
  "<div class='eqb'>Parameters = (F_h × F_w × C_in + 1) × K\n\nF_h, F_w = filter height and width\nC_in     = input depth (channels) — the term most often forgotten\nK        = number of filters\n+1       = one bias per filter</div>"+
  "<p>The deck's shorter statement, kernel_size + bias, is this formula for a single filter on single-channel input. The full version is needed for any realistic layer.</p>"+
  "<h4>The deck's exercise, solved</h4>"+
  "<div class='eqb'>Given: filters K = 1, kernel = (3,3), input = (10, 10, 1)\n\nParameters = (3 × 3 × 1 + 1) × 1 = (9 + 1) × 1 = 10\n\nOutput shape = ⌊(10 − 3 + 0)/1⌋ + 1 = 8\n             = (8, 8, 1)</div>"+
  "<p><b>Answer: 10 parameters, output shape (8, 8, 1).</b> Nine weights for the 3×3 kernel plus one bias; the output is 8×8 because no padding was specified, and depth 1 because there is one filter.</p>"+
  "<h4>Why the count is independent of input size</h4>"+
  "<p>A 3×3 filter has 9 weights whether the image is 10×10 or 10,000×10,000. The same 9 weights are reused at every position — this is weight sharing, and it is why a CNN's parameter count depends on the architecture rather than on the image size. Only the <i>computation</i> scales with image size, never the parameter count.</p>"+
  "<h4>Pooling and fully connected layers, for contrast</h4><div class='scroll'><table>"+
  "<tr><th>Layer</th><th>Parameters</th></tr>"+
  "<tr><td>Convolution</td><td>(F_h × F_w × C_in + 1) × K</td></tr>"+
  "<tr><td>Pooling</td><td><b>0</b> — max and average are fixed operations with nothing to learn</td></tr>"+
  "<tr><td>Fully connected</td><td>(inputs × outputs) + outputs</td></tr></table></div>",
 needToKnow:["Write the full parameter formula including input depth","Solve the deck's exercise and state both the count and the output shape","Explain why the count does not depend on the input's spatial size","State that pooling layers have zero parameters","Compare with a fully connected layer's count"],
 recognition:{clues:["'Number of parameters', 'trainable parameters'","A layer specification with filter count and kernel size","'Calculate parameters and output shape' together"],
  wording:["Calculate the number of parameters and the output shape for the given convolution layer.","How many trainable parameters does a convolution layer have?","Compare the parameter count of a convolution layer with a fully connected layer."],
  firstMove:"Write down F_h, F_w, C_in and K explicitly. The missing one is almost always C_in.",
  trap:"Forgetting C_in, and forgetting the bias. Both are single-term errors that change the answer."},
 examAnswer:[
  {marks:5,body:"<p>The formula, the substitution with all four quantities listed, the parameter count, and the output shape as (H, W, C).</p>"},
  {marks:10,body:"<p>All of the above plus: why the count is independent of image size; the contrast with a fully connected layer on the same input; and a note that pooling has no parameters.</p>"}],
 mistakes:["Omitting C_in — a 3×3 filter on RGB has 27 weights, not 9","Forgetting the bias, one per filter","Multiplying by the output spatial size, as if each position had its own weights","Giving parameters for a pooling layer","Reporting the count without the output shape when both were asked for"],
 examples:[
  {id:"m3t7e1",title:"The deck's unsolved exercise, worked",q:"Given filters = 1, kernel size = (3,3) and input shape = (10,10,1), calculate the number of parameters and the output shape.",
   steps:["Identify the quantities: F_h = 3, F_w = 3, C_in = 1 (the third entry of the input shape), K = 1.","Weights per filter = 3 × 3 × 1 = 9.","Add one bias per filter: 9 + 1 = 10 per filter.","Total = 10 × 1 filter = 10 parameters.","Output size: no padding is stated, so P = 0, and no stride is stated, so S = 1.","Output = ⌊(10 − 3 + 0)/1⌋ + 1 = 7 + 1 = 8.","Output depth = number of filters = 1."],
   answer:"<b>10 parameters</b> and output shape <b>(8, 8, 1)</b>.",
   trap:"This exercise is set on slide 33 of the deck and never answered. Two details are easy to lose: C_in = 1 comes from the third entry of the input shape (10,10,1), and the absence of any stated padding or stride means P = 0 and S = 1 by default — which is why the output shrinks from 10 to 8 rather than staying at 10."},
  {id:"m3t7e2",title:"Convolution against fully connected on the same input",q:"A 32×32×3 input feeds either (a) a conv layer of 64 filters, 3×3, same padding, or (b) a fully connected layer producing the same number of output values. Compare the parameter counts.",
   steps:["<b>(a) Convolution.</b> Each filter is 3 × 3 × 3 = 27 weights + 1 bias = 28. With 64 filters: 64 × 28 = 1,792 parameters. Output shape with same padding: 32 × 32 × 64 = 65,536 values.","<b>(b) Fully connected.</b> Input = 32 × 32 × 3 = 3,072 values. Output must also be 65,536 values. Weights = 3,072 × 65,536 = 201,326,592, plus 65,536 biases.","Total ≈ 201,392,128 parameters.","Ratio: 201,392,128 / 1,792 ≈ 112,000."],
   answer:"Convolution <b>1,792</b> parameters; fully connected <b>≈ 201 million</b> — about 112,000 times more, for exactly the same output size.",
   trap:"The saving comes from two things working together. <b>Weight sharing</b> means the same 28 parameters are reused at all 1,024 spatial positions rather than each position having its own. <b>Local connectivity</b> means each output depends on only 27 inputs rather than all 3,072. Either alone would help; together they are the reason CNNs are trainable at all."}],
 practice:[
  {id:"m3t7p1",d:"easy",q:"Write the parameter formula for a convolution layer and explain each term.",hint:"Four factors and a plus one.",a:"<div class='eqb'>Parameters = (F_h × F_w × C_in + 1) × K</div><p><b>F_h × F_w</b> — the spatial size of the filter, giving the number of positions it covers. <b>C_in</b> — the input depth, because the filter must span every input channel. <b>+ 1</b> — one bias per filter. <b>K</b> — the number of filters, each with its own complete set of weights and its own bias.</p><p>Note what is absent: the input's height and width. The same weights are reused at every position, so the count does not depend on image size.</p>"},
  {id:"m3t7p2",d:"moderate",q:"A layer has 128 filters of size 5×5 applied to an input of shape (14, 14, 64), with same padding. Give the parameter count and the output shape.",hint:"C_in comes from the input shape.",a:"<p><b>Parameters.</b> F_h = 5, F_w = 5, C_in = 64, K = 128.</p><p>Weights per filter = 5 × 5 × 64 = 1,600. Plus 1 bias = 1,601.</p><p>Total = 1,601 × 128 = <b>204,928 parameters</b>.</p><p><b>Output shape.</b> Same padding with F = 5 means P = (5−1)/2 = 2, so the spatial size is preserved at 14 × 14. Depth = K = 128.</p><p>Output = <b>(14, 14, 128)</b>.</p><p>Observe that C_in = 64 dominates the count — had the input been depth 3, the layer would need only 9,728 parameters. Deep layers are expensive because of their input depth, not their spatial size.</p>"},
  {id:"m3t7p3",d:"moderate",q:"Why does the parameter count not depend on the input image size, and what does depend on it?",hint:"Distinguish what is stored from what is computed.",a:"<p><b>Why the count is independent.</b> A convolution layer stores one set of weights per filter, and those weights are <b>reused at every spatial position</b>. A 3×3 filter has 9 weights whether it slides over a 10×10 image or a 10,000×10,000 one — the number of positions changes, but the weights being applied do not. This is weight sharing, and it is the defining property of convolution.</p><p><b>What does depend on image size:</b></p><p><b>Computation.</b> The number of multiply-accumulate operations is (output positions) × (weights per filter) × (filters), and the output positions scale with the image area. Doubling each dimension quadruples the computation while leaving the parameter count untouched.</p><p><b>Activation memory.</b> The feature maps themselves scale with image area, and during training every intermediate activation must be stored for backpropagation. This, not the parameters, is usually what limits batch size on a GPU.</p><p><b>The fully connected layers.</b> If the network ends with flatten-then-dense, the flattened vector's length scales with the final feature map area, so the first dense layer's parameter count <i>does</i> depend on input size. This is exactly why architectures fix their input dimensions — AlexNet requires 227×227 — and why global average pooling was later introduced to remove the dependence.</p>"}],
 questions:[
  {q:"Given filters = 1, kernel size = (3,3) and input shape = (10,10,1), calculate the number of parameters and the output shape.",marks:5,d:"moderate",priority:"high",source:"source"},
  {q:"Compare the number of parameters in a convolution layer with an equivalent fully connected layer, and explain the difference.",marks:10,d:"moderate",priority:"high",source:"source"}]},

{id:"m3t8",m:"m3",title:"CNN Architecture and the Classification Pipeline",type:"theory",priority:"high",los:["3.3"],
 src:"Module 3 deck, slides 34–37, 53–54",
 summary:"The three layer types and the six-step pipeline the deck lists for classifying an image.",
 whatIs:"<p>The deck states that a convolution neural network has multiple hidden layers that help in extracting information from an image, and names <b>three important layers</b>: convolution, pooling, and fully connected.</p>",
 concept:"<h4>The three layers</h4><div class='scroll'><table>"+
  "<tr><th>Layer</th><th>Job</th><th>Parameters</th></tr>"+
  "<tr><td><b>Convolution</b></td><td>Extract features by sliding learned filters over the input</td><td>Yes — the filters</td></tr>"+
  "<tr><td><b>Pooling</b></td><td>Downsample, keeping the strongest evidence</td><td><b>None</b></td></tr>"+
  "<tr><td><b>Fully connected</b></td><td>Combine all features and classify</td><td>Yes — the largest share</td></tr></table></div>"+
  "<h4>The classification process — the deck's six steps</h4><ol>"+
  "<li>The pixels from the image are fed to the convolutional layer, which performs the convolution operation.</li>"+
  "<li>This results in a <b>convolved map</b>.</li>"+
  "<li>The convolved map is applied to a <b>ReLU</b> function to generate a <b>rectified feature map</b>.</li>"+
  "<li>The image is processed with <b>multiple convolution and ReLU layers</b> for locating the features.</li>"+
  "<li>Different <b>pooling layers</b> with various filters are used to identify specific parts of the image.</li>"+
  "<li>The pooled feature map is <b>flattened</b> and fed to a <b>fully connected layer</b> to get the final output.</li></ol>"+
  "<div class='eqb'>INPUT → [CONV → ReLU → POOL] × n → FLATTEN → FC → SOFTMAX → OUTPUT</div>"+
  "<p>The deck's own pipeline diagram lists it as: input image → convolution (detect strokes) → ReLU → pooling (detect shapes) → convolution (detect digits/symbols) → ReLU → pooling → flatten → fully connected → softmax → final prediction.</p>"+
  "<h4>The two halves</h4>"+
  "<p>The deck's bird-classification diagram splits the network explicitly: <b>feature extraction in multiple hidden layers</b> (the convolution, ReLU and pooling stack) and <b>classification in the output layer</b> (the fully connected part). This division is worth stating in any architecture answer — it explains why the convolutional part of a trained network can be reused for a different task with only the classifier replaced.</p>",
 needToKnow:["Name the three layers and what each does","Give the six-step classification process in order","Write the pipeline as a block diagram","Split the architecture into feature extraction and classification","State that pooling has no parameters"],
 recognition:{clues:["'CNN architecture', 'explain the layers'","'Classification process', 'how does a CNN classify an image'","A block-diagram question"],
  wording:["Explain CNN architecture with a neat diagram.","Describe the classification process in a CNN step by step.","What are the three important layers in a CNN?"],
  firstMove:"Draw the block diagram INPUT → [CONV → ReLU → POOL] × n → FLATTEN → FC → SOFTMAX first, then annotate each block.",
  trap:"Omitting ReLU from the pipeline. The deck lists it as a distinct step producing the rectified feature map, and skipping it loses a mark."},
 examAnswer:[
  {marks:5,body:"<p>The three layers with their jobs, the block diagram, and the six-step process listed in order.</p>"},
  {marks:10,body:"<p>All of the above plus: what each stage detects, from strokes to shapes to objects; the feature-extraction versus classification split; and a shape trace showing how the tensor changes at each stage.</p>"}],
 mistakes:["Leaving out ReLU","Putting flatten before pooling","Saying pooling has learnable filters — its 'filters' are fixed windows","Forgetting softmax at the output for multi-class classification","Describing the layers without describing the order they appear in"],
 examples:[{id:"m3t8e1",title:"Tracing an image through the full pipeline",q:"Trace a 32×32×3 image through: Conv(32 filters, 3×3, same) → ReLU → MaxPool(2×2, s=2) → Conv(64, 3×3, same) → ReLU → MaxPool(2×2, s=2) → Flatten → FC(128) → FC(10) → Softmax. Give every shape.",
  steps:["<b>Input:</b> 32 × 32 × 3","<b>Conv 32, same:</b> spatial unchanged, depth = 32 → 32 × 32 × 32","<b>ReLU:</b> element-wise, shape unchanged → 32 × 32 × 32","<b>MaxPool 2×2, s=2:</b> ⌊(32−2)/2⌋+1 = 16, depth unchanged → 16 × 16 × 32","<b>Conv 64, same:</b> → 16 × 16 × 64","<b>ReLU:</b> → 16 × 16 × 64","<b>MaxPool:</b> ⌊(16−2)/2⌋+1 = 8 → 8 × 8 × 64","<b>Flatten:</b> 8 × 8 × 64 = 4,096 → a vector of length 4,096","<b>FC(128):</b> → 128","<b>FC(10):</b> → 10","<b>Softmax:</b> → 10 probabilities summing to 1"],
  answer:"32×32×3 → 32×32×32 → 16×16×32 → 16×16×64 → 8×8×64 → <b>4096</b> → 128 → 10 → 10 probabilities.",
  trap:"Notice the two opposing trends: spatial size falls 32 → 16 → 8 while depth rises 3 → 32 → 64. This is the deliberate trade described under striding for hierarchies — resolution is exchanged for feature variety. Note also where the parameters concentrate: the first FC layer needs 4,096 × 128 = 524,288 weights, far more than both convolution layers combined, which is why later architectures replaced flatten with global average pooling."}],
 practice:[
  {id:"m3t8p1",d:"easy",q:"Name the three important layers in a CNN and state what each does.",hint:"Extract, reduce, classify.",a:"<p><b>Convolution layer</b> — extracts features by sliding learned filters over the input, producing feature maps. It has learnable parameters: the filter weights and biases.</p><p><b>Pooling layer</b> — downsamples the feature map, keeping the strongest evidence and discarding precise position. It has <b>no learnable parameters</b>; max and average are fixed operations.</p><p><b>Fully connected layer</b> — takes the flattened feature vector and combines all features to produce the final classification. It holds the largest share of a typical CNN's parameters.</p>"},
  {id:"m3t8p2",d:"moderate",q:"Give the six-step classification process of a CNN in order.",hint:"Follow the pixels to the prediction.",a:"<p><b>1.</b> The pixels from the image are fed to the convolutional layer, which performs the convolution operation.</p><p><b>2.</b> This results in a <b>convolved map</b>.</p><p><b>3.</b> The convolved map is applied to a <b>ReLU</b> function, generating a <b>rectified feature map</b> — this introduces non-linearity and sets all negative values to zero.</p><p><b>4.</b> The image is processed with <b>multiple convolution and ReLU layers</b> to locate features of increasing complexity.</p><p><b>5.</b> <b>Pooling layers</b> with various filters downsample the maps and identify specific parts of the image.</p><p><b>6.</b> The pooled feature map is <b>flattened</b> into a vector and fed to a <b>fully connected layer</b>, whose output (through softmax) is the final prediction.</p><div class='eqb'>INPUT → [CONV → ReLU → POOL] × n → FLATTEN → FC → SOFTMAX → OUTPUT</div>"},
  {id:"m3t8p3",d:"moderate",q:"Why is a CNN described as having two halves, and what practical consequence does that have?",hint:"Which part depends on the specific classes?",a:"<p><b>The two halves.</b> The <b>feature extraction</b> half is the stack of convolution, ReLU and pooling layers, which converts raw pixels into a vector of learned features. The <b>classification</b> half is the fully connected layers plus softmax, which maps that feature vector to class probabilities. The deck's bird diagram labels these explicitly.</p><p><b>Why the split matters.</b> The features learned by the convolutional half — edges, textures, shapes, object parts — are largely <i>generic</i>. Edge detectors useful for recognising birds are equally useful for recognising cars. Only the classification half is specific to the particular set of classes.</p><p><b>The practical consequence is transfer learning.</b> Take a network trained on a million images, discard the final fully connected layers, keep the convolutional half with its learned filters frozen, and attach a small new classifier for your own classes. You then train only the new part, which needs far less data and far less computation than training from scratch — often a few hundred images rather than a million.</p><p>This is why the syllabus lists transfer learning as a Module 1 self-learning topic: the architectural split described here is what makes it possible.</p>"}],
 questions:[
  {q:"Explain CNN architecture with a neat diagram, naming the three important layers.",marks:10,d:"easy",priority:"high",source:"source"},
  {q:"Describe the classification process in a CNN step by step.",marks:10,d:"moderate",priority:"high",source:"source"}]},

{id:"m3t9",m:"m3",title:"Convolution Layer and ReLU Rectification",type:"theory",priority:"high",los:["3.3"],
 src:"Module 3 deck, slides 38–42",
 summary:"The first extraction step, and why a ReLU immediately follows every convolution.",
 whatIs:"<p>The deck calls the convolution layer the first step in the process of extracting valuable features from an image, and states that it has several filters that perform the convolution operation. The ReLU that follows converts the raw convolved map into a rectified feature map.</p>",
 concept:"<h4>The convolution layer</h4>"+
  "<p>A convolution layer holds <b>several filters</b>, not one. Each filter learns to detect a different pattern — one might respond to horizontal edges, another to vertical edges, another to a particular texture. Each produces its own feature map, and the maps are stacked to form the layer's output depth.</p>"+
  "<p>The deck gives the size relation in textbook form: convolving in layer q, the filter can be aligned at L<sub>q+1</sub> = (L<sub>q</sub> − F<sub>q</sub> + 1) positions along the height and B<sub>q+1</sub> = (B<sub>q</sub> − F<sub>q</sub> + 1) along the width, giving L<sub>q+1</sub> × B<sub>q+1</sub> dot products, which defines the size of the next hidden layer.</p>"+
  "<h4>ReLU rectification</h4>"+
  "<p>The deck's statement: once the feature maps are extracted, the next step is to move them to a ReLU layer. ReLU performs an <b>element-wise</b> operation and sets all the negative pixels to 0. It introduces <b>non-linearity</b> to the network, and the generated output is a <b>rectified feature map</b>.</p>"+
  "<h4>Why ReLU, and why here</h4><ol>"+
  "<li><b>Non-linearity.</b> Convolution is a linear operation — a weighted sum. Without an activation between them, stacked convolution layers would collapse into a single convolution, exactly as Module 2's collapse argument shows. ReLU is what makes depth meaningful.</li>"+
  "<li><b>Discarding negative evidence.</b> A negative convolution response means the patch is the <i>opposite</i> of what the filter looks for. For detection, absence is not useful information — you want to know where the feature <i>is</i>. Zeroing negatives keeps only positive evidence.</li>"+
  "<li><b>Sparsity and gradient flow.</b> Roughly half the responses become exactly zero, which is efficient. And ReLU's derivative is exactly 1 for positive inputs, so gradients pass back through many layers undiminished — essential for the deep stacks CNNs use.</li></ol>"+
  "<div class='box tip'><h5>Where the non-linearity actually lives</h5><p>Convolution is linear. Pooling with max is non-linear but has no parameters. <b>ReLU is the only place a learnable convolutional stack gets its non-linearity</b>, which is why it appears after every convolution and not occasionally.</p></div>",
 needToKnow:["State that a convolution layer holds several filters, each producing one map","Give the layer-size relation L_{q+1} = L_q − F_q + 1","State that ReLU is element-wise and sets negatives to zero","Name the output a rectified feature map","Give three reasons ReLU follows convolution"],
 recognition:{clues:["'Convolved map', 'rectified feature map'","'Why is ReLU used in a CNN?'","A question about the first layer or feature extraction"],
  wording:["Explain the convolution layer and the role of ReLU in a CNN.","What is a rectified feature map?","Why is a ReLU applied after every convolution layer?"],
  firstMove:"Name the two outputs precisely — convolved map, then rectified feature map. The deck uses these terms and examiners look for them.",
  trap:"Saying ReLU 'reduces the size of the feature map'. It is element-wise, so the shape is completely unchanged; only pooling and stride change size."},
 examAnswer:[
  {marks:5,body:"<p>The convolution layer with multiple filters; ReLU as element-wise zeroing of negatives producing the rectified feature map; and the non-linearity reason.</p>"},
  {marks:10,body:"<p>All of the above plus the layer-size relation; all three reasons for ReLU; the collapse argument applied to stacked convolutions; and one line that ReLU does not change the shape.</p>"}],
 mistakes:["Thinking ReLU changes the feature map size","Saying the convolution layer has one filter","Omitting non-linearity as the reason for ReLU","Confusing the convolved map with the rectified feature map","Placing ReLU after pooling only, rather than after each convolution"],
 examples:[{id:"m3t9e1",title:"Convolved map to rectified feature map",q:"A convolution produces the map [[−74, 12, −5],[30, −18, 44],[−2, 0, 61]]. Give the rectified feature map and state its shape. What fraction of the responses survive?",
  steps:["ReLU is element-wise: f(z) = max(0, z), applied to each value independently.","Row 1: max(0,−74) = 0, max(0,12) = 12, max(0,−5) = 0 → [0, 12, 0]","Row 2: max(0,30) = 30, max(0,−18) = 0, max(0,44) = 44 → [30, 0, 44]","Row 3: max(0,−2) = 0, max(0,0) = 0, max(0,61) = 61 → [0, 0, 61]","Shape: 3 × 3 before and 3 × 3 after — unchanged.","Non-zero values: 12, 30, 44, 61 — four of nine."],
  answer:"Rectified feature map = <b>[[0,12,0],[30,0,44],[0,0,61]]</b>, shape <b>3 × 3</b>, unchanged. Four of nine responses survive, about 44%.",
  trap:"The −74 came from the sharpen-filter example earlier: that patch was strongly the <i>opposite</i> of what the filter detects. ReLU discards it entirely, which is correct for detection — the question is where the feature is, not where its inverse is. Note that ReLU changes the values but never the shape; students who write '2×2' have confused it with pooling."}],
 practice:[
  {id:"m3t9p1",d:"easy",q:"What does the ReLU layer do in a CNN, and what is its output called?",hint:"Element-wise, and it has a specific name in the deck.",a:"<p>ReLU performs an <b>element-wise</b> operation on the convolved map, setting all negative values to 0 and leaving positive values unchanged: f(z) = max(0, z).</p><p>Its output is called the <b>rectified feature map</b>.</p><p>Its primary purpose is to introduce <b>non-linearity</b> into the network. The shape of the map is completely unchanged — ReLU alters values, never dimensions.</p>"},
  {id:"m3t9p2",d:"moderate",q:"Give three reasons ReLU follows every convolution layer.",hint:"One is structural, one is about what the values mean, one is about gradients.",a:"<p><b>1 — Non-linearity.</b> Convolution is a linear operation. Without an activation between them, two stacked convolutions compose into a single equivalent convolution, exactly as Module 2's collapse argument shows for dense layers. ReLU breaks the composition and is what makes a deep stack more expressive than a shallow one.</p><p><b>2 — Discarding negative evidence.</b> A negative convolution response means the patch resembles the <i>inverse</i> of the pattern the filter detects. For feature detection this is not useful — you want to know where the feature is present, not where its opposite is. Zeroing negatives keeps only positive evidence and makes the map directly interpretable as 'how strongly is this feature here'.</p><p><b>3 — Sparsity and gradient flow.</b> Roughly half the responses become exactly zero, which is computationally efficient and acts as a mild regulariser. More importantly, ReLU's derivative is exactly 1 for positive inputs, so gradients pass backwards undiminished through many layers — essential for the deep stacks CNNs use, where sigmoid or tanh would vanish.</p>"},
  {id:"m3t9p3",d:"moderate",q:"Why does a convolution layer contain several filters rather than one?",hint:"Ask what one filter can detect.",a:"<p>Because <b>one filter detects exactly one pattern</b>. A filter is a fixed set of weights, so it responds strongly to one specific arrangement of values and weakly to everything else — a horizontal edge detector finds horizontal edges and is blind to vertical ones.</p><p>Recognising anything real requires many different features simultaneously: horizontal edges, vertical edges, diagonals, corners, textures, colour transitions. A layer with a single filter would reduce the image to a single kind of evidence and discard everything else.</p><p><b>How it works mechanically:</b> each filter slides over the whole input independently and produces its own feature map. With K filters you get K maps, stacked to form an output of depth K. The next layer's filters then span all K channels, letting them combine evidence across feature types — for example detecting a corner as the co-occurrence of a horizontal and a vertical edge.</p><p>This is also why filter counts grow with depth: AlexNet uses 96 filters in its first layer and 384 in its middle layers. Early layers need few, simple features; later layers need many, more specific ones.</p>"}],
 questions:[
  {q:"Explain the convolution layer and the role of ReLU rectification in a CNN.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"What is a rectified feature map? Why is ReLU applied after convolution?",marks:5,d:"easy",priority:"high",source:"source"}]}
];
