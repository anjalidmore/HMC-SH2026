 mistakes:["Transposing the weight matrices","Counting the input layer as a layer with weights — it has none","Forgetting biases in the parameter count","Saying feed-forward means 'trained with forward propagation only'; training also runs backwards, but the <i>architecture</i> is feed-forward","Claiming zero initialisation is fine because gradients will separate the units — they will not, since identical units receive identical gradients forever"],
 examples:[
  {id:"m2t1e1",title:"Shapes and parameter count",q:"A network has 4 inputs, hidden layers of 5 and 3 units, and 2 outputs. Give every weight matrix and bias shape and the total parameter count.",
   steps:["Layer 1: from 4 inputs to 5 units. W⁽¹⁾ is 5 × 4, b⁽¹⁾ is 5 × 1. Parameters: 20 + 5 = 25.","Layer 2: from 5 to 3. W⁽²⁾ is 3 × 5, b⁽²⁾ is 3 × 1. Parameters: 15 + 3 = 18.","Layer 3: from 3 to 2. W⁽³⁾ is 2 × 3, b⁽³⁾ is 2 × 1. Parameters: 6 + 2 = 8.","Total: 25 + 18 + 8 = 51."],
   answer:"W⁽¹⁾ 5×4, W⁽²⁾ 3×5, W⁽³⁾ 2×3; biases 5×1, 3×1, 2×1. <b>51 learnable parameters</b> in total.",
   trap:"The rule is always (units in this layer) × (units in previous layer). Reading it the other way round gives 4×5 and the matrix multiplication will not conform."},
  {id:"m2t1e2",title:"Why zero initialisation fails",q:"All weights and biases are initialised to zero. Show that every unit in a hidden layer stays identical forever.",
   steps:["Forward pass: every hidden unit computes z = Σ0·xᵢ + 0 = 0, so every unit in the layer produces the identical activation f(0).","Backward pass: because the units have identical outputs and identical outgoing weights (all zero), they receive identical gradients.","Update: identical gradients produce identical weight changes, so after the update all units in the layer still have identical weights.","By induction this holds for every subsequent step."],
   answer:"Every unit in a hidden layer remains identical at every step. The layer has the representational power of a <b>single</b> unit no matter how many units it contains — the symmetry never breaks.",
   trap:"Random initialisation is not a convenience or a speed trick; it is what makes a wide layer meaningful at all. Note that biases <i>may</i> safely be initialised to zero, because the weights being random is already enough to break the symmetry."}],
 practice:[
  {id:"m2t1p1",d:"easy",q:"Write the matrix equations of an MLFFNN and state the dimensions of W⁽ˡ⁾ and b⁽ˡ⁾.",hint:"One equation for the pre-activation, one for the activation.",a:"<div class='eqb'>z⁽ˡ⁾ = W⁽ˡ⁾ a⁽ˡ⁻¹⁾ + b⁽ˡ⁾\na⁽ˡ⁾ = f(z⁽ˡ⁾)          with a⁽⁰⁾ = x</div><p>If layer ℓ−1 has n units and layer ℓ has m units, then <b>W⁽ˡ⁾ is m × n</b> and <b>b⁽ˡ⁾ is m × 1</b>. The activation f is applied element-wise, so a⁽ˡ⁾ is also m × 1.</p>"},
  {id:"m2t1p2",d:"moderate",q:"Name six learning factors and state the effect of setting each too high and too low.",hint:"Most of them trade underfitting against overfitting.",a:"<p><b>Learning rate:</b> too low → very slow convergence; too high → overshoots and can diverge.</p><p><b>Number of hidden layers/units:</b> too few → underfits, cannot represent the pattern; too many → overfits and memorises.</p><p><b>Batch size:</b> too small → noisy, unstable updates; too large → smooth but slow per epoch and often generalises worse.</p><p><b>Number of epochs:</b> too few → underfits, stopped before learning; too many → overfits, continues past the optimum.</p><p><b>Weight initialisation:</b> all zeros → symmetry never breaks and a layer acts as one unit; too large → activations saturate and gradients vanish.</p><p><b>Choice of activation:</b> saturating functions such as sigmoid → vanishing gradients in deep networks; unbounded ones such as ReLU → risk of dead units.</p>"},
  {id:"m2t1p3",d:"moderate",q:"What does 'feed-forward' forbid, and what kind of network results if you allow it?",hint:"Think about connections within and backwards.",a:"<p>Feed-forward forbids any connection from a unit to a unit in its own layer or in an earlier layer — that is, it forbids cycles in the computation graph. Information moves strictly input → hidden → output.</p><p><b>Consequences:</b> the network is a single composed function of the current input; it has no memory of previous inputs; and every input must be the same fixed size.</p><p><b>Allowing cycles</b> gives a <b>recurrent neural network</b>, in which a unit's output feeds back as part of its own next input. That feedback carries a hidden state across time steps, which lets the network handle variable-length sequences and remember earlier context — at the cost of needing backpropagation through time and facing vanishing and exploding gradients. That is Module 5, outside the MSE scope.</p>"}],

{id:"m2t2",m:"m2",title:"Forward Propagation",type:"problem-solving",priority:"high",los:["2.1"],
 src:"Module 2 deck, slides 28, 231–235 (Training FF DNN Ex1 and Ex2)",
 summary:"Pushing an input through every layer to a prediction — where most numericals start.",
 whatIs:"<p>Forward propagation is the computation of the network's output from its input: at each layer, take a weighted sum, add the bias, apply the activation, and pass the result on.</p>",
 concept:"<h4>The procedure</h4><ol>"+
  "<li>Set a⁽⁰⁾ = x.</li>"+
  "<li>For each layer ℓ = 1 … L: compute z⁽ˡ⁾ = W⁽ˡ⁾a⁽ˡ⁻¹⁾ + b⁽ˡ⁾, then a⁽ˡ⁾ = f(z⁽ˡ⁾).</li>"+
  "<li>The final a⁽ᴸ⁾ is the prediction ŷ.</li>"+
  "<li>If a target is given, compute the loss.</li></ol>"+
  "<div class='box tip'><h5>Exam discipline</h5><p>Lay the work out as a table with one row per neuron and columns for z and a. Keep four decimal places until the final answer — rounding to two decimals at every hidden unit compounds into a visibly wrong output by the third layer.</p></div>"+
  "<h4>The deck's Example 1, verified</h4>"+
  "<p>Input x = [2, 2, 1] (the third entry being the bias input), hidden weight matrix with columns (−4, −1, 12) and (−1/5, −1, 3), sigmoid activation, then output weights (1.5, 1, 0.5).</p>"+
  "<div class='eqb'>h₁ = 2(−4) + 2(−1) + 1(12)   = −8 − 2 + 12 = 2.0\nh₂ = 2(−1/5) + 2(−1) + 1(3) = −0.4 − 2 + 3 = 0.6\n\na₁ = σ(2.0) = 0.8808 → 0.88\na₂ = σ(0.6) = 0.6457 → 0.65   (deck shows 0.64)\n\nz  = 0.88(1.5) + 0.64(1) + 1(0.5) = 1.32 + 0.64 + 0.5 = 2.46\nŷ  = σ(2.46) = 0.9214 → 0.92</div>"+
  "<div class='box warning'><h5>Recomputed</h5><p>Every figure above was independently recomputed and matches the deck, with one exception: σ(0.6) = 0.6457, which rounds to 0.65 rather than the 0.64 printed. The deck's own downstream arithmetic uses 0.64 and reaches 2.46 and 0.92, so its final answer is self-consistent. Use the lecturer's chain if reproducing this example; carry 0.6457 if computing from scratch.</p></div>",
 needToKnow:["Carry out forward propagation layer by layer with a table","Apply sigmoid correctly and keep four decimals","Handle the bias either as an explicit +b or as an always-on input","Compute the loss once the output is reached","State the shapes at each step as a check"],
 recognition:{clues:["Weights and an input vector are given with no target update requested","'Compute the output of the network'","'Perform forward propagation' or 'find the predicted output'","A network diagram annotated with numeric weights"],
  wording:["Perform forward propagation for the given network and input.","Compute the output of the neural network shown, using sigmoid activation.","Find the total error for the given network and target."],
  firstMove:"Write the layer-1 pre-activations for every hidden unit before applying any activation. Doing all the sums first, then all the activations, prevents the single most common slip.",
  trap:"Forgetting the bias at the output layer. It is easy to remember biases in the hidden layer and lose the one at the end."},
 examAnswer:[
  {marks:5,body:"<p>Show z and a for every unit in a table, then the final output. State the activation used. Full working is the answer; a bare number earns little.</p>"},
  {marks:10,body:"<p>The full table plus: the network diagram annotated with the given weights; the loss computed against the target; and a closing line identifying which output unit dominates and why.</p>"}],
 mistakes:["Rounding to two decimals at every intermediate step","Applying the activation before adding the bias","Using the raw inputs at layer 2 instead of layer 1's activations","Forgetting that the same activation is applied element-wise, not to the sum of the layer","Mixing up which weight connects which pair of units when reading a diagram"],
 examples:[
  {id:"m2t2e1",title:"The classic two-layer forward pass (deck Example 2, solved)",q:"i₁ = 0.05, i₂ = 0.10. Hidden weights w₁ = 0.15, w₂ = 0.20, w₃ = 0.25, w₄ = 0.30 with b₁ = 0.35. Output weights w₅ = 0.40, w₆ = 0.45, w₇ = 0.50, w₈ = 0.55 with b₂ = 0.60. Sigmoid throughout. Targets 0.01 and 0.99. Find both outputs and the total error.",
   steps:["net_h1 = w₁i₁ + w₂i₂ + b₁ = 0.15(0.05) + 0.20(0.10) + 0.35 = 0.0075 + 0.02 + 0.35 = 0.3775","out_h1 = σ(0.3775) = 1/(1 + e^−0.3775) = 0.59327","net_h2 = w₃i₁ + w₄i₂ + b₁ = 0.25(0.05) + 0.30(0.10) + 0.35 = 0.0125 + 0.03 + 0.35 = 0.3925","out_h2 = σ(0.3925) = 0.59688","net_o1 = w₅·out_h1 + w₆·out_h2 + b₂ = 0.40(0.59327) + 0.45(0.59688) + 0.60 = 1.10591","out_o1 = σ(1.10591) = 0.75137","net_o2 = w₇·out_h1 + w₈·out_h2 + b₂ = 0.50(0.59327) + 0.55(0.59688) + 0.60 = 1.22492","out_o2 = σ(1.22492) = 0.77293","E_o1 = ½(0.01 − 0.75137)² = ½(0.74137)² = 0.27481","E_o2 = ½(0.99 − 0.77293)² = ½(0.21707)² = 0.02356","E_total = 0.27481 + 0.02356 = 0.29837"],
   answer:"out_o1 = <b>0.75137</b>, out_o2 = <b>0.77293</b>, E_total = <b>0.29837</b>.",
   trap:"<b>Note on the source.</b> The Module 2 deck presents this network on slide 235 as 'Training FF DNN – Ex2' but gives only the diagram; no solution appears. The working above is computed from the deck's own numbers and independently verified. Note that b₁ is shared by both hidden units and b₂ by both output units — a single bias per layer, not per unit."},
  {id:"m2t2e2",title:"A three-input single hidden layer pass",q:"x = (1, 0, 2). Hidden layer of two units with W = [[0.5, −1, 0.25], [1, 0.5, −0.5]] and b = (0.1, −0.2), ReLU activation. Output unit with w = (2, −1), b = 0.5, linear activation. Find the output.",
   steps:["z₁ = 0.5(1) + (−1)(0) + 0.25(2) + 0.1 = 0.5 + 0 + 0.5 + 0.1 = 1.1","z₂ = 1(1) + 0.5(0) + (−0.5)(2) + (−0.2) = 1 + 0 − 1 − 0.2 = −0.2","a₁ = ReLU(1.1) = 1.1","a₂ = ReLU(−0.2) = 0   ← the unit is switched off for this input","Output: z = 2(1.1) + (−1)(0) + 0.5 = 2.2 + 0 + 0.5 = 2.7","Linear activation, so ŷ = 2.7."],
   answer:"ŷ = <b>2.7</b>.",
   trap:"The second hidden unit outputs exactly 0, so its outgoing weight of −1 contributes nothing. This is ReLU sparsity in action — and it is also why that unit will receive zero gradient on this example, which is the seed of the dying-ReLU problem."}],
 practice:[
  {id:"m2t2p1",d:"easy",q:"A single neuron has w = (0.6, −0.4), b = 0.2 and sigmoid activation. Find its output for x = (2, 1).",hint:"z first, then σ(z).",a:"<p>z = 0.6(2) + (−0.4)(1) + 0.2 = 1.2 − 0.4 + 0.2 = <b>1.0</b></p><p>σ(1.0) = 1/(1 + e^−1) = 1/(1 + 0.36788) = 1/1.36788 = <b>0.7311</b></p>"},
  {id:"m2t2p2",d:"moderate",q:"Reproduce the deck's Example 1: x = [2, 2, 1], hidden weights giving h₁ and h₂, sigmoid, then output weights (1.5, 1, 0.5) with sigmoid. Show every step.",hint:"Two hidden pre-activations, two sigmoids, then one output.",a:"<div class='eqb'>h₁ = 2(−4) + 2(−1) + 1(12)    = −8 − 2 + 12 = 2.0\nh₂ = 2(−0.2) + 2(−1) + 1(3)  = −0.4 − 2 + 3 = 0.6\n\na₁ = σ(2.0) = 0.8808\na₂ = σ(0.6) = 0.6457\n\nz  = 0.88(1.5) + 0.64(1) + 1(0.5)\n   = 1.32 + 0.64 + 0.50 = 2.46\nŷ  = σ(2.46) = 0.9214</div><p>Final output ≈ <b>0.92</b>. All values independently recomputed and matching the deck, except that σ(0.6) = 0.6457 rounds to 0.65 rather than the 0.64 shown; the deck's chain uses 0.64 and remains self-consistent.</p>"},
  {id:"m2t2p3",d:"moderate",q:"Why must you keep four decimal places through a multi-layer forward pass?",hint:"Consider what happens to a rounding error as it passes through more layers.",a:"<p>Because rounding errors compound multiplicatively. An error of 0.005 introduced at a hidden unit is multiplied by that unit's outgoing weight, added to errors from sibling units, then passed through another activation and multiplied again. With weights above 1 in magnitude the error grows at each layer.</p><p>Concretely in the deck's Example 1: rounding σ(0.6) to 0.64 rather than 0.6457 introduces an error of 0.0057. Multiplied by the outgoing weight of 1 it shifts z from 2.4657 to 2.46, and the final output from 0.9218 to 0.9214. Small here — but in a network with five layers and weights of magnitude 2, the same initial error would be amplified by roughly 2⁵ = 32.</p><p>The practical rule: round only the final answer, and state the precision you carried.</p>"},
  {id:"m2t2p4",d:"hard",q:"For the deck's Example 2 network, compute E_total and explain why one output contributes over ten times as much error as the other.",hint:"Compare each output to its own target.",a:"<p>From the forward pass: out_o1 = 0.75137 with target 0.01, and out_o2 = 0.77293 with target 0.99.</p><div class='eqb'>E_o1 = ½(0.01 − 0.75137)² = ½(0.74137)² = 0.27481\nE_o2 = ½(0.99 − 0.77293)² = ½(0.21707)² = 0.02356\nE_total = 0.29837</div><p><b>Why the imbalance:</b> the two outputs are numerically close to each other (0.751 and 0.773) but their targets are at opposite ends (0.01 and 0.99). Output 1 is therefore wrong by 0.741 while output 2 is wrong by only 0.217 — a factor of 3.4 in the raw error.</p><p>Squaring amplifies that gap: 3.4² ≈ 11.7, which is why E_o1 is 11.7 times E_o2. This is the defining behaviour of squared error — large errors are penalised disproportionately — and it means the first weight update will be dominated almost entirely by correcting output 1.</p>"}],

{id:"m2t3",m:"m2",title:"Why Activation Functions? Linear Activation and Its Limits",type:"theory",priority:"high",los:["2.1","2.2"],
 src:"Module 2 deck, slides 45–50",
 summary:"The collapse argument, and why a linear activation is only ever used at a regression output.",
 whatIs:"<p>An activation function is the non-linear function applied to each neuron's weighted sum. The deck calls activations 'the architectural joints that allow networks to fold, adapt and model true complex behaviour' — and states plainly that without them a 100-layer network behaves merely as a single flat layer.</p>",
 concept:"<h4>The collapse argument — the reason activations exist</h4>"+
  "<div class='eqb'>Two linear layers:  y = W₂(W₁x + b₁) + b₂\n                     = (W₂W₁)x + (W₂b₁ + b₂)\n                     = W′x + b′        ← a SINGLE linear layer</div>"+
  "<p>Composing linear maps gives a linear map. Any depth of purely linear network is therefore exactly equivalent to one layer, and can only represent linearly separable problems — so XOR remains unsolvable no matter how many layers you stack. Inserting a non-linear f between the linear maps breaks the composition and is what makes depth mean something.</p>"+
  "<h4>Linear activation, f(z) = z</h4><div class='scroll'><table>"+
  "<tr><th></th><th></th></tr>"+
  "<tr><td><b>Definition</b></td><td>f(z) = z, identity; range (−∞, +∞)</td></tr>"+
  "<tr><td><b>Derivative</b></td><td>f′(z) = 1, constant everywhere</td></tr>"+
  "<tr><td><b>Pro</b></td><td>Output is unbounded, so it can represent any real value — necessary for regression</td></tr>"+
  "<tr><td><b>Con 1</b></td><td>Stacking it collapses the network, so it is useless in hidden layers</td></tr>"+
  "<tr><td><b>Con 2</b></td><td>Its derivative is a constant 1, so the gradient carries no information about z — every weight in the layer receives a signal independent of how strongly that unit was activated</td></tr></table></div>"+
  "<div class='box tip'><h5>Where linear activation is genuinely correct</h5><p>At the <b>output layer of a regression problem</b>, and nowhere else. Predicting a student's final marks, a house price or a temperature requires an unbounded output, and squashing it through a sigmoid would cap it at 1. The deck's 'Task 1: Predicting Final Marks' uses exactly this pairing: linear output with MSE loss.</p></div>",
 needToKnow:["State and prove the collapse argument","Give f(z) = z, its range and its derivative","Name the one correct use of linear activation","Explain both cons: collapse and constant derivative","Connect this to why XOR needs non-linearity, not just depth"],
 recognition:{clues:["'Why do we need activation functions?'","'What happens if no activation is used?'","A regression task with an unbounded target"],
  wording:["Why are activation functions required in a neural network?","Explain the linear activation function with its advantages and limitations.","What happens if a deep network uses only linear activations?"],
  firstMove:"Write W₂(W₁x) = (W₂W₁)x on the first line. That equation is the entire answer to 'why do we need activation functions', and everything else elaborates it.",
  trap:"Saying activations are needed 'to keep the output in a range'. Some do bound the output, but the fundamental reason is the collapse — ReLU is unbounded above and is still essential."},
 examAnswer:[
  {marks:5,body:"<p>(1) The collapse argument in symbols. (2) The consequence: any depth of linear network equals one layer, so XOR stays unsolvable. (3) Definition, range and derivative of the linear activation. (4) Its two cons. (5) The one place it is correct — regression output.</p>"},
  {marks:10,body:"<p>All of the above, plus a numeric demonstration of the collapse with explicit small matrices, a paragraph on why the constant derivative is separately harmful for learning, and a closing line that this argument is what motivates every activation function that follows.</p>"}],
 mistakes:["Claiming activations are needed 'to introduce non-linearity' without saying what breaks without it","Saying a linear activation is never used — it is the correct choice at a regression output","Confusing the linear activation f(z)=z with the step function","Thinking more layers can compensate for missing non-linearity","Forgetting the second con, the constant derivative"],
 examples:[{id:"m2t3e1",title:"Watching a network collapse",q:"A network has W₁ = [[1, 2], [0, 1]], b₁ = (1, 0), W₂ = [1, −1], b₂ = 2, all activations linear. Find the equivalent single-layer network and verify on x = (3, 1).",
  steps:["Hidden: h = W₁x + b₁, so h₁ = x₁ + 2x₂ + 1 and h₂ = x₂.","Output: y = W₂h + b₂ = 1·h₁ + (−1)·h₂ + 2 = (x₁ + 2x₂ + 1) − x₂ + 2","= x₁ + x₂ + 3.","So the equivalent single layer is w′ = (1, 1), b′ = 3.","Verify with the two-layer path on x = (3,1): h₁ = 3 + 2 + 1 = 6, h₂ = 1, y = 6 − 1 + 2 = 7.","Verify with the collapsed form: y = 3 + 1 + 3 = 7 ✓"],
  answer:"The two-layer network is exactly <b>y = x₁ + x₂ + 3</b>, a single linear unit. The hidden layer, its four weights and its two biases contributed nothing that one unit could not.",
  trap:"The collapse is not an approximation — it is an exact algebraic identity. Adding twenty more linear layers would still produce a function of the form w′x + b′. This is why non-linearity is a structural requirement, not a performance tweak."}],
 practice:[
  {id:"m2t3p1",d:"easy",q:"Give the definition, range, derivative and one valid use of the linear activation function.",hint:"It is the identity.",a:"<p><b>Definition:</b> f(z) = z (the identity function).</p><p><b>Range:</b> (−∞, +∞) — unbounded in both directions.</p><p><b>Derivative:</b> f′(z) = 1, constant for every z.</p><p><b>Valid use:</b> at the output layer of a <b>regression</b> problem, where the target can be any real number — predicting marks, price, temperature. It must not be used in hidden layers, because stacking linear layers collapses the network to a single linear map.</p>"},
  {id:"m2t3p2",d:"moderate",q:"Prove that a network of linear layers is equivalent to one layer, and state two consequences.",hint:"Substitute one layer into the next.",a:"<p>Let h = W₁x + b₁ and y = W₂h + b₂ with no non-linearity. Substituting:</p><div class='eqb'>y = W₂(W₁x + b₁) + b₂ = (W₂W₁)x + (W₂b₁ + b₂) = W′x + b′</div><p>where W′ = W₂W₁ and b′ = W₂b₁ + b₂. The result is a single affine map, and induction extends this to any number of layers.</p><p><b>Consequence 1:</b> depth buys nothing in representational power. A 100-layer linear network can represent exactly the functions a 1-layer network can — the linearly separable ones. XOR remains impossible.</p><p><b>Consequence 2:</b> all the extra parameters are wasted. The network has many more weights than the equivalent single layer but no more expressive power, so it costs more to train and store while learning strictly less per parameter.</p>"},
  {id:"m2t3p3",d:"hard",q:"Beyond the collapse, why is a constant derivative of 1 a problem for learning?",hint:"What does the gradient of a weight depend on?",a:"<p>In backpropagation, the gradient reaching a weight is multiplied by f′(z) of the unit it feeds. With f′(z) = 1 that factor is the same for every unit and every input, so the gradient carries <b>no information about how strongly the unit was activated</b>.</p><p>Compare with a non-linear activation. Under ReLU, f′(z) = 0 when the unit was inactive, so a weight that had no influence on this example receives no update — the gradient is <i>routed</i> to the units that actually mattered. Under sigmoid, f′(z) is largest near z = 0 where the unit is most uncertain, so learning concentrates where the decision is closest to the boundary.</p><p>A constant derivative discards this routing entirely. Every unit is updated as if it had been equally responsible, which is precisely the blame-assignment failure that the perceptron rule's proportionality to xᵢ was designed to avoid. So the linear activation fails twice over: it removes representational power through collapse, and it removes the gradient's ability to distinguish responsible units from irrelevant ones.</p>"}],
 questions:[
  {q:"Why are activation functions required in a neural network? Prove your answer.",marks:5,d:"moderate",priority:"high",source:"source"},
  {q:"Explain the linear activation function with its advantages, limitations and one valid use case.",marks:5,d:"easy",priority:"high",source:"source"}]},

{id:"m2t4",m:"m2",title:"Sigmoid and Tanh Activations",type:"problem-solving",priority:"high",los:["2.2"],
 src:"Module 2 deck, slides 51–59",
 summary:"The two saturating S-curves, their derivatives, and the vanishing-gradient problem they cause.",
 whatIs:"<p>Sigmoid (logistic) and tanh are the two classical S-shaped activations. Both squash any real input into a bounded range, and both suffer from the same defect at their extremes.</p>",
 concept:"<h4>Sigmoid / Logistic</h4>"+
  "<div class='eqb'>σ(z) = 1 / (1 + e^−z)        range (0, 1)\nσ′(z) = σ(z)·(1 − σ(z))       max value 0.25 at z = 0</div>"+
  "<div class='scroll'><table><tr><th>z</th><th>−4</th><th>−2</th><th>0</th><th>2</th><th>4</th></tr>"+
  "<tr><td>σ(z)</td><td>0.018</td><td><b>0.12</b></td><td>0.50</td><td><b>0.88</b></td><td>0.982</td></tr>"+
  "<tr><td>σ′(z)</td><td>0.018</td><td>0.105</td><td><b>0.25</b></td><td>0.105</td><td>0.018</td></tr></table></div>"+
  "<p><b>Pros.</b> Output lies in (0, 1) so it reads directly as a probability — which is why it is the correct output activation for binary classification. It is smooth and differentiable everywhere.</p>"+
  "<p><b>Cons.</b> (1) <b>Vanishing gradients</b> — σ′ never exceeds 0.25, so every layer multiplies the backward signal by at most a quarter; after 5 layers the gradient is scaled by at most 0.25⁵ ≈ 0.001. (2) <b>Not zero-centred</b> — all outputs are positive, so all gradients on a unit's incoming weights share a sign, forcing inefficient zig-zag updates. (3) The exponential is computationally expensive.</p>"+
  "<h4>Tanh / Hyperbolic tangent</h4>"+
  "<div class='eqb'>tanh(z) = (e^z − e^−z)/(e^z + e^−z)   range (−1, +1)\ntanh′(z) = 1 − tanh²(z)               max value 1.0 at z = 0\n\nRelation:  tanh(z) = 2σ(2z) − 1</div>"+
  "<div class='scroll'><table><tr><th>z</th><th>−4</th><th>−2</th><th>0</th><th>2</th><th>4</th></tr>"+
  "<tr><td>tanh(z)</td><td>−0.999</td><td><b>−0.96</b></td><td>0.00</td><td><b>0.96</b></td><td>0.999</td></tr>"+
  "<tr><td>tanh′(z)</td><td>0.001</td><td>0.071</td><td><b>1.00</b></td><td>0.071</td><td>0.001</td></tr></table></div>"+
  "<p><b>Advantage over sigmoid.</b> Tanh is <b>zero-centred</b>, so outputs of either sign are possible and the zig-zag problem disappears. Its maximum derivative is 1 rather than 0.25, so gradients shrink four times more slowly per layer.</p>"+
  "<p><b>Still fails.</b> Tanh saturates just as hard — at z = 4 its derivative is 0.001, essentially zero. It reduces the vanishing-gradient problem but does not remove it, which is what motivates ReLU.</p>"+
  "<div class='box tip'><h5>The one-line comparison</h5><p>Tanh is a rescaled, recentred sigmoid: strictly better in hidden layers because it is zero-centred with a larger maximum gradient. Sigmoid keeps its place only where a probability output is needed.</p></div>",
 needToKnow:["Write both functions, their ranges and their derivatives","Quote σ′ max = 0.25 and tanh′ max = 1 and explain the consequence","Evaluate both at given z values","Explain the vanishing-gradient mechanism with the multiplication argument","State why zero-centring matters"],
 recognition:{clues:["A probability output is required","'S-shaped', 'squashing', 'saturating'","The range (0,1) or (−1,1) is stated","'Vanishing gradient'"],
  wording:["Explain the sigmoid activation function with its advantages and disadvantages.","Compare sigmoid and tanh activation functions.","Compute σ(2) and tanh(2).","Why does the sigmoid cause vanishing gradients?"],
  firstMove:"Write the function and its derivative together. Nearly every question about either activation turns on the derivative, not the function.",
  trap:"Saying sigmoid's derivative maximum is 1. It is 0.25, and that number is the whole vanishing-gradient argument."},
 examAnswer:[
  {marks:5,body:"<p>Function, range, derivative and the derivative's maximum. Two pros, two cons. One sentence on where it is correctly used.</p>"},
  {marks:10,body:"<p>Both functions with graphs, ranges and derivatives; a comparison table; the vanishing-gradient calculation carried through five layers with actual numbers; the zero-centring argument; and a closing line on why ReLU replaced both in hidden layers.</p>"}],
 mistakes:["Writing σ′(z) = σ(z) rather than σ(z)(1 − σ(z))","Giving tanh's range as (0, 1)","Claiming tanh removes vanishing gradients; it only reduces them","Forgetting the non-zero-centred criticism of sigmoid","Saying sigmoid is obsolete — it remains the correct binary-classification output activation"],
 examples:[
  {id:"m2t4e1",title:"Evaluating both activations and their derivatives",q:"Compute σ(2), σ(−2), tanh(2), tanh(−2), and the derivative of each activation at z = 2.",
   steps:["σ(2) = 1/(1 + e^−2) = 1/(1 + 0.13534) = 1/1.13534 = 0.8808","σ(−2) = 1/(1 + e^2) = 1/(1 + 7.38906) = 1/8.38906 = 0.1192","σ′(2) = σ(2)(1 − σ(2)) = 0.8808 × 0.1192 = 0.1050","tanh(2) = (e² − e^−2)/(e² + e^−2) = (7.38906 − 0.13534)/(7.38906 + 0.13534) = 7.25372/7.52440 = 0.9640","tanh(−2) = −0.9640 (tanh is an odd function)","tanh′(2) = 1 − tanh²(2) = 1 − 0.92929 = 0.0707"],
   answer:"σ(2) = <b>0.88</b>, σ(−2) = <b>0.12</b>, tanh(2) = <b>0.96</b>, tanh(−2) = <b>−0.96</b>. Derivatives at z = 2: σ′ = 0.105, tanh′ = 0.071. All four function values match the deck exactly.",
   trap:"Note the symmetry shortcut: σ(−z) = 1 − σ(z), so σ(−2) = 1 − 0.8808 = 0.1192 with no second exponential. And tanh(−z) = −tanh(z). Using these halves the work and halves the chance of an arithmetic slip."},
  {id:"m2t4e2",title:"How fast a gradient vanishes",q:"A 6-layer network uses sigmoid throughout, and every unit happens to sit at z = 0 where the derivative is largest. By what factor is the gradient at layer 1 reduced relative to the output? Repeat for tanh.",
   steps:["Backpropagation multiplies by f′(z) once per layer traversed. Reaching layer 1 from the output crosses 5 activation layers.","<b>Sigmoid, best case:</b> σ′ = 0.25 at every layer. Factor = 0.25⁵ = 1/1024 ≈ 0.00098.","<b>Tanh, best case:</b> tanh′ = 1.0 at every layer. Factor = 1⁵ = 1.0 — no shrinkage at all.","Realistically units do not sit at z = 0. At z = 2: σ′ = 0.105, giving 0.105⁵ ≈ 1.3 × 10⁻⁵. For tanh at z = 2: 0.071⁵ ≈ 1.8 × 10⁻⁶."],
   answer:"With sigmoid, even in the <b>best possible case</b>, the gradient at layer 1 is about <b>1/1000</b> of the output gradient. With tanh in the best case it is unchanged. Away from z = 0 both collapse, and tanh can be worse because its derivative falls faster once saturated.",
   trap:"Two subtleties worth stating in an answer. First, 0.25 is the <i>maximum</i> — the realistic factor is far smaller, so the true vanishing is much worse than the best case suggests. Second, tanh's advantage holds only near z = 0; once units saturate, tanh′ drops below σ′. Tanh's real advantage is that being zero-centred it keeps units near z = 0 more often."}],
 practice:[
  {id:"m2t4p1",d:"easy",q:"Write sigmoid and tanh with their ranges and derivatives, and give the maximum value of each derivative.",hint:"The maxima are the exam-critical numbers.",a:"<div class='eqb'>σ(z)    = 1/(1 + e^−z)        range (0, 1)\nσ′(z)   = σ(z)(1 − σ(z))     maximum 0.25 at z = 0\n\ntanh(z) = (e^z − e^−z)/(e^z + e^−z)   range (−1, +1)\ntanh′(z)= 1 − tanh²(z)                maximum 1.00 at z = 0</div><p>The two maxima are what drive every vanishing-gradient argument: sigmoid shrinks the backward signal by at least a factor of 4 per layer, tanh at best not at all.</p>"},
  {id:"m2t4p2",d:"moderate",q:"Compute σ(0.5), σ(−1.5), tanh(0.5) and tanh(−1.5).",hint:"Use σ(−z) = 1 − σ(z) and tanh(−z) = −tanh(z).",a:"<p>σ(0.5) = 1/(1 + e^−0.5) = 1/(1 + 0.60653) = 1/1.60653 = <b>0.6225</b></p><p>σ(−1.5) = 1/(1 + e^1.5) = 1/(1 + 4.48169) = 1/5.48169 = <b>0.1824</b></p><p>tanh(0.5) = (1.64872 − 0.60653)/(1.64872 + 0.60653) = 1.04219/2.25525 = <b>0.4621</b></p><p>tanh(−1.5) = −tanh(1.5) = −(4.48169 − 0.22313)/(4.48169 + 0.22313) = −4.25856/4.70482 = <b>−0.9051</b></p><p>Note tanh(0.5) = 0.4621 is much further from 0 than σ(0.5) − 0.5 = 0.1225, which is the rescaling tanh(z) = 2σ(2z) − 1 at work.</p>"},
  {id:"m2t4p3",d:"moderate",q:"Explain the vanishing-gradient problem and why tanh reduces but does not remove it.",hint:"Follow the gradient backwards through several layers.",a:"<p><b>The mechanism.</b> Backpropagation computes the gradient at an early layer by repeatedly applying the chain rule, and each layer crossed contributes a factor of f′(z). Traversing k layers therefore multiplies the gradient by the product of k such factors. If each factor is less than 1, the product shrinks geometrically.</p><p><b>With sigmoid</b> σ′ ≤ 0.25 always, so crossing k layers scales the gradient by at most 0.25ᵏ. After 5 layers that is 1/1024 even in the best case, and far smaller in practice. Early layers receive essentially no signal and stop learning.</p><p><b>Tanh reduces it</b> because tanh′ reaches 1.0 at z = 0, so near the origin no shrinkage occurs at all — a factor-of-4-per-layer improvement over sigmoid. Being zero-centred, tanh also keeps units near z = 0 more often, where its derivative is largest.</p><p><b>But it does not remove it</b>, because tanh still <i>saturates</i>: at z = 3 its derivative is about 0.01, and at z = 4 about 0.001. Once units drift into saturation, tanh vanishes at least as fast as sigmoid. The problem is inherent to any bounded activation, since a function squeezed into a finite range must flatten at its extremes. Removing it requires an activation whose derivative does not decay — which is exactly ReLU, with f′ = 1 for all positive z.</p>"},
  {id:"m2t4p4",d:"hard",q:"Explain why sigmoid not being zero-centred causes inefficient updates.",hint:"Look at the sign of ∂E/∂wᵢ for all the incoming weights of one unit.",a:"<p>For a unit with inputs aᵢ from the previous layer, the gradient on weight wᵢ is ∂E/∂wᵢ = δ · aᵢ, where δ is the error signal for that unit and is the same for all its incoming weights.</p><p>If the previous layer used sigmoid, every aᵢ is strictly positive. So the sign of ∂E/∂wᵢ equals the sign of δ for <b>every i</b> — all the incoming weights of that unit must increase together or decrease together on a given example.</p><p><b>The consequence:</b> if the optimal move is to increase w₁ and decrease w₂, no single update can do it. The optimizer must alternate — one step raising both, the next lowering both — producing a zig-zag path down the loss surface that takes many more steps than a direct path.</p><p><b>Why tanh fixes it:</b> tanh outputs span (−1, +1), so the aᵢ have mixed signs and the gradients on different incoming weights can have different signs within a single update. The optimizer can then move in the actually-useful direction immediately. This is a separate benefit from the derivative magnitude, and it is the main reason tanh was preferred over sigmoid in hidden layers before ReLU arrived.</p>"}],

{id:"m2t5",m:"m2",title:"ReLU, the Dying ReLU Problem and Leaky ReLU",type:"problem-solving",priority:"high",los:["2.2"],
 src:"Module 2 deck, slides 60–67",
 summary:"The default hidden-layer activation, the failure mode it introduces, and the one-parameter fix.",
 whatIs:"<p>ReLU — the Rectified Linear Unit — is f(z) = max(0, z): pass positives through unchanged, set negatives to zero. It is the standard hidden-layer activation in modern deep networks, and the deck describes it as offering 'sparsity and computational elegance'.</p>",
 concept:"<h4>ReLU</h4><div class='eqb'>f(z) = max(0, z)          range [0, +∞)\nf′(z) = 1  if z > 0\n      = 0  if z &lt; 0        (undefined at 0; taken as 0 by convention)</div>"+
  "<p><b>Advantages.</b> (1) <b>No vanishing gradient on the positive side</b> — the derivative is exactly 1, so gradients pass through undiminished however deep the network. (2) <b>Computationally trivial</b> — a comparison, with no exponential. (3) <b>Sparsity</b> — roughly half the units output exactly 0 for a given input, which is efficient and acts as a mild regulariser.</p>"+
  "<h4>The dying ReLU problem</h4>"+
  "<p>If a unit's weights are pushed so that z &lt; 0 for <b>every</b> training input, then its output is always 0 and its derivative is always 0. Zero derivative means zero gradient, which means its weights never update, which means it can never escape. The unit is permanently dead and contributes nothing for the rest of training.</p>"+
  "<p>The usual cause is a large learning rate: one oversized update drives the weights strongly negative, and the unit dies instantly. The deck notes that the flat negative side is what makes this irreversible.</p>"+
  "<h4>Leaky ReLU</h4><div class='eqb'>f(z) = z       if z ≥ 0\n     = αz      if z &lt; 0        with a small α\nf′(z) = 1 if z > 0,  α if z &lt; 0     range (−∞, +∞)</div>"+
  "<p>Giving the negative side a small non-zero slope means the derivative there is α rather than 0, so a negative unit still receives gradient and can recover. Dying ReLU is eliminated.</p>"+
  "<div class='box warning'><h5>Which α does this course use?</h5><p>The deck gives two different values on adjacent slides. The lecturer's own slide 65 writes <b>f(x) = max(0.1x, x)</b>, i.e. <b>α = 0.1</b>. A generated recap slide (64) works an example with <b>α = 0.01</b>, giving f(−3) = −0.03. Both are standard in the literature. In an exam, state the α you are using and both answers are defensible — but α = 0.1 is the value on the lecturer's own slide.</p></div>"+
  "<p><b>Limitation of Leaky ReLU</b> (the deck devotes a slide to this): α is a hyperparameter you must choose, and there is no principled way to pick it. Too small and dying is barely prevented; too large and the function drifts back towards linear, weakening the non-linearity.</p>"+
  "<div class='scroll'><table><tr><th></th><th>Sigmoid</th><th>Tanh</th><th>ReLU</th><th>Leaky ReLU</th></tr>"+
  "<tr><td>Range</td><td>(0, 1)</td><td>(−1, 1)</td><td>[0, ∞)</td><td>(−∞, ∞)</td></tr>"+
  "<tr><td>Max derivative</td><td>0.25</td><td>1.0</td><td>1.0</td><td>1.0</td></tr>"+
  "<tr><td>Zero-centred</td><td>No</td><td>Yes</td><td>No</td><td>Nearly</td></tr>"+
  "<tr><td>Vanishing gradient</td><td>Severe</td><td>Reduced</td><td>None for z&gt;0</td><td>None</td></tr>"+
  "<tr><td>Cost</td><td>High (exp)</td><td>High (exp)</td><td>Very low</td><td>Very low</td></tr>"+
  "<tr><td>Main flaw</td><td>Vanishing, not centred</td><td>Still saturates</td><td>Dying units</td><td>α must be chosen</td></tr></table></div>",
 needToKnow:["Write ReLU and its derivative, including the z=0 convention","Give three advantages of ReLU","Explain dying ReLU as a self-reinforcing zero-gradient trap","Write Leaky ReLU and evaluate it for a negative input","State Leaky ReLU's own limitation","Fill the four-way comparison table"],
 recognition:{clues:["max(0, z) appears","'Dying', 'dead neurons', 'sparsity'","'Which activation for hidden layers?'","A negative input with an answer like −0.03 or −0.3"],
  wording:["Explain the ReLU activation function with its advantages and limitations.","What is the dying ReLU problem and how is it solved?","Compute Leaky ReLU output for z = −3.","Compare sigmoid, tanh, ReLU and Leaky ReLU."],
  firstMove:"Write f and f′ together. For dying ReLU the whole answer is the chain: z<0 always → output 0 → derivative 0 → gradient 0 → no update → stuck.",
  trap:"Saying ReLU 'has no vanishing gradient'. It has none on the positive side; on the negative side the gradient is exactly zero, which is worse — that is dying ReLU."},
 examAnswer:[
  {marks:5,body:"<p>ReLU with its derivative, three advantages, then the dying problem stated as the causal chain, then Leaky ReLU as the fix with its equation.</p>"},
  {marks:10,body:"<p>All of the above with graphs; a numeric example showing a unit dying; Leaky ReLU with an evaluated negative input and a note on the two α values in the material; Leaky ReLU's own limitation; and the four-way comparison table with a recommendation.</p>"}],
 mistakes:["Writing f′(z) = 1 for all z","Claiming Leaky ReLU is always better — it adds a hyperparameter with no principled value","Saying a dying unit recovers eventually; with derivative exactly 0 it never can","Giving ReLU's range as (−∞, ∞)","Confusing sparsity (many zeros, which is good) with dying (permanently zero, which is bad)"],
 examples:[
  {id:"m2t5e1",title:"Evaluating ReLU and Leaky ReLU",q:"For z = 3, z = 0 and z = −3, give ReLU and Leaky ReLU outputs with both α = 0.01 and α = 0.1, plus the derivative in each case.",
   steps:["<b>z = 3 (positive):</b> ReLU = max(0,3) = 3, f′ = 1. Leaky ReLU = 3 for either α, f′ = 1.","<b>z = 0:</b> ReLU = max(0,0) = 0. The derivative is undefined at the kink; by convention it is taken as 0.","<b>z = −3, ReLU:</b> max(0,−3) = 0, f′ = 0. ← this unit receives no gradient","<b>z = −3, Leaky with α = 0.01:</b> 0.01 × (−3) = −0.03, f′ = 0.01","<b>z = −3, Leaky with α = 0.1:</b> 0.1 × (−3) = −0.3, f′ = 0.1"],
   answer:"ReLU: 3, 0, 0. Leaky (α=0.01): 3, 0, <b>−0.03</b>. Leaky (α=0.1): 3, 0, <b>−0.3</b>. The critical column is z = −3, where ReLU's derivative is 0 and Leaky's is α > 0.",
   trap:"The deck shows −0.03 on its generated slide (α = 0.01) and writes max(0.1x, x) on the lecturer's own slide (α = 0.1). Always state which α you are using; the marks are for the method and the non-zero derivative, not for one particular constant."},
  {id:"m2t5e2",title:"Watching a unit die",q:"A ReLU unit has w = (0.5, 0.5), b = 0.1. A single large update with η = 2 and gradient (1.0, 1.0, 1.0) for (w₁, w₂, b) is applied. Show the unit dies for all non-negative inputs, and show Leaky ReLU would not.",
   steps:["Update: w₁ = 0.5 − 2(1.0) = −1.5, w₂ = 0.5 − 2(1.0) = −1.5, b = 0.1 − 2(1.0) = −1.9.","For any input with x₁, x₂ ≥ 0: z = −1.5x₁ − 1.5x₂ − 1.9 ≤ −1.9 &lt; 0 always.","ReLU output = 0 for every such input. Derivative f′(z) = 0 for every such input.","The gradient on each weight is δ · f′(z) · xᵢ = δ · 0 · xᵢ = 0.","Zero gradient means zero update, so the weights stay at (−1.5, −1.5, −1.9) forever. <b>The unit is dead.</b>","With Leaky ReLU (α = 0.1): output = 0.1z ≠ 0 and f′(z) = 0.1 ≠ 0. The gradient is δ · 0.1 · xᵢ, which is non-zero, so the weights keep updating and can climb back."],
   answer:"Under ReLU the unit is permanently dead and contributes nothing for the remainder of training. Under Leaky ReLU it keeps receiving gradient at one tenth strength and can recover.",
   trap:"Notice the cause: η = 2 is far too large. Dying ReLU is usually a symptom of an excessive learning rate rather than a flaw in ReLU itself, which is why lowering η is a legitimate alternative fix alongside switching activation."}],
 practice:[
  {id:"m2t5p1",d:"easy",q:"Write ReLU and its derivative, and give three advantages.",hint:"Two cases each.",a:"<div class='eqb'>f(z)  = max(0, z)           range [0, ∞)\nf′(z) = 1 if z > 0, 0 if z &lt; 0   (0 at z = 0 by convention)</div><p><b>Advantages.</b> (1) No vanishing gradient for positive inputs — the derivative is exactly 1, so the backward signal passes through undiminished regardless of depth. (2) Computationally very cheap — one comparison, with no exponential to evaluate. (3) Sparsity — around half the units output exactly 0 for any given input, which reduces computation and acts as a mild regulariser.</p>"},
  {id:"m2t5p2",d:"moderate",q:"Explain the dying ReLU problem as a causal chain and give two ways to prevent it.",hint:"Start from the weights being pushed strongly negative.",a:"<p><b>The chain:</b> a large update pushes the unit's weights and bias so that z &lt; 0 for every training input → ReLU outputs 0 for every input → the derivative f′(z) = 0 for every input → the gradient on every incoming weight is δ · 0 · xᵢ = 0 → no weight update ever occurs → z stays negative forever. The unit is permanently dead and its parameters are wasted.</p><p>What makes it irreversible is that the fix would require changing the weights, and the only mechanism for changing them is the gradient, which is exactly what has become zero.</p><p><b>Prevention 1 — use Leaky ReLU</b> (or PReLU/ELU). Giving the negative side a slope α > 0 makes f′ = α ≠ 0 there, so gradient still flows and the unit can climb back.</p><p><b>Prevention 2 — reduce the learning rate.</b> The usual trigger is a single oversized step. A smaller η, or a decaying schedule, stops weights being flung far enough negative to strand the unit. Sensible weight initialisation and batch normalization also help by keeping pre-activations near zero.</p>"},
  {id:"m2t5p3",d:"moderate",q:"Give Leaky ReLU's own limitation and explain the trade-off in choosing α.",hint:"What kind of quantity is α?",a:"<p><b>The limitation:</b> α is a hyperparameter with no principled way to choose it. It must be guessed or searched over, adding another dimension to hyperparameter tuning, and the deck flags this explicitly.</p><p><b>The trade-off.</b> If α is too small — say 0.001 — the negative-side gradient is tiny, so a unit stranded in the negative region recovers extremely slowly. In practice it is barely distinguishable from plain ReLU and dying is only nominally prevented.</p><p>If α is too large — approaching 1 — then f(z) ≈ z for both signs and the function drifts towards the identity. The activation loses its non-linearity, and in the limit α = 1 the network collapses exactly as the linear-activation argument predicts.</p><p>Values between 0.01 and 0.1 sit in the useful middle: large enough that a dead unit recovers in a reasonable number of steps, small enough that the kink at zero remains a genuine non-linearity. The material uses both ends of that range.</p>"},
  {id:"m2t5p4",d:"hard",q:"Distinguish sparsity from dying in ReLU networks. Why is one desirable and the other not?",hint:"Ask whether the zero is the same for every input.",a:"<p><b>Sparsity</b> means that for any <i>given</i> input, many units output 0 — but which units are zero varies from input to input. A unit that is silent on one example is active on another. Nothing is lost: the network is using different subsets of units to represent different inputs, which is efficient, reduces computation, and acts as a mild regulariser by preventing every unit from co-adapting to every example.</p><p><b>Dying</b> means a unit outputs 0 for <i>every</i> input in the dataset. It is not selectively silent; it is uniformly silent. Its parameters are frozen and it contributes nothing to any prediction. Its capacity is permanently lost, effectively shrinking the network.</p><p><b>The test:</b> for each unit, count the fraction of the training set on which it activates. A healthy sparse network has units activating on perhaps 20–50% of inputs. A dying unit activates on exactly 0%. If a large fraction of units sit at 0%, the effective network is far smaller than the one you built — and the diagnosis is usually that the learning rate was too high.</p>"}],
 questions:[
  {q:"Explain the ReLU activation function with its advantages and limitations.",marks:5,d:"easy",priority:"high",source:"source"},

  {q:"Compare sigmoid, tanh, ReLU and Leaky ReLU on range, derivative, vanishing gradient and cost.",marks:10,d:"moderate",priority:"high",source:"source"},

{id:"m2t6",m:"m2",title:"Softmax",type:"problem-solving",priority:"high",los:["2.2"],
 src:"Module 2 deck, slides 68–73 and 104–105",
 summary:"Turning a vector of raw scores into a probability distribution — the multi-class output activation.",
 whatIs:"<p>Softmax converts a vector of arbitrary real scores (logits) into a vector of probabilities that are all positive and sum to exactly 1. It is the correct output activation for <b>multi-class, single-label</b> classification.</p>",
 concept:"<div class='eqb'>softmax(zᵢ) = e^{zᵢ} / Σⱼ e^{zⱼ}</div>"+
  "<p>Two properties do all the work. The exponential makes every value positive and amplifies differences — a score twice as large becomes far more than twice as probable. Dividing by the sum forces the outputs to total 1, which is what makes them a distribution.</p>"+
  "<h4>The method, in exam order</h4><ol>"+
  "<li>Exponentiate every score. Keep four decimals.</li>"+
  "<li>Add them to get the denominator.</li>"+
  "<li>Divide each exponential by that sum.</li>"+
  "<li><b>Check the outputs sum to 1.</b> This catches almost every arithmetic error and costs one line.</li></ol>"+
  "<h4>The deck's worked example</h4>"+
  "<p>Scores z = [1.25, 2.44, 0.78, 0.12] for four classes.</p>"+
  "<div class='eqb'>e^1.25 = 3.4903      e^2.44 = 11.4730\ne^0.78 = 2.1815      e^0.12 = 1.1275\n\nSum = 18.2723\n\np = [0.1910, 0.6279, 0.1194, 0.0617]     (sums to 1.0000 ✓)</div>"+
  "<div class='box warning'><h5>An arithmetic slip in the source</h5><p>The deck's slide prints <b>e^0.12 = 1.27</b> and a sum of <b>18.41</b>. Recomputing, e^0.12 = <b>1.1275</b>, giving a sum of 18.2723. (1.27 is approximately e^0.24, so the exponent appears to have been doubled.) The lecturer's other three exponentials are correct to two decimals. Present the teacher's figures if reproducing their slide, but be able to compute e^0.12 correctly — an examiner asking you to work softmax from scratch will expect 1.13.</p></div>"+
  "<div class='box tip'><h5>Softmax vs sigmoid — the distinction that gets tested</h5><p><b>Softmax</b> outputs are <i>coupled</i>: they must sum to 1, so raising one probability necessarily lowers the others. Use it when exactly one class is correct — a digit is a 7 or an 8, not both.<br><b>Sigmoid</b> applied to each output independently gives outputs that are <i>uncoupled</i> and need not sum to 1. Use it for multi-<b>label</b> problems, where a student can be simultaneously distracted and sleepy. The deck's Task 4 makes exactly this point.</p></div>",
 needToKnow:["Write the formula and apply it to a vector of scores","Verify the outputs sum to 1","State that softmax is for multi-class single-label problems","Distinguish softmax from independent sigmoids","Explain why the exponential is used rather than simple normalisation"],
 recognition:{clues:["Several output classes with raw scores given","'Probability distribution', 'sum to 1'","'Which class does the network predict?'","Multi-class classification with mutually exclusive classes"],
  wording:["Explain the softmax function and compute the output probabilities for the given scores.","Differentiate between softmax and sigmoid output layers.","Why is softmax used at the output layer of a multi-class classifier?"],
  firstMove:"Exponentiate all scores first and write them in a row, then sum. Doing the divisions before the sum is complete is where errors creep in.",
  trap:"Normalising the raw scores directly, zᵢ/Σzⱼ, without exponentiating. That fails for negative scores and does not amplify differences."},
 examAnswer:[
  {marks:5,body:"<p>Formula, the four-step method, a worked example with the sum-to-1 check, and one line on when softmax is used rather than sigmoid.</p>"},
  {marks:10,body:"<p>All of the above plus: why the exponential rather than plain normalisation; the coupling property and its consequence; the full softmax-vs-sigmoid comparison for multi-class against multi-label; and one line pairing softmax with categorical cross-entropy.</p>"}],
 mistakes:["Forgetting to divide by the sum","Not checking that the probabilities sum to 1","Using softmax for multi-label problems where several classes can be true at once","Applying softmax at a hidden layer — it belongs at the output","Rounding the exponentials to two decimals before summing, which visibly shifts the result"],
 examples:[
  {id:"m2t6e1",title:"Softmax on four class scores",q:"A network outputs scores [3.5, 2.1, 0.8, 0.4] for four classes. Compute the softmax probabilities and give the predicted class.",
   steps:["e^3.5 = 33.1155","e^2.1 = 8.1662","e^0.8 = 2.2255","e^0.4 = 1.4918","Sum = 33.1155 + 8.1662 + 2.2255 + 1.4918 = 44.9990","p₁ = 33.1155/44.9990 = 0.7359","p₂ = 8.1662/44.9990 = 0.1815","p₃ = 2.2255/44.9990 = 0.0495","p₄ = 1.4918/44.9990 = 0.0332","Check: 0.7359 + 0.1815 + 0.0495 + 0.0332 = 1.0001 ≈ 1 ✓ (rounding)"],
   answer:"p = <b>[0.736, 0.182, 0.049, 0.033]</b>. Predicted class is <b>class 1</b> with 73.6% probability.",
   trap:"<b>Note on the source.</b> The deck's generated slide 105 gives [0.72, 0.18, 0.07, 0.03] for these scores. Recomputation gives [0.74, 0.18, 0.05, 0.03] — the first and third differ in the second decimal, and the deck's four values sum to 1.00 only by coincidence of rounding. The method on the slide is correct; the arithmetic drifts. Show your own exponentials and the sum-to-1 check and you cannot be marked down."},
  {id:"m2t6e2",title:"Why exponentiate at all?",q:"Scores are [2, −1, 3]. Compare softmax with naive normalisation zᵢ/Σzⱼ, and say what goes wrong.",
   steps:["<b>Naive:</b> Σzⱼ = 2 + (−1) + 3 = 4. Ratios: 2/4 = 0.5, −1/4 = −0.25, 3/4 = 0.75.","Immediately broken: one value is negative, so it cannot be a probability. They do sum to 1, but the middle value is meaningless.","Worse, if the scores had been [2, −2, 3] the sum would be 3, and if they had been [1, −1] the sum would be 0 — division by zero.","<b>Softmax:</b> e² = 7.3891, e^−1 = 0.3679, e³ = 20.0855. Sum = 27.8425.","p = [0.2654, 0.0132, 0.7214]. Sums to 1 ✓, all strictly positive ✓."],
   answer:"Naive normalisation produces a <b>negative 'probability'</b> and can divide by zero. Softmax gives [0.265, 0.013, 0.721] — valid, positive, and summing to 1.",
   trap:"There is a second reason beyond validity. The exponential <i>amplifies</i> differences: the gap between scores 2 and 3 becomes a probability gap of 0.265 to 0.721, nearly a factor of 3, whereas naive normalisation would have given 0.5 and 0.75, a factor of 1.5. This sharpening is what makes softmax act like a smooth version of 'take the maximum' — which is where its name comes from."}],
 practice:[
  {id:"m2t6p1",d:"easy",q:"Write the softmax formula and state its two defining properties.",hint:"What is guaranteed about the outputs?",a:"<div class='eqb'>softmax(zᵢ) = e^{zᵢ} / Σⱼ e^{zⱼ}</div><p><b>Property 1:</b> every output is strictly positive, because the exponential of any real number is positive.</p><p><b>Property 2:</b> the outputs sum to exactly 1, because each is divided by the sum of all of them.</p><p>Together these make the output a valid probability distribution over the classes, which is what a multi-class classifier must produce.</p>"},
  {id:"m2t6p2",d:"moderate",q:"Compute softmax for z = [1.0, 2.0, 0.5] and verify the sum.",hint:"Exponentiate all three, then sum, then divide.",a:"<p>e^1.0 = 2.7183, e^2.0 = 7.3891, e^0.5 = 1.6487</p><p>Sum = 2.7183 + 7.3891 + 1.6487 = 11.7561</p><p>p₁ = 2.7183/11.7561 = <b>0.2312</b><br>p₂ = 7.3891/11.7561 = <b>0.6285</b><br>p₃ = 1.6487/11.7561 = <b>0.1402</b></p><p>Check: 0.2312 + 0.6285 + 0.1402 = 0.9999 ≈ 1 ✓</p><p>Predicted class is class 2. Note that a score gap of 1.0 (from 1.0 to 2.0) produced a probability ratio of about 2.7 — precisely e¹, which is the exponential's signature.</p>"},
  {id:"m2t6p3",d:"moderate",q:"When would you use sigmoid rather than softmax at the output layer? Give a concrete example.",hint:"Ask whether the classes exclude one another.",a:"<p><b>Use softmax</b> when exactly one class is correct — the classes are <i>mutually exclusive</i>. Softmax outputs are coupled by the sum-to-1 constraint, so raising one probability must lower the others, which correctly encodes 'if it is this, it is not that'.</p><p><b>Use independent sigmoids</b> when several labels can be true at once — a multi-<b>label</b> problem. Each output is computed independently, need not sum to 1, and each is a separate yes/no probability.</p><p><b>Concrete example</b> (the deck's Task 4): classifying a student's behaviour during a lecture. If the task is to pick one performance category — Excellent, Good, Average or Poor — the categories are mutually exclusive, so softmax with categorical cross-entropy is right. But if the task is to flag behavioural states — distracted, sleepy, participating, confused — a student can be distracted <i>and</i> sleepy simultaneously. Forcing these through softmax would make detecting one suppress the others, which is wrong. Independent sigmoids with binary cross-entropy on each output is the correct architecture.</p><p>The test is simply: can two labels be true at the same time? If yes, sigmoid. If no, softmax.</p>"},
  {id:"m2t6p4",d:"hard",q:"A network's softmax outputs are [0.25, 0.25, 0.25, 0.25]. What does this tell you, and what would you check?",hint:"What input scores produce a uniform distribution?",a:"<p>A uniform distribution means all four logits were <b>equal</b> — since softmax is strictly increasing in each score, equal probabilities imply equal inputs z₁ = z₂ = z₃ = z₄. The network is expressing complete uncertainty: it is no better than guessing.</p><p><b>What to check, in order.</b></p><p>(1) <b>Is this at initialisation?</b> With small random weights all logits start near zero, so uniform output is expected and healthy at step 0. If training has barely begun, nothing is wrong.</p><p>(2) <b>Are the weights all zero?</b> If the output layer was initialised to zeros, every logit is exactly the bias and stays identical — the symmetry-breaking failure. Check for random initialisation.</p><p>(3) <b>Has learning stalled?</b> If this persists after many epochs, the gradient is not reaching the output layer. Likely causes are a learning rate so small nothing moves, vanishing gradients from saturating hidden activations, or dead ReLU units upstream supplying constant zeros so the output layer sees no varying signal.</p><p>(4) <b>Is the input actually informative?</b> If the features genuinely carry no signal about the class, uniform output is the correct answer and the problem is the data, not the network.</p><p>The diagnostic that separates these: feed two very different training examples and compare the logits. If they are identical, the problem is upstream — dead units or zero weights. If they differ but both give near-uniform softmax, the output layer simply has not been trained enough.</p>"}],
 questions:[
  {q:"Explain the softmax function and compute the output probabilities for the scores [1.25, 2.44, 0.78, 0.12].",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Differentiate between softmax and sigmoid output layers, with an example of when each is appropriate.",marks:5,d:"moderate",priority:"high",source:"source"},
  {q:"Why is the exponential used in softmax rather than simple normalisation?",marks:5,d:"moderate",priority:"high",source:"predicted"}]},

{id:"m2t7",m:"m2",title:"Choosing the Right Activation Function",type:"theory",priority:"high",los:["2.2"],
 src:"Module 2 deck, slides 74–79",
 summary:"The decision rules the deck states, split into hidden-layer choice and output-layer choice.",
 whatIs:"<p>Choosing an activation is two separate decisions with different criteria. Hidden layers are chosen for <b>gradient flow</b>; the output layer is chosen for the <b>shape of the answer</b>.</p>",
 concept:"<h4>Hidden layers — chosen for gradient behaviour</h4><div class='scroll'><table>"+
  "<tr><th>Choice</th><th>When</th></tr>"+
  "<tr><td><b>ReLU</b></td><td>The default. Fast, no vanishing gradient on the positive side. Start here.</td></tr>"+
  "<tr><td><b>Leaky ReLU</b></td><td>When units are dying — many units at exactly 0 for every input.</td></tr>"+
  "<tr><td><b>Tanh</b></td><td>Shallow networks, or where zero-centred outputs matter. Standard in RNNs.</td></tr>"+
  "<tr><td><b>Sigmoid</b></td><td>Essentially never in hidden layers — the deck's own note is that sigmoid combinations 'generally work better' only in specific shallow cases.</td></tr></table></div>"+
  "<h4>Output layer — chosen by the task, and this is the exam-critical table</h4><div class='scroll'><table>"+
  "<tr><th>Task</th><th>Output activation</th><th>Output units</th><th>Loss</th></tr>"+
  "<tr><td><b>Regression</b> (any real value)</td><td>Linear</td><td>1</td><td>MSE</td></tr>"+
  "<tr><td><b>Binary classification</b></td><td>Sigmoid</td><td>1</td><td>Binary cross-entropy</td></tr>"+
  "<tr><td><b>Multi-class, single label</b></td><td>Softmax</td><td>C (one per class)</td><td>Categorical cross-entropy</td></tr>"+
  "<tr><td><b>Multi-label</b> (several true at once)</td><td>Sigmoid on each output independently</td><td>C</td><td>Binary cross-entropy on each</td></tr></table></div>"+
  "<div class='box tip'><h5>Learn this table as one object</h5><p>The activation and the loss are chosen together, not separately — softmax pairs with categorical cross-entropy, sigmoid with binary cross-entropy, linear with MSE. The deck presents this as a four-task decision flow and it is the single most reusable thing in Module 2. It answers activation questions, loss questions and 'design a network for this problem' questions alike.</p></div>"+
  "<h4>The deck's four worked tasks</h4><div class='scroll'><table>"+
  "<tr><th>Task</th><th>Problem</th><th>Type</th><th>Output + Loss</th></tr>"+
  "<tr><td>1</td><td>Predict a student's final marks</td><td>Regression</td><td>Linear + MSE</td></tr>"+
  "<tr><td>2</td><td>Predict academic risk (needs intervention or not)</td><td>Binary</td><td>Sigmoid + Binary CE</td></tr>"+
  "<tr><td>3</td><td>Categorise performance into distinct labels</td><td>Multi-class</td><td>Softmax + Categorical CE</td></tr>"+
  "<tr><td>4</td><td>Detect simultaneous behaviours (distracted, sleepy)</td><td>Multi-label</td><td>Sigmoid each + Binary CE each</td></tr></table></div>",
 needToKnow:["Reproduce the four-row output table including the loss column","State ReLU as the hidden-layer default and say why","Distinguish multi-class from multi-label and give the different output activations","Justify each choice by the shape the output must take","Apply the table to an unseen problem description"],
 recognition:{clues:["'Which activation function would you use for …'","A problem description with no architecture given","'Design a network for the following task'","Marks, categories or yes/no outcomes described in words"],
  wording:["Which activation and loss function would you choose for the given task? Justify.","Formulate a computational module with suitable activation and loss functions for the given problem context.","How do you choose an activation function for the output layer?"],
  firstMove:"Classify the task first — regression, binary, multi-class or multi-label. Everything else follows mechanically from that one classification.",
  trap:"Missing multi-label. If the description allows two answers to be true simultaneously, softmax is wrong and independent sigmoids are right."},
 examAnswer:[
  {marks:5,body:"<p>The four-row task table with activation and loss. One line on ReLU as the hidden-layer default. One line justifying each output choice by the required output shape.</p>"},
  {marks:10,body:"<p>The full table plus: separate treatment of the hidden-layer criterion (gradient flow) and the output criterion (answer shape); a worked application to a stated problem naming the number of output units; the multi-class vs multi-label distinction with an example; and one line explaining why activation and loss must be chosen as a pair.</p>"}],
 mistakes:["Using softmax for a binary problem — a single sigmoid unit is correct and simpler","Using sigmoid at a regression output, which caps the prediction at 1","Choosing the activation without naming the matching loss","Recommending sigmoid for hidden layers of a deep network","Giving C output units for a binary problem where 1 suffices"],
 examples:[{id:"m2t7e1",title:"Four problems, four architectures",q:"Choose output activation, number of output units and loss for: (a) predicting a student's percentage marks; (b) flagging whether a student will fail; (c) assigning one of five grades A–E; (d) tagging a lecture recording with any of eight topics it covers.",
  steps:["<b>(a)</b> The target is a real number, potentially any value in a range. Regression → <b>linear output, 1 unit, MSE loss</b>. A sigmoid here would cap the prediction at 1.","<b>(b)</b> Two mutually exclusive outcomes, fail or not. Binary → <b>sigmoid, 1 unit, binary cross-entropy</b>. One unit suffices because P(not fail) = 1 − P(fail).","<b>(c)</b> Five mutually exclusive grades; a student gets exactly one. Multi-class single-label → <b>softmax, 5 units, categorical cross-entropy</b>.","<b>(d)</b> A recording can cover several topics at once, so the labels are not mutually exclusive. Multi-label → <b>sigmoid on each of 8 units independently, binary cross-entropy on each</b>."],
  answer:"(a) linear / 1 / MSE. (b) sigmoid / 1 / binary CE. (c) softmax / 5 / categorical CE. (d) 8 independent sigmoids / 8 / binary CE per output.",
  trap:"Cases (c) and (d) look almost identical — both have several categories — and this is exactly what the question is testing. The discriminating word in (d) is 'any of', which permits multiple simultaneous truths. Softmax there would force the eight probabilities to sum to 1, so detecting one topic strongly would suppress the others, which is the opposite of what a tagging system needs."}],
 practice:[
  {id:"m2t7p1",d:"easy",q:"Give the output activation and loss function for regression, binary classification, multi-class and multi-label tasks.",hint:"Four rows.",a:"<div class='scroll'><table><tr><th>Task</th><th>Output activation</th><th>Units</th><th>Loss</th></tr><tr><td>Regression</td><td>Linear</td><td>1</td><td>Mean squared error</td></tr><tr><td>Binary classification</td><td>Sigmoid</td><td>1</td><td>Binary cross-entropy</td></tr><tr><td>Multi-class, single label</td><td>Softmax</td><td>C</td><td>Categorical cross-entropy</td></tr><tr><td>Multi-label</td><td>Sigmoid on each output</td><td>C</td><td>Binary cross-entropy on each</td></tr></table></div>"},
  {id:"m2t7p2",d:"moderate",q:"Why is ReLU the default for hidden layers but never used at the output of a regression problem predicting temperature?",hint:"Look at ReLU's range.",a:"<p><b>Why ReLU is the hidden default:</b> its derivative is exactly 1 for positive inputs, so gradients pass backward undiminished however deep the network — no vanishing gradient. It is also computationally trivial and produces useful sparsity. Hidden layers are judged on gradient flow, and ReLU is the best simple answer.</p><p><b>Why it fails at a temperature output:</b> ReLU's range is [0, ∞). It cannot output any negative number, because max(0, z) = 0 whenever z &lt; 0. A model predicting temperature in Celsius must be able to say −5 °C, and a ReLU output would report 0 °C instead — and worse, would receive zero gradient there, so it could never learn to correct itself.</p><p>The general principle: hidden layers are chosen for gradient behaviour, output layers for the <b>range the answer must span</b>. Regression over the reals needs an unbounded, two-sided output, which only the linear activation provides.</p>"},
  {id:"m2t7p3",d:"moderate",q:"Why must the output activation and the loss function be chosen together rather than independently?",hint:"Consider what happens if you pair softmax with MSE.",a:"<p>Because the pairing determines whether the gradient is well behaved.</p><p><b>The mismatch problem.</b> Pair a sigmoid output with MSE loss and the gradient contains a factor of σ′(z), which is at most 0.25 and approaches 0 when the output saturates. So the more confidently wrong the network is — output near 1 when the target is 0 — the <i>smaller</i> its gradient becomes, and learning stalls exactly when correction is most needed.</p><p><b>Why the standard pairings work.</b> With sigmoid output and binary cross-entropy, the σ′(z) factor cancels algebraically against a term from the cross-entropy derivative, leaving a gradient proportional simply to (ŷ − t). The same cancellation happens between softmax and categorical cross-entropy. The gradient is then large when the error is large, which is exactly the behaviour you want.</p><p><b>The practical rule:</b> linear + MSE, sigmoid + binary CE, softmax + categorical CE. These are not conventions but pairings chosen so the saturating factor cancels. Breaking a pair produces a network that trains slowly or not at all, even though nothing looks wrong in the architecture.</p>"}],
 questions:[
  {q:"How do you choose the activation function for the output layer? Explain with reference to four task types.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Formulate a computational module with a suitable activation and loss function for a given problem context, and justify your choice.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Differentiate between multi-class and multi-label classification and state the output activation for each.",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m2t8",m:"m2",title:"Squared Error Loss (MSE)",type:"problem-solving",priority:"high",los:["2.2"],
 src:"Module 2 deck, slides 84–89",
 summary:"The regression loss, why squaring matters, and the pairing rule that keeps it out of classification.",
 whatIs:"<p>A <b>loss function</b> compares the target with the predicted output and returns a single number saying how wrong the prediction is. Mean Squared Error (also called L2 loss) is the standard loss for regression.</p>",
 concept:"<div class='eqb'>Single example:  E = ½ (t − ŷ)²\nOver n examples: MSE = (1/n) Σᵢ (tᵢ − ŷᵢ)²</div>"+
  "<p>The ½ in the single-example form exists so that differentiating cancels the 2 from the square, leaving ∂E/∂ŷ = −(t − ŷ). It is cosmetic and does not change where the minimum lies.</p>"+
  "<h4>Why square rather than take the absolute value?</h4><ol>"+
  "<li><b>Sign removal.</b> Errors of +3 and −3 are equally bad; squaring makes both 9 so they cannot cancel when summed.</li>"+
  "<li><b>Disproportionate penalty on large errors.</b> An error of 10 costs 100 while an error of 1 costs 1 — a hundredfold difference for a tenfold error. The deck calls this 'scaling the penalty'. The model is pushed hardest to fix its worst predictions.</li>"+
  "<li><b>Smoothness.</b> The square is differentiable everywhere, including at zero error. The absolute value has a kink at 0 where the derivative is undefined, which is awkward for gradient descent.</li></ol>"+
  "<h4>Gradient</h4><div class='eqb'>∂E/∂ŷ = −(t − ŷ) = (ŷ − t)</div>"+
  "<p>The gradient is proportional to the error itself, so a badly wrong prediction produces a large correction and a nearly-right one produces a small correction. That self-scaling is exactly the behaviour gradient descent wants.</p>"+
  "<div class='box warning'><h5>Do not use MSE for classification</h5><p>Paired with a sigmoid output, the MSE gradient carries a factor of σ′(z). When the network is confidently wrong the sigmoid saturates, σ′ → 0, and the gradient vanishes precisely when the correction is most needed. Cross-entropy is designed so that this factor cancels. The deck's own task table pairs MSE only with a linear regression output.</p></div>"+
  "<div class='box warning'><h5>A labelling slip in the source</h5><p>Slide 152 shows a prediction of 88.5 against an actual of 92.0 and labels the result <b>'LOSS: 3.5 (MSE)'</b>. Recomputing: 92 − 88.5 = 3.5 is the <i>absolute</i> error, so this is MAE. The squared error is (3.5)² = 12.25, and with the ½ convention 6.125. The lecturer's arithmetic is right for what it computed; only the label is wrong. If a question gives you this pattern, state which error measure you are computing.</p></div>",
 needToKnow:["Write both the single-example and n-example forms","Give three reasons for squaring","Write the gradient ∂E/∂ŷ = (ŷ − t)","State that MSE pairs with a linear output for regression","Compute MSE for a small table of predictions"],

 examples:[
  {id:"m2t8e1",title:"MSE over a set of predictions",q:"A model predicts final marks 72, 85, 60, 91 for students whose actual marks are 75, 80, 65, 88. Compute the MSE, and also the total squared error using the ½ convention.",
   steps:["Errors (t − ŷ): 75−72 = 3, 80−85 = −5, 65−60 = 5, 88−91 = −3","Squared: 9, 25, 25, 9","Sum of squares = 68","MSE = 68/4 = 17","With the ½ convention per example: ½(9) + ½(25) + ½(25) + ½(9) = 34"],
   answer:"<b>MSE = 17</b> (mean squared error over 4 examples). Total error with the ½ convention = 34. RMSE = √17 = 4.12 marks, which is the interpretable figure — the model is typically about 4 marks out.",
   trap:"Notice the errors +3, −5, +5, −3 sum to exactly 0. If you had averaged the raw errors you would report a loss of 0 and conclude the model is perfect. This is precisely why squaring is necessary — it stops opposite errors cancelling."},
  {id:"m2t8e2",title:"Why MSE fails with a sigmoid output",q:"A sigmoid output unit predicts ŷ = 0.99 when the target is t = 0. Compare the gradient under MSE with the gradient under binary cross-entropy.",
   steps:["<b>MSE gradient:</b> ∂E/∂z = (ŷ − t) · σ′(z) where σ′(z) = ŷ(1 − ŷ).","σ′ = 0.99 × 0.01 = 0.0099.","∂E/∂z = (0.99 − 0) × 0.0099 = 0.0098. <b>Nearly zero.</b>","<b>Cross-entropy gradient:</b> the σ′ factor cancels algebraically, leaving ∂E/∂z = ŷ − t.","∂E/∂z = 0.99 − 0 = 0.99. <b>Large.</b>"],
   answer:"MSE gives a gradient of <b>0.0098</b>; cross-entropy gives <b>0.99</b> — a hundredfold difference on the same error.",
   trap:"The perverse behaviour is worth stating explicitly: under MSE, the <i>more</i> confidently wrong the network is, the <i>smaller</i> its correction becomes, because confidence means saturation and saturation means σ′ → 0. The network gets stuck being badly wrong. Cross-entropy is constructed so that this factor cancels, giving a correction proportional to the error itself. This is the concrete reason the activation-loss pairing table is not arbitrary."}],
 practice:[
  {id:"m2t8p1",d:"easy",q:"Write the MSE formula in both forms and explain the role of the ½.",hint:"One is per example, one averages.",a:"<div class='eqb'>Single example (backprop convention):  E = ½(t − ŷ)²\nOver n examples:                        MSE = (1/n) Σᵢ (tᵢ − ŷᵢ)²</div><p>The <b>½</b> exists purely for algebraic convenience. Differentiating ½(t − ŷ)² with respect to ŷ gives −(t − ŷ), with the 2 from the power rule cancelling the ½. Without it every gradient would carry a stray factor of 2, which is harmless but clutters derivations. It does not change where the minimum lies, since scaling a function by a positive constant does not move its minimiser.</p>"},
  {id:"m2t8p2",d:"moderate",q:"Compute the MSE for predictions [2.5, 0.0, 2.0, 8.0] against targets [3.0, −0.5, 2.0, 7.0].",hint:"Errors, then squares, then average.",a:"<p>Errors (t − ŷ): 3.0 − 2.5 = 0.5; −0.5 − 0.0 = −0.5; 2.0 − 2.0 = 0.0; 7.0 − 8.0 = −1.0</p><p>Squared: 0.25, 0.25, 0.00, 1.00</p><p>Sum = 1.50</p><p><b>MSE = 1.50 / 4 = 0.375</b></p><p>RMSE = √0.375 = 0.612. Note that the single error of −1.0 contributes 1.00 of the 1.50 total — two thirds of the loss comes from one of the four predictions, which is squaring doing its job of focusing the model on its worst case.</p>"},
  {id:"m2t8p3",d:"moderate",q:"Give three reasons why the error is squared rather than taking the absolute value.",hint:"Sign, magnitude, calculus.",a:"<p><b>1 — It removes the sign so errors cannot cancel.</b> Predictions that are too high and too low are equally wrong. Averaging raw errors of +3 and −3 gives 0, falsely reporting a perfect model. Squaring makes both 9.</p><p><b>2 — It penalises large errors disproportionately.</b> An error of 10 costs 100 while an error of 1 costs 1, so one large mistake outweighs a hundred small ones. This directs the model's effort at its worst predictions, which is usually what matters — being badly wrong once is often worse than being slightly wrong often.</p><p><b>3 — It is smooth and differentiable everywhere.</b> The absolute value |t − ŷ| has a kink at zero error where the derivative is undefined and jumps from −1 to +1. Gradient descent needs a well-defined gradient at every point, and the squared error provides one that additionally shrinks smoothly to zero as the error does, giving natural convergence.</p><p>The cost of squaring is sensitivity to outliers — a single mislabelled example with a huge error can dominate the loss — which is why absolute error is sometimes preferred on noisy data.</p>"}],

{id:"m2t9",m:"m2",title:"Entropy and Cross-Entropy Loss",type:"problem-solving",priority:"high",los:["2.2"],
 src:"Module 2 deck, slides 90–95 and 100–104",
 summary:"The classification loss, built from information theory, and the numeric example the deck works.",
 whatIs:"<p>Cross-entropy measures how far a predicted probability distribution is from the true one. It is the standard loss for every classification task, and it is built on the information-theoretic idea of entropy.</p>",
 concept:"<h4>Entropy — the amount of surprise in a distribution</h4>"+
  "<div class='eqb'>H(p) = − Σᵢ pᵢ log₂ pᵢ        measured in bits</div>"+
  "<p>Entropy is highest when a distribution is uniform (maximum uncertainty) and zero when one outcome is certain. A fair coin has H = 1 bit; a two-headed coin has H = 0.</p>"+
  "<h4>Cross-entropy</h4>"+
  "<div class='eqb'>H(t, ŷ) = − Σᵢ tᵢ log ŷᵢ</div>"+
  "<p>where t is the true distribution (usually one-hot) and ŷ the predicted one. Because t is one-hot, every term vanishes except the one for the correct class, and the whole thing collapses to a single term:</p>"+
  "<div class='eqb'>Categorical CE = − log(ŷ_correct)</div>"+
  "<p>This is the single most useful fact about cross-entropy. The loss depends <b>only on the probability assigned to the correct class</b>. Everything else in the output vector is irrelevant to the loss — though not to the gradient, because softmax couples the outputs.</p>"+
  "<h4>Binary cross-entropy</h4>"+
  "<div class='eqb'>BCE = − [ t·log(ŷ) + (1 − t)·log(1 − ŷ) ]</div>"+
  "<p>One of the two terms always vanishes: if t = 1 the loss is −log(ŷ), and if t = 0 it is −log(1 − ŷ). So it is the same rule — the negative log of the probability assigned to what actually happened.</p>"+
  "<h4>Why the logarithm behaves correctly</h4><div class='scroll'><table>"+
  "<tr><th>ŷ for the correct class</th><th>−log₂(ŷ)</th><th>Interpretation</th></tr>"+
  "<tr><td>1.00</td><td>0.00</td><td>Certain and right — no loss</td></tr>"+
  "<tr><td>0.90</td><td>0.152</td><td>Confident and right — small loss</td></tr>"+
  "<tr><td>0.50</td><td>1.000</td><td>Guessing — one bit of loss</td></tr>"+
  "<tr><td>0.10</td><td>3.322</td><td>Confidently wrong — heavy loss</td></tr>"+
  "<tr><td>0.01</td><td>6.644</td><td>Very confidently wrong — very heavy</td></tr>"+
  "<tr><td>→ 0</td><td>→ ∞</td><td>Certain and wrong — unbounded penalty</td></tr></table></div>"+
  "<p>The unbounded penalty is the point. A model that assigns near-zero probability to the truth is punished without limit, which forces it to hedge rather than make confident mistakes. Squared error, capped at 1 for probabilities, cannot do this.</p>"+
  "<h4>The deck's worked example, verified</h4>"+
  "<p>Predicted distribution S = [0.775, 0.116, 0.039, 0.070] with the first class correct.</p>"+
  "<div class='eqb'>CE = − log₂(0.775) = 0.3677 bits          ✓ verified</div>"+
  "<p>The other three probabilities never enter the calculation — they matter only in that they had to leave 0.775 for the correct class. (The deck's formula line writes 0.126 where its own table shows 0.116; the 0.775 figure it actually uses is correct, and the four values do sum to 1.000.)</p>",
 needToKnow:["Write entropy, categorical CE and binary CE","Reduce categorical CE to −log(ŷ_correct) for one-hot targets","Compute CE in bits (log₂) or nats (ln) and say which you used","Explain why the log gives an unbounded penalty for confident errors","Pair categorical CE with softmax and binary CE with sigmoid"],

  {marks:5,body:"<p>Entropy formula, cross-entropy formula, the one-hot reduction to −log(ŷ_correct), one worked number, and the pairing with softmax.</p>"},
