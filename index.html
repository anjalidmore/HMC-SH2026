{id:"m2t16",m:"m2",title:"Overfitting, Underfitting and Good Fit",type:"theory",priority:"high",los:["2.4"],
 src:"Module 2 deck, slides 239–248",
 summary:"The three fitting regimes, how to diagnose each from two numbers, and what to do about it.",
 whatIs:"<p>The deck opens the regularization section with a deployment problem: a model achieving <b>99.9%</b> in testing but only <b>61%</b> in the real world. That gap is overfitting, and diagnosing it is the first step of LO 2.4.</p>",
 concept:"<h4>The three regimes, diagnosed from two numbers</h4><div class='scroll'><table>"+
  "<tr><th></th><th>Training accuracy</th><th>Validation accuracy</th><th>Gap</th><th>Diagnosis</th></tr>"+
  "<tr><td><b>Underfitting</b></td><td>Low</td><td>Low</td><td>Small</td><td>Model too simple, or trained too little</td></tr>"+
  "<tr><td><b>Good fit</b></td><td>High</td><td>High</td><td>Small</td><td>Learned the pattern, not the noise</td></tr>"+
  "<tr><td><b>Overfitting</b></td><td><b>Very high</b></td><td><b>Low</b></td><td><b>Large</b></td><td>Memorised the training set</td></tr></table></div>"+
  "<div class='box tip'><h5>The diagnostic rule</h5><p>Look at the <b>training score</b> and the <b>gap</b>. Low training score → underfitting, whatever the gap. High training score with a large gap → overfitting. High training score with a small gap → good fit. Two numbers settle it, and the deck's 99.9% / 61% is the textbook overfitting signature.</p></div>"+
  "<h4>The deck's human analogy</h4>"+
  "<p>Two students prepare for an exam. <b>Student A stores data</b> — memorises that 2 + 3 = 5 without understanding why. Given 2 + 4 they are lost. <b>Student B extracts concepts</b> — understands place value and addition, so any new sum is answerable. Student A is the overfitted model: perfect on what was seen, useless on what was not. Student B generalises.</p>"+
  "<h4>What causes each, and what fixes it</h4><div class='scroll'><table>"+
  "<tr><th></th><th>Causes</th><th>Fixes</th></tr>"+
  "<tr><td><b>Underfitting</b></td><td>Too few layers or units; too few epochs; learning rate too small; over-aggressive regularization; features carry no signal</td><td>Increase capacity; train longer; reduce regularization; engineer better features</td></tr>"+
  "<tr><td><b>Overfitting</b></td><td>Too much capacity for the data; too little data; too many epochs; noisy or unrepresentative training data</td><td><b>Regularization</b> — L1/L2, dropout, early stopping, data augmentation, batch norm; or simply more data</td></tr></table></div>"+
  "<p>The deck's own case study names the mechanism: the model latched onto an irrelevant pattern present only in the 2023 batch, which is what memorising noise looks like in practice.</p>",
 needToKnow:["Diagnose all three regimes from training and validation scores","Name at least three causes of each","List the regularization methods as the fix for overfitting","Explain why more capacity fixes underfitting but worsens overfitting","Recognise the 99.9%/61% pattern instantly"],
 recognition:{clues:["Two accuracy figures given, one high and one low","'Train accuracy 98%, test accuracy 62%'","'The model performs poorly on new data'","'Generalisation gap'"],
  wording:["Differentiate between overfitting and underfitting.","Diagnose the following model and suggest remedies.","What is a good fit? How do you achieve it?"],
  firstMove:"Write the training and validation scores side by side and compute the gap. The diagnosis follows immediately.",
  trap:"Recommending 'more data' as the fix for underfitting. More data does not help a model that is too simple to use the data it already has."},
 examAnswer:[
  {marks:5,body:"<p>The three-regime table with training score, validation score and gap; two causes and two fixes for each of underfitting and overfitting.</p>"},
  {marks:10,body:"<p>All of the above plus the diagnostic rule stated explicitly; the memorise-versus-understand analogy; a worked diagnosis of stated numbers; and the full list of regularization methods with one line on how each attacks overfitting.</p>"}],
 mistakes:["Diagnosing from the training score alone — 99% training accuracy is excellent or disastrous depending on the gap","Suggesting more data for underfitting","Confusing high bias (underfitting) with high variance (overfitting)","Saying overfitting means 'trained too long' only; capacity and data size matter as much","Recommending regularization for an underfitted model, which makes it worse"],
 examples:[{id:"m2t16e1",title:"Diagnosing four models",q:"Diagnose and prescribe: (a) train 99.9%, val 61%; (b) train 68%, val 66%; (c) train 94%, val 91%; (d) train 55%, val 78%.",
  steps:["<b>(a)</b> Training near perfect, validation far below, gap 38.9 points. Classic <b>overfitting</b>. → Add regularization (dropout, L2), get more data, or stop earlier.","<b>(b)</b> Both scores low, gap only 2 points. The model is failing on data it has already seen, so capacity is the problem. <b>Underfitting</b>. → Add layers or units, train longer, reduce any regularization.","<b>(c)</b> Both high, gap 3 points. <b>Good fit</b>. → Nothing needed; this is the target.","<b>(d)</b> Validation <i>above</i> training — unusual. Not a fitting regime at all. → Investigate: dropout is active during training but off at validation, which routinely produces this; or the validation split is easier than the training split; or the splits leaked."],
  answer:"(a) overfitting, (b) underfitting, (c) good fit, (d) not a fitting problem — a setup artefact, most often dropout being active only during training.",
  trap:"Case (d) is the one worth knowing. Students diagnose it as 'reverse overfitting', which is not a thing. When validation beats training, look for a mechanism that penalises training only — dropout and data augmentation both do exactly that — or a flaw in how the data was split."}],
 practice:[
  {id:"m2t16p1",d:"easy",q:"Differentiate overfitting, underfitting and good fit using training and validation performance.",hint:"Two numbers and the gap between them.",a:"<div class='scroll'><table><tr><th></th><th>Training</th><th>Validation</th><th>Gap</th></tr><tr><td>Underfitting</td><td>Low</td><td>Low</td><td>Small</td></tr><tr><td>Good fit</td><td>High</td><td>High</td><td>Small</td></tr><tr><td>Overfitting</td><td>Very high</td><td>Low</td><td>Large</td></tr></table></div><p><b>Underfitting</b> — the model is too simple to capture the pattern, so it fails even on data it has seen. <b>Overfitting</b> — the model has memorised the training set including its noise, so it excels there and fails on anything new. <b>Good fit</b> — the model has learned the underlying pattern and transfers it to unseen data.</p>"},
  {id:"m2t16p2",d:"moderate",q:"Give three causes of overfitting and three of underfitting, with the corresponding fix for each.",hint:"Capacity, data and training duration appear on both sides.",a:"<p><b>Overfitting.</b> (1) Too much model capacity for the amount of data → reduce layers/units or add regularization. (2) Too little training data → collect more, or use data augmentation to synthesise variation. (3) Trained for too many epochs, so the model moves from learning the pattern to memorising noise → early stopping.</p><p><b>Underfitting.</b> (1) Model too simple — too few layers or units → increase capacity. (2) Trained for too few epochs, or the learning rate is so small nothing moves → train longer or raise η. (3) Regularization applied too aggressively — dropout rate too high, λ too large → reduce it.</p><p>Note that capacity and training duration appear on both lists in opposite directions, which is why they must be tuned rather than maximised.</p>"},
  {id:"m2t16p3",d:"moderate",q:"Why does adding data help overfitting but not underfitting?",hint:"Ask what is limiting performance in each case.",a:"<p><b>Overfitting</b> occurs when the model has more capacity than the data can constrain. With few examples there are many different parameter settings that fit them all perfectly, and the model settles on one that also captures the noise. Adding data adds constraints: a pattern that was consistent across 100 examples is unlikely to persist across 10,000, so the noise-fitting solutions are eliminated and only the genuine pattern survives. More data directly attacks the cause.</p><p><b>Underfitting</b> occurs when the model lacks the capacity to represent the pattern at all. A linear model cannot represent XOR no matter how many XOR examples you show it — the limitation is in the hypothesis space, not in the evidence. Adding data gives the model more examples of a pattern it is structurally incapable of expressing, so the training error stays exactly where it was.</p><p>The general rule: more data addresses a <i>variance</i> problem, more capacity addresses a <i>bias</i> problem, and the diagnosis tells you which you have.</p>"}],
 questions:[
  {q:"Differentiate between overfitting and underfitting, giving causes and remedies for each.",marks:10,d:"easy",priority:"high",source:"source"},
  {q:"A model achieves 99.9% training accuracy and 61% validation accuracy. Diagnose the problem and suggest three remedies.",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m2t17",m:"m2",title:"Bias, Variance and the Bias–Variance Tradeoff",type:"theory",priority:"high",los:["2.4"],
 src:"Module 2 deck, slides 249–254",
 summary:"The two error sources, the deck's definitions, and why reducing one raises the other.",
 whatIs:"<p>Bias and variance are the two components of a model's generalisation error. The deck defines them precisely, and LO 2.4's 'types of biases' bullet refers directly to this material.</p>",
 concept:"<h4>The deck's definitions</h4>"+
  "<p><b>Bias</b> — systematic deviation caused by excessively rigid architectural assumptions. A high-bias model makes the same kind of mistake consistently, because its form cannot represent the truth. Fitting a straight line to curved data gives high bias: the errors are not random, they are structural.</p>"+
  "<p><b>Variance</b> — a measurement of how highly sensitive an architectural design is to minor changes in the training data. A high-variance model would produce a substantially different function if retrained on a different sample of the same size.</p>"+
  "<div class='scroll'><table><tr><th></th><th>High bias</th><th>High variance</th></tr>"+
  "<tr><td>Model complexity</td><td>Too low</td><td>Too high</td></tr>"+
  "<tr><td>Training error</td><td>High</td><td>Very low</td></tr>"+
  "<tr><td>Validation error</td><td>High</td><td>High</td></tr>"+
  "<tr><td>Fitting regime</td><td>Underfitting</td><td>Overfitting</td></tr>"+
  "<tr><td>Stability across retraining</td><td>Very stable, consistently wrong</td><td>Unstable, changes a lot</td></tr>"+
  "<tr><td>Fix</td><td>More capacity, better features, less regularization</td><td>More data, regularization, less capacity</td></tr></table></div>"+
  "<h4>The deck's stability illustration</h4>"+
  "<p>Scores of 80, 82, 79, 81 show <b>low variance</b> — consistent behaviour. Scores of 95, 20, 90, 30, 88, 25 show <b>high variance</b> — wildly inconsistent, even though the average may be similar. Variance is about consistency, not about being right.</p>"+
  "<h4>The tradeoff</h4>"+
  "<div class='eqb'>Total error = Bias² + Variance + Irreducible noise</div>"+
  "<p>Increasing model complexity lowers bias — a more flexible model can represent more — but raises variance, because a more flexible model can also chase noise. Decreasing complexity does the reverse. Total error is therefore U-shaped in complexity, and the goal is the bottom of the U, not the minimum of either component.</p>"+
  "<p>The irreducible term is noise inherent in the data. No model of any complexity removes it, which is why zero error is not a sensible target.</p>"+
  "<div class='box tip'><h5>How this connects to everything else in Module 2</h5><p>Every regularization method is a deliberate trade: accept a little more bias in exchange for a large reduction in variance. That is why regularization <i>raises</i> training error while <i>lowering</i> validation error — and a student who states that has understood the whole section.</p></div>",
 needToKnow:["Define bias and variance in the deck's terms","Fill the high-bias vs high-variance comparison table","Write the error decomposition including irreducible noise","Explain why the tradeoff exists rather than allowing both to be minimised","Link the tradeoff to what regularization does"],
 recognition:{clues:["'Bias', 'variance', 'tradeoff'","A model described as consistently wrong, or as unstable across runs","A U-shaped error-versus-complexity curve","'Types of biases'"],
  wording:["Explain bias and variance and the tradeoff between them.","What is high bias? What is high variance? How do you detect each?","Why can bias and variance not both be minimised?"],
  firstMove:"Define both, then draw the U-shaped curve with bias falling, variance rising and total error minimised between them. That diagram answers most of the question.",
  trap:"Confusing statistical bias with the bias term b in z = Σwx + b. They share a name and nothing else."},
 examAnswer:[
  {marks:5,body:"<p>Both definitions, the comparison table, the error decomposition, and one line on why the tradeoff is unavoidable.</p>"},
  {marks:10,body:"<p>All of the above plus the U-shaped curve described with all three components; the stability illustration distinguishing consistency from correctness; and a closing paragraph on regularization as a deliberate bias-for-variance trade.</p>"}],
 mistakes:["Confusing statistical bias with the bias parameter b","Saying high variance means 'the predictions vary a lot for one input' — it means the <i>learned model</i> varies across training sets","Claiming both can be reduced to zero simultaneously","Omitting irreducible noise, so the answer implies zero error is attainable","Mapping high bias to overfitting"],
 examples:[{id:"m2t17e1",title:"Identifying the dominant error source",q:"Three models are each trained five times on different samples of the same data. (a) Validation accuracies 62, 63, 61, 62, 63; training accuracy always about 64. (b) Validation accuracies 71, 88, 65, 90, 68; training accuracy always above 99. (c) Validation accuracies 90, 91, 90, 92, 90; training 93. Diagnose each.",
  steps:["<b>(a)</b> Extremely consistent across retraining → low variance. But the training accuracy is only 64%, so the model fails even on seen data → high bias. <b>High bias, low variance — underfitting.</b>","<b>(b)</b> Validation swings from 65 to 90 across retraining → high variance. Training above 99% every time, so it can fit whatever it is given → low bias. <b>High variance, low bias — overfitting.</b>","<b>(c)</b> Consistent across runs → low variance. Training 93% and validation about 90% → low bias and a small gap. <b>Good fit.</b>"],
  answer:"(a) high bias, (b) high variance, (c) well balanced.",
  trap:"Variance is measured <i>across retraining runs</i>, not across predictions within one run. Model (b) might be perfectly confident on any single input; the instability appears only when you retrain on a different sample and get a substantially different function. This is why the deck defines variance as sensitivity to minor changes in the training data."}],
 practice:[
  {id:"m2t17p1",d:"easy",q:"Define bias and variance and give the error decomposition.",hint:"One is about rigidity, one about sensitivity.",a:"<p><b>Bias</b> — systematic deviation caused by excessively rigid architectural assumptions. The model's form cannot represent the true pattern, so it makes the same kind of error consistently, regardless of the data it sees.</p><p><b>Variance</b> — how sensitive the learned model is to minor changes in the training data. A high-variance model retrained on a different sample of the same size produces a substantially different function.</p><div class='eqb'>Total error = Bias² + Variance + Irreducible noise</div><p>The irreducible term is noise inherent in the data and cannot be removed by any model.</p>"},
  {id:"m2t17p2",d:"moderate",q:"Why is there a tradeoff at all? Why can we not minimise both?",hint:"Both are controlled by the same knob.",a:"<p>Because both are governed by the same quantity — <b>model complexity</b> — and they respond to it in opposite directions.</p><p><b>Increasing complexity lowers bias.</b> A more flexible model can represent a wider family of functions, so the rigid-assumption error falls. A degree-10 polynomial can capture curvature that a straight line cannot.</p><p><b>The same increase raises variance.</b> That extra flexibility is not selective — a model able to fit genuine curvature is equally able to fit random noise. Since the noise differs between training samples, the fitted function differs too, and the model becomes unstable across retraining.</p><p>There is no setting of the complexity knob that reduces both, because they are opposite responses to one control. What you can do is find the complexity minimising <b>Bias² + Variance</b>, which is the bottom of the U-shaped total-error curve. That is why the target is a good fit rather than a minimum of either component, and why 'make the model as powerful as possible' is bad advice.</p>"},
  {id:"m2t17p3",d:"moderate",q:"How does regularization act on the tradeoff, and why does it raise training error?",hint:"Which of the two does it target?",a:"<p>Regularization is a deliberate trade: it <b>accepts a small increase in bias to obtain a large reduction in variance</b>.</p><p>It works by constraining the model — shrinking weights (L1/L2), removing units at random (dropout), halting training early, or perturbing the inputs (augmentation, noise). Each constraint narrows the family of functions the model can express, which is exactly what raising bias means.</p><p><b>Why training error rises.</b> The unconstrained model could reach a lower training loss by using its full flexibility, including the part that was fitting noise. Once constrained, that route is closed and the best achievable training loss is higher.</p><p><b>Why validation error falls anyway.</b> The flexibility given up was mostly being spent on noise specific to the training set, which never transferred. Removing it costs a little genuine pattern-fitting ability — the bias increase — but removes a great deal of noise-fitting, which is the variance reduction. If the variance saved exceeds the bias added, total error falls.</p><p>This is why a rising training error alongside a falling validation error is the signature of regularization working correctly, and why judging a regularized model by its training score is a mistake.</p>"}],
 questions:[
  {q:"Explain bias and variance and the tradeoff between them.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"How do you detect whether a model suffers from high bias or high variance? Give the remedy for each.",marks:5,d:"moderate",priority:"high",source:"source"},
  {q:"Why does regularization increase training error while decreasing validation error?",marks:5,d:"hard",priority:"high",source:"predicted"}]},

{id:"m2t18",m:"m2",title:"L1 and L2 Regularization",type:"problem-solving",priority:"high",los:["2.4"],
 src:"Module 2 deck, slides 255–272",
 summary:"Adding a weight penalty to the loss — the two forms, and why only one produces sparsity.",
 whatIs:"<p>L1 and L2 regularization add a penalty on the size of the weights to the loss function. The deck's framing is that regularization forces the model to distribute its reliance rather than lean on a few dominant features.</p>",
 concept:"<div class='eqb'>L1 (Lasso):  E_total = E + λ Σ|wᵢ|\nL2 (Ridge):  E_total = E + λ Σ wᵢ²</div>"+
  "<p>λ controls the strength: λ = 0 removes regularization entirely, and large λ forces all weights towards zero, eventually underfitting.</p>"+
  "<h4>The gradients — where the difference comes from</h4>"+
  "<div class='eqb'>L1: ∂/∂wᵢ (λ|wᵢ|) = λ·sign(wᵢ)   ← CONSTANT pull, independent of |wᵢ|\nL2: ∂/∂wᵢ (λwᵢ²)   = 2λwᵢ        ← PROPORTIONAL pull, shrinks as w shrinks</div>"+
  "<p>This single distinction explains everything else. L1 subtracts a <b>fixed amount</b> at every step regardless of how small the weight already is, so a small weight is driven all the way to exactly 0 and stays there. L2 subtracts an amount <b>proportional</b> to the weight, so as the weight shrinks the pull weakens and it approaches 0 asymptotically without ever arriving.</p>"+
  "<div class='scroll'><table><tr><th></th><th>L1 (Lasso)</th><th>L2 (Ridge)</th></tr>"+
  "<tr><td>Penalty</td><td>λ Σ|wᵢ|</td><td>λ Σ wᵢ²</td></tr>"+
  "<tr><td>Gradient</td><td>λ·sign(wᵢ) — constant</td><td>2λwᵢ — proportional</td></tr>"+
  "<tr><td>Effect on weights</td><td>Drives many to <b>exactly 0</b></td><td>Shrinks all towards 0, none reach it</td></tr>"+
  "<tr><td>Sparsity</td><td><b>Yes</b></td><td>No</td></tr>"+
  "<tr><td>Feature selection</td><td><b>Automatic</b> — zeroed features are dropped</td><td>None — all features retained</td></tr>"+
  "<tr><td>Correlated features</td><td>Picks one, zeroes the rest</td><td>Spreads weight across them evenly</td></tr>"+
  "<tr><td>Differentiable at 0</td><td>No (kink)</td><td>Yes</td></tr>"+
  "<tr><td>Deck's framing</td><td>'Strategic minimalism' — omit unnecessary indicators</td><td>'Comprehensive load balancing' — universal participation</td></tr></table></div>"+
  "<div class='box tip'><h5>The deck's L2 illustration</h5><p>L2 turns a weight distribution dominated by one feature into an even spread — the slide shows values settling around 0.25 to 0.32 across ten features. It calls this the equalization process: no single feature is allowed to dominate, so the model cannot become fragile through over-reliance on one signal.</p></div>"+
  "<p><b>Choosing between them.</b> Use L1 when you suspect many features are irrelevant and want automatic selection. Use L2 when you believe most features contribute something and want to prevent any one from dominating. L2 is the more common default, and combining both is called elastic net.</p>",
 needToKnow:["Write both penalty terms and both gradients","Explain sparsity from the constant-versus-proportional gradient","Fill the comparison table","State the effect of λ being 0, small or very large","Choose the right one from a described situation"],
 recognition:{clues:["λ appears in a loss function","'Lasso', 'Ridge', 'penalty term', 'sparsity'","'Feature selection'","'Prevent large weights'"],
  wording:["Explain L1 and L2 regularization and compare them.","Why does L1 produce sparse weights while L2 does not?","Which regularization would you use for automatic feature selection?"],
  firstMove:"Write both penalties and then both gradients. The gradients are the answer to every comparison question on this topic.",
  trap:"Saying L2 makes weights zero. It shrinks them arbitrarily close to zero but never to exactly zero — that distinction is the whole examinable point."},
 examAnswer:[
  {marks:5,body:"<p>Both penalties, both gradients, and the sparsity explanation. The comparison table if space allows.</p>"},
  {marks:10,body:"<p>All of the above plus: the full comparison table; a numeric demonstration of a weight reaching exactly 0 under L1 but not under L2; the behaviour on correlated features; and guidance on choosing λ.</p>"}],
 mistakes:["Claiming L2 gives sparsity","Forgetting λ or treating it as learned rather than chosen","Writing L1's gradient as λw","Saying larger λ is always better — beyond a point it underfits","Confusing L2 regularization with L2 loss (MSE), which are unrelated"],
 examples:[
  {id:"m2t18e1",title:"Watching a weight reach exactly zero under L1 but not L2",q:"A weight w = 0.05 receives zero gradient from the data loss. With λ = 0.01 and η = 1.0, trace it for three steps under L1 and under L2.",
   steps:["<b>L1</b>, gradient contribution λ·sign(w) = 0.01 × 1 = 0.01, constant.","Step 1: w = 0.05 − 1.0(0.01) = 0.04","Step 2: w = 0.04 − 0.01 = 0.03","Step 3: w = 0.03 − 0.01 = 0.02 … and after five steps it hits exactly 0.00 and stops (implementations clamp at zero rather than letting it oscillate).","<b>L2</b>, gradient contribution 2λw = 0.02w, proportional.","Step 1: w = 0.05 − 0.02(0.05) = 0.05 − 0.001 = 0.049","Step 2: w = 0.049 − 0.02(0.049) = 0.04802","Step 3: w = 0.04802 − 0.00096 = 0.04706"],
   answer:"L1 removes a flat <b>0.01</b> per step and reaches exactly <b>0</b> in five steps. L2 removes 2% of whatever remains, giving 0.049, 0.048, 0.047 — approaching zero geometrically but <b>never arriving</b>.",
   trap:"The mechanism is entirely in the gradient's dependence on w. L1's pull does not weaken as the weight shrinks, so it drives right through zero. L2's pull is proportional and vanishes as the weight does, which is precisely why L2 cannot produce exact zeros — and therefore cannot perform feature selection."},
  {id:"m2t18e2",title:"Choosing λ",q:"A model overfits badly. You try λ = 0, 0.001, 0.1 and 10, obtaining training/validation accuracies of 99/61, 96/89, 88/86 and 52/51. Which λ do you choose and why?",
   steps:["λ = 0: gap of 38 points. Severe overfitting, no regularization at all.","λ = 0.001: 96/89, gap 7. Validation has risen 28 points for a 3-point drop in training. Excellent trade.","λ = 0.1: 88/86, gap 2. Very small gap but validation has fallen from 89 — the constraint is now costing genuine capacity.","λ = 10: 52/51. Both scores collapsed. The penalty dominates the data loss and every weight is crushed towards zero. This is underfitting caused by over-regularization."],
   answer:"Choose <b>λ = 0.001</b>, which gives the highest validation accuracy at 89%.",
   trap:"Two traps here. First, do not choose λ = 0.1 because it has the smallest gap — a small gap achieved by making both numbers worse is not progress; the objective is validation accuracy, not gap minimisation. Second, note that λ = 10 produces underfitting, which is why over-regularization appears on the underfitting cause list. λ is a hyperparameter and must be searched, not maximised."}],
 practice:[
  {id:"m2t18p1",d:"easy",q:"Write the L1 and L2 penalties and their gradients.",hint:"Absolute value versus square.",a:"<div class='eqb'>L1 (Lasso):  E_total = E + λ Σ|wᵢ|      gradient: λ·sign(wᵢ)\nL2 (Ridge):  E_total = E + λ Σ wᵢ²      gradient: 2λwᵢ</div><p>λ is the regularization strength, a hyperparameter you choose. The critical difference is that L1's gradient contribution is a <b>constant</b> λ (with the sign of w), while L2's is <b>proportional</b> to w.</p>"},
  {id:"m2t18p2",d:"moderate",q:"Why does L1 produce sparse weights while L2 does not?",hint:"Compare how each pull behaves as the weight approaches zero.",a:"<p>The answer is entirely in the two gradients.</p><p><b>L1's pull is constant.</b> Its gradient is λ·sign(w), whose magnitude is λ whether the weight is 5.0 or 0.001. Each step subtracts the same fixed amount, so a small weight is driven through zero in a finite number of steps and is then held at exactly 0 — any move away is immediately pulled back. Weights whose data gradient does not exceed λ are eliminated entirely.</p><p><b>L2's pull is proportional.</b> Its gradient is 2λw, which shrinks as the weight shrinks. At w = 0.001 the pull is 0.002λ — a thousand times weaker than at w = 1. Each step removes a fixed <i>fraction</i> rather than a fixed amount, giving geometric decay: 0.05, 0.049, 0.048 … The weight approaches zero asymptotically and mathematically never reaches it. At w = 0 exactly, the pull is 0, so zero is not an attractor.</p><p><b>The practical consequence:</b> L1 performs automatic feature selection, because a feature whose weight becomes exactly 0 is genuinely removed from the model. L2 keeps every feature, merely reducing all their influences. That is why L1 is used when you suspect many features are irrelevant, and L2 when you believe most contribute something.</p>"},
  {id:"m2t18p3",d:"moderate",q:"How do L1 and L2 behave differently with correlated features, and which would you choose for feature selection?",hint:"Think about two features carrying nearly the same information.",a:"<p>Suppose two features are almost perfectly correlated, so the model could use either or split the weight between them.</p><p><b>L1</b> tends to pick <b>one and zero the other</b>. Because the penalty is |w₁| + |w₂|, splitting a total weight of 1.0 as (0.5, 0.5) costs exactly the same as (1.0, 0) — the L1 cost is 1.0 either way — so there is no penalty pressure towards splitting, and the data loss will favour whichever feature fits marginally better. The result is an arbitrary choice between the two, which is unstable: a slightly different training sample may pick the other one.</p><p><b>L2</b> <b>spreads weight evenly</b>. Because the penalty is w₁² + w₂², splitting as (0.5, 0.5) costs 0.25 + 0.25 = 0.5, while (1.0, 0) costs 1.0. Squaring makes concentration expensive, so L2 actively prefers to share. This is the deck's 'comprehensive load balancing' — the slide showing weights equalising around 0.25 to 0.32 across ten features.</p><p><b>For feature selection, choose L1.</b> It is the only one of the two that produces exact zeros, and a zeroed weight means the feature can be dropped from the model entirely — reducing input cost and improving interpretability. L2 leaves every feature present with a small non-zero weight, so nothing can actually be removed. The caveat is L1's instability on correlated groups, which is why elastic net, combining both penalties, is often used in practice.</p>"}],
 questions:[
  {q:"Explain L1 and L2 regularization and compare them.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Why does L1 regularization produce sparse weights while L2 does not?",marks:5,d:"hard",priority:"high",source:"source"},
  {q:"What is the effect of setting λ too large? Relate your answer to the bias–variance tradeoff.",marks:5,d:"moderate",priority:"high",source:"predicted"}]},

{id:"m2t19",m:"m2",title:"Dropout",type:"theory",priority:"high",los:["2.4"],
 src:"Module 2 deck, slides 275–277",
 summary:"Randomly switching units off during training so no unit can be depended on.",
 whatIs:"<p>Dropout randomly sets a fraction p of the units in a layer to zero on each training pass. Which units are dropped changes every time. The deck frames it as fostering complete independence — no unit is allowed to become indispensable.</p>",
 concept:"<h4>How it works</h4><ul>"+
  "<li><b>During training:</b> each unit is kept with probability (1 − p) and zeroed with probability p, independently and re-sampled on every forward pass. A dropped unit contributes nothing forward and receives no gradient backward on that pass.</li>"+
  "<li><b>During testing:</b> <b>dropout is switched off entirely.</b> All units are active. To keep the expected input to each unit the same as during training, activations are scaled — either multiply by (1 − p) at test time, or divide by (1 − p) during training, which is the usual implementation and is called inverted dropout.</li></ul>"+
  "<div class='box warning'><h5>The mark that is most often lost</h5><p>Dropout is a <b>training-only</b> mechanism. Leaving it on at test time makes predictions random and degrades accuracy. Any answer about dropout must state that it is disabled at inference and that scaling compensates for the change.</p></div>"+
  "<h4>Why it reduces overfitting</h4><ol>"+
  "<li><b>Prevents co-adaptation.</b> A unit cannot rely on any particular other unit being present, because that other unit may be dropped. Each unit must therefore learn a feature useful on its own rather than only in combination with a specific partner.</li>"+
  "<li><b>Implicit ensemble.</b> Each forward pass trains a different randomly thinned sub-network. Training with dropout approximates training exponentially many networks that share weights, and testing with all units on approximates averaging their predictions — and averaging is the classic way to reduce variance.</li>"+
  "<li><b>Spreads reliance.</b> The deck's phrasing is that the distributed classroom empowers every individual: no single unit is allowed to dominate, which is the same principle as L2's load balancing applied to units rather than weights.</li></ol>"+
  "<h4>Choosing p</h4><div class='scroll'><table>"+
  "<tr><th>p</th><th>Effect</th></tr>"+
  "<tr><td>0</td><td>No dropout at all</td></tr>"+
  "<tr><td>0.2 – 0.3</td><td>Mild; common for input or convolutional layers</td></tr>"+
  "<tr><td>0.5</td><td>Standard for large fully connected hidden layers</td></tr>"+
  "<tr><td>0.8+</td><td>Too aggressive — too little capacity survives, causing underfitting</td></tr></table></div>"+
  "<p>Dropout is applied to hidden layers, and sometimes lightly to inputs. It is <b>not</b> applied to the output layer, where zeroing a unit would destroy the prediction.</p>",
 needToKnow:["State what dropout does during training and at test time","Explain the scaling by (1 − p) and why it is needed","Give both reasons it works: co-adaptation and the ensemble view","State typical p values and the consequence of p being too large","Say which layers dropout is and is not applied to"],
 recognition:{clues:["'Dropout', a rate p, 'randomly switched off'","'Prevent co-adaptation'","Validation accuracy exceeding training accuracy — often a dropout artefact"],
  wording:["Explain dropout as a regularization technique.","Why is dropout disabled during testing?","What is the effect of the dropout rate p?"],
  firstMove:"Split the answer into Training and Testing straight away. The train/test asymmetry is the core of the topic.",
  trap:"Saying dropout removes units permanently. The dropped set is re-sampled on every single pass, and no unit is ever removed from the model."},
 examAnswer:[
  {marks:5,body:"<p>What happens during training, what happens at test time including the scaling, and both reasons it reduces overfitting.</p>"},
  {marks:10,body:"<p>All of the above plus: the ensemble interpretation developed properly; typical p values with the consequence of over-dropping; which layers it applies to; and one line explaining why dropout can make validation accuracy exceed training accuracy.</p>"}],
 mistakes:["Forgetting that dropout is disabled at test time","Omitting the (1 − p) scaling","Applying dropout to the output layer","Saying dropped units are removed from the network permanently","Claiming p = 0.5 is always correct — convolutional layers usually want much less"],
 examples:[{id:"m2t19e1",title:"Dropout on a small layer, and the scaling",q:"A hidden layer of 8 units with p = 0.5 produces activations [0.8, 0.3, 0.9, 0.1, 0.6, 0.4, 0.7, 0.2]. Units 2, 5 and 7 are dropped on this pass. Give the output during training under inverted dropout, and the output at test time.",
  steps:["<b>Training.</b> Zero the dropped units 2, 5 and 7: [0.8, 0, 0.9, 0.1, 0, 0.4, 0, 0.2].","Inverted dropout divides the surviving activations by (1 − p) = 0.5, i.e. multiplies by 2: [1.6, 0, 1.8, 0.2, 0, 0.8, 0, 0.4].","<b>Test time.</b> Dropout is off, so all 8 units are active with no scaling: [0.8, 0.3, 0.9, 0.1, 0.6, 0.4, 0.7, 0.2].","<b>Check the expectation.</b> Training sum = 1.6 + 1.8 + 0.2 + 0.8 + 0.4 = 4.8. Test sum = 4.0. With p = 0.5 each unit survives half the time and is doubled when it does, so its expected contribution is 0.5 × 2 × a = a — matching the test-time value. The 4.8 here reflects which particular units happened to survive."],
  answer:"Training output <b>[1.6, 0, 1.8, 0.2, 0, 0.8, 0, 0.4]</b>; test output <b>[0.8, 0.3, 0.9, 0.1, 0.6, 0.4, 0.7, 0.2]</b> with no scaling and no zeroing.",
  trap:"The scaling exists so the <i>expected</i> input to the next layer is the same in both regimes. Without it, a layer that saw an average total of 4.0 during training would suddenly receive 8.0 at test time, and every downstream weight would be miscalibrated by a factor of two. Inverted dropout puts the correction in training so that inference needs no special handling at all."}],
 practice:[
  {id:"m2t19p1",d:"easy",q:"Explain what dropout does during training and during testing.",hint:"The two regimes differ, and that is the point.",a:"<p><b>During training:</b> each unit in a dropout layer is independently set to zero with probability p and kept with probability (1 − p). The set of dropped units is re-sampled on every forward pass, so a different thinned sub-network is trained each time. A dropped unit contributes nothing forward and receives no gradient backward on that pass.</p><p><b>During testing:</b> dropout is <b>switched off completely</b> — all units are active. To keep the expected input to each downstream unit unchanged, activations are scaled by (1 − p); in practice this is done by dividing by (1 − p) during training instead, which is called inverted dropout and leaves inference untouched.</p>"},
  {id:"m2t19p2",d:"moderate",q:"Give two distinct explanations of why dropout reduces overfitting.",hint:"One is about dependencies between units, one is about averaging.",a:"<p><b>1 — It prevents co-adaptation.</b> Without dropout, units can specialise into fragile partnerships: unit A learns a feature that is only meaningful when unit B is also firing, and each compensates for the other's errors. Such combinations often encode noise specific to the training set. With dropout, any given partner may be absent on any pass, so no unit can depend on another being present. Each must learn a feature that is independently useful, which are exactly the features that generalise.</p><p><b>2 — It is an implicit ensemble.</b> Each forward pass trains a different randomly thinned sub-network. Over training, dropout approximately trains exponentially many sub-networks that share weights. At test time, using all units with the (1 − p) scaling approximates averaging the predictions of all those sub-networks. Averaging many models is the classic variance-reduction technique — errors that are independent across models partly cancel — so dropout obtains an ensemble's benefit at the cost of a single model.</p>"},
  {id:"m2t19p3",d:"moderate",q:"Why does dropout sometimes make validation accuracy higher than training accuracy?",hint:"Ask when dropout is active.",a:"<p>Because the two numbers are measured under <b>different conditions</b>.</p><p><b>Training accuracy</b> is typically computed while dropout is active. The network is running as a randomly thinned sub-network with a fraction p of its units missing, so it is operating with reduced capacity and is genuinely handicapped.</p><p><b>Validation accuracy</b> is computed with dropout disabled and the full network active, effectively using the ensemble average of all sub-networks. This is the stronger configuration.</p><p>So the comparison is between a handicapped model and a full one, and with a high dropout rate such as 0.5 the handicap can easily exceed any genuine generalisation gap — producing validation scores above training scores. This is a <b>measurement artefact, not a fitting problem</b>: there is no such thing as reverse overfitting.</p><p><b>How to confirm it:</b> evaluate training accuracy with dropout disabled. If it then rises above validation accuracy, the model is behaving normally and dropout was the explanation. If training accuracy is still lower, look for a genuine cause — an easier validation split, or a leak between the two sets.</p>"}],
 questions:[
  {q:"Explain dropout as a regularization technique, stating its behaviour during training and testing.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Why must dropout be disabled during testing, and what scaling is applied?",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m2t20",m:"m2",title:"Parameter Sharing and Weight Decay",type:"theory",priority:"medium",los:["2.4"],
 src:"Module 2 deck, slides 273–274 and 280–281",
 summary:"Two weight-constraint methods: forcing weights to be identical, and shrinking them each step.",
 whatIs:"<p>Both methods regularize by constraining the weights themselves. Parameter sharing forces different connections to use the <b>same</b> weight; weight decay shrinks every weight slightly at each update.</p>",
 concept:"<h4>Parameter sharing</h4>"+
  "<p>Instead of letting every connection learn its own weight, several connections are forced to share one. The shared weight receives the sum of the gradients from all the connections using it.</p>"+
  "<p><b>Why it regularizes:</b> it reduces the number of independent parameters, which directly lowers capacity and therefore variance. A model with fewer free parameters has fewer ways to fit noise.</p>"+
  "<p><b>Where it appears:</b> this is exactly what a <b>CNN</b> does — one filter's weights are reused at every position in the image, which is Module 3's weight sharing. The deck's framing here is the multi-classroom strategy: rather than learning separate patterns for Class A, Class B and Class C, the model consolidates shared expertise into one set of parameters used everywhere.</p>"+
  "<div class='box tip'><h5>The connection to Module 3</h5><p>Parameter sharing is listed in the syllabus as a Module 2 regularization method and reappears in Module 3 as the defining property of convolution. They are the same idea: a 3×3 filter applied across a 200×200 image uses 9 weights instead of 40,000, which is both a computational saving and a powerful regulariser.</p></div>"+
  "<h4>Weight decay</h4>"+
  "<div class='eqb'>w ← w − η·∂E/∂w − η·λ·w\n  = (1 − ηλ)·w − η·∂E/∂w      ← every weight shrinks by a factor each step</div>"+
  "<p>At every update the weight is multiplied by (1 − ηλ), slightly less than 1, so it decays towards zero unless the data gradient keeps pushing it back up. Weights that are genuinely useful are sustained; weights that are not simply fade.</p>"+
  "<p><b>Relationship to L2.</b> For plain gradient descent, weight decay and L2 regularization are algebraically <b>identical</b> — adding λw² to the loss produces a gradient of 2λw, which is exactly the decay term. They differ once adaptive optimizers are involved, because L2's penalty passes through the adaptive scaling while decoupled weight decay does not. At this level, treating them as the same mechanism described two ways is correct.</p>"+
  "<p>The deck's illustration shows a dominant weight being pulled back from 8.50 to 8.20 across epochs — the mechanics of pullback calibrating dominant weights.</p>",
 needToKnow:["Define parameter sharing and say why it reduces capacity","Name CNNs as the main example of parameter sharing","Write the weight decay update in the (1 − ηλ) form","State that weight decay and L2 coincide for plain gradient descent","Explain why useful weights survive decay and useless ones do not"],
 recognition:{clues:["'Parameter sharing', 'shared weights', 'tied weights'","'Weight decay', a factor slightly less than 1","A question listing regularization methods to explain"],
  wording:["Explain parameter sharing as a regularization technique.","What is weight decay? How does it relate to L2 regularization?","How does a CNN use parameter sharing?"],
  firstMove:"For weight decay, write the update in the (1 − ηλ)w form — the shrinkage factor makes the mechanism obvious in one line.",
  trap:"Confusing weight decay with learning rate decay. Weight decay shrinks the weights; learning rate decay shrinks the step size. They are unrelated."},
 examAnswer:[
  {marks:5,body:"<p>One paragraph each. Parameter sharing: what it is, why it lowers capacity, CNNs as the example. Weight decay: the update in shrinkage form, and its equivalence to L2.</p>"},
  {marks:10,body:"<p>All of the above plus a parameter-count comparison showing sharing's saving; the derivation of the (1 − ηλ) factor; the precise sense in which weight decay equals L2 and where they diverge; and the survival argument for useful weights.</p>"}],
 mistakes:["Confusing weight decay with learning rate decay","Saying parameter sharing means initialising weights to the same value — they must remain tied throughout training","Claiming weight decay and L2 are always different, or always identical, without stating the plain-GD condition","Forgetting that the shared weight accumulates gradients from every connection using it"],
 examples:[{id:"m2t20e1",title:"How much sharing saves",q:"A 100×100 grayscale image feeds a layer that detects one feature at every position. Compare the parameter count with and without sharing.",
  steps:["<b>Without sharing</b> (fully connected): every one of the 10,000 input pixels connects to every one of the 10,000 output positions. That is 10,000 × 10,000 = <b>100,000,000</b> weights.","<b>With sharing</b> (convolution with a 3×3 filter): one filter of 3 × 3 = 9 weights plus 1 bias = <b>10</b> parameters, reused at every output position.","Ratio: 100,000,000 / 10 = 10,000,000."],
  answer:"<b>100 million</b> parameters without sharing against <b>10</b> with it — a reduction of seven orders of magnitude, for a layer computing the same kind of feature.",
  trap:"The saving is not merely computational. With 100 million free parameters and a realistic dataset of a few thousand images, the layer has vastly more capacity than the data can constrain and would memorise the training set completely. Sharing makes the model both trainable and generalisable, which is why it counts as regularization and not just as an optimisation. It also encodes a genuine prior: an edge is an edge wherever it appears, so the same detector should apply everywhere."}],
 practice:[
  {id:"m2t20p1",d:"easy",q:"What is parameter sharing and why does it act as a regulariser?",hint:"Count the free parameters before and after.",a:"<p><b>Parameter sharing</b> forces several connections in a network to use the same weight value rather than each learning its own. The shared weight receives the sum of the gradients from all the connections that use it.</p><p><b>Why it regularizes:</b> it reduces the number of <i>independent</i> parameters. Capacity is governed by how many free parameters the model has, and fewer free parameters means fewer ways to fit noise — a direct reduction in variance. It also encodes a genuine assumption about the problem: that the same pattern is worth detecting wherever it occurs.</p><p>The main example is the convolutional neural network, where one filter's weights are reused at every spatial position in the image.</p>"},
  {id:"m2t20p2",d:"moderate",q:"Write the weight decay update and explain its relationship to L2 regularization.",hint:"Factorise the weight terms together.",a:"<div class='eqb'>w ← w − η·∂E/∂w − η·λ·w\n  = (1 − ηλ)·w − η·∂E/∂w</div><p>Each update multiplies the weight by (1 − ηλ), a factor slightly less than 1, before applying the data gradient. Every weight therefore shrinks geometrically towards zero unless the data gradient keeps pushing it back.</p><p><b>Relationship to L2.</b> Adding the L2 penalty λw² to the loss contributes a gradient of 2λw. A gradient-descent step on the penalised loss is w ← w − η(∂E/∂w + 2λw), which is the weight decay update with λ absorbing the factor of 2. For plain gradient descent the two are <b>algebraically identical</b> — the same mechanism described from two directions, one as a change to the loss and one as a change to the update.</p><p>They diverge only with adaptive optimizers such as Adam, where an L2 penalty passes through the per-parameter scaling while decoupled weight decay is applied directly to the weight. At this level, treating them as the same thing is correct.</p>"},
  {id:"m2t20p3",d:"moderate",q:"Under weight decay, why do useful weights survive while useless ones fade?",hint:"Two forces act on every weight each step.",a:"<p>Two opposing forces act on every weight at each update: the <b>decay term</b> −ηλw, which always pulls towards zero, and the <b>data gradient</b> −η·∂E/∂w, which pushes wherever reduces the loss.</p><p><b>A useful weight</b> is one whose value genuinely reduces the loss. Whenever decay drags it down, the data gradient pushes it back up, because the loss rises when it shrinks. It settles at an equilibrium where the two forces balance — smaller than it would have been without decay, but clearly non-zero and sustained by the data.</p><p><b>A useless weight</b> is one the loss is indifferent to, so its data gradient is near zero. Nothing opposes the decay, and it shrinks by a factor of (1 − ηλ) every single step, decaying geometrically towards zero.</p><p>The result is automatic and continuous pruning: the model retains only the weights the data actively pays to keep. This is also why weight decay reduces the effective capacity of the network without anyone deciding in advance which connections to remove.</p>"}],
 questions:[
  {q:"Explain parameter sharing and weight decay as regularization techniques.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"How does weight decay relate to L2 regularization? Show the algebra.",marks:5,d:"moderate",priority:"medium",source:"predicted"}]},

{id:"m2t21",m:"m2",title:"Batch Normalization",type:"theory",priority:"high",los:["2.4"],
 src:"Module 2 deck, slides 282–283",
 summary:"Standardising each layer's inputs per mini-batch so training is stable and faster.",
 whatIs:"<p>Batch normalization standardises the inputs to a layer across each mini-batch — subtracting the batch mean and dividing by the batch standard deviation — then rescales with two learned parameters.</p>",
 concept:"<div class='eqb'>μ_B = (1/m) Σᵢ xᵢ                        batch mean\nσ²_B = (1/m) Σᵢ (xᵢ − μ_B)²             batch variance\n\nx̂ᵢ = (xᵢ − μ_B) / √(σ²_B + ε)          normalise to mean 0, variance 1\nyᵢ = γ·x̂ᵢ + β                           scale and shift — γ, β are LEARNED</div>"+
  "<h4>Why γ and β exist</h4>"+
  "<p>Forcing every layer's input to mean 0 and variance 1 would be a strong and possibly harmful constraint — for a sigmoid, it pins activations to the near-linear central region. The learned γ and β let the network undo the normalisation if that turns out to be better; setting γ = σ_B and β = μ_B recovers the original distribution exactly. So batch norm does not force a distribution, it makes the distribution a <b>learned</b> choice rather than an accident of the preceding weights.</p>"+
  "<h4>What it fixes</h4>"+
  "<p>As training proceeds, the weights of earlier layers change, so the distribution of inputs arriving at later layers keeps shifting. Each layer is chasing a moving target. Normalising per batch keeps that distribution stable, which the deck illustrates as standardising the learning landscape — marks from different classes brought onto a common scale before comparison.</p>"+
  "<h4>Benefits</h4><ul>"+
  "<li>Allows a <b>higher learning rate</b>, so training is faster.</li>"+
  "<li>Reduces sensitivity to weight initialisation.</li>"+
  "<li>Keeps pre-activations near zero, where sigmoid and tanh have their largest gradients — <b>reducing vanishing gradients</b>, and reducing dying ReLU.</li>"+
  "<li>Acts as a mild <b>regulariser</b>, because each example's normalisation depends on which other examples share its batch, injecting useful noise. This is why it appears in the syllabus's regularization list.</li></ul>"+
  "<div class='box warning'><h5>Training versus inference</h5><p>At test time there may be no batch — predictions are often made one example at a time, and a single-example batch has zero variance. So batch norm uses <b>running averages</b> of the mean and variance accumulated during training instead of batch statistics. Like dropout, batch norm behaves differently in the two regimes, and saying so is worth a mark.</p></div>",
 needToKnow:["Write all four equations in order","Explain why γ and β are learned rather than fixed","Name the shifting-input-distribution problem it addresses","List four benefits","State that inference uses running averages, not batch statistics"],
 recognition:{clues:["'Batch normalization', 'normalize', μ and σ","γ and β appear as learned parameters","'Stabilise training', 'allows a higher learning rate'"],
  wording:["Explain batch normalization with its equations.","Why are the scale and shift parameters learned?","How does batch normalization act as a regulariser?"],
  firstMove:"Write the four equations in order — mean, variance, normalise, scale-and-shift. The structure of the answer is the structure of the algorithm.",
  trap:"Omitting γ and β, which reduces the answer to plain standardisation and misses the reason batch norm works as well as it does."},
 examAnswer:[
  {marks:5,body:"<p>The four equations, the purpose of γ and β, and three benefits.</p>"},
  {marks:10,body:"<p>All of the above plus: the shifting-distribution problem explained; why γ, β make the distribution learned rather than imposed; the train/inference difference with running averages; and the explanation of why it regularizes.</p>"}],
 mistakes:["Forgetting γ and β","Normalising over the features rather than over the batch — batch norm computes statistics per feature, across the examples in the batch","Using batch statistics at inference","Saying it removes the need for any other regularization","Omitting ε, which prevents division by zero when a batch has near-zero variance"],
 examples:[{id:"m2t21e1",title:"Normalising a batch by hand",q:"A batch of four examples gives activations [2, 4, 6, 8] at one unit. With γ = 1 and β = 0, compute the batch-normalized outputs. Then give the outputs for γ = 2, β = 1.",
  steps:["μ_B = (2 + 4 + 6 + 8)/4 = 20/4 = 5","σ²_B = [(2−5)² + (4−5)² + (6−5)² + (8−5)²]/4 = [9 + 1 + 1 + 9]/4 = 20/4 = 5","σ_B = √5 = 2.2361","x̂ = [(2−5)/2.2361, (4−5)/2.2361, (6−5)/2.2361, (8−5)/2.2361] = [−1.3416, −0.4472, 0.4472, 1.3416]","Check: these sum to 0 ✓ and their mean square is (1.8 + 0.2 + 0.2 + 1.8)/4 = 1 ✓","<b>γ = 1, β = 0:</b> y = x̂ = [−1.3416, −0.4472, 0.4472, 1.3416]","<b>γ = 2, β = 1:</b> y = 2x̂ + 1 = [−1.6833, 0.1056, 1.8944, 3.6833]"],
  answer:"Normalised: <b>[−1.342, −0.447, 0.447, 1.342]</b>, mean 0 and variance 1. With γ = 2, β = 1: <b>[−1.683, 0.106, 1.894, 3.683]</b>, mean 1 and variance 4.",
  trap:"Two points. The statistics are computed <b>per feature across the batch</b>, not across features within one example — with a layer of 50 units you would compute 50 separate means and variances. And γ, β shift the distribution to mean β and variance γ²: the network can restore any distribution it wants, which is exactly why normalisation is not a constraint but a re-parameterisation."}],
 practice:[
  {id:"m2t21p1",d:"easy",q:"Write the batch normalization equations in order.",hint:"Four steps: mean, variance, normalise, transform.",a:"<div class='eqb'>μ_B  = (1/m) Σᵢ xᵢ\nσ²_B = (1/m) Σᵢ (xᵢ − μ_B)²\nx̂ᵢ   = (xᵢ − μ_B) / √(σ²_B + ε)\nyᵢ   = γ·x̂ᵢ + β</div><p>μ_B and σ²_B are the mean and variance over the mini-batch, computed per feature. ε is a small constant preventing division by zero. <b>γ and β are learned parameters</b>, updated by gradient descent like any weight.</p>"},
  {id:"m2t21p2",d:"moderate",q:"Why are γ and β learned rather than simply normalising to mean 0 and variance 1?",hint:"Ask whether that distribution is always the best one.",a:"<p>Because mean 0 and variance 1 is not always the right distribution for a layer's input, and forcing it would remove the network's ability to choose.</p><p><b>Concretely:</b> for a sigmoid activation, inputs with mean 0 and variance 1 sit almost entirely in the central region where the sigmoid is nearly linear. That destroys much of the non-linearity the activation was there to provide. A layer might genuinely need a wider spread to use the saturating regions, or a shifted mean to bias its units towards firing.</p><p><b>What γ and β restore:</b> since y = γx̂ + β has mean β and variance γ², the network can produce <i>any</i> mean and variance it wants. Setting γ = σ_B and β = μ_B recovers the original distribution exactly, so batch norm can always represent the identity and is never worse than not using it.</p><p>The right way to state it: batch norm does not impose a distribution, it makes the distribution a <b>learned parameter</b> rather than an accident of whatever the preceding weights happen to be. The normalisation removes the dependence on earlier layers' drift; γ and β restore the freedom that removal took away.</p>"},
  {id:"m2t21p3",d:"moderate",q:"Why does batch normalization act as a regulariser, and why does it behave differently at inference?",hint:"Ask what an example's normalised value depends on.",a:"<p><b>Why it regularizes.</b> An example's normalised value depends not only on itself but on <i>which other examples happen to share its mini-batch</i>. The same input processed in two different batches produces two slightly different normalised values. This injects noise into the representation — much as dropout does — so the network cannot depend on any exact activation value and must learn features robust to small perturbations. That reduces variance, which is why the syllabus lists batch norm among the regularization methods.</p><p><b>Why inference differs.</b> At test time predictions are often made on a single example, and a batch of one has variance zero — the normalisation would divide by √ε and the output would be meaningless. Worse, a prediction should not depend on which other examples happen to be processed alongside it; that would make the model non-deterministic.</p><p><b>The solution:</b> during training, running averages of the mean and variance are accumulated across batches. At inference those fixed running statistics are used instead of batch statistics, so each example is normalised independently and deterministically. Like dropout, batch norm therefore has two distinct modes, and forgetting to switch is a real and common bug.</p>"}],
 questions:[
  {q:"Explain batch normalization with its equations and state its benefits.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Why are the parameters γ and β learned in batch normalization?",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m2t22",m:"m2",title:"Early Stopping",type:"theory",priority:"high",los:["2.4"],
 src:"Module 2 deck, slides 284–285",
 summary:"Halting training at the point where validation loss stops improving.",
 whatIs:"<p>Early stopping monitors validation performance during training and stops when it stops improving, rather than training for a fixed number of epochs. The deck calls it the optimal exit strategy — halting over-construction.</p>",
 concept:"<h4>The two curves</h4>"+
  "<p>Training loss falls essentially monotonically: given more epochs, a model with sufficient capacity keeps fitting the training set better. Validation loss falls at first, reaches a minimum, then <b>rises</b>. The rise is the model beginning to fit noise specific to the training set, which by definition does not transfer.</p>"+
  "<p>The optimal stopping point is the <b>minimum of the validation curve</b>. Training beyond it makes the model worse on new data while continuing to look better on old data — the deck's example shows the divergence beginning around epoch 5 with train 82% and test 80%.</p>"+
  "<h4>The algorithm</h4><ol>"+
  "<li>After every epoch, evaluate the loss on a held-out validation set.</li>"+
  "<li>If it improved, save the model weights as the best so far.</li>"+
  "<li>If it did not improve, increment a counter.</li>"+
  "<li>If the counter reaches the <b>patience</b> threshold, stop.</li>"+
  "<li><b>Restore the saved best weights</b>, not the final ones.</li></ol>"+
  "<div class='box warning'><h5>The two steps that get skipped</h5><p>Saving the best weights and restoring them at the end. Without them you stop at a point that is <i>patience</i> epochs worse than the best one you found, which wastes the whole mechanism.</p></div>"+
  "<h4>Patience</h4>"+
  "<p>Validation loss is noisy and often rises for an epoch or two before improving again. Patience is the number of consecutive non-improving epochs tolerated before stopping. Too small and you stop on noise, before the real minimum; too large and you waste computation past it, though the saved weights protect the result.</p>"+
  "<h4>Why it counts as regularization</h4>"+
  "<p>It limits how far the weights travel from their initialisation, which restricts the effective size of the hypothesis space explored. Fewer epochs means less opportunity to fit noise — capacity is constrained through <i>time</i> rather than through architecture or a penalty term. It is the cheapest regularization method there is: it requires no extra computation and actually saves it.</p>",
 needToKnow:["Describe the shape of both curves and where they diverge","State that the stopping point is the validation minimum","Give the algorithm including saving and restoring the best weights","Define patience and state the consequence of it being too small or too large","Explain why it counts as regularization"],
 recognition:{clues:["Two loss curves, one still falling and one rising","'Validation loss increased for N epochs'","'When should training be stopped?'","'Patience'"],
  wording:["Explain early stopping as a regularization technique.","At which epoch should training be stopped, and why?","What is patience in early stopping?"],
  firstMove:"Sketch the two curves with the validation minimum marked. That diagram is most of the answer.",
  trap:"Stopping on <i>training</i> loss. Training loss keeps falling and never signals overfitting; early stopping requires a separate validation set."},
 examAnswer:[
  {marks:5,body:"<p>The two curves and their divergence, the stopping criterion, the algorithm including restoring the best weights, and one line on why it regularizes.</p>"},
  {marks:10,body:"<p>All of the above plus: patience with the consequences of both extremes; why a separate validation set is required; and the argument that early stopping constrains capacity through time rather than through architecture.</p>"}],
 mistakes:["Monitoring training loss instead of validation loss","Not restoring the best weights","Using the test set for the stopping decision, which leaks it and invalidates the final estimate","Setting patience to 1, so training halts on ordinary noise","Saying it prevents underfitting — it prevents overfitting and can cause underfitting if triggered too early"],
 examples:[{id:"m2t22e1",title:"Choosing the stopping epoch",q:"Validation losses by epoch: 1: 0.68, 2: 0.51, 3: 0.42, 4: 0.38, 5: 0.36, 6: 0.37, 7: 0.39, 8: 0.36, 9: 0.41, 10: 0.44, 11: 0.47. With patience = 3, when does training stop, and which weights are used?",
  steps:["Track the best so far. Epochs 1–5 improve each time; best = 0.36 at epoch 5, counter 0.","Epoch 6: 0.37 > 0.36, no improvement. Counter = 1.","Epoch 7: 0.39, no improvement. Counter = 2.","Epoch 8: 0.36 — equal to the best, not an improvement under a strict rule. Counter = 3, so training stops here.","(Under a rule treating ties as improvements, the counter resets and training continues to epoch 11, stopping there with best still 0.36.)","Either way the best validation loss is 0.36, first reached at <b>epoch 5</b>.","Restore the epoch 5 weights, not the epoch 8 or 11 weights."],
  answer:"Training stops at <b>epoch 8</b> with patience 3, and the weights restored are those from <b>epoch 5</b>, where validation loss was lowest.",
  trap:"Two traps. Stopping at epoch 8 and keeping the epoch 8 weights loses nothing here because 0.36 ties, but had epoch 8 been 0.45 the final model would have been clearly worse than the best one found — which is why restoring is not optional. And note that stopping at epoch 6 with patience 1 would have been premature, since epoch 8 returns to the best value."}],
 practice:[
  {id:"m2t22p1",d:"easy",q:"Explain early stopping and state the stopping criterion.",hint:"Two curves behave differently.",a:"<p><b>Early stopping</b> halts training when validation performance stops improving, rather than running for a fixed number of epochs.</p><p><b>The two curves:</b> training loss falls essentially monotonically, because a model with enough capacity keeps fitting the training data better. Validation loss falls at first, reaches a minimum, then rises — the rise being the point where the model starts fitting noise specific to the training set.</p><p><b>The criterion:</b> stop at the <b>minimum of the validation loss curve</b>. In practice, stop after <i>patience</i> consecutive epochs without improvement, then restore the weights saved at the best epoch.</p>"},
  {id:"m2t22p2",d:"moderate",q:"Give the early stopping algorithm and explain why the last two steps matter.",hint:"What are you left holding when training stops?",a:"<p><b>Algorithm.</b> (1) After each epoch, evaluate loss on a held-out validation set. (2) If it improved on the best seen so far, save the current weights and reset the counter to 0. (3) If not, increment the counter. (4) If the counter reaches <i>patience</i>, stop training. (5) <b>Restore the saved best weights.</b></p><p><b>Why steps 2 and 5 matter.</b> When training stops, the current weights are by construction from an epoch that did <i>not</i> improve — you have just sat through <i>patience</i> consecutive non-improving epochs, so the final weights are worse than the best ones found, typically by several epochs of overfitting.</p><p>Without saving and restoring, early stopping identifies the right moment and then discards the model from that moment, keeping a degraded one instead. With patience = 10 you could end up with a model ten epochs into overfitting. Saving costs one copy of the weights in memory and turns a rough heuristic into an exact one: you keep the best model you ever had.</p>"},
  {id:"m2t22p3",d:"moderate",q:"Why is early stopping considered regularization, and why must it use a validation set rather than the training set?",hint:"Regularization constrains capacity; ask through what.",a:"<p><b>Why it regularizes.</b> Every regularization method constrains the effective capacity of the model. L2 constrains it through weight magnitude, dropout through unit availability, parameter sharing through the number of free parameters. Early stopping constrains it through <b>time</b>: the weights start near their initialisation and travel further from it with each epoch, so limiting the number of epochs limits how far the model can move and therefore how much of the hypothesis space it can explore. Fewer epochs means less opportunity to fit noise. It is the cheapest method available, since it saves computation rather than adding any.</p><p><b>Why the training set cannot be used.</b> Training loss falls essentially monotonically — it keeps improving whether the model is learning genuine pattern or memorising noise, because both reduce error on the data being memorised. It therefore carries <i>no signal at all</i> about when overfitting begins, and a stopping rule based on it would never trigger.</p><p>Only data the model has not been fitted to can reveal the divergence. And it must be a <b>validation</b> set, not the test set: using the test set to decide when to stop makes that decision part of training, so the resulting test score is optimistically biased and no longer an honest estimate of generalisation. The standard arrangement is three splits — train to fit, validate to decide, test once at the end to report.</p>"}],
 questions:[
  {q:"Explain early stopping as a regularization technique with its algorithm.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Why must early stopping monitor validation loss rather than training loss?",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m2t23",m:"m2",title:"Data Augmentation and Adding Noise",type:"theory",priority:"medium",los:["2.4"],
 src:"Module 2 deck, slides 286–290",
 summary:"Manufacturing training variety, and deliberately perturbing inputs and outputs.",
 whatIs:"<p>Both methods attack overfitting at its root cause — insufficient or too-clean data — rather than constraining the model. The deck frames the problem as the limitation of finite data: with only 100 records the system is forced to memorise the few available examples rather than learn the underlying principle.</p>",
 concept:"<h4>Data augmentation</h4>"+
  "<p>Generate new training examples by applying <b>label-preserving transformations</b> to existing ones. A rotated cat is still a cat, so the transformed image can be used as a genuine new training example with the same label.</p>"+
  "<div class='scroll'><table><tr><th>Data type</th><th>Typical transformations</th></tr>"+
  "<tr><td>Images</td><td>Rotation, horizontal flip, crop, scale, translation, brightness and contrast shifts, small added noise</td></tr>"+
  "<tr><td>Audio</td><td>Time shift, speed change, pitch shift, background noise</td></tr>"+
  "<tr><td>Text</td><td>Synonym replacement, back-translation, random word deletion</td></tr>"+
  "<tr><td>Tabular</td><td>Synthetic records within realistic ranges — the deck's example generates attendance 79%, quiz 74, assignment 91</td></tr></table></div>"+
  "<div class='box warning'><h5>Label preservation is the constraint</h5><p>A transformation is only valid if it does not change the correct answer. Flipping a photograph of a cat horizontally is fine. Flipping a photograph of the digit 2 gives something that is no longer a 2, and flipping a 6 gives a 9 — with the wrong label attached. Vertical flips are almost never valid for natural images. Choosing augmentations requires knowing what the label actually depends on.</p></div>"+
  "<h4>Adding noise</h4>"+
  "<p>Small random perturbations are added deliberately.</p><ul>"+
  "<li><b>Noise on the input</b> — forces the model to learn features robust to small variations, since it can never rely on an exact pixel or exact value. This is closely related to augmentation and, for a linear model, is mathematically equivalent to L2 regularization.</li>"+
  "<li><b>Noise on the output / labels</b> — a small fraction of training labels are perturbed, or the target is softened from 1.0 to, say, 0.9 (label smoothing). This stops the model becoming absolutely certain, which is what produces the confidently wrong predictions cross-entropy punishes so heavily.</li>"+
  "<li><b>Noise on the weights</b> — encourages solutions in flat regions of the loss surface, which tend to generalise better than sharp minima.</li></ul>"+
  "<p>The deck's framing is teaching concepts over exact values: a fragile model memorises that attendance was exactly 80, while a robust one learns that attendance <i>around</i> 80 indicates a certain outcome.</p>"+
  "<div class='box tip'><h5>Why these two differ from every other method here</h5><p>L1/L2, dropout, early stopping and batch norm all constrain the <b>model</b>. Augmentation and noise change the <b>data</b>. That makes them complementary — they can and normally should be combined with the others rather than chosen instead of them.</p></div>",
 needToKnow:["Define augmentation and give transformations for at least two data types","State the label-preservation constraint and give an example where it fails","Distinguish input noise, label noise and weight noise","Explain why these methods attack the cause rather than the symptom","Say why they combine with other regularization rather than replacing it"],
 recognition:{clues:["'Limited data', 'small dataset', 'only 100 samples'","'Augmentation', 'transformations', 'synthetic data'","'Adding noise to input and output'"],
  wording:["Explain data augmentation as a regularization technique.","How does adding noise to inputs and outputs prevent overfitting?","Give suitable augmentations for image data and state one that would be invalid."],
  firstMove:"Ask what transformations leave the label unchanged for this data type. That question generates the whole list and also generates the counter-examples.",
  trap:"Listing vertical flip for digit or text recognition. It changes the label and would actively harm training."},
 examAnswer:[
  {marks:5,body:"<p>Define augmentation with a table of transformations by data type, state the label-preservation constraint with one failure example, then the three kinds of noise.</p>"},
  {marks:10,body:"<p>All of the above plus: why these attack the cause of overfitting rather than its symptom; the equivalence between input noise and L2 for a linear model; label smoothing and what it prevents; and why augmentation combines with rather than replaces model-side regularization.</p>"}],
 mistakes:["Suggesting transformations that change the label","Calling augmentation 'collecting more data' — no new information is added, only new views of the same information","Applying augmentation to the validation or test set, which corrupts the evaluation","Adding so much noise that the signal is destroyed","Treating augmentation as an alternative to dropout or L2 rather than a complement"],
 examples:[{id:"m2t23e1",title:"Valid and invalid augmentations",q:"For each task, give two valid augmentations and one that would be invalid: (a) classifying photographs as cat or dog; (b) recognising handwritten digits 0–9; (c) reading a car's speedometer from a dashboard photo.",
  steps:["<b>(a) Cat vs dog.</b> Valid: horizontal flip (a mirrored cat is a cat); brightness variation (lighting does not change species). Invalid: cropping so tightly that the animal leaves the frame — the label no longer describes the image.","<b>(b) Handwritten digits.</b> Valid: small rotation of ±10° (handwriting is naturally slanted); small translation (position on the page is irrelevant). Invalid: <b>horizontal flip</b> — a mirrored 2 is not a digit at all, and a mirrored 6 resembles a 9 while keeping the label 6, actively teaching the model something false.","<b>(c) Speedometer reading.</b> Valid: brightness and contrast changes (dashboard lighting varies); small translation (camera position varies). Invalid: <b>any rotation</b> — the reading is determined by the needle's angle, so rotating the image changes the correct answer while the label stays put."],
  answer:"The invalid cases are: over-tight cropping for (a), horizontal flip for (b), and rotation for (c).",
  trap:"Case (c) shows that a transformation valid for one task can be fatal for another — small rotations were <i>recommended</i> for digits and are disqualifying here. The test is always the same: does the transformation change what the correct label should be? That requires knowing what the label actually depends on, which is why augmentation cannot be chosen mechanically."}],
 practice:[
  {id:"m2t23p1",d:"easy",q:"What is data augmentation and what is the constraint on which transformations may be used?",hint:"The transformed example still needs a correct label.",a:"<p><b>Data augmentation</b> generates additional training examples by applying transformations to existing ones, expanding an effectively small dataset without collecting new data.</p><p><b>The constraint is label preservation:</b> a transformation is valid only if the correct label for the transformed example is the same as for the original. A horizontally flipped photograph of a cat is still a cat, so it is a valid new training example. A horizontally flipped image of the digit 6 looks like a 9 but would carry the label 6, teaching the model something false.</p><p>Typical valid transformations for images are rotation, horizontal flip, crop, scale, translation and brightness or contrast shifts — but which of these are valid depends entirely on the task.</p>"},
  {id:"m2t23p2",d:"moderate",q:"Distinguish adding noise to the input from adding noise to the output, and say what each achieves.",hint:"One perturbs what goes in, the other what the model is asked to match.",a:"<p><b>Input noise.</b> Small random perturbations are added to the features before they enter the network. The model can never rely on an exact input value, so it must learn features that are stable under small variations — the deck's point about teaching concepts rather than exact values. For a linear model, adding Gaussian input noise is mathematically equivalent to L2 regularization, which makes the connection to the model-side methods precise.</p><p><b>Output / label noise.</b> The targets themselves are perturbed: a small fraction of labels are flipped, or the target is softened from 1.0 to around 0.9 and from 0.0 to around 0.1 — the latter being label smoothing. This prevents the model from driving its output probabilities to 0 and 1, which is what produces the confidently-wrong predictions that cross-entropy punishes without bound. It keeps the model appropriately uncertain and improves calibration.</p><p><b>The distinction in one line:</b> input noise makes the model robust to variation in what it <i>sees</i>; output noise makes it humble about what it <i>concludes</i>.</p>"},
  {id:"m2t23p3",d:"moderate",q:"Why are augmentation and noise different in kind from L2, dropout and early stopping, and why does that make them complementary?",hint:"Ask what each method modifies.",a:"<p><b>They act on different things.</b> L1/L2, dropout, weight decay, batch norm and early stopping all constrain the <b>model</b> — its weight magnitudes, its available units, its training duration. They accept the dataset as given and limit what the model may do with it. Augmentation and noise instead modify the <b>data</b>, leaving the model entirely unconstrained.</p><p><b>Cause versus symptom.</b> Overfitting arises when a model has more capacity than the data can constrain. Model-side methods attack the numerator by reducing capacity; augmentation attacks the denominator by increasing the effective amount and variety of data. Augmentation therefore addresses the root cause rather than compensating for it, which is why it is usually the first thing to try when data is genuinely scarce.</p><p><b>Why they combine.</b> Because they operate on different sides of the same ratio, their effects multiply rather than overlap. Augmenting the data does not stop the model co-adapting its units, which is what dropout prevents; adding dropout does not give the model any new views of the data, which is what augmentation provides. A typical image pipeline runs augmentation, batch normalization, dropout and early stopping simultaneously, and each contributes something the others cannot.</p><p>One caveat worth stating: augmentation adds no genuinely new <i>information</i>, only new views of information already present. If the training set contains no example of a particular class, no transformation will invent one.</p>"}],
 questions:[
  {q:"Explain data augmentation and adding noise as regularization techniques.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Give suitable augmentations for image data and state one transformation that would be invalid, with reasons.",marks:5,d:"moderate",priority:"medium",source:"predicted"}]}
]);
