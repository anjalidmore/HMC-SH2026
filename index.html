/* ===================== PROGRESS MODEL ===================== */
var STORAGE_OK = true;
function blankProgress(){
  return { examples:{}, practice:{}, quizSet:{}, quizTopic:{}, quizStage:{},
           lastStudied:null, streak:0, lastVisit:null, firstVisit:null };
}
var P = blankProgress();

function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ STORAGE_OK=false; return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); return true; } catch(e){ STORAGE_OK=false; return false; } }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){ STORAGE_OK=false; } }

function loadProgress(){
  var raw = lsGet(KEY);
  if(!raw){ P = blankProgress(); return; }
  try {
    var o = JSON.parse(raw);
    var v = validateProgress(o);
    P = v.ok ? v.data : blankProgress();
  } catch(e){ P = blankProgress(); }
}
function saveProgress(){ lsSet(KEY, JSON.stringify(P)); }

/* --- validation: reject anything that is not a recognisable progress file --- */
function isObj(x){ return x && typeof x==="object" && !Array.isArray(x); }
function validateProgress(o){
  if(!isObj(o)) return {ok:false};
  var marker = (o._app === "hmcal703_dl_study");
  var hasAny = ["examples","practice","quizSet","quizTopic","quizStage"].some(function(k){ return isObj(o[k]); });
  if(!marker && !hasAny) return {ok:false};

  var out = blankProgress();
  var exIds = {}, prIds = {};
  TOPICS.forEach(function(t){
    (t.examples||[]).forEach(function(e){ exIds[e.id]=1; });
    (t.practice||[]).forEach(function(p){ prIds[p.id]=1; });
  });
  if(isObj(o.examples)) Object.keys(o.examples).forEach(function(k){
    if(exIds[k] && o.examples[k]===true) out.examples[k]=true; });
  if(isObj(o.practice)) Object.keys(o.practice).forEach(function(k){
    if(prIds[k] && o.practice[k]===true) out.practice[k]=true; });

  var nSets = quizSetCount();
  if(isObj(o.quizSet)) Object.keys(o.quizSet).forEach(function(k){
    var s = o.quizSet[k], i = parseInt(k,10);
    if(!isObj(s)) return;
    if(!(i>=0 && i<nSets)) return;
    var score = s.score, ans = isObj(s.answers)? s.answers : null;
    if(!isObj(score)) return;
    var n = score.n, c = score.c;
    if(typeof n!=="number" || typeof c!=="number") return;
    if(n<=0 || c<0 || c>n) return;
    var cleanA = {};
    if(ans) Object.keys(ans).forEach(function(q){
      var vv = ans[q];
      if(typeof vv==="number" && vv>=0 && vv<=3) cleanA[q]=vv; });
    out.quizSet[i] = { answers:cleanA, score:{n:n,c:c},
      submittedAt: typeof s.submittedAt==="string" ? s.submittedAt : null };
  });
  ["quizTopic","quizStage"].forEach(function(key){
    if(!isObj(o[key])) return;
    Object.keys(o[key]).forEach(function(k){
      var s = o[key][k];
      if(!isObj(s)) return;
      var n = s.n, c = s.c;
      if(typeof n!=="number" || typeof c!=="number") return;
      if(n<=0 || c<0 || c>n) return;
      out[key][k] = {n:n, c:c};
    });
  });
  ["lastStudied","lastVisit","firstVisit"].forEach(function(k){
    if(typeof o[k]==="string") out[k]=o[k];
  });
  if(typeof o.streak==="number" && isFinite(o.streak))
    out.streak = Math.max(0, Math.min(3650, Math.floor(o.streak)));
  return {ok:true, data:out};
}

/* --- derived, computed at render time only --- */
function topicById(id){ for(var i=0;i<TOPICS.length;i++) if(TOPICS[i].id===id) return TOPICS[i]; return null; }
function topicQuestions(t){
  var n=0; (t.examples||[]).forEach(function(){n++;}); (t.practice||[]).forEach(function(){n++;}); return n;
}
function topicDone(t){
  var d=0;
  (t.examples||[]).forEach(function(e){ if(P.examples[e.id]) d++; });
  (t.practice||[]).forEach(function(p){ if(P.practice[p.id]) d++; });
  return d;
}
function topicProgress(t){
  var total = topicQuestions(t), done = topicDone(t);
  return { done:done, total:total, pct: total? Math.round(done*100/total) : 0 };
}
function topicStatus(id){
  var t = topicById(id); if(!t) return "none";
  var p = topicProgress(t);
  if(p.total===0) return "none";
  if(p.done===0) return "none";
  return p.done>=p.total ? "done" : "progress";
}
function progressOf(list){
  var d=0,tot=0;
  list.forEach(function(t){ var p=topicProgress(t); d+=p.done; tot+=p.total; });
  return { done:d, total:tot, pct: tot? Math.round(d*100/tot) : 0 };
}
function highTopics(){ return TOPICS.filter(function(t){ return t.priority==="high"; }); }
function overallProgress(opt){
  var all = opt && opt.all;
  return progressOf(all ? TOPICS : highTopics());
}
function moduleTopics(m){ return TOPICS.filter(function(t){ return t.m===m; }); }
function moduleProgress(m, opt){
  var list = moduleTopics(m);
  if(!(opt && opt.all)) list = list.filter(function(t){ return t.priority==="high"; });
  return progressOf(list);
}
function trackProgress(track, opt){
  var list = TOPICS.filter(function(t){ return t.type===track; });
  if(!(opt && opt.all)) list = list.filter(function(t){ return t.priority==="high"; });
  return progressOf(list);
}
function moduleTrackProgress(m, track){
  return progressOf(TOPICS.filter(function(t){ return t.m===m && t.type===track; }));
}
function topicsFinished(m){
  var list = moduleTopics(m), n=0;
  list.forEach(function(t){ if(topicStatus(t.id)==="done") n++; });
  return {done:n, total:list.length};
}
function weakTopics(){
  var out=[];
  Object.keys(P.quizTopic).forEach(function(id){
    var s=P.quizTopic[id];
    if(s.n>=2){ var acc=s.c/s.n; if(acc<0.6) out.push({id:id, acc:Math.round(acc*100), n:s.n}); }
  });
  out.sort(function(a,b){ return a.acc-b.acc; });
  return out;
}
function stageAccuracy(){
  return ["recognise","select","solve","concept"].map(function(s){
    var v=P.quizStage[s];
    return {stage:s, n:v?v.n:0, pct: v&&v.n? Math.round(v.c*100/v.n) : null};
  });
}
function quizAccuracy(){
  var n=0,c=0;
  Object.keys(P.quizSet).forEach(function(k){ n+=P.quizSet[k].score.n; c+=P.quizSet[k].score.c; });
  return { n:n, c:c, pct: n? Math.round(c*100/n) : null };
}

/* --- marking --- */
function markQ(kind, id, on){
  var map = kind==="ex" ? P.examples : P.practice;
  if(on) map[id]=true; else delete map[id];
  P.lastStudied = new Date().toISOString();
  saveProgress();
}
function isMarked(kind, id){ return !!(kind==="ex" ? P.examples[id] : P.practice[id]); }

/* --- streak --- */
function touchVisit(){
  var today = new Date().toISOString().slice(0,10);
  if(!P.firstVisit) P.firstVisit = today;
  if(P.lastVisit !== today){
    var prev = P.lastVisit;
    if(prev){
      var d1=new Date(prev+"T00:00:00Z"), d2=new Date(today+"T00:00:00Z");
      var days = Math.round((d2-d1)/86400000);
      P.streak = (days===1) ? (P.streak||0)+1 : 1;
    } else P.streak = 1;
    P.lastVisit = today;
    saveProgress();
  }
}

/* --- quiz sets --- */
var QUIZ_SET_SIZE = 20;
function quizSetCount(){ return Math.floor(QUIZ.length / QUIZ_SET_SIZE); }
function quizSet(i){
  /* stable round-robin so every set mixes modules; bank order never changes */
  var n = quizSetCount(), out=[];
  for(var k=0;k<QUIZ.length;k++){ if(k % n === i) out.push({q:QUIZ[k], gi:k}); }
  return out.slice(0, QUIZ_SET_SIZE);
}
function submitQuizSet(i, answers){
  var items = quizSet(i), c=0;
  items.forEach(function(it){
    var given = answers[it.gi];
    var ok = (given === it.q.a);
    if(ok) c++;
    var tk = it.q.t, sk = it.q.stage;
    if(given !== undefined){
      if(!P.quizTopic[tk]) P.quizTopic[tk]={n:0,c:0};
      P.quizTopic[tk].n++; if(ok) P.quizTopic[tk].c++;
      if(!P.quizStage[sk]) P.quizStage[sk]={n:0,c:0};
      P.quizStage[sk].n++; if(ok) P.quizStage[sk].c++;
    }
  });
  P.quizSet[i] = { answers:answers, score:{n:QUIZ_SET_SIZE, c:c}, submittedAt:new Date().toISOString() };
  P.lastStudied = new Date().toISOString();
  saveProgress();
  return c;
}
function resetQuiz(){
  P.quizSet={}; P.quizTopic={}; P.quizStage={};
  saveProgress();
}
function resetAll(){
  P = blankProgress();
  P.firstVisit = new Date().toISOString().slice(0,10);
  P.lastVisit = P.firstVisit; P.streak = 1;
  saveProgress();
}

    '<tr><td>First visit</td><td>'+esc(P.firstVisit||"—")+'</td></tr>'+
    '<tr><td>Day streak</td><td>'+(P.streak||0)+'</td></tr>'+
    '</table></div>';

  h += '<h3>Accuracy by recognition stage</h3><div class="scroll"><table><tr><th>Stage</th><th>Accuracy</th><th>Answered</th></tr>'+
    stageAccuracy().map(function(s){
      return '<tr><td>'+esc(s.stage)+'</td><td>'+(s.pct===null?"—":s.pct+"%")+'</td><td>'+s.n+'</td></tr>';
    }).join("")+'</table></div>';

  if(wk.length){
    h += '<h3>Weak topics</h3><div class="scroll"><table><tr><th>Topic</th><th>Accuracy</th><th></th></tr>'+
      wk.map(function(w){ var t=topicById(w.id); if(!t) return "";
        return '<tr><td>'+esc(t.title)+'</td><td>'+w.acc+'%</td>'+
          '<td><button class="btn" data-go="topic" data-id="'+esc(w.id)+'">Open</button></td></tr>'; }).join("")+
      '</table></div>';
  }

  h += '<h2>Theme</h2><div class="btnrow">'+
    ["light","dark","system"].map(function(t){
      return '<button class="btn'+(theme===t?" pri":"")+'" data-theme="'+t+'">'+
        (t==="system"?"Match system":(t.charAt(0).toUpperCase()+t.slice(1)))+'</button>';
    }).join("")+'</div>';

  h += '<h2>Data</h2><div class="btnrow">'+
    '<button class="btn" data-export="1">Export progress</button>'+
    '<button class="btn" data-import="1">Import progress</button>'+
    '<button class="btn" data-resetall="1">Reset everything</button></div>'+
    '<input type="file" id="importFile" accept="application/json,.json" class="hide">';

  h += '<h2>About</h2>'+
    '<div class="card"><h4 style="margin-top:0">The exam contract</h4><div class="scroll"><table>'+
    '<tr><td>Course</td><td>'+esc(COURSE.code)+' — '+esc(COURSE.name)+'</td></tr>'+
    '<tr><td>Assessment</td><td>'+esc(COURSE.exam)+'</td></tr>'+
    '<tr><td>Marks</td><td>'+COURSE.marks+'</td></tr>'+
    '<tr><td>Duration</td><td>'+(COURSE.durationMin/60)+' hours</td></tr>'+
    '<tr><td>Scope</td><td>'+esc(COURSE.scope)+'</td></tr>'+
    '<tr><td>Paper structure</td><td>Not stated — see the note below</td></tr>'+
    '</table></div></div>'+

    '<div class="box warning"><h5>One thing to confirm</h5><p>'+CONFIRM+'</p></div>'+

    '<div class="card"><h4 style="margin-top:0">Built from these files, and only these</h4><ul class="small">'+
    COURSE.files.map(function(f){ return '<li>'+esc(f)+'</li>'; }).join("")+'</ul>'+
    '<p class="small">All 442 slide pages were read. Two of the three decks are image-only — text extraction returned about '+
    '110 characters per page — so every page was rendered and read as an image rather than skipped.</p></div>'+

    '<div class="card"><h4 style="margin-top:0">No past paper exists for this assessment</h4>'+
    '<p class="small">The folder contains <b>no previous-year paper, no internal-assessment paper and no question bank</b> of any kind. '+
    'Nothing on this site is labelled &ldquo;previous year&rdquo; because there is nothing to label. '+
    'Questions marked <span class="srcpill">From source material</span> are worked examples or exercises that appear in the decks; '+
    'questions marked <span class="srcpill pred">Likely exam pattern</span> were written for this site and are a minority.</p></div>'+

    '<div class="card"><h4 style="margin-top:0">How priority was derived</h4><ol class="small">'+
    PRIORITY_RULE.map(function(r){ return '<li>'+r+'</li>'; }).join("")+'</ol>'+
    '<p class="small">Readiness on the Dashboard counts high-priority topics only. Low-priority topics keep full pages and can still be '+
    'marked done — they move the whole-syllabus figure in the table above, not the headline.</p></div>'+

    '<div class="card"><h4 style="margin-top:0">Numerical verification</h4>'+
    '<p class="small">Every number in the source material was independently recomputed in Python: <b>48 of 55 checks passed</b>. '+
    'The seven discrepancies are documented on the topic pages where they occur, with the lecturer\'s figures presented as authoritative '+
    'and the recomputation shown beside them. They are: e^0.12 printed as 1.27 (softmax example), the resulting sum of 18.41, '+
    'two rounded softmax probabilities on a generated slide, an absolute error labelled as MSE, a net input of 0.06 that requires a '+
    'different bias from the one stated two slides earlier, and σ(0.6) shown as 0.64 rather than 0.65.</p></div>'+

    '<div class="card"><h4 style="margin-top:0">Keyboard</h4>'+
    '<p class="small"><span class="mono">/</span> focuses search · <span class="mono">Esc</span> closes it · '+
    '<span class="mono">Enter</span> or <span class="mono">Space</span> activates a focused result or button.</p></div>';
  return h;
}
/* ===================== SEARCH ===================== */
var SEARCH_INDEX = null;
function stripTags(s){ return String(s==null?"":s).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim(); }
function buildIndex(){
  if(SEARCH_INDEX) return SEARCH_INDEX;
  var ix = [];
  TOPICS.forEach(function(t){
    ix.push({kind:"Topic", title:t.title, body:stripTags(t.summary+" "+t.whatIs+" "+t.concept),
      crumb:moduleShort(t.m), go:{v:"topic", id:t.id}});
    (t.examples||[]).forEach(function(e){
      ix.push({kind:"Worked example", title:e.title, body:stripTags(e.q+" "+(e.steps||[]).join(" ")+" "+e.answer),
        crumb:moduleShort(t.m)+" › "+t.title, go:{v:"topic", id:t.id, anchor:e.id}});
    });
    (t.practice||[]).forEach(function(p){
      ix.push({kind:"Practice question", title:stripTags(p.q).slice(0,90), body:stripTags(p.q+" "+p.hint+" "+p.a),
        crumb:moduleShort(t.m)+" › "+t.title, go:{v:"topic", id:t.id, anchor:p.id}});
    });
    (t.recognition.clues||[]).forEach(function(c){
      ix.push({kind:"Recognition clue", title:stripTags(c), body:stripTags(c+" "+t.recognition.firstMove),
        crumb:moduleShort(t.m)+" › "+t.title, go:{v:"topic", id:t.id}});
    });
    (t.questions||[]).forEach(function(q){
      ix.push({kind:"Likely exam question", title:q.q, body:q.q+" "+q.marks+" marks",
        crumb:moduleShort(t.m)+" › "+t.title, go:{v:"topic", id:t.id}});
    });
  });
  FORMULAS.forEach(function(g){
    g.i.forEach(function(x){
      ix.push({kind:"Formula", title:x.f, body:x.f+" "+x.m+" "+x.w, crumb:g.g, go:{v:"formulae"}});
    });
  });
  Object.keys(QUICK).forEach(function(m){
    QUICK[m].forEach(function(c){
      ix.push({kind:"Quick review", title:c.t, body:stripTags(c.t+" "+c.b),
        crumb:moduleShort(m)+" › Quick Review", go:{v:"module", id:m, sub:"quick"}});
    });
  });
  QUIZ.forEach(function(q, i){
    ix.push({kind:"Quiz question", title:q.q, body:q.q+" "+q.o.join(" ")+" "+q.e,
      crumb:"Quiz set "+((i % quizSetCount())+1), go:{v:"quiz", set: i % quizSetCount()}});
  });
  SEARCH_INDEX = ix;
  return ix;
}
function highlight(text, terms){
  var out = esc(text);
  terms.forEach(function(t){
    if(t.length<2) return;
    var re = new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
    out = out.replace(re, "<mark>$1</mark>");
  });
  return out;
}
function runSearch(q){
  var terms = q.toLowerCase().split(/\s+/).filter(function(x){return x.length>1;});
  if(!terms.length) return [];
  var ix = buildIndex(), res = [];
  ix.forEach(function(it){
    var hay = (it.title+" "+it.body).toLowerCase();
    var score = 0, all = true;
    terms.forEach(function(t){
      var inT = it.title.toLowerCase().indexOf(t)>=0;
      var inB = hay.indexOf(t)>=0;
      if(!inB) all = false;
      if(inT) score += 3; else if(inB) score += 1;
    });
    if(all) res.push({it:it, score:score});
  });
  res.sort(function(a,b){ return b.score-a.score; });
  return res.slice(0,40).map(function(r){ return r.it; });
}
function snippetFor(body, terms){
  var low = body.toLowerCase(), pos = -1;
  for(var i=0;i<terms.length;i++){ var p = low.indexOf(terms[i]); if(p>=0){ pos=p; break; } }
  if(pos<0) pos = 0;
  var start = Math.max(0, pos-60);
  return (start>0?"…":"") + body.slice(start, start+160) + (body.length>start+160?"…":"");
}
function renderSearch(q){
  var box = document.getElementById("searchResults");
  if(!box) return;
  var terms = q.toLowerCase().split(/\s+/).filter(function(x){return x.length>1;});
  if(!terms.length){ box.innerHTML = '<p class="small">Type at least two characters.</p>'; return; }
  var res = runSearch(q);
  if(!res.length){ box.innerHTML = '<p class="small">No results for “'+esc(q)+'”.</p>'; return; }
  box.innerHTML = '<p class="small">'+res.length+' result'+(res.length===1?"":"s")+'</p>' +
    res.map(function(it, i){
      return '<button class="res" data-res="'+i+'">'+
        '<span class="crumb">'+esc(it.kind)+' · '+esc(it.crumb)+'</span><br>'+
        '<b>'+highlight(it.title, terms)+'</b><br>'+
        '<span class="small">'+highlight(snippetFor(it.body, terms), terms)+'</span></button>';
    }).join("");
  box._results = res;
}
/* ===================== ROUTER, NAV, EVENTS ===================== */
var VIEW = {v:"dashboard"};
var searchOpen = false;

function applyTheme(){
  var t = lsGet(TKEY) || "system";
  var r = document.documentElement;
  if(t==="light" || t==="dark") r.setAttribute("data-theme", t);
  else r.removeAttribute("data-theme");
}

function navTabs(){
  var tabs = [{v:"dashboard",l:"Dashboard"}, {v:"plan",l:"Plan"}];
  MODULES.forEach(function(m){ tabs.push({v:"module", id:m.id, l:"Module "+m.n}); });
  tabs.push({v:"recognition",l:"Recognition"});
  tabs.push({v:"quiz",l:"Quiz"});
  tabs.push({v:"formulae",l:"Formulae"});
  tabs.push({v:"exam",l:"Exam Mode"});
  return tabs;
}
function activeTabKey(){
  if(VIEW.v==="topic"){ var t=topicById(VIEW.id); return t? "module|"+t.m : "dashboard"; }
  if(VIEW.v==="module") return "module|"+VIEW.id;
  if(VIEW.v==="settings" || VIEW.v==="search") return "";
  return VIEW.v;
}
function renderNav(){
  var ak = activeTabKey();
  var h = '<div class="navin"><button class="brand" data-go="dashboard">DL MSE Study Guide</button>'+
    '<div class="navtabs" role="tablist">'+
    navTabs().map(function(t){
      var key = t.v==="module" ? "module|"+t.id : t.v;
      return '<button class="tab" role="tab" aria-selected="'+(key===ak)+'" data-go="'+t.v+'"'+
        (t.id? ' data-id="'+esc(t.id)+'"':'')+'>'+esc(t.l)+'</button>';
    }).join("")+'</div>'+
    '<div class="navicons">'+
      '<button class="iconbtn" data-search="1" aria-label="Search">Search</button>'+
      '<button class="iconbtn" data-cycletheme="1" aria-label="Theme">Theme</button>'+
      '<button class="iconbtn" data-go="settings" aria-label="Settings">Settings</button>'+
    '</div></div>';
  document.getElementById("nav").innerHTML = h;
}
function renderSearchPanel(){
  var el = document.getElementById("searchPanel");
  el.className = searchOpen ? "" : "hide";
  if(searchOpen && !el.innerHTML){
    el.innerHTML = '<div class="wrap" style="padding-top:14px;padding-bottom:14px">'+
      '<input class="srch" id="searchInput" type="search" placeholder="Search topics, examples, formulas, quiz questions…" aria-label="Search">'+
      '<div id="searchResults"></div></div>';
  }
  if(searchOpen){
    var inp = document.getElementById("searchInput");
    if(inp) setTimeout(function(){ inp.focus(); }, 0);
  }
}

function render(keepScroll){
  var y = window.scrollY;
  renderNav();
  var body = "";
  switch(VIEW.v){
    case "dashboard": body = viewDashboard(); break;
    case "plan": body = viewPlan(); break;
    case "module": body = viewModule(VIEW.id); break;
    case "topic": body = viewTopic(VIEW.id); break;
    case "recognition": body = viewRecognition(); break;
    case "quiz": body = viewQuiz(); break;
    case "formulae": body = viewFormulae(); break;
    case "exam": body = viewExam(); break;
    case "settings": body = viewSettings(); break;
    default: body = viewDashboard();
  }
  document.getElementById("app").innerHTML = body;
  renderSearchPanel();
  if(keepScroll) window.scrollTo(0, y);
  else if(VIEW.anchor){
    var el = document.getElementById(VIEW.anchor);
    if(el && el.scrollIntoView) el.scrollIntoView();
    VIEW.anchor = null;
  } else window.scrollTo(0,0);
}
function go(v, id, extra){
  VIEW = {v:v, id:id};
  if(extra && extra.anchor) VIEW.anchor = extra.anchor;
  if(extra && extra.sub && id) subtabState[id] = extra.sub;
  if(v==="quiz"){ if(extra && typeof extra.set==="number"){ quizOpen = extra.set; quizDraft = {}; } else quizOpen = null; }
  searchOpen = false;
  render(false);
}

/* ---------- delegated events ---------- */
document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-go],[data-sub],[data-rev],[data-hint],[data-mark],[data-quiz],[data-qsubmit],[data-qretake],[data-qreset],[data-theme],[data-cycletheme],[data-export],[data-import],[data-resetall],[data-search],[data-res]") : null;
  if(!el) return;
  var d = el.dataset;

  if(d.go){ go(d.go, d.id); return; }
  if(d.sub){ var parts=d.sub.split("|"); subtabState[parts[0]]=parts[1]; render(true); return; }
  if(d.rev){
    var r = document.getElementById("rev_"+d.rev);
    if(r){ r.classList.toggle("hide"); el.textContent = r.classList.contains("hide") ? "Show solution" : "Hide solution"; }
    return;
  }
  if(d.hint){
    var hh = document.getElementById("hint_"+d.hint);
    if(hh){ hh.classList.toggle("hide"); el.textContent = hh.classList.contains("hide") ? "Hint" : "Hide hint"; }
    return;
  }
  if(d.mark){
    var p2 = d.mark.split("|"), kind=p2[0], qid=p2[1];
    var now = !isMarked(kind, qid);
    markQ(kind, qid, now);
    render(true);
    toast(now ? "Marked done" : "Unmarked");
    return;
  }
  if(d.search){ searchOpen = !searchOpen; renderSearchPanel(); return; }
  if(d.res){
    var box = document.getElementById("searchResults");
    var it = box && box._results ? box._results[parseInt(d.res,10)] : null;
    if(it){ go(it.go.v, it.go.id, {anchor:it.go.anchor, sub:it.go.sub, set:it.go.set}); }
    return;
  }
  if(d.quiz!==undefined){
    if(d.quiz==="close"){ quizOpen=null; quizDraft={}; render(false); }
    else { quizOpen = parseInt(d.quiz,10); quizDraft = {}; VIEW={v:"quiz"}; render(false); }
    return;
  }
  if(d.qsubmit!==undefined){
    var si = parseInt(d.qsubmit,10);
    var c = submitQuizSet(si, quizDraft);
    quizDraft = {};
    render(false);
    toast("Scored "+c+" / "+QUIZ_SET_SIZE);
    return;
  }
  if(d.qretake!==undefined){
    var ri = parseInt(d.qretake,10);
    delete P.quizSet[ri]; saveProgress(); quizDraft = {};
    render(false); toast("Set reset — answer it again");
    return;
  }
  if(d.qreset){
    if(window.confirm("Clear every quiz score, per-set state and per-topic accuracy? Your marked examples and practice questions are not affected.")){
      resetQuiz(); quizOpen=null; render(false); toast("Quiz data cleared");
    }
    return;
  }
  if(d.theme){ lsSet(TKEY, d.theme); applyTheme(); render(true); return; }
  if(d.cycletheme){
    var cur = lsGet(TKEY) || "system";
    var next = cur==="system" ? "light" : (cur==="light" ? "dark" : "system");
    lsSet(TKEY, next); applyTheme(); render(true);
    toast("Theme: "+(next==="system"?"match system":next));
    return;
  }
  if(d.export){
    var out = JSON.parse(JSON.stringify(P));
    out._app = "hmcal703_dl_study";
    out._course = COURSE.code+" "+COURSE.name+" "+COURSE.exam;
    out._exportedAt = new Date().toISOString();
    var blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "dl-mse-progress.json";
    document.body.appendChild(a); a.click(); a.remove();
    toast("Exported");
    return;
  }
  if(d.import){
    var f = document.getElementById("importFile");
    if(f) f.click();
    return;
  }
  if(d.resetall){
    if(window.confirm("This clears every marked example and practice question, every quiz score, your streak and all per-topic accuracy — in this browser only. It cannot be undone. Continue?")){
      resetAll(); go("dashboard"); toast("You are back at 0%");
    }
    return;
  }
});

document.addEventListener("change", function(ev){
  var el = ev.target;
  if(el && el.dataset && el.dataset.qa!==undefined){
    quizDraft[parseInt(el.dataset.qa,10)] = parseInt(el.value,10);
    var lbl = el.closest ? el.closest("label") : null;
    if(lbl && lbl.parentNode){
      var sibs = lbl.parentNode.querySelectorAll('label.opt');
      for(var i=0;i<sibs.length;i++) sibs[i].classList.remove("sel");
      lbl.classList.add("sel");
    }
    return;
  }
  if(el && el.id==="importFile" && el.files && el.files[0]){
    var reader = new FileReader();
    reader.onload = function(e){
      var res;
      try { res = validateProgress(JSON.parse(e.target.result)); }
      catch(err){ res = {ok:false}; }
      if(res.ok){ P = res.data; saveProgress(); render(false); toast("Progress imported"); }
      else toast("Not a valid progress file — nothing changed");
    };
    reader.readAsText(el.files[0]);
    el.value = "";
  }
});

document.addEventListener("input", function(ev){
  if(ev.target && ev.target.id==="searchInput") renderSearch(ev.target.value);
});

document.addEventListener("keydown", function(ev){
  if(ev.key==="/" && document.activeElement && document.activeElement.id!=="searchInput"
     && ["INPUT","TEXTAREA","SELECT"].indexOf(document.activeElement.tagName)<0){
    ev.preventDefault(); searchOpen = true; renderSearchPanel();
  } else if(ev.key==="Escape" && searchOpen){ searchOpen=false; renderSearchPanel(); }
});

/* ---------- boot ---------- */
applyTheme();
loadProgress();
touchVisit();
render(false);
if(!STORAGE_OK) toast("Local storage is blocked — progress will not be saved this session");
</script>
