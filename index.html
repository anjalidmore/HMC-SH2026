{id:"m3t10",m:"m3",title:"Pooling Layer",type:"problem-solving",priority:"high",los:["3.3"],
 src:"Module 3 deck, slides 43–48",
 summary:"Max and average pooling — the numeric example the deck works, and why pooling gives spatial invariance.",
 whatIs:"<p>Pooling is a <b>down-sampling</b> operation that reduces the dimensionality of the feature map. The deck's framing is a question: do I really need every single value? I only need to know whether the important feature is present.</p>",
 concept:"<h4>The two types</h4>"+
  "<p><b>Max pooling</b> takes the largest value in each window — the strongest evidence that the feature is present. <b>Average pooling</b> takes the mean — a smoothed summary. Max pooling is far more common in practice.</p>"+
  "<h4>The deck's worked example, fully verified</h4>"+
  "<p>Input map, pooled with a 2×2 window at stride 2:</p>"+
  "<div class='eqb'>Input:            Max pool:        Average pool:\n32  10  11  17     32  19          15  14\n 4  14   9  19     20  27          11  16\n20   4  16  27\n 8  12   7  14</div>"+
  "<div class='scroll'><table><tr><th>Window</th><th>Values</th><th>Max</th><th>Average</th></tr>"+
  "<tr><td>Top-left</td><td>32, 10, 4, 14</td><td><b>32</b></td><td>60/4 = <b>15</b></td></tr>"+
  "<tr><td>Top-right</td><td>11, 17, 9, 19</td><td><b>19</b></td><td>56/4 = <b>14</b></td></tr>"+
  "<tr><td>Bottom-left</td><td>20, 4, 8, 12</td><td><b>20</b></td><td>44/4 = <b>11</b></td></tr>"+
  "<tr><td>Bottom-right</td><td>16, 27, 7, 14</td><td><b>27</b></td><td>64/4 = <b>16</b></td></tr></table></div>"+
  "<p>All eight values independently recomputed and matching the deck exactly.</p>"+
  "<h4>What pooling achieves</h4>"+
  "<p>The deck states it progressively reduces the spatial size of the representation to reduce the amount of parameters and computation in the network, and also controls overfitting. And: if no pooling, then the output consists of the same resolution as the input.</p><ul>"+
  "<li><b>Fewer parameters and less computation</b> in every subsequent layer.</li>"+
  "<li><b>Controls overfitting</b> — reducing the representation size reduces capacity, which is regularization.</li>"+
  "<li><b>Spatial invariance</b> — the deck's slide on engineering spatial robustness shows a handwritten 7 shifted left, right, up and down all producing the same conclusion. Pooling makes the CNN mathematically less sensitive to small spatial shifts; the digit's meaning remains intact.</li>"+
  "<li><b>No parameters</b> — max and average are fixed operations, so pooling adds nothing to be learned.</li></ul>"+
  "<div class='box tip'><h5>Why max rather than average</h5><p>Max pooling asks 'was this feature detected anywhere in the window?' — a detection question, which is what feature maps encode. Average pooling dilutes a single strong detection among three weak ones: a genuine edge scoring 32 against neighbours of 4, 10 and 14 survives max pooling intact at 32 but is reduced to 15 by averaging.</p></div>"+
  "<p>Pooling uses the same output-size formula as convolution, with F the window size, typically P = 0 and S = F for non-overlapping windows. It never changes the depth — each channel is pooled independently.</p>",
 needToKnow:["Compute both max and average pooling for a given map","State the output size formula and that depth is unchanged","Give the four things pooling achieves","Explain spatial invariance with the shifted-digit example","State that pooling has no learnable parameters","Justify max over average"],
 recognition:{clues:["A feature map and a window size are given","'Max pooling', 'average pooling', 'down-sampling'","'Pooled feature map'","2×2 with stride 2"],
  wording:["Apply max pooling and average pooling to the given feature map.","What is pooling? Explain its purpose.","How does pooling provide spatial invariance?"],
  firstMove:"Mark the window boundaries on the input grid before computing anything. Most pooling errors are windowing errors, not arithmetic ones.",
  trap:"Overlapping the windows when stride equals window size. With a 2×2 window at stride 2 the windows tile without overlap."},
 examAnswer:[
  {marks:5,body:"<p>Both pooling types defined, the worked example with all windows shown in a table, the output size, and one line that depth is unchanged and no parameters are added.</p>"},
  {marks:10,body:"<p>All of the above plus: the four purposes; spatial invariance explained with the shifted-digit illustration; the justification for max over average; and the output-size calculation from the formula.</p>"}],
 mistakes:["Overlapping windows when they should tile","Changing the depth — each channel is pooled independently, so depth is preserved","Saying pooling has learnable filters","Averaging over the wrong window","Forgetting that pooling is applied to the rectified map, after ReLU"],
 examples:[
  {id:"m3t10e1",title:"The deck's pooling example, both types",q:"Apply 2×2 max pooling and 2×2 average pooling at stride 2 to [[32,10,11,17],[4,14,9,19],[20,4,16,27],[8,12,7,14]].",
   steps:["Window size 2 at stride 2 tiles the 4×4 input into four non-overlapping 2×2 blocks.","<b>Top-left block</b> {32,10,4,14}: max = 32; average = (32+10+4+14)/4 = 60/4 = 15","<b>Top-right block</b> {11,17,9,19}: max = 19; average = (11+17+9+19)/4 = 56/4 = 14","<b>Bottom-left block</b> {20,4,8,12}: max = 20; average = (20+4+8+12)/4 = 44/4 = 11","<b>Bottom-right block</b> {16,27,7,14}: max = 27; average = (16+27+7+14)/4 = 64/4 = 16","Output size: ⌊(4 − 2)/2⌋ + 1 = 1 + 1 = 2, so 2 × 2 for both."],
   answer:"Max pooling <b>[[32,19],[20,27]]</b>; average pooling <b>[[15,14],[11,16]]</b>. Both verified against the deck.",
   trap:"Compare the top-left block: max gives 32 while average gives 15. The value 32 was a strong detection surrounded by weak responses of 10, 4 and 14 — averaging dilutes it to less than half. This is precisely why max pooling is preferred for detection: it preserves the evidence that the feature was found."},
  {id:"m3t10e2",title:"Pooling and spatial invariance",q:"A feature is detected with strength 9 at one position in a 4×4 map. Show that shifting it by one pixel within the same 2×2 pooling window leaves the max-pooled output unchanged, and say when this breaks.",
   steps:["<b>Case A:</b> the 9 sits at position (0,0). Top-left window = {9, 0, 0, 0}, max = 9.","<b>Case B:</b> the 9 has shifted to position (1,1). Top-left window = {0, 0, 0, 9}, max = 9.","Identical output. The downstream layers cannot tell the two apart.","<b>Case C:</b> the 9 shifts to position (0,2), crossing into the top-right window. Top-left window = {0,0,0,0}, max = 0; top-right window now contains the 9.","The output has changed — the invariance holds only within a window."],
   answer:"A shift <b>within</b> a pooling window leaves the output unchanged, giving local translation invariance. A shift <b>across</b> a window boundary does change it.",
   trap:"The invariance is local, not global — one 2×2 pooling layer tolerates shifts of about one pixel. Robustness to larger shifts is built up by <i>stacking</i> pooling layers: after three 2×2 poolings, one output position corresponds to an 8×8 region of the original image, so shifts of several pixels become invisible. This is how the deck's four differently-positioned 7s all reach the same conclusion."}],
 practice:[
  {id:"m3t10p1",d:"easy",q:"Apply 2×2 max pooling at stride 2 to [[1,3,2,4],[5,6,7,8],[9,2,1,0],[4,3,6,5]].",hint:"Four non-overlapping blocks.",a:"<p><b>Top-left</b> {1,3,5,6} → max = <b>6</b></p><p><b>Top-right</b> {2,4,7,8} → max = <b>8</b></p><p><b>Bottom-left</b> {9,2,4,3} → max = <b>9</b></p><p><b>Bottom-right</b> {1,0,6,5} → max = <b>6</b></p><p>Output = <b>[[6, 8], [9, 6]]</b>, size 2 × 2. Check with the formula: ⌊(4−2)/2⌋ + 1 = 2 ✓</p>"},
  {id:"m3t10p2",d:"moderate",q:"State four things pooling achieves and one thing it costs.",hint:"Size, capacity, robustness, parameters — and what is discarded.",a:"<p><b>1 — Reduces spatial size,</b> and therefore the parameters and computation required in every subsequent layer. A 2×2 pooling at stride 2 quarters the number of values.</p><p><b>2 — Controls overfitting.</b> A smaller representation means less capacity, so pooling acts as a form of regularization.</p><p><b>3 — Provides spatial invariance.</b> Small shifts of a feature within a pooling window leave the output unchanged, making the network robust to variation in position — the deck's illustration of a handwritten 7 shifted in four directions all yielding the same conclusion.</p><p><b>4 — Adds no parameters.</b> Max and average are fixed operations with nothing to learn, so the benefits come for free.</p><p><b>The cost:</b> precise spatial information is discarded. Once pooled, the network knows a feature was present somewhere in the window but not exactly where. That is acceptable for classification, where position is irrelevant, but harmful for tasks such as segmentation or precise localisation, where architectures either avoid pooling or reconstruct the lost resolution later.</p>"},
  {id:"m3t10p3",d:"moderate",q:"Why is max pooling generally preferred over average pooling?",hint:"Consider what a feature map value means.",a:"<p>Because of what the values in a feature map <b>mean</b>. After convolution and ReLU, a large value says 'this feature was strongly detected here' and a value near zero says 'it was not'. The useful question about a window is therefore a <b>detection</b> question: was this feature present anywhere in it?</p><p><b>Max pooling answers exactly that question.</b> It returns the strongest evidence found, preserving it undiluted.</p><p><b>Average pooling dilutes detections.</b> In the deck's own example, the top-left window {32, 10, 4, 14} contains one strong detection of 32 among weak responses. Max pooling reports 32; averaging reports 15, less than half. A window containing one clear edge is reported as roughly equivalent to a window of uniform mediocre response — the distinction that mattered has been averaged away.</p><p><b>There is also a gradient argument.</b> Max pooling routes the gradient entirely to the unit that produced the maximum, so the detector responsible for the evidence receives the learning signal. Average pooling spreads the gradient equally over all four units, including three that contributed nothing.</p><p><b>Where average pooling is still used:</b> global average pooling at the very end of a network, replacing the flatten-and-dense stage. There the goal is summarising a whole channel's overall activity rather than locating a feature, and averaging is the appropriate summary.</p>"}],
 questions:[
  {q:"Apply max pooling and average pooling to the given feature map and state the output size.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"What is pooling? Explain its purpose and how it provides spatial invariance.",marks:10,d:"moderate",priority:"high",source:"source"}]},

{id:"m3t11",m:"m3",title:"Flattening and the Fully Connected Layer",type:"theory",priority:"medium",los:["3.3"],
 src:"Module 3 deck, slides 49–54",
 summary:"Converting 2-D maps into a vector, and the classifier that consumes it.",
 whatIs:"<p>The deck defines flattening as converting all the resultant 2-dimensional arrays from pooled feature maps into a single long continuous linear vector, which then feeds the fully connected layer that classifies the image.</p>",
 concept:"<h4>Flattening</h4>"+
  "<p>A pooled feature map of shape H × W × C is read out into a vector of length H × W × C. No values are changed and nothing is learned; only the arrangement changes. It exists because convolution layers produce tensors while dense layers require vectors.</p>"+
  "<div class='eqb'>8 × 8 × 64  →  flatten  →  vector of length 4,096</div>"+
  "<h4>The fully connected layer</h4>"+
  "<p>The deck's description: the flattened matrix is fed as input to the fully connected layer to classify the image. It looks like a regular neural network connecting all neurons and forms the last few layers in the network. All the inputs from this layer are connected to every activation unit of the next layer, and the feature vector is used to classify images between different categories after training.</p>"+
  "<h4>Why the network needs this stage at all</h4>"+
  "<p>Convolution and pooling are <b>local</b> operations — each output depends only on a small region of its input. Classification requires a <b>global</b> decision: 'beak present in the upper region' plus 'feather texture across the middle' plus 'claw shape below' together mean bird. The fully connected layer is where evidence from every location and every feature type is finally combined.</p>"+
  "<div class='box warning'><h5>Where the parameters concentrate</h5><p>The first fully connected layer is usually the most expensive in the whole network. A 4,096-length vector into 128 units needs 4,096 × 128 = 524,288 weights — often more than every convolution layer combined. This is why later architectures replaced flatten-then-dense with <b>global average pooling</b>, which collapses each channel to a single number, turning 8 × 8 × 64 into a vector of just 64.</p></div>"+
  "<p>A second consequence: because the flattened length is fixed by the architecture, the network requires a fixed input image size. AlexNet insists on 227×227 for exactly this reason.</p>",
 needToKnow:["Define flattening and compute the resulting vector length","State that flattening has no parameters and changes no values","Explain what the fully connected layer contributes that convolution cannot","Compute the parameter cost of the first dense layer","Explain why the input size is fixed, and how global average pooling removes that constraint"],
 recognition:{clues:["'Flatten', 'flattening operation'","'Fully connected layer', 'dense layer'","A feature map shape and a required vector length","The last stage of an architecture question"],
  wording:["What is flattening? Explain with an example.","Explain the role of the fully connected layer in a CNN.","How many parameters does the first fully connected layer have?"],
  firstMove:"Multiply H × W × C to get the vector length. That one number is the answer to most questions on this topic and the input to the parameter count.",
  trap:"Forgetting the channel dimension: an 8×8×64 map flattens to 4,096, not 64."},
 examAnswer:[
  {marks:5,body:"<p>Flattening defined with a worked length, the fully connected layer's role in combining global evidence, and one line that flattening has no parameters.</p>"},
  {marks:10,body:"<p>All of the above plus: the local-versus-global argument; the parameter cost of the first dense layer computed; the fixed-input-size consequence; and global average pooling as the modern alternative.</p>"}],
 mistakes:["Omitting the channel dimension in the vector length","Saying flattening reduces dimensionality — it rearranges, and the count is identical","Placing flatten before pooling","Saying flattening has learnable parameters","Forgetting that the FC layers usually dominate the parameter count"],
 examples:[{id:"m3t11e1",title:"Flatten, count and compare",q:"A pooled map is 7×7×512. Give the flattened length, the parameters needed for a following dense layer of 4,096 units, and the same figures if global average pooling were used instead.",
  steps:["<b>Flatten:</b> 7 × 7 × 512 = 25,088 values.","<b>Dense layer:</b> 25,088 × 4,096 = 102,760,448 weights, plus 4,096 biases = 102,764,544 parameters.","<b>Global average pooling:</b> each of the 512 channels is averaged over its 7×7 map to a single number, giving a vector of length 512.","<b>Dense layer after GAP:</b> 512 × 4,096 = 2,097,152 weights, plus 4,096 biases = 2,101,248 parameters.","Ratio: 102,764,544 / 2,101,248 ≈ 49."],
  answer:"Flatten gives <b>25,088</b> values and a dense layer of <b>≈ 102.8 million</b> parameters. Global average pooling gives <b>512</b> values and <b>≈ 2.1 million</b> — about 49 times fewer.",
  trap:"These are close to VGG-16's real figures, where the fully connected layers hold roughly 90% of the network's 138 million parameters despite doing far less of the work. Global average pooling also removes the fixed-input-size requirement, since averaging a map of any spatial size still yields one number per channel."}],
 practice:[
  {id:"m3t11p1",d:"easy",q:"What is flattening? Give the vector length for a 6×6×256 pooled feature map.",hint:"Multiply all three dimensions.",a:"<p><b>Flattening</b> converts the 2-dimensional arrays of the pooled feature maps into a single long continuous linear vector. It changes only the arrangement of the values — none are altered, none are lost, and there is nothing to learn.</p><p><b>Length</b> = 6 × 6 × 256 = <b>9,216</b>.</p><p>This is exactly the figure that appears in AlexNet, where the final 6×6×256 feature map flattens to 9,216 before the first fully connected layer.</p>"},
  {id:"m3t11p2",d:"moderate",q:"Why does a CNN need fully connected layers at the end when convolution has already extracted the features?",hint:"Compare what each layer type can see.",a:"<p>Because convolution and pooling are <b>local</b> operations while classification requires a <b>global</b> decision.</p><p>Every output of a convolution layer depends on only a small region of its input, and even after many layers a unit's receptive field covers a limited part of the image. Convolution can therefore report 'there is a beak-like shape here' and 'there is feather texture there', but it has no mechanism for combining evidence from distant locations and different feature types into a single conclusion.</p><p><b>The fully connected layer connects every element of the flattened vector to every unit of the next layer</b>, so it can weigh evidence from all positions and all channels simultaneously. It is where 'beak in the upper region' plus 'feathers across the middle' plus 'claws below' become the single conclusion <i>bird</i>.</p><p>The deck's own diagram makes this split explicit: feature extraction happens in the multiple hidden convolutional layers, and classification happens in the output layer.</p>"},
  {id:"m3t11p3",d:"moderate",q:"Why do fully connected layers dominate a CNN's parameter count, and what is the modern alternative?",hint:"Compare weight reuse in each layer type.",a:"<p><b>Why they dominate.</b> A convolution layer's weights are <b>shared</b> — the same small filter is reused at every spatial position, so 64 filters of 3×3×3 cost only 1,792 parameters regardless of image size. A fully connected layer shares nothing: every input has its own weight to every output. Connecting a 25,088-length flattened vector to 4,096 units needs over 102 million weights.</p><p>The result is lopsided. In VGG-16 the fully connected layers hold about 90% of the 138 million parameters while performing a small fraction of the computation and the feature learning.</p><p><b>The modern alternative is global average pooling.</b> Instead of flattening the H × W × C map, each channel is averaged over its whole spatial extent to a single number, producing a vector of length C. A 7×7×512 map becomes 512 values rather than 25,088 — a 49-fold reduction in the following layer's cost.</p><p>It brings two further benefits. It <b>removes the fixed-input-size constraint</b>, since averaging works on any spatial size, whereas flattening requires a known length. And it acts as a <b>regulariser</b>, because there are no parameters in the pooling itself and far fewer in what follows. Architectures from GoogLeNet and ResNet onwards use it in place of flatten-then-dense.</p>"}],
 questions:[
  {q:"What is flattening? Explain its role between the pooling layer and the fully connected layer.",marks:5,d:"easy",priority:"high",source:"source"},
  {q:"Explain the role of the fully connected layer in a CNN and why it holds most of the parameters.",marks:10,d:"moderate",priority:"high",source:"source"}]},

{id:"m3t12",m:"m3",title:"Weight Sharing in CNN",type:"theory",priority:"high",los:["3.3"],
 src:"Module 3 deck, slides 55–58",
 summary:"Applying the same weights everywhere — the deck calls it the key to the success of CNNs.",
 whatIs:"<p>The deck's definition: weight sharing has been a key to the success of convolutional neural networks, as it forces a neural network to detect common 'local' features across an image by applying the same weights across all input samples (pixels).</p>",
 concept:"<h4>What it means concretely</h4>"+
  "<p>A single filter's weights are used at <b>every</b> position of the input. The filter that examines the top-left corner is the identical filter, with identical values, that examines the bottom-right. There is one set of parameters per filter, not one per position.</p>"+
  "<h4>The deck's three advantages</h4><ol>"+
  "<li><b>Reduces the number of weights that must be learned.</b> A 3×3 filter has 9 weights whether the image is 10×10 or 10,000×10,000.</li>"+
  "<li><b>Makes feature search insensitive to feature location in the image.</b> Because the same detector runs everywhere, a feature is found wherever it appears.</li>"+
  "<li><b>Increases model flexibility.</b> The network can accept inputs of varying size, since the filter does not depend on image dimensions.</li></ol>"+
  "<div class='box tip'><h5>The deck's one-line summary</h5><p>We don't build 1,000 tools. We use one tool 1,000 times. A vertical stroke is a vertical stroke, regardless of location.</p></div>"+
  "<h4>Why it is also regularization</h4>"+
  "<p>Weight sharing is the <b>parameter sharing</b> listed among Module 2's regularization methods. Forcing many connections to use one weight collapses the number of independent parameters, which directly reduces capacity and therefore variance. It is a strong and correct <i>prior</i>: the assumption that a useful pattern is worth detecting wherever it occurs. Where that assumption holds — as it does for images — the constraint costs almost nothing in representational power and buys an enormous reduction in overfitting.</p>"+
  "<h4>How gradients work under sharing</h4>"+
  "<p>Since the same weight is used at every position, its gradient is the <b>sum</b> of the gradients from all positions where it was applied. One weight, many contributions, one update. This is why a shared weight learns from the entire image at once rather than from a single location.</p>",
 needToKnow:["State the deck's definition","Give the three advantages verbatim in substance","Quantify the parameter saving with a calculation","Explain why it is also regularization","Explain that gradients from all positions are summed"],
 recognition:{clues:["'Weight sharing', 'shared weights', 'same filter everywhere'","'Why do CNNs have fewer parameters?'","'Translation invariance' or 'insensitive to location'"],
  wording:["Explain weight sharing in CNN and state its advantages.","How does weight sharing reduce the number of parameters?","Why is weight sharing described as the key to the success of CNNs?"],
  firstMove:"Compute the parameter count with and without sharing. The size of the ratio makes the argument better than any description.",
  trap:"Saying weight sharing means all filters in a layer share weights. Each filter has its own weights; sharing is across <i>positions</i>, not across filters."},
 examAnswer:[
  {marks:5,body:"<p>The definition, the three advantages, and one parameter-count calculation showing the scale of the saving.</p>"},
  {marks:10,body:"<p>All of the above plus: the connection to Module 2's parameter sharing as regularization; the prior it encodes and when that prior is valid; and the summed-gradient mechanism.</p>"}],
 mistakes:["Thinking different filters share weights with each other","Saying it reduces computation — it reduces <i>parameters</i>; the number of multiplications is unchanged","Omitting the location-insensitivity advantage","Not connecting it to regularization","Claiming it works for any data type, when it requires the shift-invariance assumption to hold"],
 examples:[{id:"m3t12e1",title:"Quantifying the saving, and when the prior fails",q:"A 200×200 grayscale image is processed by one 3×3 feature detector. Compare shared and unshared parameter counts, then give a data type where sharing would be inappropriate.",
  steps:["<b>Unshared</b> (a separate 3×3 filter learned at every position): output positions = 198 × 198 = 39,204. Each has its own 9 weights and 1 bias = 10. Total = 392,040 parameters.","<b>Shared</b>: one filter of 9 weights + 1 bias = 10 parameters, reused at all 39,204 positions.","Ratio = 392,040 / 10 = 39,204 — exactly the number of positions, as expected.","<b>Where the prior fails:</b> tabular data. In a table whose columns are age, income, postcode and blood pressure, position carries meaning — column 1 is not interchangeable with column 3. Applying the same detector across columns would assert that a pattern in age means the same thing in income, which is false."],
  answer:"<b>392,040</b> parameters unshared against <b>10</b> shared — a saving of 39,204 times, equal to the number of positions. Sharing is inappropriate for tabular data, where each feature has a distinct meaning.",
  trap:"The saving factor is always exactly the number of positions, which makes the arithmetic easy to check. The more important point is the second half: weight sharing works for images because a pattern genuinely means the same thing wherever it appears. That assumption is a <i>prior</i>, and it is correct for images, audio and time series — but wrong for tabular data, which is why fully connected networks remain the right choice there."}],
 practice:[
  {id:"m3t12p1",d:"easy",q:"Define weight sharing and give its three advantages.",hint:"Same weights, every position.",a:"<p><b>Definition:</b> weight sharing forces the network to detect common local features across an image by applying the same weights across all input positions. One filter's weights are used at every location rather than each location having its own.</p><p><b>Advantages.</b> (1) It <b>reduces the number of weights that must be learned</b> — a 3×3 filter has 9 weights regardless of image size. (2) It <b>makes feature search insensitive to feature location</b>, since the same detector runs everywhere. (3) It <b>increases model flexibility</b>, because the network can handle inputs of varying size.</p>"},
  {id:"m3t12p2",d:"moderate",q:"How does weight sharing act as regularization, and what assumption does it rely on?",hint:"Count free parameters, then ask when reuse is justified.",a:"<p><b>How it regularizes.</b> Capacity is governed by the number of <i>independent</i> parameters. Weight sharing collapses what would be one parameter set per position into a single shared set, cutting the count by a factor equal to the number of positions. Fewer free parameters means fewer ways to fit noise, which is a direct reduction in variance. This is exactly the parameter sharing listed among Module 2's regularization methods.</p><p><b>The assumption it relies on:</b> that a pattern worth detecting in one location is worth detecting in every location — <b>translation invariance of meaning</b>. An edge is an edge wherever it appears; a cat in the corner is still a cat.</p><p><b>Why this matters.</b> Regularization normally trades away some representational power to reduce variance. Weight sharing is unusually cheap because its assumption is <i>true</i> for image data, so almost nothing useful is given up. When the assumption fails — as it does for tabular data, where each column has a distinct meaning — the same constraint would be actively harmful, forcing the model to treat unrelated features identically. The lesson is that a good prior is far more valuable than a generic penalty, but only where it actually holds.</p>"},
  {id:"m3t12p3",d:"moderate",q:"If one weight is used at thousands of positions, how is its gradient computed?",hint:"The chain rule handles a variable used many times in a specific way.",a:"<p>The gradients from all positions are <b>summed</b>.</p><p>When a variable appears in several places in a computation, the chain rule says the total derivative is the sum of the partial derivatives through each path. A shared weight w appears once per output position, so:</p><div class='eqb'>∂E/∂w = Σ_over all positions (∂E/∂output_at_that_position) × (input_at_that_position)</div><p><b>What this means in practice.</b> A single filter weight receives a learning signal from every location in the image simultaneously. If a vertical-edge detector is useful at one location and harmful at another, the two contributions partly cancel and the weight settles where it is best <i>on average across the whole image</i>.</p><p>This has an important consequence: shared weights are updated using far more evidence per step than unshared ones. With 39,204 positions, each update aggregates 39,204 gradient contributions rather than one. That is why CNNs train stably from relatively little data — the effective sample size for each parameter is multiplied by the number of positions it is applied at.</p>"}],
 questions:[
  {q:"Explain weight sharing in CNN and state its advantages.",marks:10,d:"easy",priority:"high",source:"source"},
  {q:"How does weight sharing reduce the number of parameters? Illustrate with a calculation.",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m3t13",m:"m3",title:"Fully Connected NN vs CNN",type:"theory",priority:"high",los:["3.3"],
 src:"Module 3 deck, slides 59–60",
 summary:"The comparison the deck states directly — structure agnostic versus explicit assumptions.",
 whatIs:"<p>The deck's formulation: fully connected neural networks are <b>structure agnostic</b> — no special assumptions need to be made about the input. A CNN makes <b>explicit assumptions</b> that the inputs are images, which allows encoding.</p>",
 concept:"<div class='scroll'><table><tr><th>Metric</th><th>Fully Connected NN</th><th>CNN</th></tr>"+
  "<tr><td><b>Input relationship</b></td><td>Treats every input independently</td><td>Preserves spatial locality</td></tr>"+
  "<tr><td><b>Feature detection</b></td><td>Dense connections; every input to every unit</td><td>Local features via filters</td></tr>"+
  "<tr><td><b>Parameters</b></td><td>Massive for images</td><td>Hyper-efficient through shared weights</td></tr>"+
  "<tr><td><b>Spatial information</b></td><td>Destroyed by flattening the input</td><td>Preserved through the convolutional stack</td></tr>"+
  "<tr><td><b>Assumptions</b></td><td>None — structure agnostic</td><td>Explicit: inputs are grid-structured</td></tr>"+
  "<tr><td><b>Suits</b></td><td>Tabular data, e.g. attendance records</td><td>Visual data, e.g. handwriting and photographs</td></tr>"+
  "<tr><td><b>Translation invariance</b></td><td>None — must relearn a pattern at each position</td><td>Built in, via weight sharing and pooling</td></tr></table></div>"+
  "<div class='box tip'><h5>The deck's one-line contrast</h5><p><b>MLP asks: 'What are the values?'</b> — it sees a list of numbers with no relationship between them.<br><b>CNN asks: 'What pattern is present, and where is it?'</b> — it sees a structured grid.</p></div>"+
  "<h4>Why 'structure agnostic' is a weakness here</h4>"+
  "<p>Being assumption-free sounds like an advantage, and for unknown data it is. But for images the structure is <i>known</i>, and a fully connected network cannot use it. Flattening a 28×28 image into a 784-vector destroys the fact that pixel 1 and pixel 2 are adjacent while pixel 1 and pixel 400 are not. The network would have to rediscover adjacency from data, which requires vastly more examples than simply building it into the architecture.</p>"+
  "<p>This is the general principle: an architecture that encodes a <i>true</i> assumption about the data learns from far less of it. When the assumption is false, the same encoding becomes a liability — which is why CNNs are the wrong choice for tabular data.</p>",
 needToKnow:["State the structure-agnostic versus explicit-assumptions contrast","Fill at least five rows of the comparison table","Explain what flattening destroys","Give the MLP-asks / CNN-asks one-liner","Say when a fully connected network is the better choice"],
 recognition:{clues:["'Fully connected NN and CNN', 'MLP vs CNN'","'Compare', 'differentiate' with both named","'Why not use a normal neural network for images?'"],
  wording:["Differentiate between a fully connected neural network and a CNN.","Why is a CNN better suited to image data than a fully connected network?","What is meant by 'structure agnostic'?"],
  firstMove:"Draw the comparison table. Then add one line saying when the FC network is actually preferable — that shows judgement rather than memorisation.",
  trap:"Presenting CNNs as universally superior. For tabular data the CNN's assumption is false and a fully connected network is correct."},
 examAnswer:[
  {marks:5,body:"<p>The table with five or more rows, plus the structure-agnostic versus explicit-assumption framing.</p>"},
  {marks:10,body:"<p>All of the above plus: what flattening destroys, with a parameter-count illustration; the MLP-asks/CNN-asks contrast; and a paragraph on when a fully connected network is the right choice and why.</p>"}],
 mistakes:["Saying CNNs are always better","Claiming a CNN has no fully connected layers — most end with them","Saying an FC network 'cannot' process images; it can, just inefficiently and with far more data","Omitting the parameter argument, which is the most concrete difference","Forgetting that a CNN's assumption is a strength only when true"],
 examples:[{id:"m3t13e1",title:"The same task, both architectures",q:"Classify 28×28 grayscale digits. Design a minimal fully connected network and a minimal CNN, compare their parameter counts, and say what the FC network cannot exploit.",
  steps:["<b>Fully connected:</b> flatten to 784. Hidden layer of 128: 784 × 128 + 128 = 100,480. Output layer of 10: 128 × 10 + 10 = 1,290. Total = 101,770.","<b>CNN:</b> Conv(8 filters, 3×3, same) = (3×3×1 + 1) × 8 = 80. Pool to 14×14×8. Conv(16, 3×3, same) = (3×3×8 + 1) × 16 = 1,168. Pool to 7×7×16 = 784. Dense to 10 = 784 × 10 + 10 = 7,850. Total = 9,098.","Ratio ≈ 11 times fewer parameters for the CNN.","<b>What the FC network cannot exploit:</b> flattening destroys adjacency. Pixels 1 and 2 are neighbours in the image but are just positions 1 and 2 in an unstructured vector — the network has no way of knowing they are related. It also has no translation invariance: a digit shifted two pixels right activates an entirely different set of input weights, so the network must learn each digit separately at each position."],
  answer:"Fully connected <b>101,770</b> parameters; CNN <b>9,098</b> — about 11 times fewer, while additionally exploiting locality and translation invariance that the FC network cannot represent at all.",
  trap:"The parameter count is the visible difference but the smaller one. A fully connected network can be made to work on MNIST — it reaches around 98% — because the digits are centred and size-normalised, which hides its lack of translation invariance. On uncentred or larger images the gap becomes decisive, because the FC network must learn each pattern independently at every position while the CNN learns it once."}],
 practice:[
  {id:"m3t13p1",d:"easy",q:"Give five differences between a fully connected network and a CNN.",hint:"Assumptions, locality, parameters, spatial info, use case.",a:"<div class='scroll'><table><tr><th>Metric</th><th>Fully Connected NN</th><th>CNN</th></tr><tr><td>Assumptions</td><td>Structure agnostic — none</td><td>Explicit: inputs are grid-structured</td></tr><tr><td>Input relationship</td><td>Treats every input independently</td><td>Preserves spatial locality</td></tr><tr><td>Connections</td><td>Dense — every input to every unit</td><td>Local receptive fields with shared filters</td></tr><tr><td>Parameters</td><td>Massive for images</td><td>Hyper-efficient through weight sharing</td></tr><tr><td>Spatial information</td><td>Destroyed by flattening</td><td>Preserved through the convolutional stack</td></tr></table></div>"},
  {id:"m3t13p2",d:"moderate",q:"Explain what 'structure agnostic' means and why it is a weakness for image data.",hint:"Assumption-free sounds good — ask what it costs when the structure is known.",a:"<p><b>Structure agnostic</b> means a fully connected network makes no assumptions about how its inputs relate to one another. It sees a flat list of numbers, and any permutation of that list would be handled identically. For data whose structure is unknown, this is a genuine strength — the network imposes nothing false.</p><p><b>Why it is a weakness for images.</b> For images the structure is <i>known</i> and highly informative: pixels are arranged in a grid, neighbouring pixels are strongly related, and a pattern means the same thing wherever it occurs. A structure-agnostic network cannot use any of this.</p><p>Flattening a 28×28 image into a 784-vector destroys adjacency. Position 1 and position 2 were neighbours in the image; position 1 and position 400 were not; but in the vector they are simply three of 784 unrelated slots. The network would have to <i>rediscover</i> adjacency from data — learning that certain input pairs tend to correlate — which takes enormously more examples than encoding it in the architecture.</p><p>It also has no translation invariance: a digit shifted two pixels right activates a completely different set of weights, so the pattern must be learned again at every position.</p><p><b>The principle:</b> an architecture encoding a true assumption about its data learns from far less of it. When the assumption is false, the same encoding is a liability — which is why CNNs are wrong for tabular data, where each column has a distinct meaning and position carries no locality.</p>"}],
 questions:[
  {q:"Differentiate between a fully connected neural network and a CNN.",marks:10,d:"easy",priority:"high",source:"source"},
  {q:"What is meant by 'structure agnostic'? Why is it a disadvantage for image data?",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m3t14",m:"m3",title:"Variants of the Basic Convolution Function",type:"theory",priority:"low",los:["3.3"],
 src:"Module 3 deck, slides 61–64",
 summary:"Full, unshared and tiled convolution — the three variants the syllabus names.",
 whatIs:"<p>The syllabus lists 'Variants of basic Convolution function' as a Module 3 topic. The deck names three, distinguished by how much weight sharing each applies.</p>",
 concept:"<div class='box warning'><h5>Thin coverage in the material</h5><p>The deck gives this topic four slides — one summary and one diagram each for full, unshared and tiled convolution — with no worked numbers. What follows is exactly what the material contains, developed but not invented. Rank this topic below the numerical ones when time is short.</p></div>"+
  "<h4>1 · Full convolution</h4>"+
  "<p>The deck's summary lists full convolution under <b>padding</b> and <b>stride</b>. Its diagram contrasts a kernel of width six applied without zero padding — where the layers taper to a point — with the same kernel applied <b>with zero padding</b>, labelled 'prevents shrinking'.</p>"+
  "<p>Full convolution pads enough that the filter may overhang the input entirely, so <i>every</i> overlap of at least one element is computed. This makes the output <b>larger</b> than the input:</p>"+
  "<div class='eqb'>Valid: n − f + 1      Same: n      Full: n + f − 1</div>"+
  "<h4>2 · Unshared convolution (locally connected)</h4>"+
  "<p>The deck's summary: <b>no convolution</b>, <b>MLP</b>. Its diagram labels it 'local connection: like convolution, but no sharing' — the connections are drawn with distinct labels a, b, c, d, e, f, g, h, i, whereas the convolution row below reuses a and b throughout.</p>"+
  "<p>So the connectivity pattern is convolutional — each output sees only a local patch — but every position learns its <b>own</b> weights. It sits between convolution and a fully connected layer: local like the former, unshared like the latter. It is useful when a feature genuinely means different things in different places, such as facial images where the eye region and the mouth region are structurally different. The cost is a parameter count multiplied by the number of positions.</p>"+
  "<h4>3 · Tiled convolution</h4>"+
  "<p>The deck's summary: <b>neighbouring location</b>, <b>different filter</b>. Its diagram labels it 'cycle between shared parameter groups', showing weights repeating in the pattern a, b, c, d, a, b rather than a, b, a, b.</p>"+
  "<p>Tiled convolution is the compromise: instead of one filter everywhere (convolution) or a different filter at every position (unshared), it cycles through a small set of t filters. Adjacent positions use different filters, but the set repeats every t positions. Parameters scale with t rather than with the number of positions.</p>"+
  "<div class='scroll'><table><tr><th>Variant</th><th>Sharing</th><th>Parameters</th><th>Output size</th></tr>"+
  "<tr><td><b>Standard convolution</b></td><td>One filter everywhere</td><td>Lowest</td><td>n − f + 1</td></tr>"+
  "<tr><td><b>Full convolution</b></td><td>One filter everywhere</td><td>Lowest</td><td><b>n + f − 1</b> (grows)</td></tr>"+
  "<tr><td><b>Tiled</b></td><td>t filters cycled</td><td>t × standard</td><td>Same as standard</td></tr>"+
  "<tr><td><b>Unshared</b></td><td>None — one filter per position</td><td>Highest</td><td>Same as standard</td></tr>"+
  "<tr><td><i>Fully connected</i></td><td>None, and not local either</td><td>Extreme</td><td>—</td></tr></table></div>"+
  "<div class='box tip'><h5>The spectrum</h5><p>Fully connected → unshared → tiled → standard convolution is a single axis of increasing weight sharing and decreasing parameters. Convolution is the extreme end, and that is exactly why it generalises so well on images.</p></div>",
 needToKnow:["Name the three variants and the deck's keyword for each","Explain that unshared has convolutional connectivity without sharing","Explain tiled as cycling through a small set of filters","State that full convolution produces an output larger than the input","Place all variants on the sharing spectrum"],
 recognition:{clues:["'Variants of convolution'","'Unshared', 'tiled', 'full', 'locally connected'","A diagram with differently-labelled connections"],
  wording:["Explain the variants of the basic convolution function.","Differentiate between standard, unshared and tiled convolution.","What is full convolution?"],
  firstMove:"Order the variants by how much sharing each applies. That ordering generates the parameter comparison automatically.",
  trap:"Confusing unshared with fully connected. Unshared is still <i>local</i> — each output sees only a patch — it simply does not reuse weights."},
 examAnswer:[
  {marks:5,body:"<p>Name all three with the deck's keywords, one or two lines each, and the sharing spectrum.</p>"},
  {marks:10,body:"<p>All of the above plus: the output-size formula for full convolution; when unshared is justified and its parameter cost; tiled as the compromise with parameters scaling as t; and the comparison table.</p>"}],
 mistakes:["Equating unshared convolution with a fully connected layer","Saying full convolution shrinks the output — it enlarges it","Describing tiled convolution as using one filter per position, which is unshared","Inventing detail the deck does not contain"],
 examples:[{id:"m3t14e1",title:"Parameter cost across the spectrum",q:"A 1-D input of length 10 uses filters of size 3, producing 8 output positions. Compare the weight counts for standard, tiled with t = 2, unshared, and fully connected.",
  steps:["<b>Standard convolution:</b> one filter of 3 weights, reused at all 8 positions. = 3 weights.","<b>Tiled, t = 2:</b> two filters cycled — positions 1, 3, 5, 7 use filter A and positions 2, 4, 6, 8 use filter B. = 2 × 3 = 6 weights.","<b>Unshared:</b> each of the 8 positions has its own 3-weight filter. = 8 × 3 = 24 weights.","<b>Fully connected:</b> each of the 8 outputs connects to all 10 inputs. = 8 × 10 = 80 weights.","<b>Full convolution</b> for contrast: still 3 weights, but the output has n + f − 1 = 10 + 3 − 1 = 12 positions."],
  answer:"Standard <b>3</b>, tiled(t=2) <b>6</b>, unshared <b>24</b>, fully connected <b>80</b> weights.",
  trap:"Two things worth noting. Unshared has 24 weights against fully connected's 80 — fewer, because it is still local, each output seeing only 3 inputs rather than all 10. That is the distinction students most often miss. And full convolution has the same 3 weights as standard convolution but a <i>larger</i> output, since padding lets the filter overhang the input on both sides."}],
 practice:[
  {id:"m3t14p1",d:"easy",q:"Name the three variants of the basic convolution function and give the deck's keyword for each.",hint:"The deck lists two keywords per variant.",a:"<p><b>Full convolution</b> — keywords <i>padding</i> and <i>stride</i>. Enough zero padding is applied that the filter may overhang the input entirely, so every overlap is computed and the output is <i>larger</i> than the input, at n + f − 1. The deck's diagram labels it 'prevents shrinking'.</p><p><b>Unshared convolution</b> — keywords <i>no convolution</i> and <i>MLP</i>. Locally connected like a convolution, but every position learns its own weights with no sharing. The deck labels it 'local connection: like convolution, but no sharing'.</p><p><b>Tiled convolution</b> — keywords <i>neighbouring location</i> and <i>different filter</i>. Cycles through a small set of filters so that neighbouring positions use different ones, with the set repeating. The deck labels it 'cycle between shared parameter groups'.</p>"},
  {id:"m3t14p2",d:"moderate",q:"Place the variants on a spectrum of weight sharing and explain what is traded at each step.",hint:"From no sharing to complete sharing.",a:"<p><b>The spectrum, from least to most sharing:</b></p><p><b>Fully connected</b> — no sharing and no locality. Every output connects to every input with its own weight. Maximum flexibility, maximum parameters, no assumptions encoded.</p><p><b>Unshared (locally connected)</b> — no sharing, but local. Each output sees only a patch, but each position learns its own filter. Fewer parameters than fully connected because of locality; still scales with the number of positions.</p><p><b>Tiled</b> — partial sharing. A set of t filters is cycled across positions, so parameters scale with t rather than with position count. Allows neighbouring positions to behave differently while keeping the count bounded.</p><p><b>Standard convolution</b> — complete sharing. One filter used at every position. Minimum parameters, maximum regularization.</p><p><b>What is traded:</b> moving towards more sharing reduces parameters and increases the strength of the assumption imposed. Convolution asserts that a pattern means the same thing everywhere — a powerful constraint that is <i>true</i> for images, which is why it generalises so well. Unshared makes no such assertion, so it can model position-specific structure such as the difference between the eye and mouth regions of a face, but needs far more data to do so. Tiled sits between, allowing limited position-dependence at bounded cost.</p>"}],
 questions:[
  {q:"Explain the variants of the basic convolution function: full, unshared and tiled.",marks:5,d:"moderate",priority:"medium",source:"source"},
  {q:"Differentiate between unshared convolution and a fully connected layer.",marks:5,d:"moderate",priority:"medium",source:"source"}]},

{id:"m3t15",m:"m3",title:"LeNet-5 Architecture",type:"problem-solving",priority:"high",los:["3.4"],
 src:"Module 3 deck, slide 80, with the feature-hierarchy build-up on slides 65–79",
 summary:"The classical digit-recognition CNN, with its full dimension chain verified.",
 whatIs:"<p>LeNet-5 is the classical convolutional network for <b>document recognition</b> — reading handwritten digits. The deck presents it as the micro-scale foundation: a small grayscale input and a shallow architecture that established the basic CNN feature hierarchy.</p>",
 concept:"<h4>The architecture, exactly as the deck's diagram gives it</h4><div class='scroll'><table>"+
  "<tr><th>Stage</th><th>Operation</th><th>Output shape</th><th>Check</th></tr>"+
  "<tr><td><b>Input</b></td><td>Grayscale image</td><td>32 × 32 × 1</td><td>—</td></tr>"+
  "<tr><td><b>C1</b></td><td>Convolution 5×5</td><td>28 × 28 × 6</td><td>(32−5)/1 + 1 = 28 ✓</td></tr>"+
  "<tr><td><b>S2</b></td><td>Subsampling (pooling) 2×2, s = 2</td><td>14 × 14 × 6</td><td>(28−2)/2 + 1 = 14 ✓</td></tr>"+
  "<tr><td><b>C3</b></td><td>Convolution 5×5</td><td>10 × 10 × 16</td><td>(14−5)/1 + 1 = 10 ✓</td></tr>"+
  "<tr><td><b>S4</b></td><td>Subsampling 2×2, s = 2</td><td>5 × 5 × 16</td><td>(10−2)/2 + 1 = 5 ✓</td></tr>"+
  "<tr><td><b>C5</b></td><td>Convolution 5×5</td><td>1 × 1 × 120</td><td>(5−5)/1 + 1 = 1 ✓</td></tr>"+
  "<tr><td><b>F6</b></td><td>Fully connected</td><td>84</td><td>—</td></tr>"+
  "<tr><td><b>Output</b></td><td>Fully connected</td><td>10 (one per digit)</td><td>—</td></tr></table></div>"+
  "<p>Every dimension independently recomputed with ⌊(n − f + 2p)/s⌋ + 1 and matching the deck exactly. Note there is <b>no padding anywhere</b> — this is why the map shrinks at every convolution.</p>"+
  "<h4>The pattern to memorise</h4>"+
  "<div class='eqb'>INPUT → C1 → S2 → C3 → S4 → C5 → F6 → OUTPUT\n        conv  pool  conv  pool  conv  FC    FC</div>"+
  "<p>Alternating convolution and subsampling, with spatial size falling 32 → 28 → 14 → 10 → 5 → 1 while depth rises 1 → 6 → 16 → 120. This is the resolution-for-features trade in its clearest form.</p>"+
  "<h4>What the deck emphasises about it</h4>"+
  "<p>The deck's instruction is explicit: <i>do not just memorise architecture diagrams (C1 → S2 → C3 → S4 → C5 → FC)</i>. CNNs learn hierarchical representations — simple features in early layers and increasingly complex features in deeper ones. Its digit walkthrough is: pixels → C1 detects basic edges (horizontal, vertical, diagonal, corners) → S2 consolidates while keeping important features → C3 combines edges into curves and shapes → C5 compresses into a higher-level structural representation → FC combines everything → identified: 7.</p>"+
  "<p>The deck also notes LeNet used <b>tanh</b> activation, which was standard before ReLU.</p>",
 needToKnow:["Reproduce the full table of stage, operation and output shape","Verify every dimension with the master formula","State that there is no padding","Give the alternating pattern C1-S2-C3-S4-C5-F6","Say what each stage detects in the feature hierarchy","Name the task: handwritten digit / document recognition"],
 recognition:{clues:["'LeNet', 32×32 input, 10 outputs","C1, S2, C3, S4, C5 named","Handwritten digits or MNIST","5×5 filters"],
  wording:["Explain the LeNet architecture with a neat diagram.","Compute the output size at each layer of LeNet-5.","What does each stage of LeNet detect?"],
  firstMove:"Write the dimension chain 32 → 28 → 14 → 10 → 5 → 1 first, then attach the depths and operations. The chain is the skeleton of the answer.",
  trap:"Assuming padding is used. LeNet has none, which is exactly why 32 becomes 28 rather than staying at 32."},
 examAnswer:[
  {marks:5,body:"<p>The stage table with output shapes, the alternating pattern, and the task it was built for.</p>"},
  {marks:10,body:"<p>All of the above plus: every dimension verified with the formula shown; what each stage detects in the hierarchy; the resolution-versus-depth trade; and the note that LeNet used tanh.</p>"}],
 mistakes:["Adding padding that LeNet does not use","Giving C3's output as 10×10×6 — the depth rises to 16","Forgetting F6 with its 84 units","Saying the output layer has 26 or some other count; it has 10, one per digit","Reciting the diagram without saying what any stage learns"],
 examples:[{id:"m3t15e1",title:"Deriving LeNet's dimension chain from scratch",q:"Given only that LeNet takes a 32×32×1 input and uses 5×5 convolutions and 2×2 subsampling at stride 2, with no padding, derive every layer's output size.",
  steps:["<b>C1:</b> ⌊(32 − 5 + 0)/1⌋ + 1 = 27 + 1 = 28. With 6 filters → 28 × 28 × 6","<b>S2:</b> ⌊(28 − 2 + 0)/2⌋ + 1 = ⌊13⌋ + 1 = 14. Depth unchanged → 14 × 14 × 6","<b>C3:</b> ⌊(14 − 5 + 0)/1⌋ + 1 = 9 + 1 = 10. With 16 filters → 10 × 10 × 16","<b>S4:</b> ⌊(10 − 2 + 0)/2⌋ + 1 = 4 + 1 = 5. Depth unchanged → 5 × 5 × 16","<b>C5:</b> ⌊(5 − 5 + 0)/1⌋ + 1 = 0 + 1 = 1. With 120 filters → 1 × 1 × 120","<b>F6:</b> fully connected → 84","<b>Output:</b> fully connected → 10"],
  answer:"32×32×1 → <b>28×28×6</b> → <b>14×14×6</b> → <b>10×10×16</b> → <b>5×5×16</b> → <b>1×1×120</b> → <b>84</b> → <b>10</b>. All verified.",
  trap:"C5 is the interesting stage: a 5×5 filter on a 5×5 input gives exactly one output position, so C5 is a convolution that behaves like a fully connected layer. This is why some descriptions list LeNet as having three FC layers and others two — C5 can be counted either way. Note also that pooling never changes depth, while every convolution sets the depth to its filter count."}],
 practice:[
  {id:"m3t15p1",d:"easy",q:"Give the LeNet-5 architecture as a table of stages with output shapes.",hint:"Alternating conv and pool, then dense.",a:"<div class='scroll'><table><tr><th>Stage</th><th>Operation</th><th>Output</th></tr><tr><td>Input</td><td>Grayscale image</td><td>32 × 32 × 1</td></tr><tr><td>C1</td><td>Convolution 5×5, 6 filters</td><td>28 × 28 × 6</td></tr><tr><td>S2</td><td>Subsampling 2×2, s=2</td><td>14 × 14 × 6</td></tr><tr><td>C3</td><td>Convolution 5×5, 16 filters</td><td>10 × 10 × 16</td></tr><tr><td>S4</td><td>Subsampling 2×2, s=2</td><td>5 × 5 × 16</td></tr><tr><td>C5</td><td>Convolution 5×5, 120 filters</td><td>1 × 1 × 120</td></tr><tr><td>F6</td><td>Fully connected</td><td>84</td></tr><tr><td>Output</td><td>Fully connected</td><td>10</td></tr></table></div><p>Task: handwritten digit / document recognition. No padding is used, and the original used tanh activation.</p>"},
  {id:"m3t15p2",d:"moderate",q:"Verify LeNet's C1, S2 and C3 output sizes using the master formula, stating the padding and stride assumed.",hint:"No padding anywhere.",a:"<p>Formula: Output = ⌊(n − f + 2p)/s⌋ + 1, with <b>p = 0 throughout</b> (LeNet uses no padding).</p><p><b>C1</b> — convolution, f = 5, s = 1, input 32:<br>⌊(32 − 5 + 0)/1⌋ + 1 = 27 + 1 = <b>28</b> ✓</p><p><b>S2</b> — subsampling, f = 2, s = 2, input 28:<br>⌊(28 − 2 + 0)/2⌋ + 1 = ⌊26/2⌋ + 1 = 13 + 1 = <b>14</b> ✓</p><p><b>C3</b> — convolution, f = 5, s = 1, input 14:<br>⌊(14 − 5 + 0)/1⌋ + 1 = 9 + 1 = <b>10</b> ✓</p><p>All three match the deck's diagram. Note that each 5×5 convolution removes exactly 4 from each dimension (f − 1 = 4), and each 2×2 pooling at stride 2 halves it.</p>"},
  {id:"m3t15p3",d:"moderate",q:"Describe what each stage of LeNet detects, and state what the deck says you should take from the architecture.",hint:"The deck is explicit about not just memorising the diagram.",a:"<p><b>The hierarchy.</b> <b>Pixels</b> — the network initially sees only a grid of values and does not know it is a 7. <b>C1</b> — small filters detect basic edges: horizontal, vertical, diagonal and corners. The deck's caption is 'I found some strokes'. <b>S2</b> — pooling consolidates, keeping the important features while reducing size and adding tolerance to small shifts. <b>C3</b> — combines simple features into curves and shapes; 'these strokes look like part of a digit'. <b>S4</b> — consolidates again. <b>C5</b> — compresses into a higher-level structural representation. <b>F6 and output</b> — combine all learned features (edges, shapes, spatial patterns) to identify the final digit.</p><p><b>What the deck says to take from it.</b> Its instruction is explicit: do not just memorise the architecture diagram C1 → S2 → C3 → S4 → C5 → FC. The point is that CNNs learn <b>hierarchical representations</b> — simple features in early layers and increasingly complex features in deeper layers. LeNet is significant not as a list of eight stages but as the demonstration that this hierarchy can be <i>learned from data</i> rather than designed by hand.</p><p>The deck's summary of the two architectures makes the same point: LeNet and AlexNet are not separate architectures to memorise, but two milestones in the evolution of the same visual-learning pipeline.</p>"}],
 questions:[
  {q:"Explain the LeNet architecture with a neat diagram and give the output size at each stage.",marks:10,d:"moderate",priority:"high",source:"source"},
  {q:"Verify the output dimensions of LeNet using the CNN output-size formula.",marks:5,d:"moderate",priority:"high",source:"source"}]},

{id:"m3t16",m:"m3",title:"AlexNet Architecture",type:"problem-solving",priority:"high",los:["3.4"],
 src:"Module 3 deck, slides 73–79, 81–83",
 summary:"The large-scale CNN, with every layer's arithmetic printed on the slide and verified.",
 whatIs:"<p>AlexNet is the architecture for <b>large-scale object recognition</b> — 1000 ImageNet classes from full-colour photographs. The deck presents it as the macro-scale complement to LeNet: same pipeline, far greater depth and scale.</p>",
 concept:"<h4>The deck's own summary</h4>"+
  "<p>AlexNet architecture consists of <b>5 convolutional layers, 3 max-pooling layers, 2 normalization layers, 2 fully connected layers and 1 softmax layer</b>. Each convolutional layer consists of convolutional filters and a nonlinear activation function ReLU. The pooling layers are used to perform max pooling.</p>"+
  "<div class='box warning'><h5>A counting discrepancy in the source</h5><p>The deck's text says <b>2 fully connected layers</b>, while its own detailed diagram on slide 83 shows FC 4096 → FC 4096 → 1000-way softmax, which is three dense layers. Both readings are defensible depending on whether the final softmax layer is counted as fully connected. Reproduce the lecturer's wording if quoting the summary, and use the diagram's structure when computing dimensions.</p></div>"+
  "<h4>The full dimension chain, every step verified</h4><div class='scroll'><table>"+
  "<tr><th>Layer</th><th>Configuration</th><th>Arithmetic</th><th>Output</th></tr>"+
  "<tr><td><b>Input</b></td><td>RGB image</td><td>—</td><td>227 × 227 × 3</td></tr>"+
  "<tr><td><b>Conv1</b></td><td>11×11, stride 4, 96 kernels</td><td>(227−11)/4 + 1 = 55</td><td>55 × 55 × 96 ✓</td></tr>"+
  "<tr><td><b>MaxPool1</b></td><td>3×3, stride 2 (overlapping)</td><td>(55−3)/2 + 1 = 27</td><td>27 × 27 × 96 ✓</td></tr>"+
  "<tr><td><b>Conv2</b></td><td>5×5, pad 2, 256 kernels</td><td>(27+2·2−5)/1 + 1 = 27</td><td>27 × 27 × 256 ✓</td></tr>"+
  "<tr><td><b>MaxPool2</b></td><td>3×3, stride 2</td><td>(27−3)/2 + 1 = 13</td><td>13 × 13 × 256 ✓</td></tr>"+
  "<tr><td><b>Conv3</b></td><td>3×3, pad 1, 384 kernels</td><td>(13+2·1−3)/1 + 1 = 13</td><td>13 × 13 × 384 ✓</td></tr>"+
  "<tr><td><b>Conv4</b></td><td>3×3, pad 1, 384 kernels</td><td>(13+2·1−3)/1 + 1 = 13</td><td>13 × 13 × 384 ✓</td></tr>"+
  "<tr><td><b>Conv5</b></td><td>3×3, pad 1, 256 kernels</td><td>(13+2·1−3)/1 + 1 = 13</td><td>13 × 13 × 256 ✓</td></tr>"+
  "<tr><td><b>MaxPool3</b></td><td>3×3, stride 2</td><td>(13−3)/2 + 1 = 6</td><td>6 × 6 × 256 ✓</td></tr>"+
  "<tr><td><b>Flatten</b></td><td>—</td><td>6 × 6 × 256</td><td>9216 ✓</td></tr>"+
  "<tr><td><b>FC6</b></td><td>Fully connected</td><td>—</td><td>4096</td></tr>"+
  "<tr><td><b>FC7</b></td><td>Fully connected</td><td>—</td><td>4096</td></tr>"+
  "<tr><td><b>FC8 / Softmax</b></td><td>Fully connected</td><td>—</td><td>1000 classes</td></tr></table></div>"+
  "<p>All nine spatial dimensions and the flatten independently recomputed and matching the deck exactly.</p>"+
  "<h4>What AlexNet introduced</h4><ul>"+
  "<li><b>ReLU instead of tanh.</b> The deck calls it an activation upgrade — a transition from historical tanh/sigmoid to ReLU for powerful, non-linear recognition. This is what made training a network this deep practical.</li>"+
  "<li><b>Overlapping max pooling.</b> The 3×3 window at stride 2 overlaps, unlike the usual non-overlapping 2×2.</li>"+
  "<li><b>Great depth and scale.</b> 5 convolution layers, 96 to 384 filters, and 1000 output classes.</li>"+
  "<li><b>Dropout</b> in the fully connected layers, and data augmentation — Module 2's regularization methods applied at scale.</li></ul>"+
  "<h4>The deck's staged reading of what it learns</h4>"+
  "<p><b>Conv1</b> detects boundaries, basic visual patterns, colours and simple textures. <b>Conv2</b> combines these into corners, textures and simple shapes. <b>Conv3 and Conv4</b> identify object parts — eyes, hands, books, faces. <b>Conv5</b> forms higher-level combinations, and the fully connected layers combine everything to grasp the complete scene.</p>",
 needToKnow:["Reproduce the deck's component summary","Give the full dimension chain with the arithmetic","Verify each step with the master formula","State that AlexNet introduced ReLU in place of tanh","Explain overlapping max pooling","Give the 9216 flatten figure and where it comes from"],
 recognition:{clues:["227×227 or 224×224 input, 1000 outputs","11×11 filters with stride 4","'AlexNet', 'ImageNet', 'object detection'","4096-unit dense layers"],
  wording:["Explain the AlexNet architecture with a neat diagram.","Compute the output size at each layer of AlexNet.","What innovations did AlexNet introduce?"],
  firstMove:"Write the spatial chain 227 → 55 → 27 → 27 → 13 → 13 → 13 → 13 → 6 first. Then attach depths, then the dense layers.",
  trap:"Forgetting the padding on Conv2 through Conv5. Without pad 2 on Conv2 the output would be 23, not 27, and every later dimension would be wrong."},
 examAnswer:[
  {marks:5,body:"<p>The component summary, the dimension chain as a table, and the ReLU innovation.</p>"},

 mistakes:["Dropping the padding on Conv2 to Conv5","Using 224 in the arithmetic — (224−11)/4 + 1 = 54.25, which is not an integer; 227 is the figure that makes the chain work","Giving 4096 as the number of classes rather than 1000","Saying AlexNet used sigmoid","Forgetting that Conv3, Conv4 and Conv5 are consecutive with no pooling between them"],
 examples:[{id:"m3t16e1",title:"AlexNet's full chain, verified step by step",q:"Verify every spatial dimension of AlexNet from a 227×227×3 input using ⌊(n − f + 2p)/s⌋ + 1, and derive the flatten length.",
  steps:["<b>Conv1</b> (f=11, p=0, s=4): ⌊(227 − 11)/4⌋ + 1 = ⌊216/4⌋ + 1 = 54 + 1 = <b>55</b> ✓","<b>Pool1</b> (f=3, p=0, s=2): ⌊(55 − 3)/2⌋ + 1 = 26 + 1 = <b>27</b> ✓","<b>Conv2</b> (f=5, p=2, s=1): ⌊(27 − 5 + 4)/1⌋ + 1 = 26 + 1 = <b>27</b> ✓","<b>Pool2</b> (f=3, p=0, s=2): ⌊(27 − 3)/2⌋ + 1 = 12 + 1 = <b>13</b> ✓","<b>Conv3</b> (f=3, p=1, s=1): ⌊(13 − 3 + 2)/1⌋ + 1 = 12 + 1 = <b>13</b> ✓","<b>Conv4</b>: identical configuration → <b>13</b> ✓","<b>Conv5</b>: identical configuration → <b>13</b> ✓","<b>Pool3</b> (f=3, p=0, s=2): ⌊(13 − 3)/2⌋ + 1 = 5 + 1 = <b>6</b> ✓","<b>Flatten:</b> 6 × 6 × 256 = <b>9216</b> ✓"],
  answer:"227 → 55 → 27 → 27 → 13 → 13 → 13 → 13 → 6, flattening to <b>9216</b>. All nine steps verified against the deck.",
  trap:"Three things to watch. Conv2 to Conv5 all use padding that <i>preserves</i> the spatial size — their job is to increase depth and abstraction, not to downsample, which is left entirely to the pooling layers. Conv3, Conv4 and Conv5 are consecutive with no pooling between them, which is why 13 appears four times in a row. And the input must be 227, not 224: (224 − 11)/4 + 1 = 54.25 is not an integer, which is a useful self-check that you have the right input size."}],
 practice:[
  {id:"m3t16p1",d:"easy",q:"State the components of AlexNet as the deck summarises them.",hint:"Five numbers.",a:"<p>AlexNet consists of <b>5 convolutional layers</b>, <b>3 max-pooling layers</b>, <b>2 normalization layers</b>, <b>2 fully connected layers</b> and <b>1 softmax layer</b>.</p><p>Each convolutional layer consists of convolutional filters and a nonlinear activation function, <b>ReLU</b>. The pooling layers perform max pooling.</p><p><i>Note:</i> the deck's detailed diagram shows FC 4096 → FC 4096 → 1000-way softmax, which reads as three dense layers depending on whether the softmax layer is counted as fully connected. Both readings appear in the material.</p>"},
  {id:"m3t16p2",d:"moderate",q:"Compute the output of AlexNet's Conv1 and Pool1 from a 227×227×3 input, showing the formula.",hint:"Conv1 uses a large filter with a large stride.",a:"<p><b>Conv1:</b> 11×11 filters, 96 of them, stride 4, no padding.</p><div class='eqb'>⌊(227 − 11 + 0)/4⌋ + 1 = ⌊216/4⌋ + 1 = 54 + 1 = 55</div><p>Output = <b>55 × 55 × 96</b> (depth from the 96 kernels).</p><p><b>Pool1:</b> overlapping max pooling, 3×3 window at stride 2.</p><div class='eqb'>⌊(55 − 3 + 0)/2⌋ + 1 = ⌊52/2⌋ + 1 = 26 + 1 = 27</div><p>Output = <b>27 × 27 × 96</b> (pooling never changes depth).</p><p>Note the aggressive first layer: a stride of 4 with an 11×11 filter reduces 227 to 55 in one step, which was necessary to make a network of this size computationally feasible on 2012 hardware.</p>"},
  {id:"m3t16p3",d:"moderate",q:"What did AlexNet introduce, and why was the activation change decisive?",hint:"Four innovations, one of which made the rest possible.",a:"<p><b>The four innovations.</b> (1) <b>ReLU in place of tanh</b> — the deck calls it an activation upgrade, a transition from historical tanh/sigmoid to ReLU. (2) <b>Overlapping max pooling</b> — a 3×3 window at stride 2, so windows overlap, unlike the conventional non-overlapping 2×2. (3) <b>Depth and scale</b> — five convolution layers with up to 384 filters, classifying 1000 categories. (4) <b>Regularization at scale</b> — dropout in the fully connected layers and heavy data augmentation.</p><p><b>Why ReLU was decisive.</b> Sigmoid and tanh saturate: their derivatives fall towards zero away from the origin, with sigmoid's never exceeding 0.25 even at best. Backpropagation multiplies by f′(z) once per layer, so across eight layers the gradient reaching the earliest weights is scaled by a product of eight such factors — vanishing to near zero. Training a network this deep with tanh was effectively impossible.</p><p>ReLU's derivative is exactly <b>1</b> for all positive inputs, so gradients pass backwards undiminished however many layers they cross. It is also far cheaper — a comparison rather than an exponential — which mattered enormously on 2012 GPUs.</p><p>ReLU is therefore what made the depth possible, and the depth is what made the accuracy possible. The other three innovations are refinements; the activation change is the one that removed the barrier.</p>"}],

{id:"m3t17",m:"m3",title:"LeNet vs AlexNet",type:"theory",priority:"medium",los:["3.4"],
 src:"Module 3 deck, slides 65–66, 78–79",
 summary:"The deck's own comparison table, and the point it insists you take from it.",
 whatIs:"<p>The deck presents these two not as rival architectures but as two milestones in the evolution of the <b>same</b> visual-learning pipeline — the journey, as it puts it, from recognising a stroke to understanding a scene.</p>",
 concept:"<h4>The deck's comparison table</h4><div class='scroll'><table>"+
  "<tr><th>Feature</th><th>LeNet</th><th>AlexNet</th></tr>"+
  "<tr><td><b>Task</b></td><td>Handwritten digit</td><td>Large-scale classification</td></tr>"+
  "<tr><td><b>Example</b></td><td>Recognise an answer</td><td>Understand a classroom scene</td></tr>"+
  "<tr><td><b>Input</b></td><td>Small grayscale</td><td>Large RGB</td></tr>"+
  "<tr><td><b>Architecture</b></td><td>Shallow</td><td>Much deeper and larger</td></tr>"+
  "<tr><td><b>Main lesson</b></td><td>Basic CNN feature hierarchy</td><td>Deep CNN at large scale</td></tr></table></div>"+
  "<h4>Extending it with the numbers from both architectures</h4><div class='scroll'><table>"+
  "<tr><th></th><th>LeNet-5</th><th>AlexNet</th></tr>"+
  "<tr><td>Input</td><td>32 × 32 × 1</td><td>227 × 227 × 3</td></tr>"+
  "<tr><td>Convolution layers</td><td>3 (C1, C3, C5)</td><td>5</td></tr>"+
  "<tr><td>Pooling layers</td><td>2 (S2, S4)</td><td>3, overlapping</td></tr>"+
  "<tr><td>Filter sizes</td><td>5 × 5 throughout</td><td>11×11, then 5×5, then 3×3</td></tr>"+
  "<tr><td>Filter counts</td><td>6, 16, 120</td><td>96, 256, 384, 384, 256</td></tr>"+
  "<tr><td>Activation</td><td><b>tanh</b></td><td><b>ReLU</b></td></tr>"+
  "<tr><td>Output classes</td><td>10</td><td>1000</td></tr>"+
  "<tr><td>Regularization</td><td>Minimal</td><td>Dropout and data augmentation</td></tr></table></div>"+
  "<div class='box tip'><h5>The deck's conclusion, which is the examinable point</h5><p>LeNet demonstrated hierarchical visual features for simple image recognition; AlexNet demonstrated that much deeper CNNs on large datasets achieve powerful large-scale image recognition. Its analogy: <b>LeNet is learning handwriting; AlexNet is understanding the room.</b></p><p>And its explicit instruction: do not just memorise architecture diagrams. The pipeline is the same — convolution, activation, pooling, repeat, then fully connected. What changed between them was scale, depth, activation and the amount of data.</p></div>",
 needToKnow:["Reproduce the deck's five-row comparison","Give the key numeric contrasts: input size, layer counts, classes","Name tanh versus ReLU as the critical activation change","State that they share one pipeline and differ in scale","Give the handwriting-versus-room analogy"],
 recognition:{clues:["Both architectures named together","'Compare', 'differentiate', 'evolution of CNN architectures'","A question spanning both"],
  wording:["Compare LeNet and AlexNet architectures.","Trace the evolution from LeNet to AlexNet.","What is common between LeNet and AlexNet?"],
  firstMove:"Draw the comparison table, then add one line stating that the pipeline is identical and only the scale changed. That sentence is what the deck is asking for.",
  trap:"Presenting them as unrelated architectures. The deck states explicitly that they are two milestones in the evolution of the exact same pipeline."},
 examAnswer:[
  {marks:5,body:"<p>The five-row table plus the key numbers, and one closing line that the pipeline is shared.</p>"},
  {marks:10,body:"<p>All of the above plus the extended numeric table; the significance of tanh → ReLU; the handwriting-versus-room analogy; and a paragraph on what actually changed — scale, depth, activation and data — rather than architecture in kind.</p>"}],
 mistakes:["Treating them as fundamentally different architectures","Saying AlexNet abandoned pooling; it uses three overlapping max-pooling layers","Forgetting the activation change, which is the most consequential difference","Giving LeNet 1000 classes or AlexNet 10","Listing differences without stating what is shared"],
 examples:[{id:"m3t17e1",title:"What actually changed, and what did not",q:"State what is identical between LeNet and AlexNet and what changed, then say which single change mattered most and why.",
  steps:["<b>Identical — the pipeline.</b> Both follow INPUT → [CONV → activation → POOL] repeated → FLATTEN → FC → OUTPUT. Both learn a hierarchy from edges to shapes to objects. Both use weight sharing and local receptive fields. Both end with fully connected classification.","<b>Changed — the scale.</b> Input 32×32×1 to 227×227×3. Convolution layers 3 to 5. Filter counts 6/16/120 to 96/256/384/384/256. Classes 10 to 1000.","<b>Changed — the activation.</b> tanh to ReLU.","<b>Changed — regularization.</b> Minimal to dropout plus heavy data augmentation.","<b>Changed — the data.</b> Thousands of digit images to 1.2 million ImageNet photographs.","<b>The decisive change is ReLU.</b> tanh saturates, so its derivative falls towards zero and backpropagation multiplies by that factor at every layer. Across a deep network the gradient reaching early layers vanishes, making depth untrainable. ReLU's derivative is exactly 1 for positive inputs, so gradients survive any depth."],
  answer:"The <b>pipeline is identical</b>; scale, activation, regularization and data volume all changed. The decisive change was <b>tanh → ReLU</b>, because it removed the vanishing-gradient barrier and made the depth trainable — and the depth is what produced the accuracy.",
  trap:"The tempting answer is 'AlexNet is deeper'. But depth was not a new <i>idea</i> — people had wanted deeper networks for years and could not train them. ReLU is what made depth achievable, alongside GPUs and ImageNet. Naming depth as the innovation confuses the result with its cause, and the deck's own framing supports this: it lists the transition to ReLU as an activation <i>upgrade</i> enabling powerful non-linear recognition."}],
 practice:[
  {id:"m3t17p1",d:"easy",q:"Compare LeNet and AlexNet on task, input, architecture and main lesson.",hint:"The deck's own table has five rows.",a:"<div class='scroll'><table><tr><th>Feature</th><th>LeNet</th><th>AlexNet</th></tr><tr><td>Task</td><td>Handwritten digit recognition</td><td>Large-scale classification</td></tr><tr><td>Example</td><td>Recognise an answer</td><td>Understand a classroom scene</td></tr><tr><td>Input</td><td>Small grayscale (32×32×1)</td><td>Large RGB (227×227×3)</td></tr><tr><td>Architecture</td><td>Shallow — 3 conv, 2 pool</td><td>Much deeper — 5 conv, 3 pool</td></tr><tr><td>Activation</td><td>tanh</td><td>ReLU</td></tr><tr><td>Output classes</td><td>10</td><td>1000</td></tr><tr><td>Main lesson</td><td>Basic CNN feature hierarchy</td><td>Deep CNN at large scale</td></tr></table></div>"},
  {id:"m3t17p2",d:"moderate",q:"The deck says LeNet and AlexNet are not separate architectures to memorise. What does it mean, and what should you take from them instead?",hint:"Look for what is shared before what differs.",a:"<p><b>What it means.</b> Both follow the same pipeline: convolution to extract features, an activation for non-linearity, pooling to downsample, repeated several times, then flatten and fully connected layers to classify. Both build the same hierarchy — edges, then shapes, then object parts, then whole objects. Neither introduced a new <i>kind</i> of layer. The deck describes them as two milestones in the evolution of the exact same visual-learning pipeline, and its analogy is that LeNet is learning handwriting while AlexNet is understanding the room.</p><p><b>What differs is scale, not structure:</b> input size, number of layers, number of filters, number of classes, choice of activation, amount of regularization and volume of training data.</p><p><b>What to take from them.</b> The deck states it directly: CNNs learn <b>hierarchical representations</b> — simple features in early layers, increasingly complex features in deeper layers — and this hierarchy is learned from data rather than designed. Understanding that principle lets you reason about any CNN, including ones you have never seen, whereas memorising eight stage names lets you answer only one question.</p><p>The practical exam consequence: if asked to design a CNN for an unfamiliar task, apply the pipeline and scale it to the problem — small grayscale input with few classes needs something LeNet-sized; large colour images with many classes need something AlexNet-sized.</p>"}],
